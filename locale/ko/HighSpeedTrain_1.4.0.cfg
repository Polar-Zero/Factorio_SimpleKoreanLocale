[technology-description]
highspeedartillery=고속 운송 용도로 제작된 대포 화물차를 해금합니다.
highspeedcargo=고속 운송 용도로 제작된 화물차를 해금합니다.
highspeedcargomk2=최대 속도를 위해 업그레이드된 화물차를 해금합니다.
highspeedfluid=고속 운송 용도로 제작된 유체 화물차를 해금합니다.
highspeedfluidmk2=최대 속도를 위해 업그레이드된 유체 화물차를 해금합니다.
highspeedtrain=1세대 고속 기관차를 잠금 해제합니다.
highspeedtrainmk2=개선된 고속 기관차를 잠금 해제합니다.
highspeedtrainmk3=고급 고속 기관차를 잠금 해제합니다.
highspeedtrainmk4=이 모드에서 가장 빠른 기관차를 잠금 해제합니다.

[mod-setting-name]
highspeedtrain-free-mode=제작 및 연구 없이 사용
highspeedtrain-no-fuel=고속 기관차에 연료가 필요하지 않음

[mod-setting-description]
highspeedtrain-free-mode=활성화하면 모든 고속 기관차 제작법이 게임 시작 즉시 해금되고, 제작에 아이템이 필요하지 않도록 합니다. 필요하지 않은 관련 기술 연구는 숨겨집니다.
highspeedtrain-no-fuel=활성화하면 모든 고속 기관차가 void 유형의 에너지를 연료로 사용하도록 하여, 연료 없이도 무한히 운행할 수 있게 됩니다.