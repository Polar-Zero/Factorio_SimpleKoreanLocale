[mod-name]
adjust-chunkgen-radius=청크 생성 반경 조정(Adjust Chunk Generation Radius)

[mod-description]
adjust-chunkgen-radius=플레이어를 중심으로 한 "멀리 떨어진" 청크 생성 반경을 조정합니다. \n\n번역: SimpleKoreanLocale(PolarZero)


[mod-setting-name]
adjust-chunkgen-radius-radius=청크 생성 반경

[mod-setting-description]
adjust-chunkgen-radius-radius=플레이어가 위치한 청크로부터 청크를 생성할 거리를 청크 단위 반경으로 지정합니다 (플레이어가 위치한 청크는 제외). 기본값 20일 경우, 플레이어 주변 41x41 청크 크기의 정사각형 영역이 자동으로 생성됩니다. 비활성화하려면 0으로 설정하세요.