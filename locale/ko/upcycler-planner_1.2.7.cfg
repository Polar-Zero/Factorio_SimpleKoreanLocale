[mod-name]
upcycler-planner=업사이클링 계획기(Upcycler Planner)

[mod-description]
upcycler-planner=아이템과 목표 품질만 선택하면, 모드에서 완전히 사용자 정의 가능한 업사이클링 루프 설계도를 제작해 제공합니다.\n\n번역: SimpleKoreanLocale(PolarZero, alstnrrj12)


[controls]
upl-open=업사이클링 계획기 표시/숨기기

[shortcut-name]
upl-open=업사이클링 계획기

[shortcut-description]
upl-open=업사이클링 루프를 설계하고 도면 형태로 받아보세요.

[upl-gui]
beacon=신호기
beacon-count=티어별 신호기 수
beacon-count-tooltip=각 티어마다 신호기가 몇 개씩 중첩되도록 할지 결정합니다. 추가 신호기는 너비에 영향을 주지 않지만, 늘릴 때마다 효과가 조금씩 감소됩니다.
beacon-module=신호기 모듈
beacon-module-tooltip=모든 신호기를 채웁니다. 속도 모듈은 품질 상승 확률을 줄일 수 있으므로, 기본값은 '효율 모듈'로 설정되어 있습니다. 빈 값으로 설정해 설정값을 지우세요.
beacon-tooltip=각 티어의 기계와 재활용기를 강화하고, 순환 범위를 넓힙니다. 높은 품질의 아이템일수록 강화 효과가 증가됩니다. 빈 값으로 둬 제거하세요.
belt=벨트
belt-tooltip=루프를 따라 아이템을 운반합니다. 벨트에는 품질 보너스가 없으므로 선택할 수 있는 사항은 존재하지 않습니다.
buffer-stock=완충 상자 사용
buffer-stock-tooltip=아이템을 완충 상자에 일시적으로 보관하고, 물류, 건설 로봇이 사용할 수 있도록 합니다. 루프에 아이템을 계속 두려면 선택을 해제하세요.
build-options=건설 옵션
cancel=취소
circuit-enabled=회로 제한
circuit-enabled-tooltip=최대값에 도달하면 루프가 중지되도록 하고, 각 하위 품질의 아이템을 일정 수량만큼 유지하도록 합니다. 두 가지 모두 '제한..'에서 조절할 수 있습니다
circuit-hand=묶음 크기
circuit-hand-tooltip=보관용 투입기가 한 번 움직일 때마다 가져가는 아이템 수; 비워두면 선택한 투입기에 대해 연구로 허용되는 최대 수치가 적용됩니다.
circuit-keep-tooltip=나머지 아이템을 재활용하기 전에 해당 품질의 상품을 이만큼 최소한 확보해 두도록 설정합니다. 0으로 설정하면 남기지 않음을 의미합니다.
circuit-limits=제한...
circuit-limits-title=회로 제한
circuit-limits-tooltip=각 품질 등급별 최소/최대 아이템 수량을 설정하세요.
circuit-max=최대
circuit-max-tooltip=해당 아이템 수량에 도달하면 루프가 중지됩니다. 다시 시작하려면 아이템을 꺼내주세요. 0은 제한이 없음을 의미합니다.
circuit-min=최소
circuit-network=전체 물류 네트워크를 집계
circuit-network-tooltip=출력 상자만 아니라 물류 네트워크 전체의 목표 품질 아이템 수를 집계합니다. 루프는 로보포트 범위 내에서만 진행됩니다.
circuit-paused=일시 정지 상태로 시작
circuit-paused-tooltip=제한 조합기를 비활성화 상태로 둔 뒤, 플레이어가 활성화하기 전까지 유지합니다.
columns=티어당 열 수
columns-count-tooltip=이 티어에서 열을 몇 번 반복할지 정의합니다. (최대 __1__) 빈 값을 입력하고 Enter 키를 눌러 1로 초기화하세요.
columns-edit=편집...
columns-edit-tooltip=각 하위 단계마다 열을 반복할 횟수를 정의합니다.
columns-no-lower-tier=이미 제일 낮은 품질이므로 반복할 수 없습니다.
columns-title=티어당 열 수
columns-tooltip=각 하위 티어마다 열을 몇 번 반복할지 정의합니다. (기본값: 티어당 1)
confirm=설치
container=중계 상자
container-tooltip=원하는 단계보다 더 높은 품질이 나온 아이템을 벨트로 되돌려 보냅니다. 품질이 높을수록 아이템을 더 많이 담을 수 있습니다.
feed-minutes=분
feed-minutes-tooltip=각 재료 아이템이 (대략) 해당 시간 동안 제작에 사용되도록 합니다. 값을 변경하면 아래 수량이 초기화됩니다.
footprint=면적: __1__ x __2__ 타일
group-beacons=신호기
group-chests=상자
group-circuits=회로
group-modules=모듈
group-power=전력
group-transport=물류
inserter=투입기
inserter-tooltip=1칸 거리의 투입기만 레이아웃과 일치할 것입니다. 품질이 높은 투입기일수록 더 빠르게 회전합니다.
machine=조립 기계
machine-tooltip=품질 등급마다 하나씩 설치됩니다. 여기서 말하는 품질은 조립 기계 품질 자체를 의미합니다 (기계에서 생산하는 아이템의 품질이 아님)
overflow=오버플로우 상자
overflow-tooltip=루프에서 목표 품질보다 높게 나온 아이템을 로봇이 가져가도록 합니다. 품질이 높을수록 더 많이 보관할 수 있습니다.
pick-a-recipe=업사이클링할 아이템을 선택하세요.
pipe=파이프
pipe-tooltip=기계에 유체를 공급합니다. 방향 무관하게 지하 파이프로 공급원을 연결하세요. 품질 보너스는 없습니다.
pole=전봇대
pole-tooltip=모든 건물에 전력을 공급합니다. 더 높은 품질일수록 더 넓은 거리와 연결합니다. 빈 값이면 전봇대를 설치하지 않습니다.
productivity-module=생산 모듈
productivity-module-tooltip=품질 모듈과 함께 아래 기계에 최적 비율로 장착됩니다. 아직 사용 가능한 생산 모듈이 없다면 비어 있습니다.
provider=출력 상자
provider-tooltip=완성된 아이템을 보관할 수동형 보관 상자. 품질이 높을수록 더 많이 보관할 수 있습니다.
quality=목표 품질
quality-module=품질 모듈
quality-module-tooltip=모든 재활용기와 아래 기계에 투입됩니다. 품질이 높을수록 성공률이 증가합니다.
quality-tooltip=루프를 통해 이 품질까지 한 단계씩 업그레이드합니다.
recipe=업사이클링할 아이템
recipe-tooltip=재활용으로 원료 분해가 가능한 아이템만 루프시킬 수 있습니다.
recycler=재활용기
recycler-tooltip=목표보다 낮은 단계마다 하나씩 설치되며, 아이템을 다시 재료로 분해합니다. (여기서 품질은 재활용기 자체의 품질을 의미)
request-count-tooltip=단계마다 해당 재료를 몇 개씩 요청할지 정의합니다. 입력값을 지우고 Enter를 눌러 분 단위로 재설정할 수 있습니다.
requester=재료 상자
requester-tooltip=각 기계의 재료를 물류 네트워크에서 요청합니다. 품질이 높을수록 더 많이 보관할 수 있습니다.
requests=재료 수량
requests-edit=편집...
requests-edit-tooltip=루프에서 몇 분 분량의 재료를 요청할지, 또는 재료 수량을 정의할 수 있습니다.
requests-title=재료 수량
requests-tooltip=루프 내 상자에서 물류 네트워크에 각 재료를 각각 얼마나 요청할지 정의합니다.
settings=설정
settings-tooltip=연구되지 않은 아이템이나 숨겨진 건설 옵션 표시와 관련된 설정을 조정할 수 있습니다.
split-count-tooltip=이 단계의 기계에 생산 모듈을 몇 개 장착할지 정의합니다. 남은 슬롯에는 품질 모듈이 장착됩니다. 입력값을 지우고 Enter를 눌러 최적 비율로 재설정할 수 있습니다.
split-edit=비율..
split-edit-tooltip=섞여 투입할 생산 모듈의 유형, 각 기계 단계마다 몇 개씩 투입할지 결정할 수 있습니다.
split-enabled=생산 모듈 섞기
split-enabled-tooltip=활성화하면, 목표보다 아래 단계 기계에 생산 모듈을 구성에 맞는 최적 비율로 섞어 사용하도록 합니다. 품질 모듈만 사용하고 싶다면 선택을 해제하세요.
split-no-productivity=이 공정에서 생산 모듈을 사용할 수 없어, 모든 기계에 품질 모듈이 사용됩니다.
split-of=/ __1__칸
split-title=모듈 비율
stock=인벤토리 상자
stock-tooltip=각 단계의 아이템을 재활용기가 가져갈 때까지 보관합니다. 품질이 높을수록 더 많이 보관할 수 있습니다.
summary=기계 __1__ 대, 재활용기 __2__대
terminal-module=마지막 기계 모듈
terminal-module-tooltip=목표 품질과 일치하는 단계의 기계에 투입됩니다. 더 높은 품질이 나오지 않도록 기본값은 생산 모듈로 설정됩니다. (빈 값으로 설정해도 무방함)
time-days=__1____2__ 1개 생산에 약 __3__일 필요
time-hours=__1____2__ 1개 생산에 약 __3__시간 필요
time-minutes=__1____2__ 1개 생산에 약 __3__분 필요
time-seconds=__1____2__ 1개 생산에 약 __3__초 필요
title=업사이클링 계획기
trash-unrequested=요청하지 않은 아이템 폐기
trash-unrequested-tooltip=로봇이 상자에서 요청하지 않은 모든 아이템을 가져가도록 해, 루프가 막히지 않도록 합니다.
yield=__3____2__ 1개 생산에 약 __2__ __1__개 필요

[upl-message]
beacon-out-of-reach=__1__ 건물이 같은 단계의 기계와 재활용기 모두에 도달하지 않습니다.
beacon-too-tall=__1__ 건물이 너무 커서 루프 안에 놓을 수 없습니다.
build-quality-not-researched=선택한 아이템 중 하나가 아직 연구되지 않은 __1__ 품질을 필요로 합니다. 루프는 연구가 완료될 때까지 대기 상태로 전환됩니다.
circuit-min-too-big=__1__ 최소 수량 + 운반량이 인벤토리 상자 용량을 초과합니다. 더 큰 상자를 선택하거나, 최소 수량이나 운반량을 줄여보세요.
circuit-unlinked=건물 __1__개가 회로 전선 도달 범위보다 떨어져있어, 제한 없이 작동할 것입니다. 
consumers-unpowered=건물 __1__개가 전력 공급 범위 밖에 있습니다. 더 넓은 범위의 전신주를 사용하거나 전력을 수동으로 공급해주세요.
cursor-full=설계도면을 투입할 공간이 부족합니다. 인벤토리 칸을 하나 비우고 다시 시도해주세요.
inserter-too-few-filters=__1__에 남은 필터 슬롯 수가 충분하지 않습니다. 이 제작법는 투입기마다 필터 슬롯 __2__개가 필요합니다. 더 많은 필터 슬롯을 가진 투입기를 선택하세요.
item-spoils=__1__ 아이템은 부패할 수 있으며, 목표 품질에 도달하기 전에 일부가 루프 안에서 썩어버릴 수 있습니다.
machine-no-fluid-face=__1__ 건물은 어떤 방향으로 돌리더라도 파이프와 연결할 수 없습니다.
module-not-accepted=__1__ 아이템은 __2__에 투입할 수 없습니다.
module-not-accepted-by-recipe=이 제작법에는 __1__ 아이템을 사용할 수 없습니다.
no-active-provider=아직 능동형 공급 상자가 연구되지 않았습니다.
no-belt=아직 운송 벨트가 연구되지 않았습니다.
no-buffer-chest=아직 완충 상자가 연구되지 않았습니다.
no-chest=아직 상자가 연구되지 않았습니다.
no-cursor=설계도면을 들 수 있는 캐릭터가 필요합니다.
no-logistic-chest=아직 요청/공급 상자가 연구되지 않았습니다.
no-logistic-connection=__1__에서 물류 네트워크에 연결할 수 없었습니다. '전체 물류 네트워크 집계' 선택지를 해제하거나 다른 기계를 선택하세요.
no-machine-available=이 제작법을 사용할 수 있는 기계가 없습니다.
no-module-slots=__1__에는 모듈 슬롯이 없습니다.
no-pipe=아직 파이프가 연구되지 않았습니다.
no-pipe-to-ground=아직 지하 파이프가 연구되지 않았습니다.
no-pole-researched=아직 전신주가 연구되지 않았습니다. 이 루프는 전원이 공급되지 않은 상태로 설치될 예정입니다.
no-quality-effect=__1__은 품질 모듈을 수락할 수 없습니다.
no-quality-module=아직 연구된 품질 모듈이 없습니다.
no-recycler=사용 가능한 재활용기가 없습니다. '모든 건설 옵션 표시'를 활성화한 뒤 하나를 선택하세요.
no-recycling-path=__1__ 아이템은 재활용해도 원료를 회수할 수 없습니다.
only-fuelled-inserters=현재 연구된 모든 투입기에 연료가 필요합니다. 먼저 전기 투입기를 연구하세요.
plan-failed=계획 수립에 실패했습니다. 계획기를 다시 열고 재시도해 주세요.
planner-not-researched=__1__ 기술 연구가 필요합니다.
quality-not-researched=__1__ 품질 연구가 아직 완료되지 않았습니다. 루프는 연구가 완료될 때까지 대기 상태로 전환됩니다.
recipe-not-researched=제작법이 아직 연구되지 않았습니다. 루프는 연구가 완료될 때까지 대기 상태로 전환됩니다.
recycler-needs-wider-machine=__1__에는 가로 폭이 __2__칸 이상인 기계가 필요합니다.
recycler-no-eject=__1__ 기계는 연결된 기계로 출력물을 바로 보낼 수 없습니다.
recycling-mismatch=__1__ 아이템을 재활용해도 구성 재료로 돌아가지 않습니다.
request-too-big=요청한 재료를 모두 담는 데 인벤토리 __1__칸이 필요하지만, 재료 상자 용량이 __2__칸입니다. 요청 시간을 줄이거나 더 큰 상자를 선택하세요.
too-many-fluids=유체 재료가 하나만 포함된 제작법만 루프로 만들 수 있습니다.
too-many-ingredients=이 제작법에는 루프가 선별할 수 있는 최대치인 __1__개보다 더 많은 재료가 사용됩니다.

[mod-setting-name]
upcycler-planner-show-all=연구되지 않은 아이템 표시
upcycler-planner-show-all-build-options=모든 건설 옵션 표시

[mod-setting-description]
upcycler-planner-show-all=계획기에 있는 모든 아이템, 기계, 건물을 연구 여부와 상관없이 모두 제공하세요.
upcycler-planner-show-all-build-options=상자, 신호기, 그리고 선택지가 하나뿐인 아이템을 포함하여 모든 제작 옵션을 표시하세요.