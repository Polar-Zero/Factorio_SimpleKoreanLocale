[tips-and-tricks-item-description]
administratorio-admin-science=[font=default-bold]Administrative Science fuels your bureaucratic expansion.[/font]\n\nAdministrative research requires the [item=administrative-science-pack] Administrative Science Pack (Gray). This pack is the bottleneck for most custom bureaucracy tech.\n\n[font=default-bold]Production:[/font]\nProduced at the [entity=office-desk] Administrative Office Desk from:\n• [item=blank-form] Blank Form\n• [item=provisional-approval] Provisional Approval\n• [item=basic-excuse] Basic Excuse\n• [item=research-grant-approval] Research Grant Approval\n\n[font=default-bold]Usage:[/font]\nThis pack replaces military science in vanilla research costs and is also used throughout the custom tech tree. If your paperwork chain stalls, your research stalls with it.
administratorio-administrative-space-station=[font=default-bold]The Administrative Space Station closes the platform paperwork loop.[/font]\n\nUnlocked by [technology=workforce-formation]. 3.5× crafting speed, 4 module slots, 750kW. It is the only full administrative office approved for vacuum; [entity=printer-t2] Industrial Printers and [entity=laser-printer] Laser Printers are also allowed as dedicated print equipment.\n\n[font=default-bold]Basic asteroid loop:[/font]\n• Carbon + water → paper\n• Carbon + iron ore + water → ink\n• Paper + ink → [item=orbital-operations-form]\n• Operations forms authorize fuel, oxidizer, tourism, routine deviation orders, space science, and [item=asteroid-processing-docket]\n\nBasic asteroid crushing and ice melting remain paperwork-free so a stranded platform cannot deadlock. Advanced crushing consumes dockets and yields copper, sulfur, and calcite for efficient archival paper, secure ink, bulk copying, and [item=priority-orbital-deviation-order].\n\n[font=default-bold]Staffing:[/font] One [item=astronaut] and the required managers are consumed only when constructing the station. Recurring recipes consume no personnel.
administratorio-aquilo-manifest=[font=default-bold]Aquilo is convergence, not abundance.[/font]\n\nBring earlier planets' colored paperwork and one [item=cryoprint-technician]. Fax emitters consume the source document. Receivers reconstruct it from [item=thermal-transfer-sheet] transfer sheets and, for colored paperwork, compressed [item=composite-chroma-ribbon] charges. No liquid ink survives this dress code.\n\n[font=default-bold]Rocket silo:[/font] The shared recipe is available here, but its [item=government-grant] Government Grant and [item=management-approval-written] Written Management Approval must arrive through interplanetary logistics.\n\nThe [entity=archive-recombination-bureau] also works here, but critical cryogenic progression remains deterministic. Use its one-form reassignment rolls to rebalance surpluses, not to gamble for the only permit keeping the factory alive.
administratorio-archive-recombination=[font=default-bold]The Archive Recombination Bureau recycles one form into three random same-rank replacements.[/font]\n\nUnlocked by [technology=archive-recombination] (requires Fulgora Digital Services). A Recycler variant permanently staffed by a [item=relay-clerk] (consumed on construction).\n\n[font=default-bold]How it works:[/font]\n1. Insert ONE supported paperwork form (any recyclable form of any rank).\n2. The machine automatically selects that form's reassignment recipe.\n3. THREE candidate replacement forms (same rank, color-safe) each roll independently at 25% chance.\n4. Results output to the 12-slot result inventory. You may get 0, 1, 2, or 3 forms.\n\n[font=default-bold]Constraints:[/font]\n• Candidates NEVER include the input form itself.\n• Candidates NEVER jump progression rank (T1 stays T1, T2 stays T2, etc.).\n• Candidates NEVER invent a color (a black-only form only yields black-only forms; a cyan form yields cyan or black forms).\n• Only works on "recyclable" forms (most printed documents).\n\n[font=default-bold]Use case:[/font] Rebalance surpluses — feed excess T2 permits, get random T2 permits back. Do NOT gamble for critical progression items (the only permit keeping the factory alive) — use deterministic salvage recipes for those.
administratorio-bullshit-economy=[font=default-bold]Bullshit Ore powers the entire certificate and excuse supply chain.[/font]\n\nMine [item=bullshit-ore] Bullshit Ore to produce:\n• [item=dubious-data] Dubious Data (refined from ore)\n• [item=basic-excuse] Basic Excuse → [item=good-excuse] Good Excuse\n• [item=crappy-report] Crappy Report → [item=justification] Justification → [item=narrative] Narrative\n• [item=white-paper] White Paper → [item=policy] Policy → [item=regulation] Regulation\n\n[font=default-bold]Redundant Rubble derivatives:[/font]\n[item=redundant-rubble] Redundant Rubble is processed into three derivative tiers:\n• [item=useless-documentation] [font=default-bold]Useless Documentation[/font] — rubble + paper, used in Form 27B-6 and treasury bonds\n• [item=compacted-rubble] [font=default-bold]Compacted Rubble[/font] — rubble + carbon cert, used in buildings and late recipes\n• [item=refined-nonsense] [font=default-bold]Refined Nonsense[/font] — compacted rubble + misinformation, used in credentials, narratives, and high-tier resolutions\n\n[font=default-bold]Government funding chain:[/font]\n[item=taxpayer-money] Taxpayer Money (Nauvis only) → [item=treasury-bond] Treasury Bond (50 money) → [item=government-grant] Government Grant (10 bonds)\n\nTreasury bonds are the routine, tradeable bureaucratic currency; government grants are reserved for major capital projects such as rocket silos. [fluid=slush-fund] Slush Funds and late-game [font=default-bold]Tax Audits[/font] in the [entity=union-headquarters] Union Headquarters can produce additional Nauvis funding.\n\n[font=default-bold]Multi-building production chain:[/font]\n• [entity=office-desk] Office Desk: forms, science packs, data, treasury bonds, verified certificates, environmental reports, and refinery permits\n• [entity=corporate-breakroom] Breakroom: coffee, gossip, good excuses, verbal approval drafts\n• [entity=union-headquarters] Union HQ: union approvals, government grants, narratives, written approvals, white papers, policy, regulation, and tax audits\n• [entity=propaganda-distillery] Distillery: lies, misinformation, credentials, slush funds, refined nonsense
administratorio-bureaucratic-transcendence=[font=default-bold]Bureaucratic Transcendence: paperwork is no longer a bottleneck for transit.[/font]\n\nUnlocked by [technology=bureaucratic-transcendence]. The [entity=public-train-stop] is the flagship unlock — a train stop that just works, no forms required.\n\n[font=default-bold]Lore:[/font] Your administration has achieved such throughput and reliability that the central bureau has granted a standing exemption for routine rail operations. The paperwork still exists for everything else — this is transit-specific.\n\n[font=default-bold]Prerequisites:[/font] [technology=aquilo-fax-network] (the full interplanetary fax chain). You must have conquered the convergence of all four Space Age planets' bureaucracies before the system trusts you with form-free trains.
administratorio-capture-bureau=[font=default-bold]The Capture Bureau converts hostile wildlife into workforce on Gleba.[/font]\n\nUnlocked by [technology=gleba-conciliation]. Feed lure fluids to attract specific fauna:\n• [fluid=workforce-lure-spores] — attracts biters for worker intake\n• [fluid=tourism-lure-spores] — attracts spitters for space tourism packaging (requires Cyan-Yellow Bureaucracy)\n• [fluid=oviposition-lure-spores] — attracts pentapods for egg harvest\n\n[font=default-bold]Mechanics:[/font] The bureau receives hostile units, processes [item=job-offer] on them, and outputs [item=worker-biter] (or specialist variants). It's the Gleba equivalent of the Nauvis admin-station + job-offer loop, but for hostile wildlife instead of complaining citizens.\n\n[font=default-bold]Tourism branch:[/font] Package spitters with [item=public-transportation-contract], monetize their orbital trip, and return the paid tourists to a Nauvis administrative desk for release.
administratorio-color-faxing=[font=default-bold]Color Faxing enables faxing multi-color documents.[/font]\n\nUnlocked by [technology=color-faxing] (requires Aquilo Fax Network). Without this, the [entity=fax-emitter] rejects any document requiring cyan, yellow, or magenta ink.\n\n[font=default-bold]With Color Faxing:[/font]\n• All faxable documents (including dual-color and trichromatic forms) can be transmitted.\n• Reconstruction at the receiver uses [item=composite-chroma-ribbon] charges per color.\n• Queue capacity still applies — color documents take the same queue slots.\n\n[font=default-bold]Strategic note:[/font] Faxing consumes the source document. For critical trichromatic permits ([item=trichromatic-permit], [item=unified-operations-charter], [item=promethium-research-charter]), consider whether you need the original on the source planet or if a faxed copy suffices.
administratorio-conciliation-desk=[font=default-bold]The Conciliation Desk is Gleba's specialist office for yellow-form finalization.[/font]\n\nUnlocked by [technology=gleba-conciliation]. Crafting category: [entity=bureaucracy-conciliation]. 1.75× speed, 50% base productivity, 4 module slots. Fluid inputs for yellow ink and amber sap derivatives.\n\n[font=default-bold]Recipes:[/font]\n• [item=blank-yellow-form] → [item=conciliation-order] — compact biological exception paperwork\n• [item=symbiosis-record] — biological registry replacing documentation-heavy filler\n• Local fallback approvals replacing lie-heavy Nauvis chains\n\n[font=default-bold]Staffing:[/font] Requires one [item=conciliation-officer] (crafted at [entity=formation-center], consumed on placement).\n\n[font=default-bold]Why it exists:[/font] Gleba's biology-heavy progression doesn't need the full Nauvis permit ladder. The Conciliation Desk provides a compact yellow-form branch that bypasses lie/taxpayer-heavy approvals with direct biological conciliation. It's the Gleba-native resolution path.
administratorio-cyan-magenta-bureaucracy=[font=default-bold]Cyan-Magenta Bureaucracy merges Vulcanus and Fulgora paperwork.[/font]\n\nUnlocked by [technology=cyan-magenta-bureaucracy] (requires Vulcanus Cert + Fulgora Digital Services + Metallurgic + Electromagnetic science). Unlocks:\n• [item=cyan-magenta-form] — dual-ink form for Vulcanus + Fulgora\n• [item=hardened-data-vault] — heat-sealed custody packet for Vulcanus-Fulgora data transfer\n\n[font=default-bold]Use case:[/font] Orbital and shattered-planet authorization often needs both heavy metallurgy (Vulcanus) and electromagnetic/archive (Fulgora). The dual-color form and hardened vault are the convergent paperwork.
administratorio-cyan-yellow-bureaucracy=[font=default-bold]Cyan-Yellow Bureaucracy merges Vulcanus and Gleba paperwork.[/font]\n\nUnlocked by [technology=cyan-yellow-bureaucracy] (requires Vulcanus Cert + Gleba Conciliation + Metallurgic + Agricultural science). Unlocks:\n• [item=cyan-yellow-form] — dual-ink form printed directly with cyan + yellow\n• [item=public-transportation-contract] — two-color transit contract merging cyan + yellow\n• [item=tourism-lure-spores] — spitter tourism lure for Capture Bureau\n• Orbital tourism revenue processing\n\n[font=default-bold]Tourism:[/font] Package spitters on Gleba, monetize the trip in orbit, then return paid tourists to a Nauvis administrative desk. Tourists are never converted into paperwork because, literally, be serious.
administratorio-debug-hard-mode=HARD MODE
administratorio-debug-protest-belts-and-inserters=Protest at Belts and Inserters
administratorio-digital-services-bureau=[font=default-bold]The Digital Services Bureau is Fulgora's 24/7 computerized office.[/font]\n\nUnlocked by [technology=fulgora-digital-services]. Runs [entity=bureaucracy-registration] and [entity=bureaucratic-bootstrap] categories:\n• [item=digital-processing-certificate] — authorizes computerized administrative throughput\n• [item=electromagnetic-operating-license] — electromagnetic infrastructure and holmium bureaucracy\n• [item=data-recovery-order] — routing-heavy work order for archive reconstruction\n• [item=archive-recovery-permit] — salvage-driven paperwork recovery\n• Local bootstrap forms for Fulgora progression\n\n[font=default-bold]Mechanics:[/font] 3× base productivity, 6 module slots, NO night closure (digital services run continuously). Fluid input for [fluid=electromagnetic-lubricant] (or equivalent). Staffed by one [item=relay-clerk] (crafted at [entity=formation-center], consumed on placement).\n\n[font=default-bold]Why it matters:[/font] Unlike Nauvis offices, the Digital Services Bureau does not close at night. It is your always-on Fulgora paperwork engine for archive recovery, digital certificates, and electromagnetic licenses.
administratorio-enable-working-hours=Enable Working Hours
administratorio-executive-trajectory-compliance-array=[font=default-bold]Executive Arrays have unappealable jurisdiction over every asteroid size.[/font]\n\nUnlocked by [technology=trajectory-compliance-jurisdiction-3] (requires Senior Arrays + Quantum Processor). The Executive Array pushes small, medium, big, AND huge Promethium-bearing asteroids within 40 tiles. Huge asteroids have 5× the mass factor and 54 chunk yield — they typically require several simultaneous Executive Arrays or maxed firing speed to deflect meaningfully.\n\n[font=default-bold]Promethium strategy:[/font] Huge Promethium asteroids are the primary source of Promethium chunks. You generally want to MINE them with VESMs, not deflect them. Use Executive Arrays to protect the platform while your miners work, or to clear non-Promethium huge rocks that threaten the hub.
administratorio-fax-emitter=[font=default-bold]The Fax Emitter sends black-ink paperwork to other planets.[/font]\n\nUnlocked by [technology=aquilo-fax-network]. Place a document in the emitter's single slot. It transmits over 60 ticks, then reserves a queue slot in the target planet's [entity=interplanetary-fax-exchange].\n\n[font=default-bold]Mechanics:[/font]\n• Only black-ink documents (no color) unless [technology=color-faxing] is researched.\n• GUI lets you select destination planet (Nauvis, Vulcanus, Gleba, Fulgora, Aquilo).\n• Each planet can host only ONE Interplanetary Fax Exchange.\n• Circuit interface: outputs queue status signals ([signal=signal-fax-queue-size], [signal=signal-fax-free-slots], [signal=signal-fax-reserved-slots]).\n• Quality scales transmission speed (higher quality = faster fax).\n\n[font=default-bold]Logistics:[/font] Feed documents via inserter/belt. The emitter holds one document at a time. For bulk transfer, use multiple emitters or cycle quickly.
administratorio-fax-queue-capacity=[font=default-bold]Fax Queue Capacity research expands the receiver's incoming buffer.[/font]\n\nBase queue: 5 slots + receiver quality level. Three upgrade technologies each add +5 slots:\n• [technology=fax-queue-capacity-1] → +5 (total 10+quality)\n• [technology=fax-queue-capacity-2] → +5 (total 15+quality)\n• [technology=fax-queue-capacity-3] → +5 (total 20+quality)\n\n[font=default-bold]Why it matters:[/font] During heavy multi-planet fax bursts (e.g., sending all trichromatic permits for a rocket launch), the queue can fill. A full queue blocks new faxes until slots clear. Upgrade capacity before large coordinated fax operations.
administratorio-fulgora-archives=[font=default-bold]Fulgora recycles the filing cabinet, then the files, then the explanation.[/font]\n\nScrap can yield [item=old-archive]. Archives recycle quickly into random starter forms only. Every paperwork form can also be recycled in an ordinary [entity=recycler] Recycler into one [item=paper] with a 25% chance. Redundant rubble and toner provide deterministic ordinary production through local salvage recipes.\n\nThe [entity=archive-recombination-bureau] is a separate one-input Recycler variant. Insert one supported form and it automatically selects that form's reassignment recipe. Three same-rank, color-safe replacement forms each roll independently at 25%, so an operation may return zero, one, two, or three forms through the normal result inventory. Candidates never include the input itself, never jump progression rank, and never invent a color. The [item=relay-clerk] consumed when constructing the machine is its permanent employee.\n\n[font=default-bold]Bring deliberately:[/font] Relay Clerks for every staffed digital, electromagnetic, or archive building you plan to construct (or equivalent [item=clerical-trainee] Clerical Trainees), plus a [item=chemical-operator] Chemical Operator if wanted.
administratorio-fulgora-digital-services=[font=default-bold]Fulgora Digital Services unlocks the planet's computerized bureaucracy branch.[/font]\n\nUnlocked by [technology=fulgora-digital-services] (requires Chromatic Printing, triggered by crafting 20 [item=charged-toner]). Unlocks the [entity=digital-services-bureau], [item=archive-recovery-permit], [item=digital-processing-certificate], [item=electromagnetic-operating-license], and [item=data-recovery-order].\n\n[font=default-bold]Research trigger:[/font] Craft 20 [item=charged-toner] (mined from Fulgora scrap deposits or recovered from salvage). This forces you to engage with Fulgora's scrap/recycling loop before unlocking digital services.\n\n[font=default-bold]Key buildings:[/font]\n• [entity=digital-services-bureau] — 24/7 computerized office (no night closure)\n• [entity=archive-recombination-bureau] — one-form → three-form reassignment recycler\n• [entity=interplanetary-fax-exchange] — fax receiver (shared with Aquilo tech)
administratorio-gleba-manifest=[font=default-bold]Gleba has too much bullshit, by design.[/font]\n\nPump amber sap and seed it into large quantities of [item=bullshit-ore]. Local cultivation recipes turn that surplus into dubious data, excuses, refined nonsense, provisional approvals, and disposable documentation. Yellow paperwork still spoils, so supply is abundant while logistics remain biologically annoying.\n\n[font=default-bold]Bring deliberately:[/font] one [item=clerical-trainee] Clerical Trainee (or a finished [item=conciliation-officer] Conciliation Officer) for the biochamber branch, plus a [item=chemical-operator] Chemical Operator if you want chemical infrastructure immediately.\n[font=default-bold]Produce locally:[/font] all ordinary administrative material and rocket supplies.\n[font=default-bold]Escape milestone:[/font] complete the ordinary written-management paperwork and build the same rocket-silo recipe used everywhere else.
administratorio-interplanetary-fax-exchange=[font=default-bold]The Interplanetary Fax Exchange receives and reconstructs faxed documents.[/font]\n\nUnlocked by [technology=aquilo-fax-network]. One per planet. Receives faxes from any planet's emitters, queues them (base 5 slots + quality + [technology=fax-queue-capacity-1/2/3] upgrades), and prints on demand.\n\n[font=default-bold]Reconstruction costs:[/font]\n• Black-only docs: 2 [item=thermal-transfer-sheet], 0 [item=composite-chroma-ribbon]\n• 1-color docs: 2 sheets, 1 ribbon charge\n• 2-color docs: 3 sheets, 1 ribbon charge\n• 3-color docs: 4 sheets, 2 ribbon charges\n\n[font=default-bold]GUI workflow:[/font]\n1. Incoming faxes appear in the queue.\n2. Set a requested document signal (circuit or GUI) to prioritize that form.\n3. Supply sheets and ribbons to the receiver's input.\n4. Receiver prints queued faxes matching the request (or oldest first).\n5. Printed documents output to the receiver's inventory for extraction.\n\n[font=default-bold]Color faxing:[/font] Requires [technology=color-faxing]. Without it, color documents cannot be faxed (emitter rejects them).
administratorio-laser-printer=[font=default-bold]The Laser Printer is Aquilo's frozen-ink printer using solid media.[/font]\n\nUnlocked by [technology=aquilo-fax-network]. No liquid ink — uses:\n• [item=thermal-transfer-sheet] — premium print substrate (replaces paper)\n• [item=composite-chroma-ribbon] — compressed CMY carrier (replaces liquid color inks)\n\n[font=default-bold]Capabilities:[/font]\n• All legacy printing categories\n• [entity=printing-chromatic], [entity=printing-multicolor], and advanced orbital printing\n• 5× crafting speed, 50% base productivity, 6 module slots\n• No fluid inputs — purely item-fed\n• Works at Aquilo's low pressure and aboard space platforms\n\n[font=default-bold]Why it exists:[/font] Liquid ink freezes on Aquilo. The Laser Printer uses thermally stable solid media that works in cryogenic conditions. Ribbons are assembled from imported CMY paperwork + Aquilo [item=transfer-emulsion].
administratorio-notary-office=[font=default-bold]The Notary Office is Vulcanus's premium certification office.[/font]\n\nUnlocked by [technology=vulcanus-certification]. Crafting category: [entity=bureaucracy-certification]. 2× speed, 50% base productivity, 4 module slots. Fluid inputs for cyan ink and lie outputs for notarization byproducts.\n\n[font=default-bold]Recipes:[/font]\n• [item=embossed-seal] — premium notarization seal from Vulcanus materials\n• [item=industrial-charter] — certified industrial operations packet for Vulcanus metallurgy\n• [item=good-excuse] — local bridge out of the coffee-and-gossip deadlock\n• [item=management-approval-written] — territorial-deed exception for the escape milestone\n• [item=inspection-docket] — dense industrial review for foundry-era compliance\n\n[font=default-bold]Staffing:[/font] Requires one [item=licensed-notary] (crafted at [entity=formation-center], consumed on placement). The Notary Office is the Vulcanus gateway for local certification work — bring notaries for every specialist building you plan.
administratorio-operating-paperwork=[font=default-bold]Not every machine runs on assembler paperwork.[/font]\n\n[font=default-bold]From day one:[/font]\n• [item=carbon-offset-certificate-basic] Carbon Offset Certificate — furnaces and smelting\n\n[font=default-bold]Later specialist documents:[/font]\n• [item=chemical-handling-work-order] Chemical Handling Work Order — oil refineries, chemical plants, advanced refining, coal liquefaction, and all heavier chemistry\n• [item=radiological-work-order] Radiological Work Order — centrifuges and centrifuging recipes\n\nThese specialist forms are built from lower-tier approvals like [item=safety-waiver] Safety Waivers, [item=form-27b-6] Form 27B-6, [item=environmental-impact-report] Environmental Impact Reports, and later management approvals. Complaints still stay inside the resolution chain. They fund and unlock your bureaucracy indirectly, but they are not consumed by these operating forms.
administratorio-orbital-employment-cannon=[font=default-bold]The Orbital Employment Cannon launches Voluntary Exploration Space Miners (VESMs) at asteroids.[/font]\n\nUnlocked by [technology=workforce-formation]. The cannon reaches 56 tiles but fires only through a narrow 18° corridor centered on its placed direction. On impact, the VESM attaches and begins mining after a 1-second delay.\n\n[font=default-bold]Mining mechanics:[/font]\n• Base damage: 125/second per attached miner (scales with [technology=orbital-employment-damage-1..5])\n• Each asteroid accepts 1 miner base capacity, up to 5 with [technology=orbital-employment-capacity-1..4]\n• Damage stacks linearly per attached miner\n• When the asteroid dies, it drops its full vanilla chunk yield PLUS one [item=returning-orbital-employee] chunk per attached miner\n• The employee chunk is mined by asteroid collectors directly into reusable VESM ammunition\n\n[font=default-bold]Critical — collect the employee chunks:[/font] If an asteroid collector misses the employee chunk (it drifts past the collection radius), that miner is LOST PERMANENTLY. Position collectors carefully or use multiple collectors to cover the drift zone.\n\n[font=default-bold]Staffing priority:[/font] The cannon prefers the nearest eligible asteroid inside its firing corridor with available capacity. Launches reserve capacity immediately, and an asteroid with an attached or incoming VESM cannot be deviated. If all eligible asteroids are at capacity, the cannon pauses until a slot frees up.
administratorio-orbital-employment-capacity=[font=default-bold]Orbital Employment Capacity research raises the per-asteroid miner limit.[/font]\n\nFour levels, each +1 miner per asteroid:\n• Level 1: 2 miners • Level 2: 3 miners • Level 3: 4 miners • Level 4: 5 miners\n\n[font=default-bold]Prerequisites:[/font] Level 1: Workforce Formation. Level 2: +Metallurgic/Agricultural/Electromagnetic. Level 3: +Cryogenic. Level 4: +Promethium.\n\n[font=default-bold]Economics:[/font] Each additional miner = one more employee chunk to collect = one more reusable VESM. Capacity is the single most impactful orbital research — it linearly scales both mining speed AND ammo recovery. Research capacity to 3-4 before heavy damage investment.
administratorio-orbital-employment-damage=[font=default-bold]Orbital Employment Damage research scales VESM mining damage.[/font]\n\nFive levels, each +50% damage (additive):\n• Level 1: 187.5/sec • Level 2: 250/sec • Level 3: 312.5/sec • Level 4: 375/sec • Level 5: 437.5/sec\n\n[font=default-bold]Prerequisites:[/font] Level 1-2: Workforce Formation. Level 3-4: +Metallurgic/Agricultural/Electromagnetic. Level 5: +Cryogenic. Level 6 (if extended): +Promethium.\n\n[font=default-bold]Stacking:[/font] Damage multiplies per attached miner. At capacity 5 with level 5 damage: 5 × 437.5 = 2187.5 damage/sec — enough to crack huge Promethium asteroids in ~2.3 seconds. Prioritize capacity research first (more miners = linear damage), then damage research.
administratorio-orbital-infrastructure-permit=[font=default-bold]Orbital Infrastructure Permits authorize administrative space-platform construction.[/font]\n\nUnlocked by [technology=space-platform] (vanilla). Produce them in a registration-capable office from [item=blank-directive], [item=transit-authorization], [item=low-density-structure], and [item=processing-unit].\n\n[font=default-bold]Usage:[/font] Required as an ingredient for placing [entity=administrative-space-station], [entity=trajectory-compliance-array], [entity=orbital-employment-cannon], and other orbital administrative buildings. Ordinary [item=construction-permit] has no jurisdiction in vacuum — this is the space-rated equivalent.\n\n[font=default-bold]Supply chain:[/font] Make permits before or alongside your first platform build. Keep a buffer with your construction materials: every orbital facility consumes one when placed.
administratorio-orbital-specialists=[font=default-bold]Orbital specialists are construction consumables, not runtime fuel.[/font]\n\nUnlike biter workers that cycle through [entity=biter-station] dispatches, orbital specialists (Astronauts, Licensed Notaries, Conciliation Officers, Relay Clerks, Cryoprint Technicians, Field Negotiators) are crafted at the [entity=formation-center], stored in your inventory, and consumed exactly once when you [color=red]place[/color] the matching building.\n\n[font=default-bold]Planning rule:[/font] Build one specialist for [font=default-bold]each[/font] matching building in your construction queue. For example, every [entity=digital-services-bureau], [entity=interplanetary-fax-exchange], and [entity=archive-recombination-bureau] needs its own [item=relay-clerk]; every [entity=administrative-space-station] needs its own [item=astronaut]. Stockpile them before you rocket up.\n\n[font=default-bold]Middle-Management Managing Managers (MMMM):[/font] These are also consumed on building placement. Briefed variants (Training, Staffing, Compliance, Liaison, Orbital) are produced from a regular MMMM plus meeting paperwork, expire after 3 minutes, and should be crafted just-in-time for the construction queue.
administratorio-paperwork=[font=default-bold]Paper is the foundation of all bureaucracy.[/font]\n\n[item=paper] Paper starts as wood, and [item=ink] ink is refined from coal. After researching [technology=synthetic-stationery], you can also synthesize paper directly from [item=plastic-bar] plastic, [item=sulfur] sulfur, and water for a much faster but more expensive supply.\n\n[font=default-bold]Printers:[/font]\n• [entity=mechanical-printer] [font=default-bold]Mechanical Printer[/font] — you start with one at the crash site for your first printed forms\n• [entity=printer-t1] [font=default-bold]Printer T1[/font] — electric printing for routine form production\n• [entity=printer-t2] [font=default-bold]Printer T2[/font] — faster printing plus bulk copy recipes unlocked with [technology=industrial-printing]\n\n[font=default-bold]Permit flow:[/font]\n1. Draft at office buildings\n2. Print the final permit at a printer\n3. Feed the approved form directly into the building or work-order chain\n\n[font=default-bold]Key forms:[/font]\n• [item=blank-form] Blank Form — base for most administrative paperwork\n• [item=blank-approval] Blank Approval — template for waivers, permits, and transit forms\n• [item=form-27b-6] Form 27B-6 — standardized requisition form for rail and compliance paperwork\n• [item=carbon-offset-certificate-basic] Carbon Offset Certificate — required for batch smelting
administratorio-pneumatic-transport=[font=default-bold]Move paperwork instantly through sealed manila tubes.[/font]\n\nThe pneumatic tube system transports paperwork items via a hidden signal chain — items enter at one end and appear instantly at the other:\n\n[font=default-bold]Buildings:[/font]\n• [entity=tube-intake] [font=default-bold]Tube Intake[/font] — consumes valid paperwork items from adjacent belt/chest via hidden inserter\n• [entity=tube-outtake] [font=default-bold]Tube Outtake[/font] — dispenses items from the signal pool; use your own inserter or logistics to extract\n• [entity=pneumatic-pipe] [font=default-bold]Pneumatic Pipe[/font] — manila-colored, connects intakes to outtakes\n• [entity=pneumatic-pipe-to-ground] [font=default-bold]Pneumatic Underground Pipe[/font] — 16 tile range\n\n[font=default-bold]How it works:[/font]\nIntake stations have a hidden inserter that pulls only valid paperwork items from adjacent belts or chests. Outtake stations are containers — use your own inserter or logistics to extract items. Set a filter on the outtake inventory slot to request a specific item type.\n\nPneumatic pipes define the signal network — any intakes and outtakes connected by pipes share items instantly. Multiple item types can flow through the same pipe network (sushi transport). Each network has a capacity limit that can be increased through research.\n\nPneumatic pipes use a separate connection category — they [color=red]cannot[/color] connect to regular fluid pipes.\n\nHover over any tube intake or outtake to see a live status panel showing network connection, capacity usage, and item contents.\n\nUnlocked with [font=default-bold]Pneumatic Form Transport[/font] research after [font=default-bold]Printing Technology[/font] and [font=default-bold]Logistic Science[/font].
administratorio-propaganda-distillery=[font=default-bold]The Propaganda Distillery processes all administrative fluids.[/font]\n\nUnlocked with [font=default-bold]Industrial Propaganda[/font], this building replaces chemical processing for bureaucratic fluids.\n\n[font=default-bold]Key recipes:[/font]\n• [fluid=politician-fluid] Politician Fluid → [fluid=lie] Liquid Lies\n• [fluid=lie] Lies + [item=dubious-data] Dubious Data → [fluid=misinformation] Misinformation\n• [fluid=lie] Lies + [item=dubious-data] Dubious Data + [item=refined-nonsense] Refined Nonsense → [item=credentials] Credentials\n• [item=compacted-rubble] Compacted Rubble + [fluid=misinformation] Misinformation → [item=refined-nonsense] Refined Nonsense\n• [item=treasury-bond] Treasury Bonds + lies → [fluid=slush-fund] Slush Funds\n\nChemical plants and oil refineries do [color=red]not[/color] handle these recipes. All lie, misinformation, and slush-fund processing goes through the Propaganda Distillery.
administratorio-protest-resolution=[font=default-bold]A protest is a live outage, not just a warning.[/font]\n\nWhen frustration caps out, the biter picks a reachable player building, walks there, and [color=red]disables it[/color]. Active protests raise alerts, map tags, and sirens. Overtime exemptions do [color=red]not[/color] protect buildings from protest shutdowns.\n\n[font=default-bold]Your protest tool:[/font]\n[item=promise] [font=default-bold]Bureaucratic Promise[/font] is a throwable capsule available from the early game. Throw it at the [font=default-bold]protesting biter[/font], not the building.\n• If a desk slot is free, the biter immediately reroutes back into the nearest queue\n• If no slot is free, the biter becomes [font=default-bold]pacified[/font] for 60 seconds, then resumes protesting if capacity still has not opened\n• A promise does [color=red]not[/color] erase the complaint or reset partial case progress\n\n[font=default-bold]Permanent fix:[/font]\nPromises buy time. Finishing the complaint and returning the final resolved item to the desk is what actually clears the citizen from the system.
administratorio-public-train-stop=[font=default-bold]The Public Train Stop operates without transit authorization paperwork.[/font]\n\nUnlocked by [technology=bureaucratic-transcendence] (requires Aquilo Fax Network). A vanilla [entity=train-stop] that does NOT require [item=transit-authorization] forms to function.\n\n[font=default-bold]Mechanics:[/font]\n• No transit permit chest is created.\n• No forms are consumed on train arrival.\n• Train limit is not tied to paperwork.\n• Functions exactly like a vanilla train stop.\n\n[font=default-bold]Why it exists:[/font] Bureaucratic Transcendence represents the point where your administration has become efficient enough that routine transit no longer requires per-arrival authorization. It's a quality-of-life unlock for massive rail networks — but you must complete the full interplanetary fax chain to earn it.
administratorio-regulation=[font=default-bold]Assembler crafting and building recipes are wrapped in a form-tier system.[/font]\n\n[font=default-bold]Tier System:[/font]\n• [color=green]T0[/color] [item=work-order] Work Order — assembler-only basic utility items\n• [color=green]T1[/color] [item=safety-waiver] Safety Waiver / [item=safety-work-order] Safety Work Order — inserters, radar, walls, poles, boiler, and AM1\n• [color=yellow]T2[/color] [item=construction-permit] Construction Permit / [item=construction-work-order] Construction Work Order — furnaces, mining drills, pumps, AM2, heavy industrial building recipes, and demolition jobs\n• [color=yellow]T3[/color] [item=management-approval-verbal] Management Approval (Verbal) / [item=management-verbal-work-order] Verbal Management Work Order — rail, roboports, personal roboports, robot logistics, solar, accumulators\n• [color=red]T4[/color] [item=management-approval-written] Management Approval (Written) / [item=management-written-work-order] Written Management Work Order — AM3, beacon, rocket silo, nuclear support hardware, and other megaprojects\n• [item=research-grant-approval] Research Grant Approval — all science packs\n\n[font=default-bold]Important:[/font]\n[item=work-order] Work Orders and their tiered variants are only used by assembling-machine recipes. Furnaces, refineries, chemistry, and centrifuging use separate operating paperwork.\n\n[font=default-bold]Handcrafting:[/font]\nOnly recipes available from the start or unlocked by red-science-tier technology can be handcrafted. Later regulated recipes are hidden from player crafting and must be automated.
administratorio-senior-trajectory-compliance-array=[font=default-bold]Senior Arrays extend jurisdiction to big asteroids.[/font]\n\nUnlocked by [technology=trajectory-compliance-jurisdiction-2] (requires Workforce Formation + Metallurgic + Agricultural + Electromagnetic science). The Senior Array pushes small, medium, AND big asteroids within 30 tiles. Big asteroids have 2.5× the mass factor of medium, so overlapping Senior Arrays or firing-speed research is often needed for effective deflection.\n\n[font=default-bold]Strategic note:[/font] Big asteroids carry 18 chunks each. Deflecting them protects your platform but yields no resources — consider letting VESMs mine them first, then clean up the remainder with arrays.
administratorio-territorial-arbitration=[font=default-bold]Territorial Arbitration Posts shrink demolisher territories through paperwork.[/font]\n\nUnlocked by [technology=vulcanus-certification]. Fixed recipe: [item=territorial-arbitration-processing]. Consumes [item=territorial-resettlement-order] + [fluid=lie] per processing cycle (60 ticks).\n\n[font=default-bold]Mechanics:[/font]\n1. Place the post overlapping a demolisher territory (must cover at least one territory chunk).\n2. Supply orders and lies. The post gradually removes territory chunks from the demolisher's patrol zone, shrinking its effective area.\n3. Progress is tracked per territory. Multiple posts on the same territory stack progress.\n4. When all chunks are removed, the demolisher is eliminated and drops a [item=territorial-deed].\n5. Territory naturally regrows (decay) if not actively maintained — posts must continuously feed orders/lies.\n\n[font=default-bold]Costs by demolisher size:[/font]\n• Small: 1 order + 50 lie/sec • Medium: 2 orders + 100 lie/sec • Big: 4 orders + 200 lie/sec\n\n[font=default-bold]Lies source:[/font] [entity=propaganda-distillery] on Vulcanus (politician fluid → lies). Bring enough distillery throughput for your target size.\n\n[font=default-bold]Strategic note:[/font] This is the only way to permanently clear Vulcanus demolisher territories. The deed enables the rocket silo escape milestone.
administratorio-trajectory-compliance-arrays=[font=default-bold]Trajectory Compliance Arrays push asteroids — they do not mine them.[/font]\n\nThe [entity=trajectory-compliance-array] (Junior), [entity=senior-trajectory-compliance-array] (Senior), and [entity=executive-trajectory-compliance-array] (Executive) accept [item=orbital-deviation-order] routine orders and [item=priority-orbital-deviation-order] priority orders. Priority paperwork applies twice the sustained push.\n\n[font=default-bold]Tier jurisdictions:[/font]\n• Junior: small & medium asteroids, 20 tile range\n• Senior: small, medium & big asteroids, 30 tile range\n• Executive: all sizes including huge Promethium, 40 tile range\n\n[font=default-bold]Mechanics:[/font]\n• Each shot creates a fixed-duration push. Overlapping shots and multiple arrays stack.\n• Asteroid mass dilutes the push — heavy rocks need more simultaneous orders.\n• Arrays retarget every 30 ticks to the nearest eligible asteroid.\n• No chunks are produced by deviation alone — the rock must be mined by VESMs or destroyed by other means to yield salvage.\n• If a miner attaches to an asteroid, all arrays automatically retarget away from it (staffed rocks are protected).\n\n[font=default-bold]Research:[/font] Advanced Asteroid Processing unlocks priority orders made from copper, sulfur, and calcite. [technology=trajectory-compliance-speed-1] through [technology=trajectory-compliance-speed-9] increase firing speed.
administratorio-trajectory-compliance-speed=[font=default-bold]Trajectory Compliance Speed research increases array firing rate.[/font]\n\nNine levels, each reducing cooldown:\n• Level 1: 4.5s → Level 2: 4.0s → Level 3: 3.5s → Level 4: 3.0s → Level 5: 2.5s\n• Level 6: 2.0s → Level 7: 1.5s → Level 8: 1.0s → Level 9: 0.5s\n\n[font=default-bold]Prerequisites:[/font] Level 1: Workforce Formation. Levels 5-7: +Metallurgic/Agricultural/Electromagnetic. Level 8: +Cryogenic. Level 9: +Promethium.\n\n[font=default-bold]Impact:[/font] Faster firing = more simultaneous deviation pushes = stronger net deflection on heavy asteroids. Level 9 (0.5s cooldown) with 3 Executive Arrays can push huge Promethium rocks solo. Expensive science — prioritize capacity and jurisdiction first.
administratorio-transit-authorization=[font=default-bold]Train stops have an integrated paperwork chest.[/font]\n\nEvery [entity=train-stop] Train Stop now requires [item=transit-authorization] Transit Authorization (Form 12-T) forms to remain operational.\n\n[font=default-bold]How it works:[/font]\n1. Each Train Stop gets an [entity=transit-permit-chest] integrated transit permit chest.\n2. Insert [item=transit-authorization] Transit Authorizations into that chest.\n3. One form is [font=default-bold]consumed when a train arrives[/font] and begins waiting at the station.\n4. If a station runs out of forms, it closes automatically by setting its train limit to 0.\n\n[font=default-bold]Setup:[/font]\n• Research [font=default-bold]Railway[/font] technology to unlock the form recipe.\n• Craft forms at the [entity=office-desk] Administrative Office Desk.\n• Keep stations stocked with belts, inserters, or logistics so busy hubs do not stall.\n\nThis system makes rail logistics another paperwork problem instead of a combat one.
administratorio-vulcanus-export-charters=[font=default-bold]Vulcanus Export Charters let you run Vulcanus metallurgy off-world.[/font]\n\nUnlocked by [technology=vulcanus-export-charters] (requires Vulcanus Certification + Metallurgic Science). Three charters:\n• [item=thermal-process-license] — certifies high-temperature tungsten-class metallurgy off-Vulcanus\n• [item=calcite-reagent-waiver] — authorizes off-world calcite-based industrial chemistry\n• [item=offworld-metallurgy-charter] — required to run key Vulcanus metallurgical processes away from Vulcanus\n\n[font=default-bold]Orbital variants:[/font] [item=thermal-process-license-orbital], [item=calcite-reagent-waiver-orbital], [item=offworld-metallurgy-charter-orbital] produced at [entity=administrative-space-station] for space platform use.\n\n[font=default-bold]Why it matters:[/font] Without these charters, Vulcanus-specific recipes (tungsten, calcite chemistry, foundry processes) cannot run on other planets or platforms. The charters are the bureaucratic export license for Vulcanus industrial IP.
administratorio-vulcanus-manifest=[font=default-bold]Vulcanus runs on propaganda.[/font]\n\nThe local chain turns lava and cyan minerals into [fluid=molten-promises] Molten Promises and then abundant [fluid=lie] Lies. Territorial Arbitration consumes [item=territorial-resettlement-order] orders plus 50/100/200 lie per second for small/medium/big demolishers. Larger territories cost more because apparently geology has legal standing.\n\n[font=default-bold]Bring deliberately:[/font] enough [item=licensed-notary] Licensed Notaries for each specialist building you intend to construct, plus a [item=chemical-operator] Chemical Operator if you want local chemical infrastructure immediately. These are staffing seeds, not production consumables.\n[font=default-bold]Produce locally:[/font] cyan paperwork, ordinary forms, propaganda fluid, and rocket materials.\n[font=default-bold]Escape milestone:[/font] clear a demolisher territory, receive a [item=territorial-deed], complete the ordinary written-management paperwork, and build the shared rocket-silo recipe.
administratorio-workforce-formation=[font=default-bold]Workforce Formation unlocks orbital bureaucracy.[/font]\n\nResearching [technology=workforce-formation] opens the path to space-based administrative operations. It unlocks the [entity=formation-center] for advanced specialist training, the [entity=trajectory-compliance-array] for asteroid deflection, the [entity=orbital-employment-cannon] for deploying miners, and the [entity=administrative-space-station] for orbital paperwork.\n\n[font=default-bold]New Formation Center outputs:[/font]\n• [item=astronaut] — orbital administrator for space-platform bureaucracy\n• [item=licensed-notary] — Vulcanus charter and permit certification\n• [item=conciliation-officer] — Gleba biochamber and pacification mediation\n• [item=relay-clerk] — Fulgora digital services and archive staffing\n• [item=cryoprint-technician] — Aquilo frozen-ink printing\n• [item=field-negotiator] — protest suppression and expropriation\n• [item=middle-management-managing-manager] — manager for specialist construction\n• [item=voluntary-exploration-space-miner] — reusable ammunition for the orbital cannon\n\nSpecialists and managers are kept in inventory and consumed when you [color=red]place[/color] their matching building; they are not runtime fuel. VESMs are the exception: load them into a cannon and recover them from asteroid debris.
administratorio-yellow-magenta-bureaucracy=[font=default-bold]Yellow-Magenta Bureaucracy merges Gleba and Fulgora paperwork.[/font]\n\nUnlocked by [technology=yellow-magenta-bureaucracy] (requires Gleba Conciliation + Fulgora Digital Services + Agricultural + Electromagnetic science). Unlocks:\n• [item=yellow-magenta-form] — dual-ink form for Gleba + Fulgora\n• [item=anecdotal-data-reprocessing] — salvage-heavy shortcut recipe\n\n[font=default-bold]Use case:[/font] Biological archive work and electromagnetic biology crossover. The yellow-magenta form replaces separate yellow + magenta chains for joint Gleba-Fulgora recipes.

