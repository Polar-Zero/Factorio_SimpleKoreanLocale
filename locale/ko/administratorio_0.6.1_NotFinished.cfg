[fluid-description]
amber-sap=호박 누출 지대에서 펌핑된 끈적끈적한 글레바 분비물. 값싼 핑계, 검은색 잉크, 그리고 노란색 행정주의를 뒷받침합니다.
cyan-ink=불카누스에서 채취할 수 있는 색상 성분입니다. 허가증 및 선언문 초안 인쇄를 위해 컬러 프린터에 투입할 수 있습니다.
cyan-slurry=녹청 껍질에서 추출한 거친 광물 현탁액. 불카누스 청록색 잉크와 약간의 의심스러운 공증 부산물로 정제할 수 있습니다.
hostile-spore-culture=글레바에서 배양된 포자 기질, 포획국에서 사용하는 유인액 제작에 사용할 수 있습니다.
liquid-black-ink=색채 배관 및 고처리량 액체 공급 프린터용으로 준비된 가압식 흑색 필기용 액체.
magenta-ink=풀고라에서 채취할 수 있는 색상 성분입니다. 회수된 토너와 문서를 재활용하여 생산할 수 있으며, 디지털 처리, 아카이브 복구, 홀뮴 게이트 관련 등 서류 작업을 위해 사용할 수 있습니다.
oviposition-lure-spores=실험적인 글레바 유인용 구름입니다. 포획국에 투입하면 알 채취를 위해 펜타포드를 유인할 수 있습니다.
tourism-lure-spores=이동 경로 향이 나는 유인용 구름입니다. 포획 사무실에 투입하면 관광 상품을 판매할 스피터를 유인할 수 있습니다.
workforce-lure-spores=구인 공고 향이 나는 유인용 구름입니다. 포획 사무실에 투입하면 근로자로 채용할 바이터를 유인할 수 있습니다.
yellow-ink=글레바에서 채취할 수 있는 색상 성분입니다. 호박 수액과 생물학적 성분을 이용해 생산할 수 있으며, 노란색 서류 제품 생산을 위해 컬러 프린터에 투입할 수 있습니다.

