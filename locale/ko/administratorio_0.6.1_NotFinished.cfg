[technology-description]
aquilo-fax-network=아퀼로에서 ‘얼어붙은 잉크’를 사용한 행정주의 수립을 공식화합니다. 레이저 프린터, 행성간 팩스 교환 시스템, 고체 매체 전송, 그리고 후반 행성간 제작에 사용할 수 있는, CMY 서류 더미를 대체할 최초의 3색 통합 양식을 사용할 수 있게 됩니다.
 
archive-recombination=풀고라의 '폐기물 회수' 행정주의를 표준화합니다. 직원이 운영하는 ‘기록물 재할당기’를 잠금 해제합니다. 이는 단일 입력 방식을 사용하는 재활용기의 변형으로, 25%의 대체 아이템 3개를 제공합니다. (지원되는 양식마다 독립적으로 결정됨) 
bureaucratic-transcendence=불카누스의 산업적 운영과 풀고라의 제도적 지능을 통합해 행정주의 체계를 강화합니다. 대중교통 계약을 잠금 해제하고, 환승 승인이 필요하지 않은 무승인 기차 정류장을 배치할 수 있게 됩니다. 이는 행정 체계 정복에 대한 궁극적인 보상입니다.
chromatic-printing=다양한 우주 시대 행성에서 사용할 수 있도록 인쇄 공정을 강화합니다. 향후 등장할 행성간 서류 계열의 제작 기반이 되는 ‘컬러 프린터’ 사용이 가능합니다.
cyan-magenta-bureaucracy=불카누스의 파란색 서류와 풀고라의 마젠타색 양식을 통합하면, 금속공학 및 전자기학 과학에 의해 제한되던 두 행성 간 서류 시스템 사용이 가능합니다.
cyan-yellow-bureaucracy=불카누스의 청록색 서류와 글레바의 노란색 양식을 통합하면, 금속공학 및 농업 과학에 의해 제한되던 두 행성 간 서류 시스템 사용이 가능합니다.
eminent-domain-zoning-space-age=대규모 확장을 위한 정책 골격을 마련합니다. 백서 및 정책 지침을 해제합니다. 우주 시대에는 비자금 세탁 대신 우주 관광을 통해 재생 가능한 공적 자금을 조달할 수 있습니다.
admi-epic-quality=내각급 인증 (특급) 등급 사용이 가능합니다.
fax-queue-capacity-1=각 행성의 팩스 수신 대기열을 문서 5건만큼 확장합니다.
fax-queue-capacity-2=각 행성의 팩스 수신 대기열을 문서 5건만큼 확장합니다.
fax-queue-capacity-3=각 행성의 팩스 수신 대기열을 문서 5건만큼 확장합니다.
fulgora-digital-services=풀고라에서의 디지털 행정 체계를 공식화합니다. 디지털 서비스국과, 이전의 마젠타색 회수 공정의 확정 기록 보관, 전자기학 관련 서류 제작법 사용이 가능합니다.
gleba-conciliation=글레바에서의 노란색 서류를 이용한 간결한 행정 체계를 공식화합니다. 조정 사무소와, 호박 수액으로 노란색 잉크 제작, 생물학적 예외 및 발사 시대 지름길에 사용되는 소형 양식 제작, 자금으로 펜타포드 알 미끼 제작, 글레바에서 포자 배양체 재배, 그리고 포획국 제작에 사용할 수 있는 펜타포드 수확용 미끼를 사용이 가능합니다.
government-liaison=바이터 정부 허가 서명을 공식화합니다. 청원 창구와 모든 허가 승인 날인 레시피 사용이 가능합니다.
admi-legendary-quality=장관급 인증(전설) 인증을 승인합니다.
orbital-employment-capacity-1=소행성마다 광부를 하나 더 배치할 수 있도록 승인합니다.
orbital-employment-capacity-2=소행성에 광부를 3명까지 배치할 수 있도록 3개 행성에서 지원망을 구축합니다.
orbital-employment-capacity-3=극저온 교대 근무 일정을 이용해, 소행성마다 광부 4명을 배치할 수 있도록 합니다.
orbital-employment-capacity-4=소행성당 광부 5명으로 구성된 프로메튬 등급 탐사팀을 승인합니다.
orbital-employment-damage-1=고급 무중력 채굴 기술을 승인합니다. 부착된 각 VESM이 187.5/초 채광 피해를 입히게 됩니다.
orbital-employment-damage-2=동기부여 포스터를 떼고 강화된 드릴 부착물로 교체합니다. 부착된 각 VESM이 250/초 채광 피해를 입히게 됩니다.
orbital-employment-damage-3=3개 행성의 기술을 하나의 공격적인 채굴 방식으로 통합합니다. 부착된 각 VESM이 312.5/초 채광 피해를 입히게 됩니다.
orbital-employment-damage-4=극한의 우주 유영 성능을 유지하기 위해 극저온 일정 관리를 적용합니다. 부착된 각 VESM이 375/초 채광 피해를 입히게 됩니다.
orbital-employment-damage-5=프로메튬 등급 탐사 규칙을 적용합니다. 부착된 각 VESM이 437.5/초 채광 피해를 입히게 됩니다.
admi-quality-module=기본 행정 인증 기준을 법제화하는 것으로, 인증 모듈 1을 사용할 수 있게 됩니다.
admi-quality-module-2=인증 요건을 고급 수준으로 상향 조정할 수 있지만, 이는 상당한 행정적 비용 부담으로 다가올 수 있습니다.
admi-quality-module-3=경영진 인증 제도를 도입하여, 서류 작업이 큰 명예와 큰 재정적 부담를 안겨주는 작업이 되도록 만듭니다.
trajectory-compliance-jurisdiction-2=궤도 검토 위원회에 3개의 내행성에서 선출된 대표 3명을 포함시킵니다. 고급 배열을 사용하면 30칸 범위의 대형 소행성 궤도를 변경할 수 있습니다.
trajectory-compliance-jurisdiction-3=프로메튬 탐사를 위해, 양자 기술을 기반으로 한 집행 권한을 부여합니다. 집행 배열을 사용하면 40칸 범위의 거대한 소행성 궤도를 변경할 수 있습니다.
trajectory-compliance-speed-1=기본적인 궤도 미세 관리를 통해 배열 발사 대기시간을 4.5초로 단축합니다.
trajectory-compliance-speed-2=점점 더 엄격해지는 성과 평가를 통해 배열 발사 대기시간을 4.0초로 단축합니다.
trajectory-compliance-speed-3=법적으로 모호한 몇 종류의 커피 휴식을 제거하여 배열 발사 대기시간을 3.5초로 단축합니다.
trajectory-compliance-speed-4=행정적 오버클럭킹을 통해 어배열 발사 대기시간을 3.0초로 단축합니다.
trajectory-compliance-speed-5=3개의 내행성에 대한 행정 체계를 통합하여 배열 발사 대기시간을 2.5초로 단축합니다.
trajectory-compliance-speed-6=궤도 안전을 분기별 성과 지표로 취급함으로써 배열 발사 대기시간을 2.0초로 단축합니다.
trajectory-compliance-speed-7=행성 간 경영진 가속화를 통해 배열 발사 대기시간을 1.5초로 단축합니다.
trajectory-compliance-speed-8=극저온 일정 관리 정책을 활용하여 배열 발사 대기시간을 1.0초로 단축합니다.
trajectory-compliance-speed-9=프로메튬급 소행성에 대한 긴급 대책 회의를 통해 배열 발사 대기시간을 0.5초로 단축합니다.
vulcanus-certification=불카누스 인증 사무소를 공식화합니다. 공증 사무소, 핵심 허가서, 지역적인 거짓말 구제, 설립한 불카누스 식민지가 우주로 나아갈 수 있도록 하는 비상 서류 발사 작업을 사용할 수 있습니다.
vulcanus-export-charters=불카누스 관련 서류 작업을 지역적인 단순한 토지 소유권 주장에서 행성간 야금 허가 수준으로 격상시킵니다. 외계 주조소, 텅스텐, 방해석 화학 공정에 대한 수출 허가서 계열을 해금합니다.
workforce-formation=우주로 진출한 핵심 인력을 위한 전담 행정 체계를 수립합니다. 형성 센터와, 커피 기금으로 운영되는 5회의 중간 관리자 회의, 전문가 배정, 자발적 우주 광부 모병 사용이 가능합니다.
yellow-magenta-bureaucracy=글레바의 노란색 서류와 풀고라의 마젠타색 서류을 통합하면, 금속공학 및 농업 과학에 의해 제한되던 두 행성 간 서류 시스템 사용이 가능합니다.

