[tips-and-tricks-item-name]
moshine-briefing=모샤인 개요

[tips-and-tricks-item-description]
moshine-briefing=[planet=moshine]은 [item=sand]와 ([item=silicon]와 [item=glass]의 잠금을 해제할 수 있음) [item=neodymium]([item=magnet]를 만들기에 좋은 물질)이 풍부하게 존재하는, 뜨거운 화산 행성입니다. 너무 뜨거워서 [entity=accumulator]을 건설하기 부적절하지만 다행히 뜨거운 [entity=steam-geyser]이 곳곳에서 발견됩니다. 녹은 철로 이루어진 호수에서 [fluid=molten-iron]를 얻으려면 [entity=foundry]을 가져오는 것을 권장합니다. 석탄 액화를 통해 [fluid=crude-oil] 제작이 가능합니다.

[description]
equation_to_solved_equation_description=[item=datacell-equation][font=moshine-data][color=#2685e5]equation.data[/color][/font]를 다수의 [tile=webbed_processor_tile]프로세서 그물망으로 둘러싸인 [entity=processing-grid]연산망에 공급하고,  [item=datacell-solved-equation][font=moshine-data][color=#fbff6b]solved_equation.data[/color][/font]를 받아오세요.
equation_to_solved_equation_description_nocolor=[item=datacell-equation]equation.data를 다수의 [tile=webbed_processor_tile]프로세서 그물망으로 둘러싸인 [entity=processing-grid]연산망에 공급하고, [item=datacell-solved-equation]solved_equation.data를 받아오세요.

