[technology-description]
mosh-minimalist-elevated-rails=네오디뮴 철도의 고가 버전 제작이 가능합니다.
mosh-minimalist-rails=모샤인의 자원을 활용하면 더 강한 저항을 가진 전력을 전달하는 철도 제작이 가능합니다.
moshine-concrete-from-molten-iron-and-sand=녹은 철과 모래를 이용한 콘크리트를 만들어보세요.
moshine-petroleum-from-sand-sulfur-steam-carbon=모래, 황, 석탄으로 석유 가스를 만들어보세요.
moshine-tech-3d-data-storage=홀로그램 코어는 복잡한 AI 모델을 호스팅하고 나중에 학습시킬 수 있는 제일 좋은 방법입니다.
moshine-tech-ai-tier=기하급수적으로 더 강력하게 되도록 AI 코어를 더욱 더 학습시킵니다.
moshine-tech-ai-trainer=AI 모델은 자가학습을 통해 최적화할 수 있으며, 이전에는 볼 수 없었던 수준의 연구에 도달할 수 있습니다.
moshine-tech-cosmic-data-outsignal-creation=[entity=moshine_cosmicscanner]를 건설했다면, 유용한 데이터를 기록하기 위해서는 정확한 좌표가 포함된 복잡한 신호를 생성해야 합니다.
moshine-tech-cosmicscanner=머나먼 심우주를 탐색합니다. 이 장치가 발사하는 강력한 신호에 대한 응답은 우주와 그 작동 원리에 관한 방대한 데이터를 얻을 수 있도록 해줄 것입니다.
moshine-tech-cosmicscanner-construction1=[entity=moshine_cosmicscanner] 건설 프로젝트를 시작합니다. 엄청난 양의 에너지를 소비하는 거대한 우주 구조물로, 우주 공간으로 광선 신호를 발사한 뒤 돌아오는 [font=moshine-data][color=#8086ff]cosmos.data[/color][/font]를 수집합니다.
moshine-tech-cosmicscanner-construction1_nocolor=[entity=moshine_cosmicscanner] 엄청난 양의 에너지를 소비하는 거대한 우주 구조물로, 우주 공간으로 광선 신호를 발사한 뒤 돌아오는 cosmos.data를 수집합니다.
moshine-tech-data-extractor=모샤인에 충돌한 탐사선에 대한 데이터를 수집할 수 있습니다.
moshine-tech-data-processor=복잡한 인공 지능을 만들 수 있지만, 첫 번째 형태는 폭발할 수 있다는 점에 각별히 유의하세요.
moshine-tech-data-processor-building=데이터 처리기는 데이터 변환 등 데이터 관련 작업을 처리할 수 있습니다.
moshine-tech-datacell-empty=데이터를 처리하여 드라이브에 저장할 수 있도록 합니다.
moshine-tech-glass=모래를 제련하면 유리가 만들어집니다.
moshine-tech-hard-drive=데이터를 처리하여 드라이브에 저장할 수 있도록 합니다.
moshine-tech-magnet=네오디뮴과 철을 강력한 자석 형태로 가공합니다. 네오디뮴은 매우 발견하기 어렵지만, 한 곳에 대규모로 뭉쳐있는 경우가 많습니다.
moshine-tech-neural_computer=신경망 컴퓨터는 방대한 양의 정보를 처리하여 새로운 지식을 찾아냅니다.
moshine-tech-opticalfiber-storage-tank=데이터를 데이터 서버에 저장할 수 있도록 합니다.
moshine-tech-processing-grid=극도로 복잡한 작업을 처리할 수 있습니다.
moshine-tech-silicon=모래를 실리콘으로 변환할 수 있습니다.
moshine-tech-silicon-carbide=탄화 규소는 강력한 절연체로 사용됩니다.
moshine-tech-silicon-cell=실리콘 전지는 컴퓨터의 필수 부품입니다.
moshine-tech-supercomputer=신경망 컴퓨터는 방대한 양의 정보를 처리하여 새로운 지식을 찾아냅니다.
planet-discovery-moshine=매우 햇볕이 잘 드는 행성으로, 네오디뮴, 실리콘, 태양 에너지가 풍부합니다. 신비롭게 추락한 탐사선에는 인공 지능의 한계를 뛰어넘는 데 활용할 수 있는 풍부한 지식이 담겨 있습니다.

