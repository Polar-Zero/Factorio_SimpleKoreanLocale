[mod-description]
Moshine=AI를 개발할 수 있는 뜨거운 행성, 33가지 기술, 2종류의 새로운 광물, 7종류의 건물, 다양한 아이템, 맞춤형 지형, 음악, 독특한 도전 등을 추가합니다. 우주 시대 DLC 밸런스를 해치지 않으며, 게임에 자연스럽게 녹아듭니다.\n\n번역: SimpleKoreanLocale(PolarZero)
Moshine-assets=모샤인 모드이 작동하는 데 필요한 자산 데이터가 포함된 모드입니다. 행성, 자원, 리소스 등이 포함되어 있지만 기술, 아이템 등은 추가하지 않습니다.\n\n번역: SimpleKoreanLocale(PolarZero)


