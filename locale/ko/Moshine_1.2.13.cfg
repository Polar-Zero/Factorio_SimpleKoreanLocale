[recipe-description]
ai-tier-0=새로운 AI 티어는 이전 티어보다 기하급수적으로 향상되며 컴퓨팅 속도가 상당히 빨라집니다. [item=ai-tier-10]티어 10은 규소 기반 컴퓨팅 과정을 통해 얻을 수 있는 가장 진보된 단계입니다.
datacell-add-equation=기본 컴퓨터로 하기엔 너무 복잡한 계산을 진행하고 저장합니다.
model-unstable=이 중간 생산품 코어는 30초 동안 방치되면 폭발합니다!
moshine_cosmicscanner-construct-1=심우주 스캐너의 중심부를 구축합니다. 완료하려면 기초 토대에 40회 적용해야 합니다.
moshine_cosmicscanner-construct-2=심우주 스캐너의 기본 기계 장치들을 구축합니다. 완료하려면 기초 토대에 40회 적용해야 합니다.
moshine_cosmicscanner-construct-3=심우주 스캐너의 정교한 부품들을 구축합니다. 완료하려면 기초 토대에 40회 적용해야 합니다.
moshine_cosmicscanner-construct-4=심우주 스캐너의 중앙부와 돔을 구축합니다. 완료하려면 기초 토대에 40회 적용해야 합니다.
moshine_cosmicscanner-construction-stage-1=심우주 스캐너 시설의 기초 토대입니다.
datacell-equation=기본 컴퓨터로 하기엔 너무 복잡한 계산을 진행하고 저장합니다.

