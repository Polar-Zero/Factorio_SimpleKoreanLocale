[mod-name]
144-Slot-Wagons=144칸 화물차(144 Slot Cargo Wagons)

[mod-description]
144-Slot-Wagons=화물차 인벤토리 크기를 144칸으로, 유체 화물차 용량을 100,000으로 증가시킵니다. (사용자 지정 가능) 기존 모드 (alterae 제작) 기반으로 포팅되었습니다.\n\n번역: SimpleKoreanLocale(PolarZero)

[mod-setting-name]
wagon-fluid-capacity=유체 화물차 용량
wagon-inventory-size=화물차 인벤토리 크기

[mod-setting-description]
wagon-fluid-capacity=다른 모드의 화물차를 포함한, 모든 유체 화물차의 유체 용량을 재설정합니다. 원래 용량을 유지하려면 0 값을 입력하세요. 사용자 지정 용량으로 설정했을 경우, 높은 등급의 화물차에는 추가 유체 용량이 부여됩니다.
wagon-inventory-size=다른 모드의 화물차를 포함한, 모든 화물차의 유체 용량을 재설정합니다. 원래 용량을 유지하려면 0 값을 입력하세요. 사용자 지정 용량으로 설정했을 경우, 높은 등급의 화물차에는 추가 인벤토리가 부여됩니다.