[mod-name]
angelbob-spaceage-rebalance=엔밥 우주시대 리밸런싱(AngelBob Space Age Rebalance)

[mod-description]
angelbob-spaceage-rebalance=여러 행성과, 버그 수정을 비롯한 수정점을 포함한, 완전한 AngelBob Space Age 모드팩 도우미입니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[ab-rebalance]
direct-recipe=직접 제작

[console]
factorio-update-required=[뮬루나 관련 안내] Muluna 행성 모드의 재초기화시마다 유체 박스 관련 오류가 표시될 수 있습니다. AngelBob Space Age Rebalance 모드에서 Factorio 2.1 이후 버전에서 이 문제를 수정하여, 뮬루나 행성의 증기, 진공 용광로 유체 박스가 정상적으로 작동되도록 했습니다. 다만 유체 네트워크가 혼합되는 현상이 발견되지 않았을 경우, 별도의 조치가 필요하지 않습니다.

