[technology-description]
ab-vulcanus-foundry-tungsten-specialization=Angel 모드의 텅스텐 분말을 탄화 텅스텐으로 제작하는 불카누스 주조 경로를 개선할 수 있도록 합니다. Angel 모드의 텅스텐 3단계 제련는 여전히 필요합니다.
maraxsis-hydrolox-fuel=마락시스의 유압 처리 기술과 아퀼로의 극저온 과학 기술을 결합하면, 복잡한 엔밥 연료 생산 단계 없이도 로켓 연료를 쉽게 제작할 수 있게 됩니다.
planetaris-arig-roboport-2=MK2 로보포트 기술과 아리그의 방진 로보포트 기술을 합친, 아리그 행성에서도 사용할 수 있는 Bob의 모드 MK2 로보포트 유형입니다.
planetaris-arig-roboport-3=Bob의 모드 MK3 로보포트 기술에 개선된 아리그 방진 기술을 합친, 아리그 행성에서도 사용할 수 있는 MK3 로보포트 유형입니다.
planetaris-arig-roboport-4=Bob의 모드 MK4 로보포트 기술에 상당한 아리그 방진 기술을 합친, 아리그 행성에서도 사용할 수 있는 MK4 로보포트 유형입니다.

[mod-setting-name]
ab-enable-diagnostics=AngelBob 재조정 진단 활성화

[mod-setting-description]
ab-enable-diagnostics=버그 보고를 위한 심층적인 프로토타입 감사를 활성화합니다. 더 빠르고 조용한, 일반적인 게임 플레이를 원한다면 비활성화 상태로 유지하세요.