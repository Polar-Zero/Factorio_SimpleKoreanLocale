[fluid-description]
ab-ammoniacal-mineral-slurry=아퀼로 얼음과 레골리스를 세척해 얻은, 약간의 광물성 입자를 포함한 암모니아성 혼합물입니다.
ab-aquilo-frozen-brine=아퀼로 빙층에서 유래한 암모니아 함량이 높은 불순물을 함유한 과냉각 염수.
ab-arig-saline-groundwater=사막 광물 및 석유화학 물질의 미량 성분을 함유한 염분이 많은 아리그 지하수.
ab-fulgora-electrolytic-sludge=전도성이 있는 오염 침전물로, 느린 비상 처리를 거친 후에만 사용할 수 있다.
ab-gleba-organic-groundwater=사용 전에 처리가 필요한 생물학적 오염 지하수.
ab-groundwater-placeholder=내부 호환성 유체. 일반적으로 표시되어서는 안 됩니다.
ab-hyarion-crystal-sludge=하리온 지하수 포드에서 가져온, 약간의 수정 성분이 포함된 광물성 혼합물입니다.
ab-maraxsis-deep-brine=유용한 물로 활용하기 전에 산업적 처리가 필요한 심해 염수입니다.
ab-muluna-lunar-brine=사용 가능한 물을 조금이라도 얻기 위해 반드시 여과해야 하는 저비중 광물 염수.
ab-paracelsin-acidic-brine=직접적인 깨끗한 물로는 사용할 수 없으나, 화학 회수에 적합한 산성 염수.
ab-vulcanus-geothermal-brine=불카누스 균열에서 나오는 뜨거운 광물 염수로, 폐유황 화합물이 풍부하다.

