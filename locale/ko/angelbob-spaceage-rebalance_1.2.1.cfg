[recipe-description]
ab-aquilo-bore-water-processing=극저온 염수를 녹여, 약간의 물과 암모니아 부산물을 추출합니다.
ab-aquilo-ground-water-bore=지하수 펌프가 아퀼로 빙층의 극저온 염수를 추출하도록 합니다.
ab-arig-acid-wash-bobmonium=아리그 산과 석유화학 물질을 사용한 압축 공정을 진행하고, 남아있는 분쇄된 밥모늄을 회수합니다.
ab-arig-acid-wash-crotinnium=아리그 산과 석유 화학 물질을 사용한 압축 공정을 진행하고, 남아있는 분쇄된 크리티늄을 회수합니다.
ab-arig-acid-wash-rubyte=아리그 산과 석유 화학 물질을 사용한 압축 공정을 진행하고, 남아있는 분쇄된 루바이트를 회수합니다.
ab-arig-bore-water-processing=사막 지하수를 처리하고, 약간의 물과 아리그 광물성 부산물을 추출합니다.
ab-arig-ground-water-bore=지하수 펌프가 아리그 대수층의 사막 지하수를 추출하도록 합니다.
ab-arig-heavy-mineral-sand=물을 사용하여 아리그 사막 모래에 남아있는 약간의 광물성 부산물을 농축합니다. 이 제작법은 효율성이 낮은 보조 채광 방식으로, 대량 생산 목적에는 적합하지 않습니다.
ab-arig-wash-jivolite=아리그 광물성 모래를 세척하고, 남아있는 분쇄된 지보라이트를 추출하여, 현지 생산의 유지보수 목적으로 활용할 수 있도록 합니다.
ab-arig-wash-saphirite=아리그 광물성 모래를 세척하고, 남아있는 분쇄된 사피라이트를 추출하여, 현지 생산의 유지보수 목적으로 활용할 수 있도록 합니다.
ab-arig-wash-stiratite=아리그 광물성 모래를 세척하고, 남아있는 분쇄된 스티라타이트를 추출하여, 현지 생산의 유지보수 목적으로 활용할 수 있도록 합니다.
ab-fulgora-bore-water-processing=전해 침전물에 대한 추가적인 침전을 진행하여, 약간의 비상용 물과 폐기물로 분리합니다.
ab-fulgora-ferric-chloride-solution=풀고라 현지 자원을 이용한 회로 기판 제작 진행을 위해, 행성 내 철 광석과 산물질을 활용합니다.
ab-fulgora-glass-to-glass-fiber=풀고라에서 엔젤 모드 주조 공정을 통해, 유리를 유리 섬유 형태로 성형할 수 있도록 합니다.
ab-fulgora-ground-water-bore=지하수 펌프가 풀고라 지하 대수층의 전해 침전물을 추출하도록 합니다.
ab-fulgora-heavy-oil-to-naphtha=저장되어있던 풀고라 원유를 엔젤/밥 석유화학 공정에 사용할 수 있는 형태인 나프타로 전환합니다.
ab-fulgora-mineral-oil-lubricant=성간 물류에 의존할 필요 없이, 풀고라 원유만을 이용해 윤활유를 생산할 수 있게 됩니다.
ab-fulgora-naphtha-to-mineral-oil=풀고라 나프타를 정제하여 광유로 만들 수 있게 됩니다. 이를 사용하여 윤활유 생산 방식을 독립적으로 발전시켜보세요.
ab-fulgora-scrap-washing-catalyst-aggregate=석유화학 아이템과 광석 혼합물을 이용하면, 고급 풀고라 광석의 성분을 약간이지만 추출할 수 있습니다.
ab-fulgora-scrap-washing-primary-aggregate=고철을 풀고라 나프타와 물로 세척하여, 혼합된 광석을 회수해보세요.
ab-fulgora-silicon-wafer-to-powder=풀고라 시멘트, 유리, 질화 규소, 유리 섬유 생산 공정에 활용할 수 있도록 실리콘 웨이퍼에서 실리콘 분말을 회수해보세요.
ab-fulgora-solid-resin-liquefaction=풀고라에서 활용할 수 있도록, 고급 엔밥 회로기판 등 석유화학 아이템 내부의 수지를 회수해 액화할 수 있게 됩니다.
ab-fulgora-sour-naphtha-separation=풀고라에서의 엔젤 정제 과정에 사용할 수 있는, 개선된 나프타 탈황 제작법입니다.
ab-fulgora-wooden-board-to-wood=풀고라의 철도나 기본 벨트 등에 사용할 수 있도록, 나무 기판에서 소량의 목재를 회수할 수 있도록 합니다.
ab-gleba-bore-water-processing=유기물 지하수를 처리하여 약간의 물과 생물학적 폐기물로 분리합니다.
ab-gleba-ground-water-bore=지하수 펌프가 글레바 습지의 유기물 지하수를 추출하도록 합니다.
ab-hyarion-bore-water-processing=수정 혼합물을 더욱 침전시키고, 약간의 물과 광물성 부산물을 추출합니다.
ab-hyarion-ground-water-bore=지하수 펌프가 하리온 퇴적층의 크리스탈 혼합물을 추출하도록 합니다.
ab-low-gravity-maintenance-ore=이 제작법은 뮬루나, 우주 플랫폼 내에서 생존력을 높일 수 있도록, 제한된 저중력 환경에서 소행성->광석 생산을 가능하게 합니다. 대량 생산 목적으로는 적합하지 않습니다.
ab-low-gravity-maintenance-plate=이 제작법은 뮬루나, 우주 플랫폼 내에서 생존력을 높일 수 있도록, 제한된 저중력 환경에서 판 생산을 가능하게 합니다. 대량 생산 목적으로는 적합하지 않습니다.
ab-low-gravity-provisioning=이 제작법은 뮬루나, 우주 플랫폼 내에서 생존력을 높일 수 있도록 하는 제작법이며, 대량 생산 목적으로는 적합하지 않습니다.
ab-low-gravity-water-boiling=이 제작법은 뮬루나, 우주 플랫폼 내에서 생존력을 높일 수 있도록 하는 물 끓이기 제작법이며, 일반적인 형태의 보일러를 대체하지 않습니다.
ab-maraxsis-bore-water-processing=심층 염수를 처리하여, 약간의 물과 소금 부산물을 추출합니다.
ab-maraxsis-ground-water-bore=지하수 펌프가 마락시스 해저 지층의 심층 염수를 추출하도록 합니다.
ab-muluna-bore-water-processing=우주 염수를 여과하여, 소량의 물과 광물성 부산물을 추출합니다.
ab-muluna-cast-aluminium-plate=뮬루나에서 녹은 알루미늄을 주조해 판 형태로 만들 수 있도록 합니다.
ab-muluna-crushed-alumina-to-alumina=증기를 활용해, 뮬루나의 분쇄된 알루미나를 엔밥 알루미나 공정에 사용할 수 있도록 정제합니다.
ab-muluna-crushed-aluminium-to-alumina=뮬루나의 고농도 분쇄된 알루미늄을 엔밥 공정 없이 알루미나 형태로 정제할 수 있도록 합니다.
ab-muluna-draw-aluminium-cable=증기를 활용해, 알루미늄 판을 케이블 형태로 주조할 수 있게 됩니다.
ab-muluna-ground-water-bore=지하수 펌프가 얕은 물루나 퇴적층의 우주 염수를 추출하도록 합니다.
ab-muluna-lunar-clay=광물성 잔여물이 포함된 물루나 진흙을, 일반적인 Angel 모드 세척 공정을 거치지 않고도 점토로 농축할 수 있도록 합니다.
ab-muluna-lunar-clay-brick=뮬루나 진공 용광로 제작을 위해 증기 분쇄기에서 소량의 점토 벽돌을 소성할 수 있도록 합니다. 대량 생산 목적에는 적합하지 않습니다.
ab-muluna-lunar-mud=월석 잔여물과 얼음을 현지에서 증기 세척하여, 뮬루나 초기 구축에 필요한 약간의 진흙을 제작해보세요.
ab-muluna-molten-aluminium-from-alumina=엔밥 모드의 알루미나를 열, 증기, 탄소를 이용해 녹은 알루미늄 형태로 주조합니다.
