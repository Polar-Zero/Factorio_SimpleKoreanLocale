[item-description]
crane-bulk-diesel-inserter=대용량 화물 처리를 위해 설계된 대형 연료 구동식 크레인입니다. 한 번의 잡기 동작으로 아이템 묶음 전체를 손쉽게 이동시킬 수 있습니다.\n선박/기차 하역이나 보관함 사이의 아이템 운송에 적합합니다.
diesel-assembling-machine=디젤 엔진으로 구동되는 다목적 조립 기계입니다. 전력망에 연결하지 않아도 작동하지만 작동에 연료가 필요합니다.
diesel-mining-drill=디젤 엔진으로 구동되는 채광 드릴입니다. 전력망에 연결하지 않아도 작동하지만 작동에 많은 연료가 필요합니다.
diesel-pump=유체 연료로 구동되는 견고한 펌프입니다. 전력망에 연결하지 않아도 작동하므로, 외부 지역에서의 유체 처리에 적합합니다.
fast-diesel-inserter=디젤 엔진으로 구동되는 투입기, 일반적인 투입기보다 훨씬 빠릅니다.
long-handed-diesel-inserter=연료 구동식 긴 팔 투입기. 전력망에 연결하지 않아도 작동하지만 그 대신 연료가 필요합니다.
portable-diesel-generator=가혹하고 염분이 많은 환경에서도 작동하도록 있도록 설계된 휴대용 디젤 엔진. 디젤 연료 배럴을 공급받으면 핵분열로를 압도하는 전력을 생산합니다.

[technology-name]
portable-diesel-generator=휴대용 디젤 발전기
