[technology-description]
diesel-automation=디젤 엔진으로 구동되는 다목적 조립 기계를 사용할 수 있게 됩니다. 전력망에 연결하지 않아도 작동하지만 지속적인 연료 공급이 필요합니다.
portable-diesel-generator=가혹하고 염분이 많은 환경에서도 작동하도록 있도록 설계된 휴대용 디젤 엔진. 디젤 연료 배럴을 공급받으면 핵분열로를 압도하는 전력을 생산합니다.