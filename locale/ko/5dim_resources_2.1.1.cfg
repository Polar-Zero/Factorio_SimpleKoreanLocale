[mod-description]
5dim_resources=5dim_resources=광석을 더 빠르게 가공하고 각 매장지에서 더 많은 광물을 얻어보세요.\n더 강력한 용광로, 분쇄기, 분말 생산 공정을 구축해 광석 가공과 산업 생산량을 높입니다.\n작동에 5dim_core 모드가 필요합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


