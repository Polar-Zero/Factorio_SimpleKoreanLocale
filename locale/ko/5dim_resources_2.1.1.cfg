[technology-description]
5d-advanced-orbit-resources=가공에 더 많은 자원이 필요한 분말 형태의 소행성 덩어리를 사용하는, 고급 궤도상 분쇄 제작법 사용이 가능합니다.
5d-aquilo-resources=개선된 암모니아 용액 분리와 리튬 처리 제작법 사용이 가능합니다.
5d-fulgora-resources=홀뮴 분말, 압축된 고철, 고철 재활용 사용이 가능합니다.
5d-gleba-resources=농축된 유마코, 젤리넛 가공 제작법 사용이 가능합니다.
5d-orbit-resources=소행성을 분말 형태로 분쇄하고, 해당 분말을 사용하는 기본적인 궤도상 분쇄 제작법 사용이 가능합니다.
5d-vulcanus-resources=텅스텐 분말, 방해석 분말, 촉매 처리된 용암 처리 사용이 가능합니다.