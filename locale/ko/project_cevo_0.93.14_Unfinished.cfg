[tips-and-tricks-item-description]
cevo-tips-ambushes=행성 곳곳에서 다양한 파괴 가능한 아이템이나 구조물을 발견할 수 있습니다. 이를 파괴해 게임 초반 제작에 유용하게 사용할 수 있는 전리품이나 경험치를 얻을 수 있습니다. 하지만 이 아이템들은 특별한 보스들이 지키고 있으므로 주의해야 합니다. 낮은 확률로 매복했던 보스가 아이템을 지키려 등장할 수 있습니다.
cevo-tips-bosses=CEVO의 핵심 요소로, 많은 보스의 추가가 있습니다. 보스를 만나게 되는 주 경로는 다음과 같습니다.\n-------------------------------\n월드 보스: 보스와 처음 마주치는 대부분의 케이스입니다. 이 강력한 적들은 세계 곳곳에 위치해 있으며, 플레이어가 다가오기만을 기다리고 있습니다.\n매복: 신성한 벌레 구조물을 파괴할 때, 공격에 대한 보복으로 나타날 가능성이 있습니다.\n진화: 각 오염/진화 단계마다 해당 단계에 맞는 보스가 기지의 포위 공격을 시도할 것입니다. 모든 보스는 상당히 강력하며, 게임 후반부까지 잘 조정되어 있습니다. 보스를 공격하기 전에 장비를 갖추고 빌드를 최적화하는 것을 강력히 권장합니다. 조심하지 않는다면 단 한 번의 실수만으로 기지 전체가 파괴될 수 있습니다!
cevo-tips-buffs=아래 리스트를 통해 모든 버프 데이터에 대한 데이터를 확인할 수 있습니다.\n모든 데이터가 제공되지는 않으며, 패시브 효과 등은 직접 작성해야 합니다. 버프는 일반적으로 지정된 시간 동안 플레이어에게 재능 또는 능력치 보너스를 제공합니다. 적을 밀어내거나 주변 적에게 x의 피해를 주는 등의 능력을 부여하는 버프들도 몇 가지 존재합니다. 현재로써는 직접 테스트해 보며 어떤 효과가 있는지 파악해야 하지만, 일반적으로 치유/슬로우/기절/광역 피해 효과가 제공됩니다.\n---\n[cevo-knights-5-buff][시간:7200] | 재능:[장갑:15]\n[cevo-engineers-3-buff][시간:7200] | 재능:[설계자:10]\n[cevo-eldests-buff][적용: [entity=cevo-eldests-buff]][시간:3600]\n[cevo-researchers-1-buff][시간:7200] | 재능:[수용적:5]\n[cevo-divine-5-buff][적용: [entity=cevo-divine-5-buff]][시간:3600]\n[cevo-high-lords-buff][적용: [entity=cevo-high-lords-buff]][시간:3600]\n[cevo-sisters-buff][적용: [entity=cevo-sisters-buff]][시간:3600]\n[cevo-barbarians-1-buff][시간:7200] | 재능:[튼튼함:5]\n[cevo-greater-demons-buff][적용: [entity=cevo-greater-demons-buff]][시간:3600]\n[cevo-researchers-3-buff][시간:7200] | 재능:[수용적:10]\n[cevo-researchers-5-buff][시간:7200] | 재능:[수용적:15]\n[cevo-endulging-6-buff][적용: [entity=cevo-endulging-6-buff]][시간:3600]\n[cevo-infernal-buff][시간:7200] | 재능:[폭발물 전문가:15][디몰리셔:15]\n[cevo-thieves-5-buff][시간:7200] | 재능:[민첩함:15]\n[cevo-endulging-4-buff][적용: [entity=cevo-endulging-4-buff]][시간:3600]\n[cevo-angels-6-buff][시간:7200] | 재능:[사차원:21]\n[cevo-protection-4-buff][적용: [entity=cevo-protection-4-buff]][시간:3600]\n[cevo-protection-6-buff][적용: [entity=cevo-protection-6-buff]][시간:3600]\n[cevo-sages-5-buff][시간:7200] | 재능:[신속 대응:15]\n[cevo-archdemons-2-buff][시간:7200] | 재능:[증오:6][원한:6]\n[cevo-endulging-2-buff][적용: [entity=cevo-endulging-2-buff]][시간:3600]\n[cevo-berserker-4-buff][적용: [entity=cevo-berserker-4-buff]][시간:3600]\n[cevo-savages-4-buff][적용: [entity=cevo-savages-4-buff]][시간:3600]\n[cevo-sages-3-buff][시간:7200] | 재능:[신속 대응:10]\n[cevo-angels-2-buff][시간:7200] | 재능:[사차원:11]\n[cevo-engineers-1-buff][시간:7200] | 재능:[설계자:5]\n[cevo-holy-4-buff][적용: [entity=cevo-holy-4-buff]][시간:3600]\n[cevo-templars-buff][적용: [entity=cevo-templars-buff]][시간:3600]\n[cevo-investors-6-buff][시간:7200] | 재능:[보증됨:21]\n[cevo-berserker-2-buff][적용: [entity=cevo-berserker-2-buff]][시간:3600]\n[cevo-holy-2-buff][적용: [entity=cevo-holy-2-buff]][시간:3600]\n[cevo-knights-3-buff][시간:7200] | 재능:[장갑:10]\n[cevo-assassins-3-buff][시간:7200] | 재능:[전투적:10]\n[cevo-engineers-5-buff][시간:7200] | 재능:[설계자:15]\n[cevo-archdemons-6-buff][시간:7200] | 재능:[증오:12][grudge:12]\n[cevo-assassins-1-buff][시간:7200] | 재능:[전투적:5]\n[cevo-disrupters-6-buff][적용: [entity=cevo-disrupters-6-buff]][시간:3600]\n[cevo-barbarians-3-buff][시간:7200] | 재능:[튼튼함:10]\n[cevo-thieves-1-buff][시간:7200] | 재능:[민첩함:5]\n[cevo-assassins-5-buff][시간:7200] | 재능:[전투적:15]\n[cevo-divine-3-buff][적용: [entity=cevo-divine-3-buff]][시간:3600]\n[cevo-investors-2-buff][시간:7200] | 재능:[보증됨:11]\n[cevo-disrupters-2-buff][적용: [entity=cevo-disrupters-2-buff]][시간:3600]\n[cevo-knights-1-buff][시간:7200] | 재능:[장갑:5]\n[cevo-angels-4-buff][시간:7200] | 재능:[사차원:16]\n[cevo-sages-1-buff][시간:7200] | 재능:[신속 대응:5]\n[cevo-savages-6-buff][적용: [entity=cevo-savages-6-buff]][시간:3600]\n[cevo-thieves-3-buff][시간:7200] | 재능:[민첩함:10]\n[cevo-investors-4-buff][시간:7200] | 재능:[보증됨:16]\n[cevo-soothing-6-buff][적용: [entity=cevo-soothing-6-buff]][시간:3600]\n[cevo-protection-2-buff][적용: [entity=cevo-protection-2-buff]][시간:3600]\n[cevo-archdemons-4-buff][시간:7200] | 재능:[증오:9][원한:9]\n[cevo-soothing-4-buff][적용: [entity=cevo-soothing-4-buff]][시간:3600]\n[cevo-barbarians-5-buff][시간:7200] | 재능:[튼튼함:15]\n[cevo-berserker-6-buff][적용: [entity=cevo-berserker-6-buff]][시간:3600]\n[cevo-soothing-2-buff][적용: [entity=cevo-soothing-2-buff]][시간:3600]\n[cevo-savages-2-buff][적용: [entity=cevo-savages-2-buff]][시간:3600]\n[cevo-disrupters-4-buff][적용: [entity=cevo-disrupters-4-buff]][시간:3600]\n[cevo-holy-6-buff][적용: [entity=cevo-holy-6-buff]][시간:3600]
cevo-tips-companions=동료(및 관련 메커니즘)는 이제 활용할 수 있는 완전히 새로운 도구들입니다. 여기에는 배치 가능한 NPC부터 자동으로 생성되는 포탑까지 다양한 요소를 포함합니다. 게임 내에서 “동료”는 구체적으로, 리스폰이 가능하거나 배치할 수 있으며 플레이어를 따라다니고 기본적인 명령에 반응하는 NPC를 의미합니다. 이들은 전투에서 플레이어를 돕거나, 플레이어를 지원할 수 있습니다. 지능이 매우 뛰어난 편은 아니지만, 최소한 적의 어그로를 플레이어에게서 돌리는 데는 도움이 될 것입니다. 동료가 사망하더라도 인벤토리에서 찾아 수리할 수 있습니다. 이와 관련된 몇 가지 추가 메커니즘을 하위 팁에서 확인할 수 있습니다.
cevo-tips-core=CEVO 모드에서는 수많은 신규 콘텐츠, 변경 사항, 도전 과제 및 목표를 제공합니다. 이 팁과 가이드를 확인하면 게임에 추가된 다양한 요소에 대한 전반적인 정보를 확인하는 데 도움이 될 것입니다.
cevo-tips-enemies=난이도를 높이고 더욱 역동적이며 진화하는 세계를 추가할 수 있도록 게임에 새로운 적 시스템을 구현했습니다. 이제 적들이 플레이어에게 반응하거나, 플레이어가 적과 교전하는 방식이 더 다양해졌습니다. 또한 플레이어가 달성하거나 완료해야 할 더 광범위한 목표와 도전 과제들이 추가되었습니다. 하위 도움말에서 특정 시스템에 대한 보다 자세한 정보를 확인해보세요. 기본적으로, 게임을 더 방어적으로 진행하고, 적과 더 직접적으로 교전할 준비를 진행하세요.
cevo-tips-gadgets=가젯은 지원군과 유사하지만, 단순한 동료가 아닌 포탑을 소환합니다. 적에게 접근하면 주변에 가젯이 소환되어 언제든지 전투를 보조하고 후방에 방어선을 형성해 줍니다. 이러한 포탑은 자체적인 체력을 가지고 있으며, 이는 적의 관심을 더 많이 끌 수 있다는 것을 의미합니다. 하지만 지원군과 마찬가지로 이러한 아이템들은 일시적이며, 파괴될 때까지 지속적인 피해를 입습니다.
cevo-tips-hoarders=비축가는 낮은 확률로 등장하는 강력한 적 변종입니다. 이 변종들은 느리지만, 처치하기 훨씬 더 어려우며 방어력 역시 뛰어납니다. 처치에 성공하면 희귀한 전리품을 얻을 수 있으며, 전설 등급 아이템이나 장비를 획득할 확률 역시 존재합니다. 또한 엄청난 양의 경험치를 얻을 수 있기도 합니다!
cevo-tips-legendary-talents=전설급 재능은 훨씬 더 강력한 보너스를 제공하는 특별한 형태의 재능입니다. 이들은 주로 특정 상호작용의 보상으로 획득할 수 있습니다. 보스, 도전 과제, 그리고 일부 플레이어 행동을 통해 이러한 재능을 제공하는 두루마리를 얻을 가능성이 존재합니다.
cevo-tips-modifications=동료와 무기는 특수 장비를 추가하는 것으로 사용자 지정을 진행할 수 있습니다. 인벤토리에서 해당 아이템을 우클릭하는 것으로 메뉴를 열 수 있으며, 이를 통해 아이템을 추가하거나 수정할 수 있습니다. 이 기능은 한 번만 적용할 수 있으며, 수정 가능한 요소에는 몇 가지 제한이 있습니다.
cevo-tips-modifications-attachments=무기에 부착물을 추가해 무기의 성능과 상호작용 능력을 향상시키고 간혹 획기적으로 바꿀 수 있습니다... 부착물을 장착할 수 있는 모든 무기에 사용 가능한 부착물을 나타내는 아이콘이 나타납니다. 무기 위에 마우스를 올려 어떤 유형의 부착물과 어떤 등급의 부착물을 장착할 수 있는지 확인해보세요. 무기 수정은 한 번만 수행할 수 있습니다 (취소 불가). 또한 각 슬롯에는 해당 유형과 동일한 티어의 부착물만 장착할 수 있습니다.
cevo-tips-modifications-supplies=보급품은 부착물과 거의 동일한 기능을 하지만, 동료에게 적용됩니다. 아이템 자체에 새로운 아이콘이 나타나는데, 해당 아이콘에 마우스를 올려놓으면 사용 가능한 슬롯에 대한 정보를 확인할 수 있습니다. 부착물에 적용되는 모든 제한 사항과 메커니즘은 보급품에도 동일하게 적용됩니다.
cevo-tips-pack-leaders=적 우두머리는 게임 세계에서 드물게 등장하거나, 습격/대습격을 이끄는 또 다른 형태의 변종입니다. 일반 유형의 적보다 더 강력하고, 거대하며, 빠르게 움직입니다. 이들은 종종 다른 적 무리를 이끌기도 하며, 그 자체로 거의 미니 보스나 다름없습니다.
cevo-tips-pollution=공해와 관련된 시스템이 확장되었으며, 이제 새로운 상호작용과 도전 과제를 제공합니다. 오염과 진화는 이제 티어 형태로 새롭게 표현됩니다. 화면 상단에서 이러한 티어의 시각적 표시를 확인할 수 있습니다. 각 티어는 새로운 난이도와 도전을 의미합니다. 각 티어(또는 티어 내)로 진입할 때마다 새로운 적, 이벤트, 상호작용이 발생할 수 있습니다. 현재 6개의 진화 티어가 존재으며, 각 티어로 진입할 때마다 보스와 약간의 적 무리가 함께 등장합니다. 이러한 적들을 상대하기 전 현재 티어와 동등하거나 그 이상의 장비를 준비하는 것을 강력히 추천합니다. 일반적으로 포탑과 같은 일반적인 방어 시설은 강력한 적들에 의해 무력화될 가능성이 존재하며, 이러한 상황이 발생할 경우 기지를 직접 방어할 준비를 해야 합니다.
cevo-tips-progression=진행도는 일반적으로 플레이어의 캐릭터, 능력치, 핵심 진척도를 의미합니다. 레벨, 재능, 신규 능력치, 속성 등이 모두 여기에 포함됩니다. 일부 진척도 유형은 별도의 카테고리로 분류되기도 합니다. 대부분의 장비와 업그레이드를 사용하려면 특정 레벨에 도달하거나 특정 속성을 충족해야 합니다. 현재 레벨을 꾸준히 확인하고, 개인 연구를 통해 진행 상황을 관리하세요. 새로 추가된 아이템의 제작법를 대량으로 해금할 수 있는 새로운 기술 역시 존재합니다. 이러한 제작법 중 상당수는 개인 연구를 통해 더 일찍 발견할 수도 있습니다.
cevo-tips-progression-attributes=각 캐릭터는 여러 가지 속성을 가지고 있습니다. 레벨 업을 진행하거나 몇 가지 시스템을 통해 속성 포인트를 획득하면, 특정 속성을 향상시킬 수 있습니다. 또한 다양한 아이템, 연구, 직업 등을 통해 능력치를 올리거나 낮출 수도 있습니다. 각 능력치는 특정 플레이어 스탯의 증가 또는 감소에 기여합니다. 일반적으로 한 가지 능력치는 다음 3가지 요소에 영향을 미칩니다. 1. 팩토리오 게임 내 능력치가 변경됩니다(이동 속도, 제작 속도 등) 2. CEVO 능력치가 변경됩니다(운, 피해 배율, 방어 배율). 3. 대부분의 속성은 팩토리오 내 특정 탄 유형의 공격 속도나 피해량을 변경합니다.
cevo-tips-progression-level=레벨링은 CEVO 모드에서 추가한 새로운 진행 시스템입니다. 레벨은 경험치를 모아 올릴 수 있으며, 경험치는 다양한 이벤트나 상호작용을 통해 획득할 수 있습니다. 제작, 채광, 적 처치, 특수 아이템 등은 모두 각기 다른 비율로 경험치를 제공합니다. 레벨이 높아질수록 다음 레벨에 도달하는 데 필요한 경험치가 점점 더 많아집니다. 레벨이 상승할 때마다 속성 포인트와 전문성 포인트를 얻을 수 있습니다. 이 포인트는 캐릭터에게 새로운 보너스를 부여하거나 특정 아이템 사용 권한을 해금하는 데 사용할 수 있습니다. 또한 CEVO에서 추가된 많은 아이템을 사용하기 위해 특정 레벨 달성이 필수 조건인 경우가 많습니다. 직업/적성/무기/방어구 등은 특정 레벨이나 속성 조건에 따라 사용 가능 여부가 변동될 수 있으므로, 어떤 목표를 향해 나아가고 있는지 항상 신경써서 확인해야 합니다.
cevo-tips-progression-stats=CEVO 모드에서는 체력/피해량/속도 등과 같은 플레이어 능력치에 대한 자세한 정보를 제공합니다. 또한 다른 시스템과 직접 연동되는 몇 가지 추가 능력치도 제공합니다. 이 모든 능력치는 재능/효과/속성 등을 통해 조정될 수 있으며, 진행 상황 메뉴에서 확인할 수 있습니다. 재능은 이러한 새로운 능력치와 상호작용하는 핵심 수단이며, 일부는 속성을 통해 적용됩니다.
cevo-tips-reinforcements=지원군은 동료의 소형 버전으로, 빠르게 자동으로 소환할 수 있습니다. 이들은 주로 새로운 장비(커뮤니케이터)를 통해 사용되며, 동료의 단순 형태로 작용합니다. 피해량도 적으며 체력 역시 적지만, 적에게 접근할 때 자동으로 소환됩니다. 이들은 주로 지원 도구로 설계되었기 때문에 그다지 효과적이지는 않습니다. 하지만 적의 어그로를 끌어오고 어느 정도의 피해를 입히는 데 도움이 될 수 있습니다. 참고: 이러한 형태의 동료는 일시적이며, 지속적으로 체력을 소모합니다. 장기적인 생존을 기대하지 마십시오.
cevo-tips-rituals=의식은 게임 세계 곳곳에서 발견할 수 있는 특별한 적 상호작용입니다. 포털을 열고 아군을 소환하기 위해, 이 지역의 적들은 나우비스와 다른 행성 곳곳에서의 의식을 진행하기 시작했습니다. 이 의식들은 삼엄한 경비 하에 진행되지만, 강력한 전리품과 경험치 보상을 제공합니다. 특별한 전설급 아이템과 기타 희귀 드롭 아이템도 획득할 수 있습니다. 다만 의식을 방해하려는 자들로부터 의식을 지키기 위해 새로운 하수인들이 경비를 서고 있는 경우가 많으니 주의하세요.
cevo-tips-talents=재능은 다양한 상호작용에 따라 플레이어에게 적용되는, 중첩 가능한 긍정적 또는 부정적 보정 효과입니다. 아이템/직업/전문직/연구 등의 다양한 요소는 플레이어에게 재능을 적용하거나 제거할 수 있습니다. 각 재능은 능력치에 중첩되는 효과를제  공하며, 이는 플레이어의 메커니즘과 상호작용에 다양한 변화를 가져올 수 있습니다.
cevo-tips-variants=적 변종은 일반적인 적과 다른 색상 형태로 등장합니다. 현재는 체력과 경험치 보상만 변경되어 있지만, 일반적인 변종에 더 많은 변화가 추가되었다면 이 팁 역시 자세한 정보와 함께 업데이트될 것입니다.
cevo-tips-waves-hordes=위험도는 CEVO서 추가한 새로운 시스템으로, 적들의 현재 활동 수준을 확인하는 데 도움을 줍니다. HUD에 새로 추가된 막대 하단에서 현재 값을 확인할 수 있습니다. 위험도가 높아질수록 근처에 적의 습격/대습격이 생성될 가능성이 증가됩니다. 무리 지도자(또는 보스)가 이끄는 대규모 적 집단이여, 당신과 기지를 파괴하려 할 것이므로 반드시 처치해야 합니다. 습격은 일반적으로 이러한 적이 한 무리만 등장하지만, 대습격은 3/4/5무리의 적이 동시에 등장합니다. 위험도는 이러한 적의 생성 빈도와 수량에 직접적인 영향을 미칩니다. 오염도/진화 요인이 높아질수록 더 강력한 적이 생성됩니다. 위험도는 '호르몬 변형제' 아이템을 사용해 낮출 수 있습니다. 또한 이 아이템은 위협도 생성 배율을 감소시켜 위험도가 더 천천히 증가되도록 합니다. 보스를 몇 마리 처치하고 3티어 정도에 도달했면, 이 아이템들을 확보해 관리할 필요성이 있습니다. 위협도가 계속 쌓이도록 방치하면 이는 곧 감당할 수 없는 결과로 이어질 것입니다.
cevo-tips-welcome='Project CEVO' 모드에 오신 것을 환영합니다! 이 모드는 현재 베타 버전인 만큼, 업데이트로 많은 변경 사항이 발생할 수 있으며 일부 버그가 발생할 수 있습니다. 포럼이나 Discord에 언제든지 제안 사항을 남겨 주세요. 팁이나 도움말이 제공될 때마다 꼭 읽어보시고, 새로운 내용에 대해 궁금한 점이 있다면 Factorio 게임의 "팁과 도움말" 메뉴를 확인해 보세요! 이번 첫 번째 팁들은 추가된 게임플레이 루프를 '개인 성장 -> 장비 성장 -> 기타 -> 적의 메커니즘' 순으로 이해할 수 있도록 도움을 드릴 수 있도록 제작되었습니다. 추가된 내용은 강제되거나 필수적으로 읽을 필요는 없으며, 이는 단순히 게임을 즐기는 또 다른 방법일 뿐입니다. 기본 아이템과 게임 시스템은 거의 변경되지 않았습니다.\n[개인 연구 -> 전문성 -> 직업 -> 직무]가 바로 플레이어의 성장 순서입니다. 개인 연구는 이제 경험치(레벨과 공유됨)를 획득해 완료할 수 있습니다. 전문성 포인트는 특정 연구와 연결되어 있으며, 레벨이 올라갈 때마다 능력치 포인트와 함께 획득할 수 있습니다. 직업을 해금하려면 특정 전문성이 필요하며, 직무는 직업과 직접적으로 연결됩니다. 경험치는 주로 '전투' 또는 '연구 아이템'(새로운 재료, 연구 기계, 제작품)을 통해 획득할 수 있습니다. 화면 상단에서 경험치와 연구 진행 상황을 확인할 수 있습니다.\n직업을 확보했다면 장비를 제작해야 하는 단계입니다. 방어구는 핵심 능력치 제공처입니다. 재능은 능력치에 %(간혹 고정치) 보너스를 제공하며, 이는 중첩되거나 감소될 수 있습니다. 연구/전문성/직업 역시 재능을 제공합니다. 장비는 핵심 특성 획득처입니다. 특성은 능력치에 고정치 보너스를 제공합니다. 직업/레벨/소모품 역시 특성을 제공합니다. 새로운 무기와 방어구를 사용하려면 능력치 요구 사항을 만족해야 합니다. 일부 방어구는 고유 효과를 제공할 수 있습니다. 사용 가능한 장비의 대부분 역시 고유 효과, 전투 능력, 재능을 제공합니다. 또한 (특정 보스와 연계된) 유물도 존재하며, 다양한 보너스 역시 제공합니다.\n새로운 아이템 제작과 관련된 새로운 소재 아이템을 게임에 추가했습니다. 유물 -> 경험치 보상 -> 핵심 아이템에 이르기까지 다양합니다. 기본(비전설) 무기는 이제 다양한 부착물을 부착해 개조할 수 있습니다. 각 무기마다 어떤 부착물을 장착할 수 있는지에 대한 유형과 등급이 지정해져 있습니다. 이를 활용하면 시간이 지남에 따라 무기를 나만의 스타일로 커스터마이징하고 업그레이드할 수 있습니다. 동료에게는 유사한 '보급품' 시스템이 있으며, 현재는 헬멧/시스템만 제공되지만(향후 확장 예정) 아티팩트와 전설급(또는 이스터 에그) 무기/갑옷/장비를 보스 처치 시 또는 특정 상호작용을 통해 획득할 수 있습니다. 이스터 에그 아이템은 중복 아이템을 합쳐 업그레이드하는 것으로 더 강력한 버전을 만들 수 있습니다.\n보스, 습격, 대습격, 변종, 캐시, 하수인이 게임에 추가되었습니다. 보스들은 다양한 공격 유형과 다양한 메커니즘을 갖추고 있어, 플레이어가 흥미롭고 역동적인 느낌을 받을 수 있도록 합니다. 습격과 대습격은 다양한 원인에 따라 주기적으로 생성됩니다. 위협 수준, 플레이어 행동, 적의 사망, 보스 등이 모두 습격/대습격을 유발할 수 있습니다. 변종과 하수인은 새로운 적 유형입니다. 변종 더 강화된 능력치를 가졌지만 희귀한 전리품을 드롭할 수 있는 변형된 바이터입니다. 하수인은 보스와 동시에 소환되는 적들로, 대개 고유한 효과나 공격을 가지고 있습니다. 보물 상자에서는 높은 확률로 새로운 재료나 전설급 아이템을 얻을 수 있지만, 아주 낮은 확률로 이를 지키는 보스를 소환해버릴 수도 있습니다.\n월드 보스는 게임 시작 시점에 등장하며, 피할 수도 있지만 사냥하는 것도 가능합니다. 보스와의 거리는 보스의 능력치에 따라 달라집니다. 현재 월드 보스를 한 번 처치하면 자연적으로 재등장하지 않지만, 추후 변경될 예정입니다. 신전은 보스를 처치한 후 해금되는 아이템으로, 신전을 사용해 원하는 시점에 해당 보스를 다시 소환할 수 있습니다. 여기까지가 추가된 요소의 제일 중요한 90%를 차지합니다. 레벨을 올리고, 장비를 획득하고, 전략을 세운 다음, 보스를 사냥하고, 공장과 함께 성장해 나가세요. 다만, 어느 한쪽도 소홀히 해서는 안 됩니다.

