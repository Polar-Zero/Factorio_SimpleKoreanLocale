[dialogue]
ambush-tutorial=(이러한) 특수 구조물을 파괴하면 대량의 전리품과 경험치를 획득할 수 있으며, 간혹 전설급 아이템을 획득할 수도 있습니다. 하지만 현재 위협 수준이 바로 증가되며, 위협이 증가하는 속도 역시 가속됩니다. 또한 위협에 대응하기 위해 강력한 보스 적이 등장할 확률이 존재합니다. (1/15)\n위협에 대비하고, 만반의 준비를 갖추세요!
attachment_tip=무기 부착물 시스템은 다소 복잡하고 제한적일 수 있습니다. 또한 각 무기마다 장착 가능한 부착물의 수는 정해져 있습니다. 각 부착된 부착물은 같은 티어여야 합니다. (티어 2 배럴을 장착한 무기에는 티어 2 배럴만 장착할 수 있습니다. 이는 현재 게임의 기술적 제한 사항 때문이며, 의도된 설계는 아닙니다)\n각 부착물 설명에서 티어를 확인할 수 있습니다. 또한 이 메뉴 드롭다운 목록에서 사용 가능한 모든 부착물이 표시되며, 버튼을 눌러 개조를 완료할 수 있습니다. 주의: 이 작업은 무기당 한 번만 가능하며, 무기나 부착물을 강화했다면 원래 상태로 되돌릴 수 없지만, 무기와 부착물 모두 비교적 저렴하게 구할 수 있으므로, 여러 자루를 준비해 두고 다양한 조합을 시도해 보는 것도 괜찮습니다.
companion_basics=첫 파티 동료가 성공적으로 합류했습니다. 이들은 다양한 방식으로 전투 지원을 제공하는, 플레이어가 조종할 수 있는 AI 캐릭터들입니다. 한 번에 사용할 수 있는 동료의 수는 제한되어 있지만, 아이템, 연구, 직업, 전문 기술 등을 통해 이 한도를 늘릴 수 있습니다.
companion_basics2=동료는 왼쪽 상단의 버튼이나 (마우스를 올려놓으면 자세한 정보를 확인할 수 있음) 단축키(기본 설정은 Ctrl+1 ~ Ctrl+3)를 통해 제어할 수 있습니다.
companion_basics3=동료에게도 장비를 장착해 줄 수 있다는 점을 기억하세요! 동료 장비들은 무기 부착물과 비슷한 방식으로 작동합니다. 능력치 보너스, 특수 효과, 새로운 탄환을 제공하거나, 완전히 새로운 형태로 변경, 재설계시킬 수 있습니다.
job_tip=직업은 캐릭터의 핵심 요소입니다. 다른 일반적인 성장 수단이나 아이템보다 플레이어 능력치에 가장 큰 영향을 미칩니다. 또한 다양한 특수 효과나 메커니즘을 부여하거나, 특정 장비를 사용하기 위한 전제 조건으로 설정되기도 합니다. 다만 새로운 직업을 얻기 위해 선행 직업이 필요한 경우가 있으며, 높은 적성이 필요할 수 있습니다, 적성은 개인 연구를 통해 해금할 수 있습니다.
level_up=첫 레벨 업을 축하합니다! 새로운 능력치 포인트(5)와 전문성 포인트 1점을 획득했습니다! 새로운 연구, 직업, 전문 분야에 접근하려면 특정 레벨 도달이 필요하니, 주기적으로 새로운 아이템을 확인해 보세요.
on_enemy_ambush_generated=누군가가 플레이어를 마음에 들지 않아했던 것 같습니다...
on_enemy_horde_generated=기지로 엄청난 수의 적들이 몰려오고 있습니다!!
on_enemy_wave_generated=근처에 적들이 모여들고 있는 것 같습니다!
progression_tip=플레이어 성장 메뉴에 오신 것을 환영합니다. 이곳에서 능력치 포인트를 할당하거나 초기화할 수 있습니다. 각 능력치는 플레이어(진영)에 다양한 보너스를 제공하며, 여러 아이템의 제작 조건에 필요하기도 합니다. 또한 이 메뉴에서 완료한 연구나 현재까지 축적한 재능을 확인할 수 있습니다.
requirement=현재 이 아이템을 장착하기 위한 조건 중 일부가 충족되지 않았습니다. 자세한 이유를 확인하려면 아이템 설명을 살펴보세요.
ring-tutorial=반지는 특별한 종류의 "무기"입니다. 무언가를 발사하지 않고, 어떤 피해도 입힐 수 없지만, 무기 슬롯에 장착되어 있을 때 다양한 보너스를 제공합니다. 더 많은 재능, 능력치, 버프를 얻을 수 있지만 무기 유형 선택의 유연성을 제한하게 됩니다. 반지는 전용 제작 기계를 사용하면 추가로 업그레이드할 수 있습니다.
supply_tip=보급품(부착물과 동일)은 다소 복잡하고 제한적일 수 있습니다. 각 동료에게 사용 가능한 보급품의 수는 정해져 있습니다. 또한 사용되는 보급품은 같은 티어여야 합니다 .(티어 2 헬멧을 장착한 동료는 티어 2 헬멧만 장착할 수 있습니다. 이는 현재 게임의 기술적 제한 사항 때문이며, 의도된 설계는 아닙니다)\n각 보급품 설명에서 티어를 확인할 수 있습니다. 또한 이 메뉴 드롭다운 목록에서 사용 가능한 모든 보급품이 표시되며, 버튼을 눌러 개조를 완료할 수 있습니다. 주의: 이 작업은 동료마다 한 번만 가능하며, 동료나 보급품을 강화했다면 원래 상태로 되돌릴 수 없습니다. 다만 동료와 보급품 모두 비교적 저렴하게 구할 수 있으므로, 여러 보급품를 준비해 두고 다양한 조합을 시도해 보는 것도 괜찮습니다.
threat_increased=이 지역 주민들이 요즘들어 자주 짜증내는 것 같습니다..
tutorial.cevo-alchemy-station=플라스크는 일시적으로 능력치를 상승시키거나 능동형 버프를 제공하는 소모품입니다. 능동형 버프는 광역 치유/피해/슬로우와 같은 지속적으로 발동되는 효과를 말합니다. 이러한 플라스크의 전설 등급은 영구적인 버프를 제공하기도 합니다. 각 유형의 버프는 하나만 적용할 수 있지만, 버프의 총 개수에는 제한이 없습니다 (원하는 만큼 보유 가능) 등급이 높은 플라스크일수록 더 강력한 보너스를 가지며 더 오래 지속됩니다.
weapon-tutorial=CEVO 모드의 무기는 탄약을 소모하지 않습니다. 하지만 발사하기 전 적절한 탄약을 장전해야 합니다. 이를 간편하게 하기 위해 모드에서 '충전제'를 생성하지만, 충전제는 이외의 다른 용도로 사용되지 않습니다.
welcome='Project CEVO' 모드에 오신 것을 환영합니다! 이 모드는 현재 베타 버전인 만큼, 업데이트로 많은 변경 사항이 발생할 수 있으며 일부 버그가 발생할 수 있습니다. 포럼이나 Discord에 언제든지 제안 사항을 남겨 주세요. 팁이나 도움말이 제공될 때마다 꼭 읽어보시고, 새로운 내용에 대해 궁금한 점이 있다면 Factorio 게임의 "팁과 도움말" 메뉴를 확인해 보세요! 이번 첫 번째 팁들은 추가된 게임플레이 루프를 '개인 성장 -> 장비 성장 -> 기타 -> 적의 메커니즘' 순으로 이해할 수 있도록 도움을 드릴 수 있도록 제작되었습니다. 추가된 내용은 강제되거나 필수적으로 읽을 필요는 없으며, 이는 단순히 게임을 즐기는 또 다른 방법일 뿐입니다. 기본 아이템과 게임 시스템은 거의 변경되지 않았습니다.
welcome2=[개인 연구 -> 전문성 -> 직업 -> 직무]가 바로 플레이어의 성장 순서입니다. 개인 연구는 이제 경험치(레벨과 공유됨)를 획득해 완료할 수 있습니다. 전문성 포인트는 특정 연구와 연결되어 있으며, 레벨이 올라갈 때마다 능력치 포인트와 함께 획득할 수 있습니다. 직업을 해금하려면 특정 전문성이 필요하며, 직무는 직업과 직접적으로 연결됩니다. 경험치는 주로 '전투' 또는 '연구 아이템'(새로운 재료, 연구 기계, 제작품)을 통해 획득할 수 있습니다. 화면 상단에서 경험치와 연구 진행 상황을 확인할 수 있습니다.
welcome3=직업을 확보했다면 장비를 제작해야 하는 단계입니다. 방어구는 핵심 능력치 제공처입니다. 재능은 능력치에 %(간혹 고정치) 보너스를 제공하며, 이는 중첩되거나 감소될 수 있습니다. 연구/전문성/직업 역시 재능을 제공합니다. 장비는 핵심 특성 획득처입니다. 특성은 능력치에 고정치 보너스를 제공합니다. 직업/레벨/소모품 역시 특성을 제공합니다. 새로운 무기와 방어구를 사용하려면 능력치 요구 사항을 만족해야 합니다. 일부 방어구는 고유 효과를 제공할 수 있습니다. 사용 가능한 장비의 대부분 역시 고유 효과, 전투 능력, 재능을 제공합니다. 또한 (특정 보스와 연계된) 유물도 존재하며, 다양한 보너스 역시 제공합니다.
welcome4=새로운 아이템 제작과 관련된 새로운 소재 아이템을 게임에 추가했습니다. 유물 -> 경험치 보상 -> 핵심 아이템에 이르기까지 다양합니다. 기본(비전설) 무기는 이제 다양한 부착물을 부착해 개조할 수 있습니다. 각 무기마다 어떤 부착물을 장착할 수 있는지에 대한 유형과 등급이 지정해져 있습니다. 이를 활용하면 시간이 지남에 따라 무기를 나만의 스타일로 커스터마이징하고 업그레이드할 수 있습니다. 동료에게는 유사한 '보급품' 시스템이 있으며, 현재는 헬멧/시스템만 제공되지만(향후 확장 예정) 아티팩트와 전설급(또는 이스터 에그) 무기/갑옷/장비를 보스 처치 시 또는 특정 상호작용을 통해 획득할 수 있습니다. 이스터 에그 아이템은 중복 아이템을 합쳐 업그레이드하는 것으로 더 강력한 버전을 만들 수 있습니다.
welcome5=보스, 습격, 대습격, 변종, 캐시, 하수인이 게임에 추가되었습니다. 보스들은 다양한 공격 유형과 다양한 메커니즘을 갖추고 있어, 플레이어가 흥미롭고 역동적인 느낌을 받을 수 있도록 합니다. 습격과 대습격은 다양한 원인에 따라 주기적으로 생성됩니다. 위협 수준, 플레이어 행동, 적의 사망, 보스 등이 모두 습격/대습격을 유발할 수 있습니다. 변종과 하수인은 새로운 적 유형입니다. 변종 더 강화된 능력치를 가졌지만 희귀한 전리품을 드롭할 수 있는 변형된 바이터입니다. 하수인은 보스와 동시에 소환되는 적들로, 대개 고유한 효과나 공격을 가지고 있습니다. 보물 상자에서는 높은 확률로 새로운 재료나 전설급 아이템을 얻을 수 있지만, 아주 낮은 확률로 이를 지키는 보스를 소환해버릴 수도 있습니다.
welcome6=월드 보스는 게임 시작 시점에 등장하며, 피할 수도 있지만 사냥하는 것도 가능합니다. 보스와의 거리는 보스의 능력치에 따라 달라집니다. 현재 월드 보스를 한 번 처치하면 자연적으로 재등장하지 않지만, 추후 변경될 예정입니다. 신전은 보스를 처치한 후 해금되는 아이템으로, 신전을 사용해 원하는 시점에 해당 보스를 다시 소환할 수 있습니다. 여기까지가 추가된 요소의 제일 중요한 90%를 차지합니다. 레벨을 올리고, 장비를 획득하고, 전략을 세운 다음, 보스를 사냥하고, 공장과 함께 성장해 나가세요. 다만, 어느 한쪽도 소홀히 해서는 안 됩니다.

