[gui]
attachment-barrel=Barrel
attachment-barrel-description=Weapon barrels typically adjust the speed, direction, and spin of a projectile as it leaves the gun. In some cases you find that your barrel has a more physical impact on the bullet itself. Maybe you find the bullets that exit the gun to be larger then before, or coated in some new substance. It's worth experimenting with before firing the weapon nearby property or friends...
attachment-grip=Grip
attachment-grip-description=No point in shooting your weapon if you can't hit a shot. By utilizing an improved form of grip, you can help stabilize your shots and prepare for the next.
attachment-magazine=Magazine
attachment-magazine-description=Magazines determine the firing capacity of your weapon, calibers supported, and how those rounds are loaded into the weapon itself. A reliable magazine is a must-have, and can easily determine the outcome of a close fight.
attachment-scope=Scope
attachment-scope-description=At times it can be difficult to spot something in the distance. Maybe you have trouble tracking the speed and direction of something. Scopes can help provide a visual improvement to your weapon. Aiding in your ability to use it, and often providing new information. We've heard rumours that some attempt to directly attach to your body to provide instant feedback and support....
attachment-stock=Stock
attachment-stock-description=Your body supports the accuracy, stability, and reliability of a firing weapon. It is important that the contact point to your central body is reliable and useful.
attachment-trigger=Trigger
attachment-trigger-description=Triggers are the first point of contact in the chain of actions between your reactions and the firing of a weapon. Ensure yours is capable, and reliable.
