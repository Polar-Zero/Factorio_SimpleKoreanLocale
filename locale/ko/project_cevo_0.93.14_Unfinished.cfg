[mod-name]
project_cevo=CEVO 계획(Project CEVO)

[mod-description]
project_cevo=‘공장을 키우고, 캐릭터를 성장시키세요’ ARPG와 팩토리오의 만남: 1,000가지 이상의 선택지를(직업, 직무, 적성, 연구, 능력치, 재능) 통한 심도 있는 플레이어 성장 시스템과, 500가지 이상의 신규 아이템을 추가합니다: 전설 등급의 전리품 아이템, 반지, 유물, 무기 부착물, AI 하수인/동반자, 연금술 등. 새로운 전투 메커니즘(가시, 생명력 흡수, 회피, 증폭, 균열, 타격 효과 등), 새로운 능동/수동 스킬(치유, 기절, 슬로우 등). 30종 이상의 보스와 그 부하들을 상대로, 적의 의식이나 매복 등 다양한 도전에 맞서보세요!

