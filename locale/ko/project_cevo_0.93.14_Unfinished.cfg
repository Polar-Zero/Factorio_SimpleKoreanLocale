[info-artifact]
description=Artifacts are rare items, typically obtained through bosses. These items provide strong talent bonuses and can be changed out here. They will persist through death, and are not consumed on use. Must be in your inventory to appear here.
title=Artifact Info

[info-attachment]
description=Attachments will alter stats/bullets/talents of a weapon. ONLY attachments of the SAME tier can be applied. Cannot be undone.
title=Attachment Info

[info-expertise]
description=Expertise is the next step after personal research. To unlock an expertise you typically will need to complete the prerequisite personal research first. Expertise provide small boosts to special stats, and begin your pathways to unlocking professions. They each cost 1x expertise point, which are rewarded on level up. So be aware that you may be limited in expertise available. Although you may find a consumable item that provides more...
title=Expertise Info

[info-job]
description=Jobs are the strongest career mechanics. Items often require specific jobs for requirements. Jobs also provide strong benefits towards a particular play-style.
title=Job Info

[info-profession]
description=Professions are an important aspect to career progression. They provide some core benefits to your character in the form of additional talents or attributes. They also are the main way of unlocking new jobs, and some items may require certain professions.
title=Profession Info

[info-progression]
description=Here you can see all things progression related. The most important being attribute points. Each attribute point provides you with a small bonus to a specific stat. They also are used as requirements to use specialized gear/weapons/equipment/etc... You will also be able to see any obtained effects/talents/research/expertise here as well. TIP: Right click an attribute button to apply 10 points.
title=Progression Info

[info-research]
description=Personal research is the first step in growing your character and specializing your build. Research can be queued(max of 4), and exp earned is shared with research and levels. There is a small progress bar below the level and pollution bars to track progress, red indicates a research needs to be started. Once research is complete, you will gain any benefits listed. Completing a research typically unlocks a more advanced version(may be level restricted though), and new expertise options. Research can also provide new recipes, earlier then you would otherwise be able to unlock them.
title=Research Info

[info-supply]
description=Supplies will alter stats/bullets/talents of a companion. ONLY supplies of the SAME tier can be applied. Cannot be undone.
title=Supply Info

