[mod-name]
DamageIndicator=피해 표시기(Damage Indicator)

[mod-description]
DamageIndicator=객체가 피해를 입을 때 움직이는 피해 수치 표시를 표시하도록 합니다. 간편한 사용자 지정 설정이 가능하며 다른 모드와 호환됩니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[command-help]
damage-indicators-clear=게임 내에 존재하는 피해 표시기 텍스트를 전부 삭제합니다.
damage-indicators-override=현재 플레이어별 피해 표시기 설정을 포함한 인코딩된 문자열을 담은 대화 상자를 엽니다. 관리자는 이 문자열을 모드 설정 -> 시작의 "서버 설정 재정의 문자열"에 붙여넣어 모든 플레이어가 동일한 피해 표시기가 표시되도록 지정할 수 있습니다.

[damage-indicator-message]
server-override-active=[font=default-dialog-button][[color=#FFE6C0]Damage Indicator[/color]][/font] Per-player display settings (other than 'Show damage indicators') will be overridden by the server.
server-override-decode-failed=[color=red]Server override string is invalid[/color]: the value in 'Server override settings string' is not a valid encoded settings string. Clear & generate a fresh one with [color=#FFE6C0]/damage-indicators-override[/color] and paste the exact output into the startup setting.\n\n[font=default-bold]This is a startup issue, check your mod settings in the main menu.[/font]\n
server-override-json-failed=[color=red]Server override string is corrupted[/color]: decoded successfully but the payload inside is not valid JSON. The string was likely truncated or partially overwritten -- generate a fresh one with [color=#FFE6C0]/damage-indicators-override[/color].\n\n[font=default-bold]This is a startup issue, check your mod settings in the main menu.[/font]\n
server-override-shape-failed=[color=red]Server override string has the wrong format[/color]: decoded payload does not match the expected settings shape. This usually means a blueprint or other unrelated encoded string was pasted. Generate a fresh one with [color=#FFE6C0]/damage-indicators-override[/color].\n\n[font=default-bold]This is a startup issue, check your mod settings in the main menu.[/font]\n
setting-overridden=[font=default-dialog-button][[color=#FFE6C0]Damage Indicator[/color]][/font] "__1__" 변경 사항이 서버에서 재정의되었습니다.

[gui-damage-indicator]
settings-string-close=Close
settings-string-help=Copy & paste this string into the [font=default-bold][color=#FFE6C0]Startup[/color][/font] → [font=default-bold]Server override settings string[/font] in the main menu mod settings to override per-user damage indicator settings in-game. This uses your current damage indicator per-player settings, you can re-run the [color=#FFE6C0]/damage-indicators-override[/color] command to update the string if you decide to adjust your indicator settings.
settings-string-title=Damage Indicator Override Settings

