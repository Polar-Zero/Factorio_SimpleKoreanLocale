[mod-setting-description]
damage-indicator-alt-mode=Alt-모드에서만 피해 표시기를 표시하도록 합니다.
damage-indicator-animation-speed=애니메이션 속도에 해당 설정값을 곱합니다. 높은 값으로 설정할수록 애니메이션이 더 빨리 끝나며, 낮은 값일수록 더 오래 지속됩니다.
damage-indicator-blacklist-entity-names=피해 표시기를 표시하지 않도록 할 객체 프로토타입 ID를 쉼표로 구분된 목록 형식으로 지정할 수 있습니다. (예: "small-biter, big-metallic-asteroid") 앞이나 뒤에 와일드카드 문자를(*) 사용할 수 있습니다. "*-asteroid"로 설정해 "-asteroid"으로 끝나는 모든 ID와 일치하도록, "pipe-*"로 "pipe-"로 시작하는 모든 ID와 일치하도록 할 수 있습니다. 제외 목록을 비활성화하려면 빈 문자열로 유지하세요 (비어 있는 상황일 경우 성능 영향 없음)
damage-indicator-blend-damage-type-colors=활성화하면, 복합 유형 피해를 표시할 때 피해 유형 색상을 그대로 사용하는 대신, 각 피해 유형의 피해량에 따른 색상 가중치를 혼합해 계산하도록 합니다. '피해 유형'이 '혼합'으로 설정되어 있어야 적용됩니다.
damage-indicator-color-acid=산성 피해 유형을 표시할 때 사용할 RGB 색상을 조정할 수 있습니다.
damage-indicator-color-electric=전기 피해 유형을 표시할 때 사용할 RGB 색상을 조정할 수 있습니다.
damage-indicator-color-explosion=폭발 피해 유형을 표시할 때 사용할 RGB 색상을 조정할 수 있습니다.
damage-indicator-color-fire=화염 피해 유형을 표시할 때 사용할 RGB 색상을 조정할 수 있습니다.
damage-indicator-color-impact=충돌 피해 유형을 표시할 때 사용할 RGB 색상을 조정할 수 있습니다.
damage-indicator-color-intensity=활성화하면, 피해 유형별 색상을 유지하면서도, 적은 피해를 주는 피해 유형이 더 흐리게 하고, 더 많은 피해를 주는 피해 유형일수록 진하게 강조되도록 합니다.
damage-indicator-color-intensity-cap=이 수치 이상의 피해량에 대한 피해 표시가 최대 수준의 그라데이션 강조를 사용하도록 합니다.
damage-indicator-color-laser=레이저 피해 유형을 표시할 때 사용할 RGB 색상을 조정할 수 있습니다.
damage-indicator-color-mode=피해 표시기의 색상이 각 피해 유형에 따라 해당 출처의 영감을 받은 색상을 사용하도록 하거나, '피해량에 따라' 옵션을 통해 피해 유형과 무관하게, 피해량에 따라 연노란색에서 진한 빨간색까지 색상이 변하도록 할 수 있습니다.
damage-indicator-color-physical=물리 피해 유형을 표시할 때 사용할 RGB 색상을 조정할 수 있습니다.
damage-indicator-combine-ticks=객체가 피해를 입은 직후, 해당 틱 이내에 발생하는 추가 피해가 새로운 팝업 대신 동일한 표시기에 통합되도록 합니다.
damage-indicator-compact-numbers=활성화하면 큰 피해 수치에 1.0k, 10.0m, 1.00b와 같은 k/m/b 표기법을 사용하도록 합니다. 비활성화된 상태일 경우 큰 피해량은 아래 선택값에 따른 숫자 구분 기호를 사용해 생략되지 않은 값으로 표시됩니다.
damage-indicator-debug-info=디버깅에 사용할 수 있도록, 피해 표시기의 내부 상태를 표시합니다.
damage-indicator-drift-distance=표시기가 사라지기 전 이동할 거리를 조정할 수 있습니다. (칸 단위)
damage-indicator-drift-style='원점에서 멀어지도록': 표시기 숫자가 피해 발생 지점에서 점점 멀어지도록 합니다. '위쪽으로': 일반적인 플로팅 텍스트처럼 동작합니다. '혼합': 위 두 방식을 모두 적용합니다.
damage-indicator-enabled=활성화하면, 피해를 입은 객체 근처에 받은 피해량을 나타내는 텍스트 표시기를 표시합니다.
damage-indicator-font=렌더링된 피해 텍스트에 사용할 글꼴 프로토타입 ID를 설정할 수 있습니다. '사용자 지정' 값을 통해 사용자 정의 글꼴, 크기 설정을 사용하는 것도 가능합니다.
damage-indicator-font-family='사용자 정의' 피해 표시기 글꼴 값을 사용 중일 때, 표시기를 생성할 때 사용할 기본 글꼴 ID입니다.
damage-indicator-font-size='사용자 정의' 피해 표시기 글꼴 값을 사용 중일 때, 표시기를 생성할 때 사용할 기본 글꼴 크기입니다.
damage-indicator-group-name-normalize=Rampant 모드의 적과 같이 유사한 변형 객체를 그룹화합니다. 쉼표(,)로 구분된 Lua 패턴으로, 각 패턴은 티어/버전별로 나눠진 내부 ID에서 기본 이름을 추출하는 데 사용되는 하나의 캡처 그룹 '(...)'을 포함해야 합니다.
damage-indicator-group-similar-distance=해당 범위 내 동일한 내부 프로토타입 ID를 가진 1x1 건물들이 피해를 입을 때, 하나의 피해 표시기를 공유하도록 합니다. 그룹화를 비활성화하려면 0으로 설정하세요.
damage-indicator-killing-blow=막타를 가한 피해 수치 뒤에 마커(기본값: !)와, 눈에 띄는 미묘한 강조 요소를 추가합니다.
damage-indicator-killing-blow-marker=막타를 가한 피해 수치 뒤에 추가할 접미사입니다. 강조 펄스는 유지하지만 접미사를 추가하고 싶지는 않다면 이 설정을 비워두세요.
damage-indicator-lifetime=기본 애니메이션 지속 시간 (틱 단위), 지속 피해의 경우, 종료되기 전까지 표시기가 계속 유지되며, 종료되더라도 해당 설정값만큼의 시간이 지난 뒤에 애니메이션이 종료될 것입니다.
damage-indicator-max-active=활성 상태인 표시기가 이 수량보다 많을 경우 제일 오래된 표시기가 제거됩니다.
damage-indicator-minimum-damage=이 수치보다 적은 피해량을 가진 새로운 피해 표시기가 생성되지 않도록 무시합니다. 기존 표시기에 합쳐지는 후속 타격은 이 설정과 무관하게 누적된 피해를 합산합니다.
damage-indicator-number-separator='피해량 단축 표기 허용' 설정이 비활성화되었을 때 데미지 수치에 사용할 구분 기호입니다.
damage-indicator-radius=플레이어로부터 해당 범위 내에 있는 표시기만 표시합니다. (칸 단위)
damage-indicator-saturation-threshold=동일한 객체 유형에서 발생하는 데미지 표시기를 하나의 표시기로 그룹화하기 전 유지할 최대 개수입니다.
damage-indicator-scale=피해 텍스트 표시기를 이 설정값만큼 크게 합니다.
damage-indicator-shadow-style=가독성과 성능 간의 균형을 조절합니다. '약하게'는 표시기당 그림자 텍스트 객체 3개를 사용하며, '강하게'는 5개를 사용합니다, '바활성화'로 설정하면 텍스트에 색상만 적용해 표시합니다.
damage-indicator-show-group-count=그룹화된 객체 수와 번역된 아이템 이름이 포함된 텍스트를 표시하도록 합니다 (예: [7x 벽]) 비활성화하면 피해 텍스트만 표시됩니다.
damage-indicator-show-reductions='Stable Foundations'모드로 인해 줄어든 피해량을 추가로 표시합니다: 50 (-50)
damage-indicator-text-template=각 표시기에 렌더링할 텍스트입니다. 서식이 적용된 피해 수치가 표시되어야 할 위치에 __damage__를 입력하세요. 감소된 피해를 수동으로 표시해야 할 경우 __reduced__를 사용할 수 있습니다.
damage-indicator-text-update-interval=피해가 합산되는 동안 표시 중인 피해 텍스트는 해당 틱 간격마다 최대 한 번씩 갱신됩니다.
damage-indicator-viewport-culling=피해 표시기가 모든 플레이어 주변 일정 범위 외부에서 생성되지 않도록 건너뜁니다. 실제 화면이 아닌 각 플레이어의 동기화된 위치를 사용하므로, 모든 플레이어에게 동일한 동작이 적용됩니다.
damage-indicator-viewport-margin=플레이어 주변 범위를 계산할 때 추가 여백 칸수를 추가하여, 화면 가장자리의 피해 표시기가 지나치게 엄격하게 제거되지 않도록 합니다.
damage-indicator-visibility='주변': 주변의 모든 피해가 표시됩니다. '아군': 아군과 관련된 피해가 표시됩니다. '다른 세력': 아군이 다른 세력에 가한 피해만 표시합니다.
damage-indicator-whitelist-distance-bonus=허용 목록에 등록된 객체 유형을 그룹화할 때 '피해 그룹화 범위'에 범위 값을 추가하도록 합니다. 이를 통해 허용 목록 등록된 객체가(예: 표류하는 소행성) 일반 건물보다 더 넓은 간격이더라도 그룹화되도록 할 수 있습니다.
damage-indicator-whitelist-entity-types=1x1보다 크더라도 항상 그룹화될 수 있도록 간주될 객체 유형(예: "asteroid, turret, rail")을 쉼표로(,) 구분된 목록 형식으로 지정할 수 있습니다. 허용 목록을 비활성화하려면 비워두세요.
damage-indicator-server-override-string=모든 플레이어에 대한 피해 표시기가 지정된 시작 설정을 사용하도록 재정의합니다. 서버에서 일관된 피해 표시기를 적용하도록 할 때 유용합니다. 게임 내에서 [color=#FFE6C0]/damage-indicators-override[/color]를 사용해 문자열을 생성할 수 있으며, [font=default-bold]비활성화하려면 이 칸을 비워두세요[/font].