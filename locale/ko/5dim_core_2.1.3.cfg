[mod-name]
5dim_core=5Dim 모드 - 핵심 요소(5Dim's mod - Core)

[mod-description]
5dim_core=모든 5Dim 모드를 깔끔하고 체계적인 기반 위에서 시작하세요.\n다른 5Dim 모드에서 사용하는 공통 시스템과 정리된 아이템 구성을 제공하는 기본 모듈입니다.\n다른 5Dim 모드를 설치하기 전에 먼저 설치하세요.\n\n번역: SimpleKoreanLocale(PolarZero)

