[mod-setting-description]
5d-bicho-healing=틱당 적군 체력 자연 회복량 배율을 조정합니다.
5d-bicho-hp=적 유닛의 체력 배율을 조정합니다.
5d-bicho-spawner-hp=적 산란장의 체력 배율을 조정합니다.
5d-braking=기차 제동력에 대한 무한 연구를 활성화합니다.
5d-change-inventory=플레이어의 기본 인벤토리 크기를 조정할 수 있습니다. (기본값: 60)
5d-change-stack=아이템 묶음 크기를 설정값 배율만큼 늘리거나 줄일 수 있습니다.
5d-crafting-time-multiplier=모든 제작 시간을 해당 설정값 배율로 조정합니다. (기본값: 1.0)
5d-entity-tier-overlay=활성화하면, 지원되는 배치 가능한 객체 위에 티어 번호를 표시합니다.
5d-entity-tier-overlay-black-background=티어 번호를 그리기 전, 검은색 배경을 먼저 그린 뒤 객체 티어 오버레이를 표시합니다. 티어 번호만 표시하려면 비활성화하세요.
5d-equip-start=새 게임을 시작할 때 지급할 시작 장비를 정의합니다.
5d-exp=실험적인 적 유형을 활성화합니다.
5d-grid=차량에 장비 그리드를 추가해 차량용 장비를 장착할 수 있도록 합니다.
5d-grid-override=모든 차량의 장비 그리드를 재정의합니다. (차량 그리드 활성화 필요)
5d-healing=틱당 플레이어 체력 자연 회복량을 조정합니다. (기본값: 0.15)
5d-hp=플레이어의 기본 최대 체력을 조정합니다. (기본값: 250)
5d-icon-tier-overlay=공유되는 5Dim 관련 도우미 객체를 사용하는 아이템, 제작법, 기술 등의 프로토타입 아이콘에 티어 번호 표시를 추가합니다.
5d-icon-tier-overlay-black-background=검은색 배경을 먼저 그린 뒤 아이콘 티어 배지를 표시합니다. 티어 번호만 표시하려면 비활성화하세요.
5d-item-start=새 게임을 시작할 때 지급할 시작 아이템을 정의합니다.
5d-light-radius=플레이어 주변의 조명 반경을 정의합니다. (기본값: 25)
5d-long-mine=플레이어의 채광 범위를 늘릴 수 있습니다. (기본값: 6)
5d-long-reach=건설 및 인벤토리 관리 등 상호작용 제한 범위를 조정합니다. 화면 전체와 상호작용하려면 125로 설정하세요. (기본값: 6)
5d-machine-energy-factor=기계 에너지 사용량의 티어별 증가폭을 정의합니다. 높은 값으로 설정하면 메가베이스 확장을 장려하기 위해 고티어 기계의 전력 사용량을 증가시킬 수 있습니다. [재시작 필요] (기본값: 1.75)
5d-machine-recipe-factor=기계 업그레이드 제작법 변화의 티어별 증가폭을 정의합니다. 내부 희귀도 가중치를 통해 희귀 재료가 일반적인 재료에 비해 급격하게 많이 필요해지지 않도록 합니다. [재시작 필요] (기본값: 1.25)
5d-machine-t10-extra-module-slots=지원되는 기계 계열의 최종 티어에 MK10 보너스로 추가할 모듈 슬롯 수를 정의합니다. [재시작 필요] (기본값: 2)
5d-machine-t10-next-tier-work=활성화하면, 지원되는 기계 계열의 최종 티어가 다음 이론상 티어의 작업 속도 값을 사용하도록 해, 기본 에너지 티어를 높이지 않고도 T10 기계를 최고 업그레이드로 활용할 수 있도록 합니다. [재시작 필요]
5d-machine-tech-factor=기계 기술 연구 필요량에 대한 티어별 증가폭을 정의합니다. 실제 적용값은 더 깔끔한 값으로 반올림됩니다. [재시작 필요] (기본값: 1.3)
5d-machine-work-factor=제작 속도, 채광 속도, 연구 속도, 펌프 속도 등 기계의 처리량 관련 수치의 티어별 증가폭을 정의합니다. [재시작 필요] (기본값: 1.45)
5d-mining-speed=플레이어 채광 속도를 해당 설정값 배율로 조정합니다.
5d-ores=모든 자원 매장량을 무한으로 설정합니다.
5d-recipe-cost-multiplier=제작법 재료 비용에 적용되는 전역 배율입니다. 일반적인 재료 스케일링, 우주 시대 재료에도 적용됩니다. 티어별 제작법 진행 방식을 사용하는 기계 계열은 이 설정값이 아닌 '기계 제작법 배율'에 의해 정의됩니다. [재시작 필요] (기본값: 1.0)
5d-robot-tech=새 게임을 시작할 때 로봇공학 기술을 잠금 해제한 상태로 시작합니다.
5d-space-age-materials='우주 시대' DLC를 설치한 경우, 고티어(5-10) 모듈이 우주 시대 진행도에 따라 기계 제작에 행성 자원이, 기술 연구에 행성 과학 팩이 필요하도록 수정합니다.
5d-special-mines=독, 산 지뢰와 관련 제작법, 기술 연구를 활성화합니다.
5d-special-turrets=독, 산, 박격포, 로봇 배치기, 조명탄 포탑과 관련 제작법, 기술 연구를 활성화합니다.
5d-speed=연구 속도와 관련된 무한 연구를 활성화합니다
5d-speed-gun-turret=총기, 기관 포탑의 발사 속도에 대한 무한 연구를 활성화합니다
5d-spoil-time-multiplier=모든 부패 가능한 아이템의 부패 시간에 해당 설정값 배율을 추가로 적용합니다. 1보다 큰 값으로 설정하면 아이템의 지속 시간이 증가되지만, 1보다 적을수록 더 빠르게 부패합니다. '우주 시대' DLC가 설치된 경우에만 표시됩니다. (기본값: 1.0)
5d-stack=묶음 투입기 용량에 대한 무한 연구를 활성화합니다
5d-stack-artillery-bullets=포탄을 최대 5개까지 쌓을 수 있도록 합니다
5d-storage=로봇 화물 용량에 대한 무한 연구를 활성화합니다
5d-suicide=접촉 시 폭발하는 자폭 바이터를 활성화합니다
5d-train-tech=새 게임을 시작할 때 철도 기술을 잠금 해제한 상태로 시작합니다.
5d-tree=나무 사이로 비집고 들어가기 쉽도록 나무의 충돌 범위를 작게 만듭니다.
5d-worm=베헤모스, 실험적 땅벌레를 활성화합니다.
5d-yield=무한 광석의 생산량이 최소 100%로 유지되도록 합니다.