[mod-name]
bp-trees=설계도면화 가능한 나무(Blueprintable Trees)

[mod-description]
bp-trees=로봇을 사용하여 나무 씨앗을 심을 수 있도록 합니다. 심은 나무 씨앗은 일정 시간동안 설계도면이나 Ctrl+C 등으로 지정할 수 있습니다. Alien Biomes 모드와 호환됩니다.\n\n번역: SimpleKoreanLocale(PolarZero)\n\n번역: SimpleKoreanLocale(PolarZero)



[item-name]
tree-capsule=나무 캡슐

[item-description]
tree-capsule=나무 묘목이 들어 있는 캡슐입니다. 땅에 놓으면 마치 나무 씨앗을 심은 것처럼 잠시 뒤 작은 나무로 변합니다. 설계도면으로 만들 수 있습니다.


[mod-setting-name]
tree-capsule-replace-time=나무 캡슐 성장시간

[mod-setting-description]
tree-capsule-replace-time=나무 캡슐이 작은 나무로 변하는 데 걸리는 시간(초)입니다. 설계도면이나 복잡한 배치를 보다 쉽게 하기 위해 이 수치를 조정할 수 있습니다.