[mod-setting-description]
berbcorp-belts-freezes-on-aquilo=활성화하면, 버브 주식회사 벨트가 극저온 환경에서 얼어붙지 않게 작동하려면 가열이 필요하도록 조정합니다. (기본 게임 벨트와 동일함)
berbcorp-belts-gear-cost-scale=기본 철 톱니바퀴 재료 비용에 해당 설정값을 곱합니다. 기본값 0.5로 설정하면 제작 비용이 과도하게 커지지 않게 됩니다. (기본값: 0.5)
berbcorp-belts-tier-4-speed=4티어 벨트의 초당 운송량을 조정할 수 있습니다. 우주 시대 DLC의 기본 터보 벨트 운송량은 60/초이며, 이 모드의 벨트와는 무관한 객체로 처리됩니다.
berbcorp-belts-tier-5-speed=5티어 벨트의 초당 운송량을 조정할 수 있습니다.
berbcorp-belts-tier-6-speed=6티어 벨트의 초당 운송량을 조정할 수 있습니다.
berbcorp-belts-tier-7-speed=7티어 벨트의 초당 운송량을 조정할 수 있습니다.
berbcorp-belts-tier-8-speed=8티어 벨트의 초당 운송량을 조정할 수 있습니다.