[mod-name]
berbcorp-belts=버브 주식회사 벨트(BerbCorp Belts)

[mod-description]
berbcorp-belts=버브 주식회사가 개발한 MK4~8 벨트, 지하 벨트, 분배기를 게임에 추가합니다. 우주 시대 DLC의 터보 벨트와 별개로 추가되며, 모드 설정에서 속도나 제작 비용을 조정할 수 있습니다.\n\n번역: SimpleKoreanLocale(PolarZero)


