[mod-name]
Gun_Turret_Alerts=탄약 알림(Ammo Alerts)

[mod-description]
Gun_Turret_Alerts=포탑이나 차량의 탄약이 소진되었거나 얼마 남지 않았을 경우에 대한 지도 알림을 추가합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[gun-turret-alerts]
message-empty=__1__에 탄약이 없습니다!
message-low=__1__에 탄약이 부족합니다

[string-mod-setting]
gun-turret-alerts-mode-added=합산
gun-turret-alerts-mode-individually=개별
gun-turret-alerts-mode-selected=선택

[virtual-signal-name]
ammo-icon-red=탄약 소진 신호
ammo-icon-yellow=탄약 부족 신호

[mod-setting-name]
gun-turret-alerts-artillery-enabled=대포 탄약 경고 활성화
gun-turret-alerts-car-enabled=차량 탄약 경고 활성화
gun-turret-alerts-enabled=포탑 탄약 경고 활성화
gun-turret-alerts-mode=다중 슬롯 모드
gun-turret-alerts-threshold=탄약 부족 임계값
gun-turret-alerts-z-automated-full=자동 보충량보다 적을 때만 표시
gun-turret-alerts-z-show-planets=모든 행성 알림 표시
gun-turret-alerts-z-show-platforms=모든 우주 플랫폼 알림 표시

[mod-setting-description]
gun-turret-alerts-artillery-enabled=대포, 대포 화물차에 대한 탄약 관련 알림을 표시합니다.
gun-turret-alerts-car-enabled=자동차, 탱크 등에 대한 탄약 관련 알림을 표시합니다.
gun-turret-alerts-enabled=기관 포탑에 대한 탄약 관련 알림을 표시합니다.
gun-turret-alerts-mode=탄약 잔량 계산시 각 인벤토리 칸을 합산할지, 개별적으로 계산할지, 선택한 슬롯만 계산할지 조정할 수 있습니다. (객체에 탄약 슬롯이 2개 이상인 경우에만 적용)
gun-turret-alerts-threshold=포탑, 차량, 대포에 해당 값보다 적은 탄약이 남았을 경우, 탄약 관련 지도 알림을 표시하도록 합니다.
gun-turret-alerts-z-automated-full=포탑이나 대포에 남은 탄약이 투입기 자동 보충량과 같거나 더 많은 상황에서 알림을 보내지 않도록 합니다.
gun-turret-alerts-z-show-planets=현재 행성 외부의, 다른 행성 표면에 대한 경고를 표시합니다. (기본값: 비활성화)
gun-turret-alerts-z-show-platforms=현재 행성 궤도가 아닌, 다른 우주 표면에 대한 경고를 표시합니다. (기본값: 비활성화)