[mod-name]
berbcorp-lane-balancers=버브 주식회사 라인별 분배기(BerbCorp lane balancers)

[mod-description]
berbcorp-lane-balancers=버브 주식회사에서 개발한 단일 라인의 양 열에 대한 분배 처리가 가능한 라인별 분배기를 게임에 추가합니다. 기본 게임 유형과 버브 주식회사의 MK4~8 벨트 속도와 대응하는 유형이 모두 추가됩니다.\n\n번역: SimpleKoreanLocale(PolarZero)


