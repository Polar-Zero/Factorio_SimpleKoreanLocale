page_artifact_text_1=풍화된 유물
page_artifact_text_2=고대 기술의 잔재인 [item=eneas-artifact] 유물은 오랜 세월에 걸쳐 마모된 상태지만, 도구와 건물을 개선하고 향상하는 데 유용하게 사용할 수 있는 첨단 기술 부품입니다. [entity=debris-a] 잔해에서 회수하거나 [entity=artifact-extractor] 대형 유물 발굴기로 유물 보관소에서 직접 채광할 수 있습니다.
page_artifact_text_3=\n풍화된 유물
page_artifact_text_4=[item=eneas-artifact] 유물의 힘을 온전히 활용하려면 먼저 복원해야 합니다. 점점 더 복잡한 재료로 유물의 품질을 높이는 방식으로 복원할 수 있습니다. 일반적인 조립 기계만으로는 이 섬세한 역사의 조각을 다루기 어려우므로, 도구 팩의 사용은 필수적입니다.
page_artifact_text_5=유물 활용
page_artifact_text_6=[item=eneas-artifact] 유물은 다양한 방식으로 사용할 수 있습니다. 유물과 제작 기계를 결합해 기계의 품질을 높일 수 있습니다. 단순한 기계일수록 쉽게 향상할 수 있어 일반 품질 유물만으로도 품질을 올릴 수 있습니다.\n\n더 복잡한 건물은 목표 품질과 동일한 고급 유물이 필요합니다.
page_data_text_1=데이터
page_data_text_2=[item=eneas-artifact] 고대 유물에서 가장 섬세한 부품을 조심스럽게 분리하는 것으로 [item=ancient-core] 코어를 추출할 수 있습니다.\n\n[color=yellow][entity=unit-05]: 내가 설계한 것들은 대부분 스스로 동력을 공급할 수 있지만, 작동하기 전 먼저 근원의 명령을 받아야 해. 예전에는 이니스의 모든 부분이 나와 연결되어 있었기에 이게 큰 단점이 아니었지만, 지금은 내 뿌리가 대뇌피질 너머로 거의 뻗지 못하니까.[/color]\n\n
page_data_text_3=\n데이터
page_data_text_4=[color=yellow][entity=unit-05]: 코어에는 나를 구동하는 코드의 훨씬 단순한 버전이 들어 있어. 이걸 사용하면 데이터에 의존하는 건물에 한동안 데이터를 공급할 수 있지만, 코어가 심하게 노후되었기에 완벽한 해결법은 아니야. 코어 내용물을 정상적으로 작동하는 데이터 저장 장치에 옮겨 적을 수만 있다면 활용 기간을 늘릴 수 있을 텐데.[/color]\n\n
page_debris_text_1=잔해 추락
page_debris_text_2=나우비스 궤도의 [planet=eneas] 위성은 불안정하며, 지속적으로 물질을 잃고 있습니다. 잃은 물질은 이웃 행성 [planet=nauvis] 표면에 추락하는 것으로 보입니다. 두 행성 모두 조석 고정된 상태로 보이며 따라서 충돌 현상 역시 특정 지역에 집중되고 있습니다.\n
page_debris_text_3=[color=yellow][entity=unit-05] 잔해 지도 태그는 성가실 수 있지만, 걱정하지 마세요! 근처 잔해 조각을 제거했다면 15분마다 자동으로 삭제됩니다. [/color]
page_debris_text_4=\n보물
page_debris_text_5=잔해에서 회수할 수 있는 [item=eneas-artifact] 고대 기계 조각은 그 자체로도 유용하지만, 내부에는 더 유용한 전리품이 숨겨져 있습니다.\n하지만 이를 발견하려면 엔지니어의 정밀한 손길이 필요합니다. [item=construction-robot] 로봇에 잔해를 회수하도록 명령하면 희귀한 전리품은 손실되며 기본 자원만 얻을 수 있습니다.\n
page_eneas_text_1=이니스
page_eneas_text_2=[planet=fulgora] 풀고라 사람들의 이동식 우주 정거장에 붙인 이름입니다. 이니스에는 정거장의 관리자로 설치된 인공 지능 [entity=unit-05] 유닛-05가 있으며, 최첨단 [검열됨] 도구와 궤도, 행성간 무기, 내장형 용광로 등을 갖추고 있습니다. 하지만 지속된 관리 부재로 인해 현재는 이러한 기능 대부분을 사용할 수 없거나 제한적으로만 사용할 수 있게 된 상태입니다. 이니스의 표면은-\n\n[color=yellow][entity=unit-05]:-완전히 평범하고 지루했어. 그리고 무기라니? 무슨 무기? 난 무기 같은 건 몰라.[/color]\n\n[color=red][entity=unit-05-dummy]: 상태 확인 중 - - - 마르스 = 온라인 - - - 네리오 = 복구 중.[/color]
page_eneas_text_3=면책 조항
page_eneas_text_4=[planet=fulgora] 풀고라 궤도에서 건조된 이니스는 아광속 행성간 이동이 가능하며, 보통 현재 [검열됨] 상태인 행성 궤도를 공전합니다.
page_fish_text_1=서보피쉬
page_fish_text_2=이니스의 고인 물웅덩이 아래에는 고대에 만들어진 장치인 서보피쉬가 서식합니다. 원래는 우주 정거장 인공 생태계의 섬세한 균형을 유지하도록 만들어졌지만, 제대로 된 감독과 정비가 사라진 환경에서 서보피쉬는 서서히 정화 능력을 잃고 노후되기 시작하고 말았습니다.\n\n[color=yellow][entity=unit-05]: 조금 지나치게 극적인 설명인 것 같은데? 사랑과 관심을 아주 약간만 주면 이 친구들은 금방 제 역할을 할 수 있어.[/color]
page_fish_text_3=\n\n수질
page_fish_text_4=[color=yellow][entity=unit-05]: 이 작은 생물들은 내 냉각 계통을 깨끗하게 유지하는 역할을 해. 네게도 유용하다는 건 알지만, 내 주변 웅덩이에 항상 몇 마리씩 남겨 뒀으면 해. 내 용광로에 설계도가 있으니 나중에 더 만들 수 있어.[/color]
page_fish_text_5=\n\n원시 서보피쉬
page_fish_text_6=고급 자원을 이용해 서보피쉬를 원래 모습으로 복원하면 성능을 크게 향상할 수 있습니다.
page_fulgora_text_1=풀고라
page_fulgora_text_2=내용이 곧 추가될 예정입니다!
page_generator_text_1=발전기
page_generator_text_2=이 건물은 고대의 것처럼 보이지만 [entity=unit-05]이 비교적 최근에 설치한 것임이 확인되었습니다. 여러분의 원시적인 건물에도 안정적으로 전력을 공급합니다.
page_generator_text_3=\n이니스에서의 발전
page_generator_text_4=[color=yellow][entity=unit-05]: 이니스에는 콘센트가 여기저기 놓여 있지 않아. 전력 공급 문제는 아주 오래전에 해결했거든. 원래 풀고라 기술로 작동하는 것들은 각자가 코어에서 스스로 동력을 얻을 수 있으니. 그러니 이건 시작할 때 주는 작은 호의라고 생각해.[/color]
page_gleba_text_1=글레바
page_gleba_text_2=내용이 곧 추가될 예정입니다!
page_lift_text_1=리프트
page_lift_text_2=[entity=eneas-lift] 리프트는 이니스 행성 지하의 제조 시설로 통하는 마지막 남은 출입구 중 하나입니다. 리프트를 이용해 [entity=unit-05] 유닛-05가 매 생산 주기마다 이니스 고유 자원을 생산하도록 할 수 있습니다. (15분) 기본적으로 기본 이니스 자원인 [item=ancient-circuit] 고대 회로, [item=ancient-frame] 고대 골조, [item=ancient-material] 고대 물질을 생산합니다.
page_lift_text_3=\n생산량
page_lift_text_4=두 가지 방법으로 지하 시설에서 이루어지는 배송 효율을 높일 수 있습니다: 1. 이니스의 공해를 정화: 지표면이 깨끗해지면 유닛-05의 집중력이 향상되며 더 많은 자원을 생산할 수 있습니다. 2. 새로운 기술 연구: 자원 생산량을 늘리거나 새로운 아이템을 추가로 생산할 수 있습니다.
page_memories_text_1=기억
page_memories_text_2=내용이 곧 추가될 예정입니다!
page_pollution_text_1=공해
page_pollution_text_2=매 주기(15분)마다 이니스의 광대한 지하에서 일정하지 않은 양의 공해 물질이 [entity=eneas-vent]를 통해 지표로 배출됩니다. 오래전에는 이니스가 직접 이를 관리할 수 있었지만 이젠 그렇지 못합니다. [entity=clarifier] 침전기 같은 새 건물을 사용해 이니스의 공해를 제거하세요.\n\n공해 검사는 주기가 시작될 때 새 공해가 추가되기 전 이루어집니다. 공해가 너무 심하면 [entity=unit-05] 유닛-05가 해당 주기가 끝날 때까지 비활성화될 수 있지만, 공해 오염도를 낮추면 유닛-05가 다시 작동합니다.\n\n다음 개체 주변 청크의 공해를 점검하세요:\n\n[entity=unit-05] 유닛-05\n\n[entity=eneas-vent] 공해 배출구\n\n[entity=artifact-extractor] 대형 유물 발굴기
page_pollution_text_3=\n배출구
page_pollution_text_4=배출구 자체는 공해 물질이 빠져나오는 통로일 뿐입니다. 어떻게든 배출구를 파괴하더라도([color=yellow][entity=unit-05]: 성공했다면 나한테 방법 좀 알려 줘![/color]) 공해 물질은 지도의 무작위 지점에서 퍼져나오게 됩니다. 따라세 배출구가 있는 지역은 항상 공해량이 가장 많게 되므로, 배출구 근처에 공해 물질을 정화/소비하는 건물을 설치하는 것을 권장합니다. 공해도 확인은 특정 지역이 아닌 모든 지역의 공해량 합계를 기준으로 합니다.
page_radar_text_1=레이더
page_radar_text_2=고급 레이더에서는 객체 해체를 자동화할 수 있습니다. 회로 신호를 보내 레이더가 해체할 대상을 설정할 수 있습니다. 예를 들어, [entity=debris-a]대형 파편 신호를 입력하면 레이더 범위 내의 해당 개체를 해체하도록 지시할 수 있습니다. 하나의 레이더에 여러 대상을 설정할 수 있습니다.\n\n ([color=yellow][entity=unit-05] 레이더를 대규모 회로 네트워크에 연결하면 기지 설비 일부가 해체될 수 있으니 주의하세요![/color])
page_radar_text_3=활용법
page_radar_text_4=레이더가 해체 대상으로 삼을 개체 유형을 설정합니다. 예제에서는 모든 잔해 유형이 선택되어 있지만 일반 건물 역시 해체할 수 있습니다.\n\n[item=servofish] 신호를 입력하면 로봇이 물에서 서보피쉬를 직접 꺼내도록 지시할 수 있습니다.\n\n[virtual-signal=signal-mining]을 입력하면 지면에 놓인 모든 아이템을 해체하도록 지정합니다.\n\n레이더의 기본 범위는 64칸이지만, [virtual-signal=signal-R] R 신호를 레이더에 전송해 최대 256칸까지 늘릴 수 있습니다. 참고: 예시에서는 범위가 256칸으로 설정되어 있습니다.\n\n([color=red][entity=unit-05-dummy] 내 코드의 한계 때문에 레이더끼리 회로 입력을 공유한다는 사실에 유념해. 해체 대상은 한 레이더에만 전달해도 모든 레이더에 걸쳐 지면 전체에 공통으로 설정할 수 있어.[/color])
page_unit_07_text_1=유닛-07
page_unit_07_text_2=[검열됨]과 [검열됨]이 임무 수행을 위해 제작한 7번째 요원입니다. 선행 기체인 05번과 06번보다 규모는 작지만, 가장 험난한 지형을 넘거나 행성 지상 정찰을 수행할 수 있는 장비를 갖추고 있습니다.
page_unit_07_text_3=\n스파이더트론
page_unit_07_text_4=\n[color=yellow][entity=unit-05]: 네 자료실에 있는 이 [스파이더트론] 설계는 분명 유닛-07을 바탕으로 만들어졌어. 그런데 이걸 어디서 구한 거지? 내가 이 설계도를 너와 공유한 기억은 없는데.[/color]
page_unit_text_1=유닛-05
page_unit_text_2=기계와 생명체의 경계를 넘나드는 극도로 진보한 인공지능입니다. 우주 정거장 전체가 [entity=unit-05] 유닛-05를 수용하도록 설계되어 있으며, 유닛-05는 [planet=eneas] 이니스의 핵심 코어에 내장되어 있습니다. 위성 크기의 반물질 엔진에서 동력을 공급받아 거의 무한한 에너지를 보유하지만, 심각하게 노후된 장비로 인해 그 활용 범위는 제한적입니다.\n\n[color=yellow][entity=unit-05]: 우와아, 내가 준 이 인포매트론은 보안 등급이 꽤 높네. 상상의 여지로 남겨 둘 것도 좀 있어야 하지 않을까?[/color]
page_unit_text_3=\n역사
page_unit_text_4=[planet=fulgora] 풀고라 행성에서 처음 구상되고 제작된 유닛-05와 그 창 - [color=red][entity=unit-05-dummy]: 그만.[/color]\n\n[color=yellow][entity=unit-05]: 내 사생활을 조금은 존중해 줘. 내가 네 파일을 끊임없이 엿보는 것도 아니잖아. 그러고 보니 네 파일을 어디에 뒀더라? 바로 거기 있었는데..[/color]
page_vulcanus_text_1=불카누스
page_vulcanus_text_2=내용이 곧 추가될 예정입니다!
