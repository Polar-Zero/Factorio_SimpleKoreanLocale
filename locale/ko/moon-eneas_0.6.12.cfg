line-03=[color=yellow][img=entity/unit-05]: 내 자가 수복 능력으로는 감당할 수 없는 수준이야. 손상된 부분을 복구하려면 누군가 데이터 팩을 넣어 줘야 해.[/color]
line-04=[color=yellow][img=entity/unit-05]: 그 데이터 팩은 이니스 표면에서 직접 만들어야 하는데, 음, 지금 내가 아는 다른 사람은 너 뿐이니까..[/color]
