[recipe-description]
disassemble-artifact=더 정밀하게 유물을 분해한 뒤, 복잡한 생산품을 추출합니다.
disassemble-artifact-advanced=더 정밀하게 유물을 분해한 뒤, 더 복잡한 생산품을 추출합니다.
filter-water-copper=돌을 여과 첨가물로 이용하면, 오염된 물을 정화하면서 귀중한 물질도 얻을 수 있습니다.
filter-water-iron=돌을 여과 첨가물로 이용하면, 오염된 물을 정화하면서 귀중한 물질도 얻을 수 있습니다.
purify-water-basic=석탄을 여과 첨가물로 이용하면, 오염된 물을 정화하면서 귀중한 물질도 얻을 수 있습니다.
salvage-artifact=유물에서 유용한 생산품을 추출할 수 있지만, 그 결과물은 매우 무작위적일 것입니다.
significant-data-artifact-epic=고대 유물 코어의 데이터를 추출합니다. 데이터를 기록한 카드는 일반적인 코어보다 엔지니어 기계를 더 오래 유지시킬 수 있습니다.\n\n[color=yellow][entity=unit-05]: 이 과정을 마치면 코어가 파괴됩니다.[/color]
