[entity-description]
auto-deconstruct-radar=훨씬 넓은 구역을 밝혀주는 고급 레이더입니다. 나우비스에서는 이 레이더로 [entity=debris-a] 잔해의 추락을 유도시킬 수 있습니다. 레이더를 여러 대 건설해 추가 잔해가 떨어질 확률을 점진적으로 높일 수 있지만, 설치할수록 효과는 점차 감소됩니다.\n\n레이더에서 회로 네트워크 신호를 입력받은 뒤 객체를 해체하도록 지시할 수 있습니다. 자세한 내용은 인포매트론 페이지를 참고하세요.
debris-a=나우비스 위성 중 하나에서 발생한 대형 외계 파편. 고대 기술의 흔적이 담겨 있습니다. 직접 회수하면 [color=yellow]더 귀중한 아이템[/color]을 얻을 수 있습니다.
debris-b=나우비스 위성 중 하나에서 발생한 중형 외계 파편. 고대 기술의 흔적이 담겨 있습니다. 직접 회수하면 [color=yellow]더 귀중한 아이템[/color]을 얻을 수 있습니다.
debris-c=나우비스 위성 중 하나에서 발생한 소형 외계 파편. 고대 기술의 흔적이 담겨 있습니다. 직접 회수하면 [color=yellow]더 귀중한 아이템[/color]을 얻을 수 있습니다.
eneas-generator=고대 기술을 기반으로 한 건물은 스스로 전력을 발전하도록 건설되었기에, 대규모 발전소가 필요하지 않습니다.\n\n[entity=unit-05] 유닛-05는 당신들이 도착할 것을 예상한 뒤 이 기본적인 에너지 인터페이스를 준비했습니다.
eneas-lift=이니스 지하 공장에서 지상으로 자원을 운반합니다. 주기당 생산량은 현재 이니스 공해 수준에 따라 달라집니다.\n\n[entity=eneas-lift] 리프트 관련 기술을 연구하면 생산량을 더욱 향상시킬 수 있습니다.\n\n[color=red][img=entity/unit-05-dummy] 경고: 리프트에 남겨진 모든 아이템은 다음 배송이 이루어지는 즉시 삭제됩니다 [/color]
eneas-vent=[planet=eneas] 이니스 표면 깊은 곳에는 거의 끝없을 정도로 많은 공해 물질이 갇혀 있습니다. 이 배출구는 때때로 유닛-05의 주의를 분산시키는 유독 가스를 내뿜습니다.\n\n배출구를 막거나 파괴해도 가스가 다른 경로로 올라오기에 도움이 되지 않을 것입니다.
gantry=[entity=gantry] 내부에 있는 객체 품질을 향상시킬 수 있습니다.\n\n객체를 향상하려면 먼저 갠트리 제작 인벤토리를 열고 목표로 할 품질을 선택하세요. 목표 품질은 차량의 품질보다 한 단계 높아야 합니다. 예를 들어 일반 품질 기관차를 고급 품질로 향상하려면 <고급> 제작법을 선택하세요.\n\n품질을 선택했다면 필요한 재료를 갠트리에 공급하면 됩니다. 향상 작업이 진행되는 중 차량을 이동하면 아이템이 낭비될 수 있습니다.
rotund-friend=[color=yellow][entity=unit-05]: 정말 귀여운 친구. 날아다닐 때 내는 소리가 정말 좋지. 네 설계를 바탕으로 효율을 조금 높여봤어. 잘 돌봐 줘![/color]
unit-05=[entity=unit-05] 유닛-05의 주 피질입니다. 잃어버린 메모리 아이템을 복원하려면 [item=ambition-science-pack] 메모리 팩이 필요합니다.\n[item=significant-data-card] 데이터 연료를 공급받아야 합니다.

