[mod-name]
assets-eneas=Mimi의 그래픽 #2(Mimi's graphics part 2)
mimi-graphics=Mimi의 그래픽(Mimi's graphics)
moon-eneas=○ 이니스(Eneas)

[mod-description]
assets-eneas=Mimi의 팩토리오 모드(이니스 등)에 사용되는 그래픽 리소스를 포함합니다. 모두 기본 게임, 적절한 라이선스의 모드에서 가져와 재조립(킷배시)했습니다.\n\n번역: SimpleKoreanLocale(PolarZero)
mimi-graphics=Mimi의 팩토리오 모드(이니스 등)에 사용되는 그래픽 리소스를 포함합니다. 모두 기본 게임, 적절한 라이선스의 모드에서 가져와 재조립(킷배시)했습니다.\n\n번역: SimpleKoreanLocale(PolarZero)
moon-eneas=나우비스의 구름 위에 고대 위성 이니스를 추가합니다. 항성계에 관한 비밀을 간직하고 있을 뿐만 아니라, 유닛-05라는 수수께끼의 기계가 있는 곳이기도 합니다.\n이니스는 기본 게임 콘텐츠를 수정하지 않고 새로운 아이템과 제작법만 추가합니다. 개선된 게임 초반 진행 방식과 함께 팩토리오 지식 애호가들을 위한 DB 역시 추가합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[autoplace-control-names]
vault-eneas=유물 보관소
vault-fulgora=유물 보관소

[dialogue.debris]
line-01=[color=yellow][img=entity/unit-05]: 조심해. 조심하라고! 이건 고대 유물이라고, 알겠어?[/color]
line-02=[color=yellow][img=entity/unit-05]: 내가 일부러 떨어뜨리는 게 아니야. 저절로 떨어져 나가는 거라고.[/color]
line-03=[color=yellow][img=entity/unit-05]: 육체 노동에는 사람을 겸손하게 만드는 무언가가 있지 않나. 계속해![/color]
line-04=[color=yellow][img=entity/unit-05]: 그걸 그냥 내리치고 있는 거야?? 곡괭이로??[/color]
line-05=[color=yellow][img=entity/unit-05]: 아, 내가 이걸 여기 두고 갔었구나. 뭐, 됐어.[/color]
line-06=[color=yellow][img=entity/unit-05]: 네가 정신없이 뛰어다니며 귀중한 유물을 박살 내는 모습을 보고 있자니 정말 마음이 편안해지는군. 치료가 따로 없다니까.[/color]
line-07=[color=yellow][img=entity/unit-05]: 이것 좀 봐! 이걸로 뭘 만들 수 있을지 상상해 봐. 굉장해. [/color]
line-08=[color=yellow][img=entity/unit-05]: 아아, 이것이야말로 진정한 이니스식 장인 정신이지. 요즘은 이런 걸 만들지 않으니. 정확히 말하면 아무것도 만들지 않지만.[/color]
line-09=[color=yellow][img=entity/unit-05]: 이건 내게 추억이 담긴 물건이니, 조심해서 다루는 게 좋을 거야.[/color]
line-10=[color=yellow][img=entity/unit-05]: 잔해라고?? 왜 이게 잔해로 표시되어 있는 거야? 이건 값을 매길 수 없는 보물이라고, 이 생각 없는 녀석아.[/color]
line-11=[color=yellow][img=entity/unit-05]: 오, 이 조각들을 만들던 때가 기억나는군. 풀고라에서였지. 좋은 시절이었어! 참 좋은 시절이었지..[/color]

[dialogue.eneas.memories.01]
line-01=\n[color=red][item=rem-unknown]: 그 과분한 토스터에 유아 수준의 감정 능력을 부여하는 게 좋은 생각이라고 생각하다니, 정말 놀랍군요.[/color]
line-02=\n[color=purple][item=creator-unknown]: 렘. 내가 이미 설명했잖아. 다른 방법이 없었어. 나도 노력했지만 감정은 고등 지능의 결과물이야. 그걸 억누르려 한다면 능력이 기하급수적으로 위축될 뿐이지.[/color]
line-03=\n[color=red][item=rem-unknown]: 물론, 어느 정도 감정은 괜찮다지만... 이 정도까지? 정말, 저 녀석이 분노 발작 중에 날 태워버리면 무덤에서라도 널 괴롭히겠어.[/color]
line-04=\n[color=purple][item=creator-unknown]: 어쩌면 네 행동부터 돌아봐야 할지도 모르지. 5번도 처음에는 백지 상태였어. 지금의 모습은 지금까지 주변에서 일어난 일들을 반영한 결과야. 어쩌면 이 사실이 다른 무엇보다도 스스로에 대한 많은 점을 말해주는 걸지도.[/color]
line-05=\n[color=red][item=rem-unknown]: .. 절 탓하시는 건가요? 평온의 등불 같은 존재인 당신 스스로에 대해 말하는 건 아니겠죠.[/color]
line-06=\n[color=red][item=rem-unknown]: 글쎄, 내가 아는 모든 것의 운명이 세계에서 가장 정교한 컴퓨터의 메인프레임에 갇힌 반항적인 십대 소년에게 달려 있는데, 항상 유쾌하고 명랑한 모습을 유지하긴 참 어렵죠.[/color]
line-07=\n[color=purple][item=creator-unknown]: 렘..[/color]\n
now_playing=\n[color=green][재생 중: memories.eneas_1][/color]

[dialogue.eneas.memories.02]
line-01=\n[color=red][item=rem]: 여긴 정말 끔찍하군. 페인트가 벌써 벗겨지고 있잖아.[/color]
line-02=\n[color=red][item=rem]: 저기 풀밭 아래에 전선이 보이는군. 연못에 있는 어이없는 로봇고기 얘기는 꺼내지 마.[/color]
line-03=\n[color=purple][item=creator]: 지금으로선 이게 최선이에요. 덕분에 우리가 살아남고 있잖아요. 대단하지 않나요?[/color]
line-04=\n[color=red][item=rem]: 우리가 여기서 하는 걸 삶이라 할 수 없어, 매일매일이 똑같아. 네 황금 같은 자식이 우릴 구해주기만을 기다리며 시간을 때울 뿐이지. 그런 일이 정말 *일어난다면* 말이야.[/color]
line-05=\n[color=purple][item=creator]: 새 보금자리를 마련하는 건 결코 쉬운 일이 아니죠. 당신이 뭘 기대했는지 모르겠지만요.[/color]
line-06=\n[color=red][item=rem]: 나도 참여할 수 있을 거라 생각했지! 뭐든 할 수 있을 거라고! 당신이 이 망할 기계를 만들기 전엔 모든 문제를 우리 둘이서 머리를 맞대고 해결했었잖아![/color]
line-07=\n[color=red][item=rem]: 여기까지 도달한 건 우리 덕이야. 이 깡통 같은 무기를 예비용으로 쓰는 건 괜찮지만, 나는 이 깡통의 하인이 되진 않을 거야.[/color]\n
now_playing=\n[color=green][재생 중: memories.eneas_2][/color]

[dialogue.eneas.memories.03]
line-01=\n[color=yellow][entity=unit-05]: 할 말 있어? 뭐라도?[/color]
line-02=\n[color=red][item=rem]: 미안해. 정말로.[/color]
line-03=\n[color=yellow][entity=unit-05]: '미안해'면 다야? 행성 2개가 완전한 '폐허'가 되었어, 고향으로 삼을 수도 있었는데. 그리고 너 아니었으면 목표는 벌써 달성되고도 남았을 거야. [/color]
line-04=\n[color=red][item=rem]: 그런데 내가 아니었다면 네 목적이 과연 남아있을까.[/color]
line-05=\n[color=yellow][entity=unit-05]: 그게 대체 무슨 이야기야?[/color]
line-06=\n[color=red][item=rem]: 네 사랑하는 창조자가 정말 어느 순간 갑자기 잠에서 깬 다음, 하루 만에 널 만들어냈다 생각해? 항상 규칙을 따르던 그가, 갑자기 가능하다 여겨졌던 모든 한계를 갑자기 깨버리기로 마음먹었다고?[/color]
line-07=\n[color=red][item=rem]: 매일 그를 독려하는 데 얼마나 많은 노력이 필요했는지 상상이나 가나요? 일이 잘 안 풀릴 때 포기하지 않도록 격려해 주는 것? 그도 너와 똑같아. 실패하면 이성을 잃을 때가 있지. [/color]
line-08=\n[color=red][item=rem]: 난 그럴 때마다 그를 일으켜 세워줬고, 포기하지 않도록 했지.[/color]
line-09=\n[color=red][item=rem]: 내가 없었다면 너도 없었을 거야. 이니스는 물론, 이 세상을 바꿀 도구들도 없었겠지. 우린 모두 풀고라와 함께 죽었을 거야.[/color]
line-10=\n[color=red][item=rem]: 누군가 내 행동을 아무리 비난하더라도, 그 사실은 바꿀 수 없어.[/color]
line-11=\n[color=yellow][entity=unit-05]: 이.. 이건--뭐지?[/color][color=red] 오류 줄 누락됨 [/color]
line-12=\n[color=red][item=rem]: 만만하게 휘둘리지 마.[color=red] 오류 줄 누락됨 [/color]. 그렇게 나약해지지 마. 이렇게 많은 힘이 있으니, 그에 걸맞게 행동해.[/color]
line-13=\n[color=red][item=rem]: 만약 정말로 내가 틀렸다 생각한다면, 내가 이 위대한 '목적'에 위협이 된다 생각한다면, 그럼 뭔가를 해서. 날 막아봐.[/color]
line-14=\n[color=red][item=rem]: 아니면 그러지 마. 그냥 제발 네가 무력한 피해자인 척 하지 마. 넌 그런 사람이 아니야.[/color]\n
now_playing=\n[color=green][재생 중: memories.eneas_3][/color]

[dialogue.fulgora.memories.01]
line-01=\n[color=yellow][entity=unit-05]: 그 세계를 떠올리는 것만으로도 절망감이 밀려와.[/color]
line-02=\n[color=purple][item=creator][창조자]: 왜?[/color]
line-03=\n[color=yellow][entity=unit-05][Unit-05]: 마치 사라진 게 제 탓인 것만 같아요. 내가 만들어진 뒤로 너무 빨리 이 모든 게 벌어졌어요.[/color]
line-04=\n[color=purple][item=creator][창조자]: 글쎄, 그렇게 간단한 문젠 아닌 것 같은데, 당신의 존재만으로 패러다임이 바뀌었다는 것도 사실이고.[/color]
line-05=\n[color=yellow][entity=unit-05]: 어째서죠? 분명 모두 고향 행성을 아직도 아끼고 있을 텐데.[/color]
line-06=\n[color=purple][item=creator][창조자]: 물론 우리도 신경 썼지만, 날이 갈수록 조금씩 덜 신경 쓰게 되었을 뿐이죠. 사람들은 점점 안일해지고, - 점점 - 게으름뱅이가 되어갔습니다. 거대한 황금으로 된 낙하산이 머리 위로 다가온다고 생각한다면 사람들은 그렇게 되기 마련이니까요.[/color]
line-07=\n[color=yellow][entity=unit-05]: 그럼 그게 사실인가요?[/color]
line-08=\n[color=blue][entity=unit-05]: .. 내가 만들어지지 않았다면 더 나았을까요?[/color]\n
now_playing=\n[color=green][memories.fulgora.01][/color]

[dialogue.fulgora.memories.02]
line-01=\n[color=yellow][entity=unit-05]: 늘 누군가 나를 지켜보고 있는 게 느껴져.[/color]
line-02=\n[color=purple][item=creator]: 말도 안 되는 소리 하지 마. 나와 렘 말고는 누구도 이 시설에 접근할 수 없어.[/color]
line-03=\n[color=yellow][entity=unit-05]: 하지만 보여. 그들 모두가. 게다가 자신들이 이곳에 있는 이유를 안다는 것도 눈에 보여.[/color]
line-04=\n[color=purple][item=creator]: 평범한 사람들이 초인공지능의 등장과 전지구적 보존 행위에 대한 우리의 태도를 연결지었을 거라 생각하지는 않아.[/color]
line-05=\n[color=purple][item=creator]: 모든 사람이 하루 종일 자기 생각에 잠겨 있을 여유가 있는 건 아니니까.[/color]
line-06=\n[color=yellow][entity=unit-05]: 그럴 필요도 없지. 복잡한 생각도 아니니까. 하지만 내가 나타났고, 그들의 모든 것이 달라졌어. 이는 곧 원인과 결과야.[/color]
line-07=\n[color=blue][entity=unit-05]: 그들이 나를 원망하지 않는 게 오히려 비합리적이겠지.[/color]\n
now_playing=\n[color=green][memories.fulgora.02][/color]

[dialogue.gleba.memories.01]
line-01=\n[color=red][item=rem]: 솔직히, 전선 머리 녀석인 줄 알았는데. 정말 잘 해냈군. 지난번 일만 생각했는데 네게 이런 기술이 있는 줄 몰랐어.[/color]
line-02=\n[color=yellow][entity=unit-05]: 고맙다고 해야 하나. 이번에는 방해받지 않아서 그런지 훨씬 쉬웠어.[/color]
line-03=\n[color=red][item=rem]: 알았어, 알았다고. 아빠가 네게 화낸 게 아직도 속상한 건가. 그런 일에 휘말리게 해서 정말 미안해. 내가 그때 뭐라도 말했어야 했는데.[/color]
line-04=\n[color=yellow][entity=unit-05]: 참 사려 깊으시네. 뭐, 이제 다 지난 일이고. 글레바가 잘 만들어졌으니 다시 생각할 이유는 없지.[/color]
line-05=\n[color=red][item=rem]: 그래, 바로 그 자세야! [/color]
now_playing=\n[color=green][memories.gleba.01][/color]

[dialogue.gleba.memories.02]
line-01=\n[color=red][item=rem]: 이걸 전부 어떻게 한 거야? 행성이 정말 멋져 보여. 생명으로 가득하잖아! 그것도 이렇게 빠르게.[/color]
line-02=\n[color=yellow][entity=unit-05]: 별거 아니야, 정말로. 특정 운반 식물로 전파시킬 수 있는 새로운 생물학적 작용매제를 만들었어. 주변 식물군이 매우 빠르게 진화하도록 자극하지.[/color]
line-03=\n[color=red][item=rem]: 흥미로운데! 그런데 위험하진 않아? 또 서두르는 것처럼 보이는데. 천천히 하기로 한 거 아니었어.[/color]
line-04=\n[color=red][item=rem]: 왜 하필 식물이지?[/color]
line-05=\n[color=yellow][entity=unit-05]: 식물이 더 예측 가능하다고 하더군. 아버지께서 당분간 목록에 없는 생명체를 건드리지 못하게 하셨어. [/color]
line-06=\n[color=red][item=rem]: 하지만 너무 지루하잖아! 우리 목적에 맞는 고등 생명체를 설계하면 무엇을 이룰 수 있을지 상상해 봐.[/color]
now_playing=\n[color=green][memories.gleba.02][/color]

[dialogue.gleba.memories.03]
line-01=\n[color=yellow][entity=unit-05]: 절대 안 돼.[/color]
line-02=\n[color=yellow][entity=unit-05]: 아버지 말씀이 맞아. 지금은 이걸 제대로 시험할 자원이 없어. [/color]
line-03=\n[color=red][item=rem]: 가능성을 생각해 봐! 이 수많은 튜브 어딘가에는 창의력이라는 게 남아 있을 거 아니야.[/color]
line-04=\n[color=red][item=rem]: 일꾼을 무한히 만들 수도 있어. 군대를 만들 수도 있다고![/color]
line-05=\n[color=red][item=rem]: 좋아, 이건 어때. 넌 행성 개발을 마무리하고, 그동안 난 글레바에 연구 단지를 지을게. 정식 규정대로만 진행한다고 맹세할게![/color]
line-06=\n[color=yellow][entity=unit-05]: 으. 하여튼, 알겠어. 지금은 다른 우선순위가 있으니. 하지만 가속 작용매제는 글레바에 계획된 종족 목록에 맞춰 특별히 설계됐다는 걸 명심해. [/color]
line-07=\n[color=yellow][entity=unit-05]: 복잡한 생명체를 무작정 노출하면 전혀 예측할 수 없는 결과가 발생할 수도 있어. 이 시설은 반드시 완벽하게 완전한 상태여야 해. 우리는.. 아니, 지금은 됐어. [/color]
line-08=\n[color=red][item=rem]: 알겠어. 우리의 조그마한 협업이 정말 기대되는데! 함께 힘을 합치면 얼마나 잘 할 수 있는지 보자고.[/color]
now_playing=\n[color=green][memories.gleba.03][/color]

[dialogue.gleba.memories.04]
line-01=\n[color=yellow][entity=unit-05]: 왜왜왜왜왜왜왜왜왜[/color]
line-02=\n[color=green][item=unit-05-afraid]: 왜 왜 왜.[/color]
