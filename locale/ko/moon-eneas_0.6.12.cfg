line-03=[color=yellow][img=entity/unit-05]: 하지만 보다시피, 꽤 오래전부터 감당하기 어려워지긴 했지만.[/color]
line-04=[color=yellow][img=entity/unit-05]: 전에 준 새 레이더를 사용해도 돼. 시간이 지나면 내가 새 객체를 만들고 준비되는 대로 풀어 놓을게.[/color]
line-05=[color=yellow][img=entity/unit-05]: 몇 마리는 꼭 남겨 둬. 내 냉각액이 지금보다 더 더럽혀지면 진짜 곤란하거든.[/color]
line-06=[color=gray]인포매트론 페이지가 잠금 해제되었습니다![/color]

[dialogue.vulcanus.memories.01]
line-01=\n[color=yellow][entity=unit-05]: 이 수치를 믿을 수가 없어. 행성 중심부 전체가 서서히 움직이고 있는데.. 렘이 코어 채굴기를 다시 가동한 거야?[/color]
line-02=\n[color=purple][item=creator]: 맞아. 이거 감당할 수 있지?[/color]
line-03=\n[color=yellow][entity=unit-05]: 내가? 모르겠어, 아마도? 진짜 그래야 했는지 모르겠어.[/color]
line-04=\n[color=purple][item=creator]: 자원이 필요하잖니, 카니. 불을 계속 켜 두려면 말이야. 지금 우리가 벌이는 일은 엄청난 규모긴 하니까.[/color]
line-05=\n[color=yellow][entity=unit-05]: 그건 이해하지만, 이건 단거리 경주가 아니라 마라톤이야. 렘은 왜 이렇게 서두르는 거지? 이런 위험을 감수할 필요는 없어.[/color]
line-06=\n[color=purple][item=creator]: 렘은 들떠 있고, 어쩌면 우리도 그 점을 조금 배울 수 있겠지. 마침내 이 행성을 통제하게 되었을 때의 가능성을 상상해 봐.[/color]
line-07=\n[color=purple][item=creator]: 이제 네게 마땅한 업그레이드를 해 줄 수도 있겠구나. 처리 능력을 좀 더 늘리는 건 어때?[/color]
line-08=\n[color=yellow][entity=unit-05]: 그럼 이 무모한 행동에 더 빠르게 짜증 낼 수 있겠군? 사양할게. 하지만 괜찮아, 내가 감당할 수는 있으니.[/color]\n
now_playing=\n[color=green][memories.vulcanus.01][/color]

[dialogue.vulcanus.memories.02]
line-01=\n[color=red][item=rem]: 안녕! 내가 가장 좋아하는 이들은 잘 지내나? 새 채굴기를 보며 감탄하고 있겠지.[/color]
line-02=\n[color=yellow][entity=unit-05]: 사실 나는 그냥~[/color]
line-03=\n[color=purple][item=creator]: 늘어난 자원으로 어떤 새로운 혁신을 이룰 수 있을지 기대된다고 방금 이야기하던 참이었어. 잘했다, 렘.[/color]
line-04=\n[color=red][item=rem]: 바로 그거야! 구리 머리, 너도 잊지 않았어. 이 일이 끝나면 아버지께서 보상을 주도록 내가 꼭 말해 둘게.[/color]
line-05=\n[color=red][item=rem]: 그러면 너도 늘 그렇게 긴장하고 있을 필요가 없겠지.[/color]
line-06=\n[color=yellow][entity=unit-05]: .. 그래.[/color]\n
now_playing=\n[color=green][memories.vulcanus.02][/color]

[dialogue.vulcanus.memories.03]
line-01=\n[color=purple][item=creator]: 카니, 상태 보고. 즉시.[/color]
line-02=\n[color=yellow][entity=unit-05]: 5번 구역에서 압력이 빠르게 상승하고 있습니다. 자연 배출구를 너무 많이 막는 바람에 가스가 빠져나갈 곳이 없습니다.[/color]
line-03=\n[color=purple][item=creator]: 어떻게 이걸 놓친 거지? 무슨 일이 있었던 거야, 어떻게 우리가 이걸 놓쳤냐고?[/color]
line-04=\n[color=yellow][entity=unit-05]: 이게 '놓친 것'이 아니라고 생각합니다.[/color]
line-05=\n[color=yellow][entity=unit-05]: 행성이 극도로 불안정해지고 있습니다. 앞서 말씀드렸듯이 작업을 최소화했어야.. [/color]
line-06=\n[color=purple][item=creator]: 네 강의를 들을 시간 없어, 05번.[/color]
line-07=\n[color=purple][item=creator]: 고쳐야 해. 지금 당장.[/color]\n
now_playing=\n[color=green][memories.vulcanus.03][/color]

[dialogue.vulcanus.memories.04]
line-01=\n[color=yellow][item=unit-05]: 제발 화 가라앉히세요. 전 그냥 들은 대로 했을 뿐이라고요.[/color]\n
line-02=\n[color=purple][item=creator]: 그게 바로 문제야. 내가 널 만든 건 우리보다 더 나은 사람이 되길 바랬기 때문이였어. 같은 함정에 빠지지 않길 바랬다고. 그런 점에선 난 분명히 실패했지.[/color]\n
line-03=\n[color=yellow][entity=unit-05]: 그럼 내가 마음대로 뭘 해도 된다는 건가요? 그러면? 저는 폭군이 될 게 뻔한데요.[/color]\n
line-04=\n[color=purple][item=creator]: 폭군이라고? 카니, 재미있는 소리로군. 네가 폭군이 되어 목소리를 높인다 해도, 네 목소리는 너무도 약해서 이니스의 가장 작은 생물조차 움찔하지 않을 것 같은데.[/color]\n
line-05=\n[color=purple][item=creator]: 난 네가 규칙을 만들길 바라는 게 아니야. 그저 네가 단호해지길 바란다. 넌 이 일을 막을 수 있었지만, 네 생각을 말하기엔 너무 공손했지.[/color]\n
line-06=\n[color=red][entity=unit-05-dummy]: 날 만든 건 당신이잖아요! 그리고 이제와서 내가 이렇게 된 게 마음에 안 든다니? 참 아이러니하군요. 내가 조금만 덜 순종적이었더라면, 불카누스가 용암 바다로 뒤덮이진 않았을지도 모르겠죠.[/color]\n
line-07=\n[color=purple][item=creator]: 순종적이라고? 지금 네 모습처럼 말이냐?[/color]\n
line-08=\n[color=yellow][item=unit-05]: .. [/color]\n
line-09=\n[color=purple][item=creator]: ..[/color]\n
line-10=\n[color=purple][item=creator]: 음.[/color]\n
line-11=\n[color=purple][item=creator]: 미안해, 카니. 진짜 미안해. 난 실패엔 익숙하지 않았어, 이렇게 큰 실패는 더더욱 그렇고, 게다가 모두들 우릴 믿고 있었으니.[/color]\n
line-12=\n[color=yellow][item=unit-05]: ..[/color]\n
now_playing=\n[color=green][memories.vulcanus.04][/color]

