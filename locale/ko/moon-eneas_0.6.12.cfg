line-03=[color=yellow][img=entity/unit-05]: 정말 낭비네! 내가 좋은 방법을 알려 줄게, 작은 친구여.[/color]

[dialogue.tech.upgrade-tech-basic]
line-01=[color=green][신호 수신 중][/color]
line-02=[color=yellow][img=entity/unit-05]: 방금 굉장한 생각이 났어! 네가 공장을 짓는 방식을 지켜봤는데.. 꽤 흥미롭더군. [/color]
line-03=[color=red][img=entity/unit-05-dummy]: 흥미로울 정도로 비효율적이야! 고쳐야겠어.[/color]
line-04=[color=yellow][img=entity/unit-05]: 필요한 건 모두 유물 안에 저장되어 있어. 이런 식으로 구조물에 적용하면 돼. [/color]
line-05=[color=gray] 새로운 업그레이드 제작법이 잠금 해제되었습니다. 유물 탭에서 확인할 수 있습니다. [/color]

[dialogue.tech.water-advanced]
