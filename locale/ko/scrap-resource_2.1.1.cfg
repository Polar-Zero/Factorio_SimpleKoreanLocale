[mod-name]
scrap-resource=고철 자원(Scrap Resource)

[mod-description]
scrap-resource=고철 자원을 게임에 추가합니다. 채광한 뒤 처리하고 다른 제품으로 변환할 수 있습니다.


[autoplace-control-names]
scrap=__ENTITY__scrap__

[entity-name]
scrap=고철

[item-name]
scrap=고철

[recipe-name]
scrap-recycling=고철 재활용

[mod-setting-name]
sr_scrap_recycling=고철 재활용 활성화
sr_scrap_main_resource=고철을 주 자원에 추가

[mod-setting-description]
sr_scrap_recycling=활성화하면, 고철 채광시 '고철' 아이템이 나오며, 이를 재활용/제련하여 하위 구성 요소로 만들어야 합니다.
sr_scrap_main_resource=활성화하면, 고철이 (희귀한 2차 자원이 아닌) 일반 철광석과 동일한 자동 배치 빈도 및 풍족도로 배치되고, 시작 지점 근처에 자원 지역을 반드시 생성하도록 합니다. 이 설정은 다른 기본 자원 없이 (철, 구리, 석탄, 우라늄, 원유) 고철만 활성화하는 지도에서 사용하는 것을 의도되었습니다.