[mod-name]
rabbasca-underground=○ 라바스카 지하(○ Rabbasca underground)

[mod-description]
rabbasca-underground=라바스카 행성에서의 아퀼로 이후 컨텐츠를 확장합니다. 라바스카의 워프 기술을 활용하여 다양한 행성의 핵 사이를 이동하는 워프장 안정장치와 상호작용해 워프장을 안정화하세요. 다만 지표면 깊은 곳에서는 우주 플랫폼과 직접 상호작용할 수 없습니다. 건물을 워프시켜 들여오거나 내보낼 수는 있지만, 자재는 행성 내에서 직접 조달해야 하며, 환경이 끊임없이 변화하기 때문에 이는 생각만큼 쉽지 않을 수 있습니다.\n\n번역: SimpleKoreanLocale(PolarZero)


