[tips-and-tricks-item-description]
rabbasca-manifest-anomaly=[entity=rabbasca-warp-stabilizer]는 [entity=rabbasca-warp-anomaly]를 제거하기 위해 여러 장소 사이를 이동합니다. 각 장소마다 새로운 이상 현상들을 발견할 수 있습니다.\n\n장소가 바뀔 때, 이상 현상이 새로운 장소에 맞는 고유 자원으로 변할 가능성이 있습니다. 이 확률은 이상 현상에 남아 있는 자원량과 현재 위치의 안정도에 따라 달라집니다.\n\n[item=rabbasca-warp-anomaly]를 줄일수록 안정도가 높아지지만, 새로운 자원을 효율적으로 확보하려면 적절한 균형을 찾는 것이 중요합니다.\n\n또는 [recipe=rabbasca-amplify-anomaly]를 사용하여 자원을 생성할 수도 있습니다. 각 제작마다 제작 기계의 위치에 있는 가상 [item=rabbasca-warp-anomaly]의 양이 1씩 증가합니다. 변환 확률은 [item=rabbasca-warp-anomaly]와 동일한 방식으로 결정되지만, 이 제작은 안정화 진행도에 영향을 미치지 않으므로 안정화도가 100%일 때도 변환 확률은 항상 최대치로 유지됩니다.\n\n[color=yellow]예[/color]: [entity=rabbasca-warp-stabilizer]가 [planet=fulgora]로 워프 중이며, 그곳에서는 [entity=rabbasca-holmium-ore]이 기본 확률 [color=green]6%[/color]로 생성될 수 있습니다. 안정화 진행률은 [color=yellow]75%[/color]라고 가정합니다.\n 1) 이 이상 현상에서 채굴해야 할 자원은 [color=cyan]69[/color] [item=rabbasca-warp-anomaly]만큼 남았습니다.\n워프가 완료된 뒤, 해당 이상 현상이 [entity=rabbasca-holmium-ore] 광맥으로 변할 확률은 [color=green]0.06[/color] * [color=cyan]69[/color] * [color=yellow]0.75[/color] = 310.5% (확정)\n또한 해당 광맥의 자원량은 기본 수량에 [color=cyan]69[/color] * [color=yellow]0.75[/color]를 곱한 값이 됩니다.\n 2) [entity=rabbasca-warp-pylon]이 해당 위치에서 [color=cyan]14[/color]번 [recipe=rabbasca-amplify-anomaly]를 제작했습니다.\n 워프가 완료된 후, 해당 위치에 [entity=rabbasca-holmium-ore] 광맥이 생성될 확률은 [color=green]0.06[/color] * [color=cyan]14[/color] * [color=yellow]0.75[/color] = 63%가 됩니다. 광맥이 생성될 경우 자원량은 기본 수량에 [color=cyan]14[/color] * [color=yellow]0.75[/color]를 곱한 값이 됩니다.
rabbasca-underground-automation=[entity=rabbasca-warp-stabilizer]는 주변 환경과 안정화 진행 상황에 대한 데이터를 [entity=constant-combinator], 물류 상자 등을 통해 접근 가능한 물류 그룹으로 전송합니다.\n기본적으로 "[item=rabbasca-warp-trace] 워프장 안정장치 측정값" 이름으로 지정되며, 이를 통해 현재 지하 상태나 바닥이 완전히 안정화되어 안정적인 워프가 가능한지 등을 확인한 뒤 상세한 자동화 공정을 구현할 수 있습니다.\n\n내보내지는 신호 목록:\n- [임의의 행성 신호] = 현재 방문 중인 행성. 숫자는 안정화 진행률을 백분율로 나타냅니다.\n- [entity=rabbasca-warp-anomaly] = 채굴해야 할 이상 현상이 몇 개 남았는지 (이 값이 0일 경우 안정화 진행률이 100%임을 의미함)\n- [entity=rabbasca-stability-pylon] = 현재 [tile=rabbasca-underground-rubble-powered]를 제공하지 않는 안정성 첨탑 수\n- [item=rabbasca-warp-trace] = 안정장치의 연료 버퍼 충전량 (% 단위)\n- [item=rabbasca-powerspike] = 이 안정장치가 생성한 [item=rabbasca-powerspike] 개수\n- [item=rabbasca-progress-powerspike] = 다음 [item=rabbasca-powerspike] 생성까지 남은 진행률\n- [recipe=rabbasca-hunt-relicaries] = 다음 워프 시 [entity=rabbasca-relicary]를 발견할 확률 (% 단위) [탐지가 성공했을 때만 감소]\n- [recipe=rabbasca-hunt-anomalies] = 다음 워프 시 [entity=rabbasca-warp-anomaly]의 평균 자원 획득량 (% 단위) [워프 후 100%로 재설정]
rabbasca-underground-briefing=라바스카 보존소에는 워프 기술 실현에 도움이 되는 [space-location=rabbasca-underground]와 관련된 정보가 담겨 있습니다. [entity=rabbasca-warp-stabilizer]는 [entity=rabbasca-warp-anomaly]를 제거하기 위해 자주 위치를 바꿉니다. 따라서 해당 장소를 직접 방문할 수는 없으며 우주 플랫폼을 통한 보급도 불가능하지만, [recipe=rabbasca-locate-stabilizer]로 위치를 파악했다면 [entity=rabbasca-warp-pylon]을 이용해 원격으로 관리할 수 있게 됩니다.\n\n안정장치가 위치를 변경할 때마다 외부에 있는 모든 것들은 버려지게 되므로, (예외: 부분적으로 노출된 [entity=offshore-pump]) 공장 건설 시 [tile=rabbasca-underground-rubble-powered] 바닥재 위에 있는지 확인해야 합니다.\n또한 이 바닥재는 [item=harene-ears-core]가 장착된 기계를 설치하기에도 적합하므로, 발전에 필요한 자원을 확보할 때까지의 공백을 메울 수 있습니다. 추가 연구 없이 채광 가능한 자원은 안전 지역 밖에서만 얻을 수 있으므로, 채광 전초 기지를 적극적으로 관리해야 합니다.\n위치마다 대기 성분이 다르며, 이를 활용하면 무한한 양의 기체와 유체를 얻을 수 있습니다. 성분은 위치한 행성에 따라 [technology=rabbasca-stabilizer-on-aquilo]와 같은 특수 기술로 표시됩니다.\n\n안정장치는 이미 심하게 노후화되어 있으므로, 고립되지 않으려면 적극적인 유지보수가 필요합니다. [item=rabbasca-powerspike] 해금을 진행하면 안정장치의 예전 잠재력에 가까워질 수 있으며, 이후 [item=rabbasca-warpfield-science-pack]을 생산하는 완전 자동화된 지하 공장을 가동할 수 있게 됩니다.\n그럼에도 불구하고 고립되었다면 [recipe=rabbasca-abandon-stabilizer]로 현재 안정장치를 포기할 수 있으며, 이후 새로운 안정장치를 찾아 다시 시작할 수 있습니다. 다만 그 전에 공장을 안전한 곳으로 워프시킬 필요성이 있습니다.
rabbasca-upgrade-placements=[entity=rabbasca-collector-pylon]와 [entity=rabbasca-stability-pylon]은 일반 구조물과 동일한 방식으로 배치할 수 있습니다. 하지만 배치된 후에는 회수할 수 없습니다. (이동은 가능)\n[entity=rabbasca-collector-pylon]에 채굴할 자원이 더 이상 없을 경우 자동으로 다른 [entity=rabbasca-warp-anomaly]으로 이동합니다.\n[entity=rabbasca-stability-pylon]는 [recipe=rabbasca-relocate-floorthing] 제작을 완료한 뒤 [entity=entity-ghost] 형태로 되돌아갑니다.\n\n두 구조물 모두 [virtual-signal=rabbasca-warp-inventory]로 보낼 수 있지만, [entity=rabbasca-warp-stabilizer]이 파괴되면 함께 제거되므로 새로운 안정장치에서 재사용할 수는 없습니다.

