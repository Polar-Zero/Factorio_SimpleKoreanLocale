panel-progress-spike=__2__ [item=rabbasca-progress-powerspike] 내부에서 전력 급증 __1__ 발생
panel-progress-tooltip=안정도는 해당 위치에서 [item=rabbasca-warp-anomaly]가 몇 개 회수(채광)되었는지를 나타냅니다. 100%는 생성된 __1__개의 [item=rabbasca-warp-anomaly]가 모두 회수되었음을 의미합니다. 현재 안정도와 회수해야 하는 남은 [item=rabbasca-warp-anomaly] 수량이 물류 그룹으로 내보내지며, [entity=constant-combinator] 등을 통해 확인할 수 있습니다.
panel-setting-radius=안정장치를 중심으로 주변에 [tile=rabbasca-underground-rubble-powered]을 생성할 범위입니다. 최소값을 초과한 4 값마다 [item=rabbasca-warp-cell] 유지비가 __1__/분 증가됩니다.\n이 설정은 새로운 위치로 워프한 후에 적용됩니다.
rabbasca-relicary-fuel-category=접근 시간
sanity-notice-0=[color=#a317d8][img=item.rabbasca-sanity-loss] [item=rabbasca-obscure-theories]을 너무 많이 공부하다 보니 머리가 조금 아프군.[/color]
sanity-notice-1=[color=#a317d8][img=item.rabbasca-sanity-loss] 그림자 속에 무언가가 숨어 있는데, 그것 때문에 무척 불편한 기분이 드는군...[/color]
sanity-notice-10=[color=#a317d8][img=item.rabbasca-sanity-loss] ...[img=entity.rabbasca-small-insanity-crawler][img=entity.rabbasca-small-insanity-crawler]....[img=entity.rabbasca-small-insanity-wriggler][img=entity.character]....[img=entity.character][img=entity.rabbasca-small-insanity-crawler].... [/color]
sanity-notice-2=[color=#a317d8][img=item.rabbasca-sanity-loss] 이 모든 워프 기술을 연구한다니... 말이 안 되는데... 그런데 왠지 모르게 효과가 있는 것 같은데?[/color]
sanity-notice-3=[color=#a317d8][img=item.rabbasca-sanity-loss] 당신은 머리를 벽에 세게 부딪친다. 하지만 그들은 실재하지 않았다. 말이 되지 않는다.[/color]
sanity-notice-4=[color=#a317d8][img=item.rabbasca-sanity-loss] 반복의 힘 때문일까, 아니면 머릿속에서 뭔가 딱 맞아떨어진 걸까? "[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]"... 이 글을 쓴 사람이 뭔가 알아챈 건 아닐까? [/color]
