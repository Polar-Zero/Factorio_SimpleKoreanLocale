sanity-notice-6=[color=#a317d8][img=item.rabbasca-sanity-loss] 지금 확인해보세요. [img=fluid.beta-carotene]의 힘. 곧 기묘한 아이디어의 폭발로 인해 머릿속이 텅 비었습니다.[/color]
sanity-notice-7=[color=#a317d8][img=item.rabbasca-sanity-loss] [img=entity.rabbasca-small-insanity-wriggler][img=entity.rabbasca-small-insanity-wriggler] 그... 힘...[/color]
