[recipe-description]
rabbasca-abandon-stabilizer=이 안정장치를 포기합니다. 안정장치의 연료가 바닥난 경우, 이것이 마지막 선택지가 될 수도 있습니다. [entity=rabbasca-vault-crafter]에서 나중에 새로운 안정장치를 발견할 수 있습니다.\n[color=red][img=virtual-signal.signal-alert] 안정장치 주변의 모든 것은 파괴될 것이며, 여러분의 공장도 예외가 아닙니다![/color]\n[color=#33aaff][img=virtual-signal.signal-info][entity=rabbasca-warp-stabilizer]에 연료가 없어도 이 제작법은 사용할 수 있습니다[/color]
rabbasca-amplify-anomaly=기계가 위치한 지역을 불안정하게 만들어, 기계 아래에 자원 지대가 생성될 확률을 증가시킵니다. ([tip=rabbasca-manifest-anomaly] 참조) 이 작업을 통해 [tile=rabbasca-underground-rubble-powered]에 자원을 생성하고 영구적인 채광 거점을 마련할 수 있습니다.
rabbasca-anomaly-extractor=[entity=rabbasca-anomaly-extractor]을 재시작하고, [entity=rabbasca-warp-stabilizer]에 연료를 공급하기 위해 [item=rabbasca-warp-anomaly]를 지속적으로 수집합니다. 안정장치가 일시 중지되었더라도 계속 작동합니다.
rabbasca-embrace-insanity=이거 꽤 위로가 되는 것 같지 않나요...?
rabbasca-floor-stability-work=체력 손실을 방지합니다
rabbasca-hunt-anomalies=다음 워프에서 [entity=rabbasca-warp-anomaly] 자원 생산량을 3% 증가시킵니다. 워프가 완료되면 생산량은 100%로 초기화됩니다. 다음 워프의 생산량을 확인하려면 [entity=rabbasca-warp-stabilizer] 또는 연결된 [entity=constant-combinator]의 신호값을 확인하세요.
rabbasca-hunt-relicaries=향후 워프에서 [entity=rabbasca-relicary]를 발견할 확률을 0.4% 증가시킵니다. 이 확률은 여러 워프 사이에도 유지되지만, [entity=rabbasca-relicary]를 한 번 발견하면 초기화됩니다. 현재 확률을 확인하려면 [entity=rabbasca-warp-stabilizer] 또는 연결된 [entity=constant-combinator]의 신호값을 확인하세요.
rabbasca-locate-stabilizer=금고에서 [space-location=rabbasca-underground]를 찾고 [entity=rabbasca-warp-pylon]을 배치하도록 지시합니다. 여러 번 시도해야 할 수도 있지만, 찾지 못했을 경우 워프 첨탑은 되돌려받을 수 있습니다.\n현재 발견된 안정장치가 있는 경우, 성공 시 그 옆에 [entity=rabbasca-warp-pylon]를 하나 더 배치합니다.\n[color=#33aaff][img=virtual-signal.signal-info]이 제작법이 성공하면 자동으로 선택 해제됩니다.[/color]
rabbasca-plastic-from-petroleum-gas=극한 조건에서 [item=coal] 없이도 플라스틱을 제작할 수 있도록 합니다.
rabbasca-powershard=[item=rabbasca-powerspike]의 능력을 일시적으로 약화시켜 [entity=rabbasca-relicary]를 위한 추가 연료를 확보합니다.
rabbasca-relocate-floorthing=[entity=rabbasca-stability-pylon]은 회수할 수 없지만, 이 제작법을 완성하는 것으로 [virtual-signal=signal-ghost][entity=rabbasca-stability-pylon]로 위치를 옮기도록 할 수 있습니다.
rabbasca-stabilizer-recharge=이 제작법이 진행되는 동안, [item=rabbasca-warp-cell-recharging]와 [item=rabbasca-warp-cell]이 모두 안정장치 연료 인벤토리로 이동됩니다.\n\n[color=#33aaff][img=virtual-signal.signal-info]이 제작법의 영향을 받지 않은 전지는 __CONTROL__open-item__[/color]로 열고 다시 등록해야 합니다.
rabbasca-stabilizer-warp-sequence=다음 위치로 순간이동하며, [color=yellow][tile=rabbasca-underground-rubble-powered][/color] 위에 배치되지 않은 모든 것을 남겨둡니다. 남아 있는 이상 현상은 자원으로 변할 가능성이 있습니다. 워프 중에는 [item=rabbasca-warp-trace]의 정지 보존 효과가 중단됩니다.\n[color=#33aaff][img=virtual-signal.signal-info][entity=rabbasca-warp-stabilizer]이 [tile=rabbasca-underground-rubble-powered][/color]로 완전히 덮여 있지 않으면 이 제작법이 진행되지 않습니다.\n[color=#33aaff][img=virtual-signal.signal-info][entity=rabbasca-warp-stabilizer] 제어판에서 '자동 조종'이 활성화되어 있으면, 안정화도가 100%에 도달하는 즉시 이 제작법이 자동으로 진행됩니다.[/color]
rabbasca-summon-ufo=도움이 필요한 상황일 경우 [entity=rabbasca-ufo] 함대에 연락하세요. 모든 [entity=rabbasca-ufo]가 지점 주변으로 워프하려고 시도할 것입니다. 워프 대상의 인벤토리는 비어 있어야 하며, 연료의 50%가 소모됩니다.
rabbasca-underground=[entity=rabbasca-warp-stabilizer]을 찾고 라바스카 워프 기술의 비밀을 밝혀내세요.
rabbasca-warp-cell=[color=#33aaff][img=virtual-signal.signal-info]이 제작법은 [entity=rabbasca-warp-stabilizer]에서 제작할 때 연료를 소모하지 않습니다.[/color]\n[color=#33aaff][img=virtual-signal.signal-info][entity=rabbasca-warp-stabilizer]의 제어판에서 '연료 합성'이 활성화되어 있으면, 연료가 떨어졌을 때 자동으로 이 제작법이 진행됩니다.[/color]
rabbasca-warp-cell-recharging=[color=#33aaff][img=virtual-signal.signal-info]제작 결과물은 [entity=rabbasca-warp-stabilizer] 전지 보관소[/color]에 바로 저장됩니다.
rabbasca-warpfield-science-pack-wi-download=이 금고에서 선택한 품질의 [item=rabbasca-warpfield-science-pack] 아이템을 최대 100개까지 추출합니다. 이전에 [recipe=rabbasca-warpfield-science-pack-wi-upload]를 통해 업로드한 수량만큼만 가져올 수 있습니다.
rabbasca-warpfield-science-pack-wi-upload=[entity=rabbasca-vault-crafter] 네트워크에 입력 아이템을 업로드합니다. 업로드한 아이템은 이후 [recipe=rabbasca-warpfield-science-pack-wi-download]를 통해 가져올 수 있습니다. 한 번에 최소 10개 이상 입력해야 하며, 최대 100개까지 업로드할 수 있습니다.

