[technology-description]
rabbasca-anomaly-studies-floor=[tile=rabbasca-underground-rubble-powered] 위에 자원을 생성할 수 있으므로, 각 워프 후 재확장은 필수 사항이 아닙니다.
rabbasca-archives=[entity=rabbasca-relicary]를 찾고 남겨진 지식을 확인하세요. 어쩌면 그 지식이 도움이 될지도 모릅니다.
rabbasca-insanity=혼돈에 싸인 지식이 당신의 멘탈에 타격을 주었습니다. 당신은 실재하지 않는다는 것을 알지만 이상한 것들이 보이기 시작합니다. 아니면, 이것들이 정말로 실재하지 않을까요? 어쩌면 이 상황을 유리하게 활용할 수도 있을지 모릅니다...
rabbasca-knowledge-efficiency=어떤 규칙이 보이기 시작합니다. 어느 정도는 말이 되네요... 맞는 것 같은데. 잠깐... 방금 그 소리 들으셨나요?\n\n([recipe=rabbasca-restored-knowledge]은 최대 생산성 제한이 매우 높습니다)
rabbasca-supercharged-module=[item=rabbasca-powerspike]를 사용해 엄청나게 강력한 모듈을 만들어 보세요.
rabbasca-ufo=[entity=rabbasca-ufo] 함대를 편성하고, 어디서든 전장으로 워프시켜 전투에 투입하세요.
rabbasca-underground=고대 [entity=rabbasca-warp-stabilizer]을 찾아내고, 그 안정화 능력을 회복시키고 이를 활용하여 라바스카 기술에 대해 더 깊이 알아내보세요.
rabbasca-warp-trace-productivity=이상 현상에 대한 변환 공정을 개선해보세요. 생산성은 제작법의 모든 산출물에 영향을 줍니다.

