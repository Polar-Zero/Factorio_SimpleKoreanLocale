[item-description]
rabbasca-obscure-theories=혼란스럽고 뒤죽박죽 섞인 정보의 난장판. 방정식들이 사방에 마구 적혀 있는데, 그중 한 방정식이 끊임없이 반복됩니다: "[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!", "[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!", "[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!!!"...\n엔지니어는 믿을 수 없다는 듯이 멍하니 바라보며, 이 모든 게 대체 무슨 뜻인지, 아니면 자신이 서서히 미쳐가는 건지 헷갈려합니다..
rabbasca-powerspike=[entity=rabbasca-warp-stabilizer]의 업그레이드에 사용할 수 있는 장치입니다. [recipe=rabbasca-warp-trace] 제작 부산물로 생성됩니다. 전력 급증이 생성될 때마다 더 긴 제작 시간이 필요합니다.
rabbasca-powerspike-weak=완전히 복구되기 전에는 사용할 수 없습니다.
rabbasca-restored-knowledge=잠시 동안 모든 것을 이해할 수 있게 되었다. 하지만 곧 그 모든 것이 사라져 버린다. 이런 주제들에 대해 더 깊이 파고들면 안 될 것 같은 기분이 든다...
rabbasca-sanity-loss="정말 유익한 통찰이군요. 어떤 문제가 발생할 수 있을까요?"
rabbasca-sanity-mote=[entity=character]의 인벤토리에서 부패를 진행시키면, [item=rabbasca-tinfoil-hat]를 착용하고 있지 않은 경우, 일부 [item=rabbasca-sanity-loss]이 취소됩니다.\n\n광기와 전투를 통해 획득합니다.
rabbasca-warp-cell=연결된 기계에 지속적으로 전력을 공급합니다. 발전량은 연료 신선도에 비례하며, 신선도가 완전히 소진되면 연결은 끊어지고 내부 전지가 [item=rabbasca-warp-cell-recharging]로 되돌아갑니다.\n\n신선도의 절반을 소모해 언제든지 다시 연결할 수 있습니다. 신선도는 [entity=rabbasca-warp-stabilizer]의 연료를 사용해 복구시킬 수 있습니다.
rabbasca-warp-cell-recharging=기계와 연결시켜 [item=rabbasca-warp-cell]를 재충전할 수 있습니다. 이때 [entity=rabbasca-warp-stabilizer]의 연료가 일부 사용되지만, 충전량이(신선도) 5% 회복됩니다. 충전량을 유지하려면 [entity=rabbasca-warp-stabilizer]에 보관하세요.
rabbasca-warp-trace=국소 워프장의 존재를 암시하는 미약한 신호가 감지되었습니다. [entity=rabbasca-warp-stabilizer]을 최대 1묶음까지 정지 상태로 유지시킬 수 있으며, 안정장치는 이 신호를 자동으로 사용하여 내부의 [item=rabbasca-warp-cell]을 재충전할 것입니다.

