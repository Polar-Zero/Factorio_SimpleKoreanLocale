[entity-description]
rabbasca-anomaly-extractor=[entity=rabbasca-warp-stabilizer]에 동력을 공급하는 엔진입니다. [entity=rabbasca-warp-anomaly]를 지속적으로 소모해 스스로 연료를 공급합니다.\n\n[img=virtual-signal.signal-alert] [technology=rabbasca-warp-stabilizer]에 의해 일단 가동되면 멈출 수 없습니다.\n[item=rabbasca-warp-anomaly]를 너무 많이 낭비하면 연료 부족이 발생하게 되며, 안정장치가 새로운 위치로 워프할 수 없게 될 가능성이 존재합니다.
rabbasca-anomaly-storage=[entity=rabbasca-collector-pylon]에서 추출된 [item=rabbasca-warp-anomaly]를 저장합니다.
rabbasca-collector-pylon=여러 [entity=rabbasca-warp-anomaly]를 자동으로 이동하며 수리하고, 추출된 [item=rabbasca-warp-anomaly]을 [entity=rabbasca-anomaly-storage]에 저장합니다.
rabbasca-relicary=강력한 기술을 해금하는 데 도움이 되는 설계도가 들어 있는 숨겨진 보물창고입니다. [item=rabbasca-powershard]을 사용해 상당한 양의 설계도를 얻을 수 있습니다. 발견하려면 [recipe=rabbasca-hunt-relicaries]로 위치를 탐색할 필요가 있습니다.
rabbasca-relicary-remote=가장 가까운 [entity=rabbasca-relicary]와 연결하여, [tile=rabbasca-underground-rubble-powered]의 안전 지대에서 벗어나지 않고도 유물을 수집하는 데 유용합니다.
rabbasca-remote-access-chest=[개발 진행 중] 주변 상자나 기계 인벤토리에 접근할 수 있도록 합니다.
rabbasca-stability-pylon=[tile=rabbasca-underground-rubble-powered] 바닥재를 유지하고, 다른 위치로 워프할 수 있는 구역을 확장합니다. 작동에 [item=rabbasca-warp-cell]이 필요합니다.\n제작이 중단될 경우 체력이 1 남을 때까지 점차 감소하게 되며, 체력이 10 미만이 되면 유지에 실패하고 바닥이 [tile=rabbasca-underground-rubble]로 변하게 되어 버릴 것입니다. \n\n[color=red][img=virtual-signal.signal-alert][tile=rabbasca-underground-rubble-powered] 바닥재로 완전히 덮여 있지 않은 모든 구조물은 워프 시 파괴됩니다! 여기에는 [entity=rabbasca-warp-stabilizer]과 [entity=rabbasca-stability-pylon] 자체도 포함됩니다![/color]
rabbasca-warp-anomaly=채광하여 회수해 워프장의 안정화에 기여하세요.\n[entity=rabbasca-warp-stabilizer]의 위치가 변경될 때, 각 이상 현상은 새로운 위치에서 일시적인 고유 자원으로 변할 가능성이 약간 존재합니다.([tip=rabbasca-manifest-anomaly] 참조)\n이상 현상은 [tile=rabbasca-underground-rubble-powered] 위에는 절대 생성되지 않습니다.
rabbasca-warp-stabilizer=[entity=rabbasca-warp-anomaly]를 능동적으로 탐색하고 제거한 뒤 [item=rabbasca-warp-cell] 연료로 변환하는, 진정한 라바스카 공학의 경이입니다.\n이 장비는 다양한 행성의 핵 근처에서 작동하며, 극한 환경으로부터 여러분의 지하 공장을 보호해 줄 것입니다.

[equipment-name]
rabbasca-tinfoil-hat=알루미늄 호일 모자

[equipment-description]
rabbasca-tinfoil-hat=광적인 기어다니는 자들을 물리치는 데 도움이 되는 모자입니다. [item=rabbasca-sanity-mote]의 정신력 회복 효과를 차단하지만,\n하나만 착용해도 광적인 기어다니는 자들을 아군으로 소환시킬 수 있습니다.\n2개를 동시에 착용하면 광적인 기어다니는 자들이 더 이상 소환되지 않습니다.\n\n참고: [color=#33aaff]현재 장비 효과는 [img=quality.normal] 품질의 장비에서만 작동합니다.[/color]

