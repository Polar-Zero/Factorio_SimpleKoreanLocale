[mod-name]
chemistry-tab=화학 아이템 그룹(Chemistry group)

[mod-description]
chemistry-tab=화학 관련 제작법의 아이템 그룹을 통합합니다. 우주 시대 DLC의 '유기 화학'도 포함합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[item-group-name]
chemistry=화학

[mod-setting-name]
keep-production-machines-tab='생산' 아이템 그룹에서도 기계 유지
reorder-production-machines-tab='생산' 아이템 그룹 위치를 뒤로 이동

[mod-setting-description]
keep-production-machines-tab=활성화하면, 제작에 '화학 공장'이 필요한 기계의 제작법 그룹을 이동하지 않습니다.
reorder-production-machines-tab='생산' 아이템 그룹을 '화학', '중간 생산품' 뒤쪽으로 옮깁니다. 바이오챔버와 같은 기계는 한 번에 1개의 기계만 생산할 수 있으므로, 이 설정을 활성화해도 대부분의 제작법이 포함된 기계 UI를 열 수 있습니다.