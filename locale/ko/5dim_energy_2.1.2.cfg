[mod-name]
5dim_energy=5Dim 모드 - 에너지(5Dim's mod - Energy)

[mod-description]
5dim_energy=초기 보일러부터 게임 후반 메가베이스에 이르기까지 전력망을 확장해보세요.\n\r확장되는 공장에 맞춘 다양한 발전, 저장, 전력 배전 단계를 게임에 추가됩니다.\n\r5dim_core 모드가 필요합니다.\n\n번역: SimpleKoreanLocale(PolarZero)

