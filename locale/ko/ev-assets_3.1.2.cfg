[mod-name]
ev-assets=확장된 바닐라 - 자산 팩(Extended Vanilla: Assets)

[mod-description]
ev-assets=Extended Vanilla 모드에 사용되는 리소스를 모아둔 모드입니다.\n이 모드에 포함된 자산의 일부를 사용하거나 호환성을 추가하려면 디스코드 서버나 토론 페이지에 언제든 문의해 주세요.\n이 모드만으로는 자체적인 콘텐츠가 추가되지 않습니다.


[item-name]
electromagnetic-engine=전자기 엔진
plasma-head=플라즈마 헤드
tungsten-drill=텅스텐 드릴

[item-description]
electromagnetic-engine=전자기력을 이용해 운동 에너지를 발생시키는 엔진입니다. 기존 엔진보다 작동 효율이 뛰어나며, 더 빠른 속도로 작동합니다.
plasma-head=플라즈마를 이용해 재료를 매우 쉽게 절단할 수 있도록 하는 첨단 부품입니다. 정밀 절단 작업에 이상적이며 다양한 재료를 처리할 수 있습니다.
tungsten-drill=매우 단단하고 내구성이 뛰어난 텅스텐으로 제작된 드릴입니다. 단단한 재료를 뚫을 수 있어 심층 채광 작업에 이상적입니다.