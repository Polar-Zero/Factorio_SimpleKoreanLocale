[mod-description]
krastorio-aai-loaders-compact=Krastorio 2와 AAI Loaders 사이의 호환성 모드입니다. 이 모드를 활성화하면 Krastorio 2에서 AAI Loaders의 그래픽을 불러와 적용합니다. AAI Loaders 모드 설정에서 작동 모드를 '그래픽 전용'으로 설정하는 것을 잊지 마세요. 그렇지 않으면 적재기가 중복되어 나타날 수 있습니다. Space Exploration 모드와도 호환됩니다.\n\n번역: SimpleKoreanLocale(PolarZero)


