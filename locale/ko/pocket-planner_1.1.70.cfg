buildings-request=물류 요청
buildings-request-tip=이 페이지/표 이름을 가진 물류 그룹을 생성하고 캐릭터의 요청 목록에 추가합니다. 재요청시 이미 존재하는 그룹이 업데이트되며, 물류 설정에서 해당 그룹을 끄는 것으로 요청을 중단할 수 있습니다. 각 아이템의 수량은 건물 단위로 올림 처리되며, 신호기는 각 기계마다 개별적으로 계산되므로 여러 기계가 공유하는 신호기는 중복 집계됩니다.
