heat-fluid-temps-tip=이 기계는 뜨거운 유체 또는 열에서 에너지를 얻습니다. 공급할 온도를 선택하세요. 최저 온도 이상이면 최고 온도를 초과해도 작동하며, 온도가 높을수록 유체 소비량이 줄어듭니다. 자동은 이 페이지에서 생산하는 온도를 사용하고, 없다면 에너지당 비용이 가장 낮은 온도를 선택합니다.
