[mod-name]
pocket-planner=손 안의 계획기(Pocket Planner)

[mod-description]
pocket-planner=게임 내 생산 계획 도구를 게임에 추가합니다. 선형 해결 방식을 사용해 공정 루프, 부산물, 다중 출력 제작법 사이의 균형을 맞출 수 있으며, Pyanodon 수준의 거대한 공장도 처리 가능합니다. 단축키를 누르거나 Ctrl+Shift+Y 키를 사용하여 열어보세요.\n\n번역: SimpleKoreanLocale(PolarZero)


