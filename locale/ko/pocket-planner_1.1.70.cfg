help-3-5-k=비용 분석에서
help-3-5-v=재료나 생산품을 클릭하면 해당 아이템의 비용 분석을 엽니다. 상단 화살표로 돌아갈 수 있습니다. 생산 방법 끝의 X를 누르면 순위에서 제외되어 나머지 중 가장 저렴한 방법이 100%가 됩니다. 채팅에서 /pocket-planner-costs를 입력하면 모든 비용을 처음부터 다시 계산합니다.
help-3-6-k=기계의 동력으로 사용되는 유체나 열 클릭
help-3-6-v=기계의 작동 온도를 선택합니다. (증기, 녹은염, 히트 파이프 등) 최저 온도 이상이면 최고 온도를 초과해도 작동합니다. 자동은 페이지에서 생산하는 온도를 사용하고, 없으면 에너지당 비용이 가장 낮은 온도를 선택합니다.
help-4-1-k=제작법 아이콘 클릭
help-4-1-v=줄 메뉴: 활성화, 강조 색상, 중첩된 표, 이동, 삭제를 설정합니다.
help-4-2-k=이름 클릭
help-4-2-v=줄을 집어 이동합니다. 왼쪽 클릭으로 배치하고, 오른쪽 클릭이나 Esc로 취소합니다.
help-4-3-k=이름 위에서 Q
help-4-3-v=기계 위에서 Q를 누른 것처럼 해당 줄의 기계를 선택합니다. 관련 설정이 켜져 있으면 제작법도 함께 지정됩니다.
help-4-4-k=제작법 아이콘 오른쪽 클릭
help-4-4-v=줄을 삭제합니다. 표의 첫 줄에서는 닫힌 표가 삭제되고, 열린 표는 그룹이 해제됩니다.
help-4-5-k=줄을 Shift+클릭 또는 +
help-4-5-v=이 줄을 첫 줄로 하는 중첩된 표를 만듭니다.
help-4-6-k=줄을 Ctrl+클릭
help-4-6-v=해당 줄이 속한 표를 펼치거나 접습니다.
help-4-7-k=Shift+오른쪽 클릭, Ctrl+오른쪽 클릭
help-4-7-v=줄을 활성화하거나 비활성화합니다.
help-4-8-k=이름 왼쪽 버튼
help-4-8-v=강조 색상을 순서대로 변경합니다. 오른쪽 클릭으로 강조 표시를 해제합니다.
help-5-1-k=기계 클릭
help-5-1-v=다른 기계를 선택합니다. 즐겨찾기로 지정하면 새 줄에서 해당 기계를 사용합니다.
help-5-2-k=기계 오른쪽 클릭
help-5-2-v=모듈, 신호기, 연료를 설정하는 줄 편집기를 엽니다.
help-5-3-k=연료 아이콘, 자동
help-5-3-v=계획기가 연료를 선택합니다. 표에서 생산하는 연결된 연료, 페이지의 잉여 연료, 가장 저렴한 연료 순으로 선택합니다.
help-5-4-k=자동 아래의 규칙
help-5-4-v=자동 연료를 사용하는 줄의 연료 메뉴입니다. 특정 연료를 제외하거나 지정한 연료만 사용하도록 줄, 표 또는 페이지 단위로 설정합니다.
help-5-5-k=모듈 클릭
help-5-5-v=모듈 슬롯을 빠르게 채웁니다.
help-5-6-k=신호기 상자 (모듈 옆)
help-5-6-v=신호기 종류, 개수, 내부 모듈을 설정합니다. 신호기를 즐겨찾기로 지정하면 목록 맨 앞에 표시됩니다. Q로 모듈이 포함된 신호기를 선택할 수 있습니다.
help-5-7-k=TURD 상자 (Pyanodon)
help-5-7-v=줄에 영향을 주는 TURD 업그레이드마다 하나씩 표시됩니다. 게임에서 선택한 업그레이드를 따르거나, 적용하지 않고 계획하거나, 이 줄에서만 다른 업그레이드를 시험할 수 있습니다. 빨간색은 계획 이후 게임의 선택이 변경되어 해당 줄의 표가 비활성화되었다는 뜻입니다. 줄의 내용은 변경되지 않았으므로 확인한 뒤 클릭하거나 표를 다시 활성화하세요.
help-5-8-k=건물 수를 Shift+클릭
help-5-8-v=건물 수를 고정합니다. 기계 메뉴의 버튼으로도 설정할 수 있습니다.
help-6-1-k=10/s 99/m 10/3m
help-6-1-v=시간 단위를 직접 입력할 수 있습니다. 10/3m은 3분당 10개를 의미합니다.
help-6-2-k=10
help-6-2-v=숫자만 입력하면 오른쪽 상단에서 선택한 시간 단위를 사용합니다.
help-6-3-k=45x3/m (10+5)/2/5s
help-6-3-v=모든 숫자 입력란에서 + - x / 괄호로 계산할 수 있으며, k는 천 단위를 의미합니다. 시간 단위는 마지막 나눗셈 기호 뒤에 붙입니다.
help-6-4-k=0
help-6-4-v=0 또는 5-5처럼 계산 결과가 0인 값도 입력할 수 있습니다. 다만 0을 곱하거나 0으로 나누는 연산은 허용되지 않습니다.
help-6-5-k=빨간색 텍스트
help-6-5-v=숫자가 아니거나 음수이거나, 0을 곱하거나 0으로 나눈 경우 값이 변경되지 않습니다. 값을 수정하거나 Esc를 눌러 이전 수량을 유지하세요.
help-6-6-k=매우 낮은 생산 속도
help-6-6-v=분당, 시간당 또는 10시간당 수량으로 표시됩니다. 최솟값은 0.01/10h입니다.
help-7-1-k=파란색
help-7-1-v=연결되어 있고 공급량이 충분합니다.
help-7-2-k=빨간색
help-7-2-v=연결되어 있지만 공급량이 부족합니다.
help-7-3-k=보라색
help-7-3-v=연결되어 있으며 소비량보다 생산량이 많습니다.
help-7-4-k=색상 없음
help-7-4-v=연결되지 않아 수급 균형을 맞추지 않습니다.
help-7-5-k=모서리의 과학 팩 아이콘
help-7-5-v=먼저 연구해야 합니다. 표시된 과학 팩은 해당 연구에 필요한 과학 팩입니다.
help-7-6-k=모서리의 빨간색 X
help-7-6-v=이 제작법을 잠금 해제하는 연구가 없습니다.
help-8-1-k=페이지 탭
help-8-1-v=클릭하여 페이지를 전환합니다. 오른쪽 클릭하면 이름 변경, 복제, 삭제, 내보내기를 포함한 페이지 메뉴가 열립니다. 현재 열린 탭을 눌러 이동할 수 있습니다. 왼쪽의 +로 페이지를 추가합니다.
help-8-10-k=대상 위에서 Q
help-8-10-v=게임에서 해당 아이템이나 기계를 선택합니다. 줄의 기계나 제작법 아이콘에서는 제작법이 지정된 기계 설계도를 선택합니다. 톱니바퀴 설정에서 끌 수 있습니다.
help-8-11-k=대상을 Alt+클릭
help-8-11-v=팩토리오백과에서 해당 대상을 엽니다.
help-8-12-k=E
help-8-12-v=계획기 옆에 인벤토리를 엽니다.
help-8-13-k=머리글의 점 세 개
help-8-13-v=열 너비를 조정합니다.
help-8-2-k=재료 목록
help-8-2-v=건물 창, 개요, 건설 가이드에서 필요한 재료를 비축 시간만큼 물류 요청하거나 조합기 설계도로 가져옵니다. 시간을 클릭해 변경할 수 있습니다. Enter, Esc 또는 다른 곳을 클릭하면 수치만 적용됩니다.
help-8-3-k=개요 버튼 (시그마)
help-8-3-v=전체 페이지 또는 특정 탭 그룹의 아이템별 생산량, 소비량, 순생산을 보여줍니다. 생산/소비 표시 전환과 이름 필터가 있으며, 건물과 모듈도 각각 버튼으로 볼 수 있습니다. 페이지별 건물 수는 정수로, 순전력은 생산이 더 많으면 연한 초록색으로 표시됩니다. 아이템에 마우스를 올리면 어떤 페이지에서 생산하거나 소비하는지 확인할 수 있습니다.
help-8-4-k=탭 그룹, 보관
help-8-4-v=페이지 메뉴에서 탭 그룹 이름을 입력하거나 페이지를 보관할 수 있습니다. 그룹 이름은 다른 곳을 클릭하면 적용됩니다. 탭 왼쪽 목록에서는 그룹 하나, 그룹 없는 페이지 또는 보관함을 표시합니다. 연필 아이콘으로 현재 그룹의 이름을 변경할 수 있습니다.
help-8-5-k=건물 버튼
help-8-5-v=페이지에서는 기계 제목 옆에, 줄이나 표에서는 체크박스 왼쪽에 있습니다. 필요한 모든 기계, 모듈, 신호기를 표시하며 물류 요청하거나 조합기 설계도로 가져올 수 있습니다. 기차 정류장 아이콘 기능은 입력과 출력을 정류장 이름에 넣을 아이콘으로 표시합니다. 아이콘 또는 입력/출력 전체를 클릭한 뒤 Ctrl+C로 복사하세요.
help-8-6-k=톱니바퀴 (도구 모음)
help-8-6-v=손 안의 계획기 설정: 제작법이 지정된 기계 설계도 피펫, 피펫 사용된 계획기 다시 열기, 피펫 사용된 건설 가이드 숨기기, 화면 상단 계획기 버튼, 재료 비축 시간, 계획기 크기(50~150% 슬라이더)를 설정합니다.
help-8-7-k=페이지 내보내기, 가져오기 버튼
help-8-7-v=페이지 메뉴의 내보내기로 페이지를 텍스트로 복사하여 친구에게 보낼 수 있습니다. 실행 취소 옆의 가져오기 버튼은 해당 텍스트를 새 페이지로 추가합니다.
help-8-8-k=실행 취소, 다시 실행
help-8-8-v=페이지를 넘나들며 모든 변경을 순서대로 되돌리거나 다시 실행합니다. 페이지 생성, 삭제, 이름 변경, 이동도 포함됩니다.
help-8-9-k=검색창
help-8-9-v=현재 페이지에서 이름이 일치하는 아이템을 생산하거나 소비하는 줄만 표시합니다. Ctrl+F로 검색창으로 이동하고, 일치하는 결과가 있는 탭은 금색으로 표시됩니다.
help-9-1-k=기능 안내
help-9-1-v=건설하는 동안 화면에 표시해 두는 작은 계획기입니다. 페이지 전체 또는 클립보드 버튼을 누른 줄이나 표를 보여줍니다. 각 줄에는 제작법 아이콘, 기계와 개수, 아래의 모듈, 재료, 생산품이 표시됩니다. 제작법에 마우스를 올리면 이름을 볼 수 있습니다. 가이드에서는 아무것도 수정할 수 없습니다.
help-9-2-k=대상 위에서 Q
help-9-2-v=해당 대상을 선택합니다. 기계나 제작법 아이콘에서는 기계를 선택하며, 설정이 켜져 있으면 제작법도 지정됩니다.
help-9-3-k=방향키 또는 Ctrl+클릭
help-9-3-v=표를 접거나 펼칩니다. 계획기에서도 사용할 수 있습니다.
help-9-4-k=Esc, X 또는 단축키
help-9-4-v=계획기로 돌아갑니다. 게임 화면을 클릭해도 건설 가이드는 닫히지 않습니다.
help-9-5-k=접기 버튼 (제목 표시줄)
help-9-5-v=제목 표시줄만 남도록 줄입니다.
help-9-6-k=점 세 개
help-9-6-v=건설 가이드 설정: 한 줄에 표시할 재료와 생산품 수, 가이드 크기(50~150%)를 조정합니다.
help-9-7-k=상단 목록
help-9-7-v=전체를 표시하거나 내부 표 하나만 표시합니다.
help-h1=기본 사용법
help-h2=목표 생산품 (페이지 상단)
help-h3=아이템 (줄의 아이콘)
help-h4=줄
help-h5=기계
help-h6=수량 입력
help-h7=색상, 표시
help-h8=페이지, 도구
help-h9=건설 가이드 (기계 제목 또는 줄의 클립보드 버튼)
help-open=도움말, 단축키
help-tab1=기본 사용법
help-tab2=아이템, 줄
help-tab3=기계, 색상
help-tab4=페이지, 도구
help-title=도움말, 단축키
hidden-recipe=숨겨진 제작법입니다.
highlight-blue=파란색 (예: 계획됨)
highlight-green=초록색 (예: 완료됨)
highlight-none=강조 표시 없음
highlight-red=빨간색 (예: 문제 발생)
highlight-tip=강조 표시: __1__.\n[font=default-semibold]왼쪽 클릭[/font]: 다음 색상. [font=default-semibold]오른쪽 클릭[/font]: 강조 해제.
highlight-yellow=노란색 (예: 진행 중)
ingredients-combinator=조합기
ingredients-combinator-ready=조합기 설계도를 선택했습니다. 재료 __1__종, __2__초 분량이 포함됩니다.
ingredients-combinator-tip=모든 재료와 유체를 __1__초 분량으로 설정한 상수 조합기 설계도를 선택합니다. 즉시 배치할 수 있도록 계획기가 닫힙니다.
ingredients-label=__1__초 분량의 재료:
ingredients-label-a=비축할 재료 (
ingredients-label-b=초 분량):
ingredients-none=비축할 재료가 없습니다. 이 작업은 아이템이나 유체를 소비하지 않습니다.
ingredients-request=물류 요청
ingredients-request-tip=아이템 재료 __1__초 분량을 개인 물류에 요청합니다. 비활성화하거나 갱신할 수 있는 물류 그룹으로 추가되며, 유체는 요청할 수 없습니다.
ingredients-requested=물류 그룹 "__2__"로 재료 __1__종을 요청했습니다. (__3__초 분량)
ingredients-time-tip=클릭하여 시간을 변경합니다.
ingredients-tip=유입되는 재료의 비축량입니다. 각 재료의 초당 소비량에 __1__초를 곱하고 올림 처리합니다. 도구 모음의 톱니바퀴 설정에서 시간을 바꿀 수 있습니다. 전력과 열은 제외됩니다.
input-pick-title=목표 투입량 추가
input-remove=목표 투입량 제거
inputs=재료 합계:
inputs-wanted=목표 투입량:
inputs-wanted-tip=이 페이지에 외부에서 공급되는 양입니다. 해당 자원을 소비하는 줄은 공급량을 전부 사용하도록 확장됩니다. 남는 양은 추가 생산품에, 부족한 양은 빨간색으로 표시됩니다. 공급되는 전력과 열은 이용 가능한 공급량으로 처리되며, 기계 수를 늘려 전부 소비하지는 않습니다.
item-cost=비용: __1__
item-cost-tip=원재료와 기계 작업 시간을 기준으로 추정한 비용이며, 제작법의 순위를 정하는 데 사용됩니다.
loading=제작법을 색인하고 비용을 추정하는 중입니다. 게임 진행마다 한 번만 진행하며, 규모가 큰 모드팩일 경우 몇 초 정도 걸릴 수 있습니다.
locked=[color=1,0.4,0.3]아직 연구되지 않았습니다.[/color]
machine-favorite=즐겨찾기: 제작법에서 허용하는 경우 새 줄에 이 기계를 사용합니다. 즐겨찾기가 두 개라면 보유한 기계 중 더 빠른 것을 선택합니다.
machine-select=제작 기계 선택
machine-slots=모듈 슬롯: __1__
machine-speed=속도: __1__
machine-speed-short=속도 ×__1__
machine-unfavorite=즐겨찾기에서 제거합니다.
made-by=생산 기계
made-by-n=생산 기계 (__1__)
menu-add-producer=이 아이템을 생산하는 제작법 추가
menu-balanced-above=이 표를 포함하는 __1__에 연결되어 있습니다. 이 줄은 표의 첫 줄이므로 상위 표의 계산에 참여합니다. 표 내부에 연결하려면 아이콘을 오른쪽 클릭하세요.
menu-balanced-here=이 표에 연결되어 있습니다. 여기에서 생산하고 소비하는 양의 균형을 맞춥니다. 연결을 해제하려면 아이콘을 오른쪽 클릭하세요.
menu-browse=아이템 탐색기에서 열기
menu-count-clear=건물 수량 고정 해제
menu-count-set=건물 수 고정
menu-deficit=[color=1,0.4,0.3]부족: __1__[/color]
menu-edit-target=__1__의 목표 수량 편집
menu-fixed-clear=고정 수량 해제
menu-fixed-make=생산량 고정
menu-fixed-use=소비량 고정
menu-link=이 표에 아이템 연결
menu-link-idle=현재 연결되었지만, 표 내에 해당 아이템을 생산하거나 소비하는 작업이 존재하지 않아 아직 효과가 없습니다.
menu-make-table=이 줄을 첫 줄로 하는 중첩된 표 만들기
menu-not-linked=연결되지 않았습니다. 계획기에서 생산/소비량 밸런스를 맞추지 않습니다. 연결하려면 표에 있는 아이콘을 오른쪽 클릭하세요.
milestones-help=이미 확보한 과학 팩을 선택하세요. 선택한 과학 팩으로 해제되는 제작법은 연구가 완료된 것으로 취급되어 회색이나 잠금 표시가 적용되지 않습니다. 아직 사용할 수 없는 제작법일 경우 필요한 과학 팩이 표시됩니다.
module-add-tip=모듈을 왼쪽 클릭하면 빈 슬롯을 모두 채웁니다. 이미 가득 찼다면 전부 교체합니다. 오른쪽 클릭하면 하나만 추가합니다.
module-remove-tip=왼쪽 클릭으로 모듈을 전부 제거하고, 오른쪽 클릭으로 하나만 제거합니다.
modules-clear=모듈, 신호기 제거
modules-empty-tip=모듈이 없습니다. 클릭하여 선택하세요.
move-cancel-tip=다시 클릭하면 이동을 취소합니다.
move-pick-tip=클릭하여 이 줄을 집어 이동합니다. 표의 첫 줄을 이동하면 표 전체가 함께 이동합니다.
move-row-tip=[font=default-semibold]왼쪽 클릭[/font]: 여기에 줄 배치. [font=default-semibold]오른쪽 클릭[/font]: 원래 위치로 되돌리기.
nei-adding-note=+ 또는 제작법 아이콘을 클릭하면 현재 페이지에 제작법을 추가합니다. 재료나 생산품을 클릭하면 해당 아이템의 정보를 볼 수 있습니다.
nei-locked-hidden=잠긴 제작법 __1__개가 표시되지 않았습니다. ("잠긴 아이템 표시"를 선택하세요.)
nei-menu=아이템 목록으로 돌아가기
nei-more=__1__개 더 보기
nei-none=제작법을 찾을 수 없습니다. 잠긴 제작법이나 숨겨진 제작법을 표시해 보세요.
nei-pick-hint=아이템이나 유체를 선택하여 생산, 사용 방법을 확인하세요.
nei-search-tip=이름으로 아이템, 유체 검색
no-rows=이 페이지에는 아직 제작법이 없습니다.\n목표 생산품이나 아이템 아이콘을 클릭하여 제작법을 선택하거나, 위의 "제작법 추가"를 사용하세요.
no-tech=이 제작법을 잠금 해제하는 연구가 없습니다. 스크립트(TURD 선택 등)로 제공되거나 잠금 해제할 수 없는 제작법입니다.
page-tab-tip=[font=default-semibold]왼쪽 클릭[/font]: 페이지 열기. [font=default-semibold]오른쪽 클릭[/font]: 이름 변경. 열린 탭을 다시 누르면 탭을 집어 이동할 수 있습니다.
parent-disabled=이 줄을 포함하는 상위 표가 비활성화되어 있습니다.
reversible-recipe=포장 또는 포장 해제 제작법입니다. 정확히 반대되는 제작법이 있으므로 목록의 마지막에 표시됩니다.
row-to-page-tip=이동 중인 줄을 이 페이지로 옮기려면 여기에 마우스를 올리세요. 이후 오른쪽 클릭으로 원래 위치에 되돌릴 수 있습니다.
setting-buffer_seconds=재료 비축 시간 (초)
setting-buffer_seconds-tip=재료 조합기와 물류 요청에 각 재료를 몇 초 분량으로 비축할지 설정합니다. 120은 2분이며, 5x60 같은 수식도 사용할 수 있습니다.
setting-guide_close_pipette=피펫 사용된 건설 가이드 숨기기
setting-guide_close_pipette-tip=건설 가이드에서 Q로 대상을 선택하면 가이드가 일시적으로 숨겨집니다. 선택한 대상을 내려놓으면 가이드가 다시 표시됩니다.
setting-guide_size-tip=계획기와 별도로 건설 가이드의 크기를 조절합니다.
setting-pipette_blueprint=제작법이 지정된 설계도로 기계 피펫 사용
setting-pipette_blueprint-tip=줄의 기계에서 Q를 누르면 해당 제작법이 설정되고 모듈 요청이 포함된 기계 설계도를 선택합니다. 끄면 일반 기계를 선택합니다. 제작법을 자체적으로 결정하는 기계(용광로, 채광기 등)는 항상 일반 기계를 선택합니다.
setting-pipette_reopen=피펫 사용된 계획기 다시 열기
setting-pipette_reopen-tip=계획기에서 선택한 대상을 내려놓아 마우스가 비면 마지막으로 열었던 위치에서 계획기가 다시 열립니다. 제작법 지정 여부와 관계없이 계획기에서 Q로 선택한 대상, 건물 창의 조합기 설계도에 적용됩니다.
setting-planner_size-tip=계획기와 모든 메뉴, 팝업 창의 크기를 조절합니다. 건설 가이드 크기는 별도로 설정합니다.
setting-top_button=화면 상단에 계획기 버튼 표시
share-in-tip=페이지 가져오기: 다른 사람이 내보낸 페이지 텍스트를 붙여 넣으면 새 페이지로 추가됩니다.
share-out-help=이 텍스트에는 페이지 전체 데이터가 포함되어 있습니다. 이미 선택되어 있으므로 Ctrl+C로 복사하세요. 친구에게 보내거나 실행 취소 옆의 가져오기 버튼으로 다른 저장 파일에 붙여 넣을 수 있습니다.
share-out-tip=페이지 전체를 텍스트로 내보냅니다. 친구에게 보내거나 실행 취소 옆의 가져오기 버튼으로 다른 저장 파일에 가져올 수 있습니다.
summary-col-balance-tip=생산량에서 소비량을 뺀 값입니다. 빨간색: 소비량이 더 많아 외부 공급 필요. 보라색: 생산량이 더 많음. 아이템에 마우스를 올리면 생산, 소비하는 페이지를 확인할 수 있습니다.
summary-col-buildings-tip=실행 중인 각 줄의 건물 수를 정수로 올림 처리한 값입니다.
summary-col-count-tip=각 줄의 건물 수를 먼저 정수로 올림 처리한 뒤 합산합니다.
summary-col-made-tip=각 페이지에서 생산하고 내보내는 추가 생산품과 목표 생산품의 합계입니다.
summary-col-power-tip=순전력: 페이지에서 소비하는 전력에서 자체 발전기의 생산 전력을 뺀 값입니다. 연한 초록색은 생산 전력이 더 많다는 뜻입니다.
summary-col-used-tip=각 페이지에서 소비하고 공급받는 아이템의 합계입니다.
summary-col-wants=목표 생산품
summary-even=균형
summary-filter-tip=이름에 입력한 문자열이 포함된 아이템만 표시합니다.
summary-net-tip=활성화: 페이지 간 생산량과 소비량을 상쇄하여 남는 양과 부족한 양만 표시합니다. 비활성화: 각 페이지의 재료와 초과 생산품을 모두 합산합니다.
summary-open-tip=모든 페이지 또는 탭 그룹 하나의 개요를 표시합니다. 생산량, 필요량, 전체 건물 수를 함께 확인할 수 있습니다.
summary-power-made-tip=이 페이지에서 소비량보다 해당 값만큼 많은 전력을 생산합니다.
summary-power-used-tip=이 페이지에서 생산량보다 해당 값만큼 많은 전력을 소비합니다.
summary-scope-tip=집계할 페이지 범위를 선택합니다. 모든 페이지(보관된 페이지 제외) 또는 특정 탭 그룹을 선택할 수 있습니다.
summary-show-consuming-tip=페이지에서 생산량보다 소비량이 많은 아이템을 표시합니다.
summary-show-producing-tip=페이지에서 소비량보다 생산량이 많은 아이템을 표시합니다.
tab-group-tip=그룹 이름이 같은 페이지가 함께 표시됩니다. 탭 왼쪽 목록에서 그룹을 선택하세요. 그룹을 지정하지 않으려면 비워 두세요.
tab-move-tip=이동할 페이지를 다른 탭 위에 올리세요. 왼쪽 클릭으로 놓고, 오른쪽 클릭으로 원래 위치에 되돌립니다.
target-inline-tip=__1__당 수량입니다. 숫자나 수식(45x3/m)을 입력하고 Enter를 누르세요.
target-pick-hint=이 페이지에서 생산할 대상을 선택하세요. 전력과 열이 먼저 표시됩니다.
target-rate=__1__당 수량:
temp-auto-tip=자동: 이 페이지에서 생산하는 온도 중 남는 양이 가장 적도록 선택하며, 필요하면 혼합합니다. 온도를 클릭하면 항상 해당 온도를 사용합니다.
tip-deficit=[color=1,0.4,0.3]이 페이지의 제작법만으로는 수급 균형을 맞출 수 없습니다.[/color]
tip-free-in=이 그룹에서 생산하지 않는 아이템입니다. 상위 그룹이나 페이지 외부에서 공급됩니다.
tip-free-out=이 그룹에서 소비하지 않는 아이템입니다. 상위 그룹이나 페이지 외부로 나갑니다.
tip-group-export=이 그룹에서 의도적으로 내보내는 아이템입니다. (그룹 내 목표 생산품 중 하나)
tip-group-in=이 그룹에는 외부 공급이 필요합니다.
tip-group-out=이 그룹에서 상위 단계로 공급합니다.
tip-ingredients=재료
tip-item-clicks=[font=default-semibold]왼쪽 클릭[/font]: 제작법 추가. [font=default-semibold]오른쪽 클릭[/font]: 연결/연결 해제.
tip-linked=연결됨: 이 표의 다른 제작법과 밸런스가 맞춰집니다.
tip-linked-above=이 표를 포함하는 상위 표에 연결됨. 이 줄은 표의 첫 줄이므로 상위 표의 계산에 참여합니다.
tip-row-clicks=[font=default-semibold]왼쪽 클릭[/font]: 강조 표시, 중첩된 표, 이동 등을 설정하는 줄 메뉴 열기. [font=default-semibold]오른쪽 클릭[/font]: 줄 삭제 (도구 모음에서 실행 취소 가능)
tip-surplus=[color=0.5,1,0.5]그룹에서 소비할 수 있는 양보다 많이 생산했습니다. 초과 생산분은 버려집니다.[/color]
train-stop-all-tip=입력되거나 출력되는 아이템을 고체, 유체 순으로, 수량이 많은 것부터 표시합니다. 이곳을 클릭하면 전부 한 번에 복사할 수 있고, 아이콘을 클릭하면 해당 아이템만 복사합니다.
train-stop-none=아직 입력/출력되는 아이템이 없습니다.
train-stop-open-tip=입력과 출력을 아이콘으로 표시하여 기차 정류장 이름에 복사할 수 있습니다.

[shortcut-name]
pocket-planner-toggle=손 안의 계획기