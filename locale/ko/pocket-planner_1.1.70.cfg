heat-temp-auto-tip=자동: 이 페이지에서 생산하는 온도를 사용하고, 없으면 에너지당 비용이 가장 낮은 온도를 선택합니다. 온도를 클릭하면 항상 해당 온도를 사용합니다.
help-1-1-v=계획기를 열거나 닫습니다. 단축키는 설정 > 조작에서 변경할 수 있습니다. 단축바 버튼과 화면 왼쪽 상단의 손 안의 계획기 버튼으로도 같은 작업을 할 수 있습니다.
help-1-2-v=맨 위에 열린 창이나 팝업을 닫습니다. 숫자 입력 중에는 Enter처럼 값을 적용합니다. 게임 화면을 클릭해도 창이 하나씩 닫힙니다. 건설 가이드에서는 계획기로 돌아갑니다.
