pocket-planner-alt-click=손 안의 계획기: 팩토리오백과에서 열기
pocket-planner-click=손 안의 계획기: 클릭 (감시 중, 왼쪽 클릭 유지 권장)
pocket-planner-ctrl-click=손 안의 계획기: 테이블 펼치기/접기
pocket-planner-ctrl-right-click=손 안의 계획기: 줄 단위 활성화/비활성화 (대체)
pocket-planner-find=손 안의 계획기: 페이지에서 찾기
pocket-planner-pipette=손 안의 계획기: 피펫
pocket-planner-right-click=손 안의 계획기: 오른쪽 클릭 (감시 중, 오른쪽 클릭 유지 권장)
pocket-planner-shift-click=손 안의 계획기: 테이블 추가, 수량 고정
pocket-planner-shift-right-click=손 안의 계획기: 줄 단위 활성화/비활성화
pocket-planner-tech-tree=손 안의 계획기: 기술 트리 닫기
pocket-planner-toggle=손 안의 계획기 열기

