[mod-setting-description]
advanced-substatino-t3-use-uranium-crafting=기본 제작법 대신 우라늄 기반 아이템을 사용하여 실험용 핵융합 에너지 변전소를 제작합니다.
advanced-substation-t2-area=고급 변전소(2티어)의 전력 공급 반경을 조정합니다. (총 범위: 설정값 x 2)
advanced-substation-t2-wire=고급 변전소(2티어)의 전선 도달 범위를 조정할 수 있습니다.
advanced-substation-t3-area=3티어 변전소의 실제 전력 공급 반경을 조정합니다. (총 범위: 설정값 x 2) 해당 설정값에 프로토타입 기본 품질 보너스(+6)]가 차감된 값이 적용됩니다. 높은 품질의 아이템은 더 넓은 지원 영역을 가지게 되며, 전설 등급에 도달하면 해당 값에 최대 +5까지 추가됩니다. 일반 36 -> 전설 41. 배선 도달 거리의 절반으로 설정하여 공급 범위와 도달 범위를 일치시키세요.
advanced-substation-t3-wire=3티어 변전소의 전선 도달 범위를 조정할 수 있습니다. 해당 설정값에 프로토타입 기본 품질 보너스(+12)]가 차감된 값이 적용됩니다. 이 값은 게임에서 64 상한치가 지정되어 있으므로, 최대 76까지 설정할 수 있습니다. 높은 품질의 아이템은 더 넓은 지원 영역을 가지게 되며, 전설 등급에 도달하면 해당 값에 최대 +10까지 추가됩니다. 일반 72 -> 전설 82.
big-electric-area=기본 게임의 대형 전신주 전력 공급 반경을 조정합니다. (총 범위: 설정값 x 2)
big-electric-wire=기본 게임의 대형 전신주 전선 도달 범위를 조정할 수 있습니다.
medium-electric-area=기본 게임의 중형 전신주 전력 공급 반경을 조정합니다. (총 범위: 설정값 x 2)
medium-electric-wire=기본 게임의 중형 전신주 전선 도달 범위를 조정할 수 있습니다.