[mod-name]
AdvancedSubstation=고급 변전소(Advanced Substations)
AdvancedSubstationSpaceAgeUpdate=고급 변전소 2.0 (우주 시대 업데이트)(Advanced Substations 2.0 (Space Age Update))

[mod-description]
AdvancedSubstation=두 개의 새로운 고급 변전소를 게임에 추가합니다.\n- 더 긴 연결 범위\n- 더 넓은 전력 공급 범위\n- 더 비싼 가격\n- 전기 에너지 배전 3 연구 추가\n* 고급 변전소\n* 실험적 핵융합 변전소(휘발성)\n\n 실험적 핵융합  변전소는 로보포트에서 사용할 수 있습니다\n\n양자, 시간 및 고무 밴드 과학력을 사용하여 전기를 넓은 지역으로 흐르게 할 수 있습니다\n\n. 고무 밴드는 전선을 단단히 고정하기 위해 사용합니다.\n\n이 모드 사용에 따른 책임은 본인에게 있습니다!\n\n번역: SimpleKoreanLocale(PolarZero)
AdvancedSubstationSpaceAgeUpdate=두 개의 새로운 고급 변전소를 게임에 추가합니다.\n- 더 긴 연결 범위\n- 더 넓은 전력 공급 범위\n- 더 비싼 가격\n- 전기 에너지 배전 3 연구 추가\n* 고급 변전소\n* 실험적 핵융합 변전소(휘발성)\n\n실험적 핵융합 변전소는 로보포트에서 사용할 수 있습니다\n\n양자, 시간 및 고무 밴드 과학력을 사용하여 전기를 넓은 지역으로 흐르게 할 수 있습니다\n\n. 고무 밴드는 전선을 단단히 고정하기 위해 사용합니다.\n품질 모드가 활성화되어 있을 경우, 배치된 실험용 핵융합 변전소(3티어)가 품질에 따라 확장되는 맞춤형 슈퍼 등급으로 업그레이드됩니다. 각 티어별 전선 범위 및 연결 범위:\n일반: 72x72\n고급: 74x74\n희귀: 76x76\n특급: 78x78\n전설: 82x82\n\n번역: SimpleKoreanLocale(PolarZero)

