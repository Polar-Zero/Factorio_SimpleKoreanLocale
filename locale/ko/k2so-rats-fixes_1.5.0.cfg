[mod-name]
k2so-rats-fixes=Krastorio 2 - Rat의 우주 시대 수정(K2SO Rat's Fixes)

[mod-description]
k2so-rats-fixes=Krastorio 2 + 우주 시대 (K2SO) 모드 환경에 대한 버그 수정 모음입니다. Krastorio2-spaced-out 모드, 관련 조정 모드인 'nulls-k2so-tweaks', 그리고 'xy' 포크 버전 사이의 상호작용을 개선합니다. 부패 메커니즘이 적용된 제작법과 관련된 문제들을 수정했습니다. 기존에는 상위 재료의 부패 속성이 그대로 전달되어 전체 생산 공정이 붕괴하는 현상이 발생했는데, 특히 재귀적 바이오매스 제작 공정에서 이러한 문제가 강조되었습니다. 또한 세리스, 마락시스, 방사선 피해와 관련된 상호작용 오류를 수정했습니다. (K2-Arsenal 지원) 추후 더 많은 수정 사항과 호환성 개선을 위해 지속적으로 업데이트될 예정입니다.\n\n번역: SimpleKoreanLocale(PolarZero)

[mod-setting-name]
k2so-rats-fixes-asteroid-radiation-immunity=소행성 방사능 피해 저항
k2so-rats-fixes-asteroid-radiation-immunity__0__=0% (비활성화)
k2so-rats-fixes-asteroid-radiation-immunity__100__=100% (K2SO 기본값)
k2so-rats-fixes-asteroid-radiation-immunity__25__=25%
k2so-rats-fixes-asteroid-radiation-immunity__50__=50%
k2so-rats-fixes-asteroid-radiation-immunity__75__=75%
k2so-rats-fixes-asteroid-radiation-immunity__auto__=자동
k2so-rats-fixes-greenhouse-plus-k2-glass=Greenhouse+: 크라스토리오 2의 유리, 모래 사용

[mod-setting-description]
k2so-rats-fixes-asteroid-radiation-immunity=모든 소행성에 'kr-radioactive' 저항력을 추가합니다. Krastorio 2 Spaced Out에서 100% 면역으로 지정한 객체의 저항력을 기본적으로 유지하지만, kr-radioactive 속성을 지닌 무기를 추가하는 eRisel-k2-arsenal 모드가 설치된 경우에는 50%가 사용됩니다.
k2so-rats-fixes-greenhouse-plus-k2-glass=k2-greenhouse-plus에서 자체적인 모래와 유리를 추가하는 경우(기본 설정), 이를 Krastorio 2 생산 체계와 통합합니다. 즉, 온실은 'kr-glass'(Krastorio 2 유리)를 사용하여 건설하도록 하며, 중복되는 'k2gp-sand', 'k2gp-glass' 관련 제작법과 아이템을 게임에서 제거합니다. 이 설정은 'Krastorio 2'가 설치된 경우에만 적용되며, 그렇지 않은 경우에는 효과가 없습니다.