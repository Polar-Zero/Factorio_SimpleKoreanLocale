[mod-name]
5dim_transport=5Dim 모드 - 운송(5Dim's mod - Transport)

[mod-description]
5dim_transport=공장에서 더 많은 물품과 유체를 처리할 수 있도록 해보세요.\n\r더 빠른 처리량 구축을 위한 고급 컨베이어 벨트, 투입기, 적재기, 펌프, 긴 파이프 등을 게임에 추가합니다.\n\r작동에 5dim_core 모드가 필요하며, Bob's Adjustable Inserters 모드 역시 호환됩니다 (선택 사항)\n\n번역: SimpleKoreanLocale(PolarZero)


