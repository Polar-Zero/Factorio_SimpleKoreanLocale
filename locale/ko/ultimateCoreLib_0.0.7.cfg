[mod-setting-description]
abacayba_deconstructor_detailed_reporting=[메세지 출력: 거의 없음] 어떤 차량이나 플레이어가 해체 대상 아이템을 표시하는지 추적하는 데 유용합니다.
abacayba_detailed_reporting=[메세지 출력: 매우 많음] 주로 기능이 정상적으로 작동하는지 확인하는 등의 디버깅 용도로만 사용됩니다.
abacayba_show_startup_messages=[메세지 출력: 다소 많음] Abacayba 제어 도구에서 게임 로드 및 모드 업데이트를 완료한 뒤, 정상 작동 여부를 확인하는 데 사용됩니다.
abacayba_spawn_enemies=불길한 과학 팩을 연구한 후, 모드에서 2초마다 모든 청크를 확인한 뒤 적군 생성을 시도합니다. 청크 구획에 플레이어가 설치한 구조물이나 적 산란장이 없는 경우에만 생성되며, 안전 반경은 없습니다. 적 생성을 방지하려면 32x32 크기의 모든 청크에 적어도 하나의 건물을 배치해야 합니다. ([entity=small-electric-pole] 하나도 가능). UPS 절약을 위해 매핑된 표면만 주기마다 한 번씩 확인합니다. 다른 행성에 대한 공격 역시 활성화하려면 지도 설정을 확인하세요.
ufp_detailed_reporting=[메세지 출력: 가열기 수에 비례] 주로 기능이 정상적으로 작동하는지 확인하는 등의 디버깅 용도로만 사용됩니다.
ufp_show_startup_messages=[메세지 출력: 다소 많음] 게임 로드 및 모드 업데이트를 완료한 뒤, 정상 작동 여부를 확인하는 데 사용됩니다.
ultimateCoreLib_override=이 설정은 다른 설정이 어떻게 되어 있든 상관없이 Ultimate Fixed Mods의 런타임 단계에 대한 모든 컨트롤을 활성화하거나 비활성화할 수 있습니다. 비활성화하면 UPS 성능 소모량이 증가되지 않으며, 이에 연결된 이벤트 역시 발생하지 않을 것입니다.
umr_detailed_reporting=[메세지 출력: 코어 수에 비례] 주로 기능이 정상적으로 작동하는지 확인하는 등의 디버깅 용도로만 사용됩니다.
umr_quantum_teleporter_meltdown=[메세지 출력: 거의 없음] 최대 건물 건설 한도를 추적합니다.
umr_show_startup_messages=[메세지 출력: 다소 많음] 게임 로드 및 모드 업데이트를 완료한 뒤, UMR 제어 도구의 정상 작동 여부를 확인하는 데 사용됩니다.