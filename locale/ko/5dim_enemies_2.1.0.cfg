[mod-setting-description]
5d-attack-stickers=적의 공격에 대한 부가 효과를 활성화합니다. (화염: 화상, 독성: 이동 속도 감소)
5d-berserker-biter=체력이 적지만 매우 강한 공격을 하는 광폭 바이터를 활성화합니다.
5d-boss=매우 높은 진화 단계에서만 등장하는 보스(MK11) 적을 활성화합니다.
5d-broodmother-biter=사망시 새끼를 낳는 바이터를 활성화합니다.
5d-broodmother-spitter=사망시 새끼를 낳는 스피터를 활성화합니다.
5d-damage-multiplier=적의 피해 배율을 조정합니다. (높을수록 더 강력한 공격을 함)
5d-death-effect-scale=사망 효과 크기를 조정합니다 (0.25: 더 작음, 3.0: 훨씬 큼)
5d-death-effects=원소 속성 적(불, 독, 전기 등)에 대한 특수 사망 효과를 활성화합니다.
5d-electric-spitter=전기 방전 공격을 하는 스피터를 활성화합니다.
5d-fire-spitter=불줄기를 쏘는 스피터를 활성화합니다
5d-health-multiplier=적 체력 배율 (값이 높을수록 적의 체력이 추가 증가합니다)
5d-impact-biter=충격/폭발 피해에 내성이 있는 바이터를 활성화합니다.
5d-laser-biter=레이저 피해에 내성이 있는 바이터를 활성화합니다.
5d-laser-spitter=레이저 빔을 발사하는 스피터를 활성화합니다.
5d-physical-biter=물리적 피해에 내성이 있는 바이터를 활성화합니다.
5d-physical-spitter=돌/파편을 던지는 스피터를 활성화합니다.
5d-poison-spitter=독성 구름을 생성하는 스피터를 활성화합니다.
5d-railgun-biter=레일건 공격에 의한 물리 피해에 저항하는 바이터를 활성화합니다 (우주 시대 DLC 필요)
5d-railgun-spitter=레일건 광선을 발사하는 스피터를 활성화합니다 (우주 시대 DLC 필요)
5d-railgun-worm=레일건 광선을 발사하는 땅벌레를 활성화합니다 (우주 시대 DLC 필요)
5d-regenerator-biter=체력을 매우 빠르게 회복하는 바이터를 활성화합니다.
5d-regenerator-spitter=체력을 매우 빠르게 회복하는 스피터를 활성화합니다.
5d-rocket-spitter=로켓을 발사하는 스피터를 활성화합니다.
5d-speed-multiplier=적의 이동 속도 배율을 조정합니다. (높을수록 적 이동 속도가 빨라짐)
5d-suicide=접촉 시 폭발하는 스피터를 활성화합니다.
5d-swarm-biter=수많은 무리를 이루어 공격하는 작지만 빠른 바이터를 활성화합니다.
5d-tank-biter=모든 피해 유형에 50% 저항력을 가져 매우 높은 방어력을 갖췄지만 공격력이 낮은 바이터를 활성화합니다.
5d-tank-spitter=모든 피해 유형에 50% 저항력을 가져 매우 높은 방어력을 갖췄지만 공격력이 낮은 스피터를 활성화합니다.
5d-tank-worm=모든 피해 유형에 50% 저항력을 가져 매우 높은 방어력을 갖췄지만 공격력이 낮은 땅벌레를 활성화합니다.
5d-typed-damage=적 공격이 유형에 맞는 피해를 입히도록 합니다. (예: 화염 바이터가 화염 피해를 입힘)
5d-worm=베헤모스와 보스 등급의 땅벌레를 활성화합니다.