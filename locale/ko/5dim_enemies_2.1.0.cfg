[mod-name]
5dim_enemies=5Dim 모드 - 적군(5Dim's mod - Enemies)

[mod-description]
5dim_enemies=바이터를 진정한 장기적 위협으로 만듭니다.\n게임 전반에 걸친 더 강력한 적 변종과 더 거센 전투 압박을 추가합니다.\n경험이 풍부한 플레이어만 설치하는 것을 권장합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[biter-type]
berserker=광폭
broodmother=여왕
impact=충격
laser=레이저
physical=장갑
plasma=플라즈마
railgun=레일건
regenerator=재생
swarm=군집

[enemy-info-ui]
category=분류:
data-source=데이터 출처:
data-source-runtime=생략된 데이터에 대해 runtime 단계 프로토타입 대체 티어 구성이 사용함
range=범위
show-all-tiers=모든 티어 표시
tier-breakdown=__1__ __2__ 분석
tier-help=비활성 항목을 확인하려면 "모든 티어 표시"를 활성화하세요. 회색은 비활성 상태, 능력치가 없다는 것은 관련된 프로토타입이 로드되지 않았음을 의미합니다.

[enemy-info-description]
acid=산성을 기반으로 한 강력한 지역 봉쇄에 중점을 둔 부식성 땅벌레 변종입니다.
berserker=공격적이지만 그만큼 낮은 지속력을 가진 ‘유리 대포’형 땅벌레 변종입니다.
broodmother=새끼를 계속 낳아 방어선을 압도시킬 수 있는 산란장형 변종입니다.
electric=전기 교란 효과가 추가된 충격 피해를 주는 공격적인 땅벌레입니다.
explosion=밀집된 방어선을 분쇄시킬 수 있는 폭발 공격을 하는 땅벌레입니다.
fire=화염을 이용해 고정된 방어망에 효과적인 피해를 주는 지역 봉쇄 공격형 땅벌레입니다.
impact=느리지만 훨씬 더 강력한 충격 피해를 주는 느린 돌격형 땅벌레입니다.
laser=레이저 위주의 방어 체계에 강하며, 에너지 기반 구성에 지속적인 압박을 가합니다.
normal=극단적인 수정 요소 없이, 기본적인 능력치를 지닌 기본적인 적입니다.
physical=탄창을 비롯한 물리 피해를 흡수하도록 조정된 방어적인 변종입니다.
poison=독을 이용한 지속 피해를 이용해 소모전을 유도할 수 있는 공격적인 변종입니다.
railgun=강력한 관통력을 기반으로 한 압박을 가하는, 우주 시대적인 분위기를 지닌 빠른 원거리 전문 변종입니다.
regenerator=잃은 체력을 빠르게 회복할 수 있는 지속 압박형 적입니다.
rocket=밀집된 벽과 포탑을 효과적으로 제압하는 원거리 폭발 공격을 가하는 적입니다.
suicide=접촉 시 폭발해 광역 피해를 주는 자폭형 변종입니다.
swarm=낮은 체력을 수적 우위로 극복할 수 있는 작고 빠르며 엄청나게 밀집된 적입니다.
tank=체력과 방어력이 매우 뛰어나지만, 공격력이 낮은 적입니다.

