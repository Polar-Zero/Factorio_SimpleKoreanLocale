[tips-and-tricks-item-description]
5dim-enemies-berserker-biter=[color=#CC0000]피처럼 붉은 광폭 바이터[/color]는 전형적인 유리 대포형 적입니다.\n\n[font=default-bold]특징:[/font]\n• 체력 50% 감소\n• [color=red]공격력 2배 (매우 위험!)[/color]\n• 이동 속도 30% 증가\n• [color=cyan]회복하지 않음[/color]\n• 물리 피해를 10% 더 많이 받습니다\n• 진화 요인 25% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n적들이 벽에 도달하기 전에 처치하세요! 높은 순간 피해가 필요할 것입니다. 이들은 엄청난 피해를 입힐 수 있지만 그만큼 빠르게 처치할 수 있으므로, 벽은 적의 속도를 늦추는 데 매우 유용할 것입니다.
5dim-enemies-bosses=[color=#6600CC]보스 적[/color]은 거대하고 강력한 적 변종입니다.\n\n[font=default-bold]보스 특징:[/font]\n• 체력 2배\n• 공격력 2배\n• 2배 크기 (시각적 더 거대함)\n• 이동 속도 40% 감소\n\n[font=default-bold]출현 조건:[/font]\n• 진화 요인 90%부터 출현하기 시작\n• 진화 요인 100%에서 최대 출현 빈도\n• 모든 적 유형에 보스 변종이 존재합니다.\n\n[font=default-bold]전략:[/font]\n보스를 상대하려면 화력을 집중해야 합니다. 대포, 로켓, 포탑의 집중 사격이 필수적입니다. 보스는 이동 속도가 느리니, 이 점을 활용하세요!
5dim-enemies-broodmother-biter=[color=#FF00FF]마젠타/핑크색을 띈 여왕 바이터는[/color], 처치될 때 새끼를 생성합니다.\n\n[font=default-bold]특징:[/font]\n• 체력 50% 증가 (단단함)\n• 이동 속도 30% 감소\n• 공격력 20% 감소\n• [color=red]사망 시: 50% 확률로 하위 티어의 바이터[/color]를 생성합니다.\n• 진화 요인 25% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n가급적 강력한 무기를 사용하여 한 방에 처치하세요. 범위 공격 무기를 사용하면 생성된 새끼들까지 처리할 수 있습니다. 화염방사기는 여왕과 새끼 모두에 피해를 줄 수 있기에 매우 효과적입니다.
5dim-enemies-electric-spitter=[color=#00FFFF]연쇄 번개 피해를 주는 밝은 청록색 스피터[/color].\n\n[font=default-bold]특징:[/font]\n• 전기/번개 피해\n• 주변 목표 사이로 튕길 수 있음\n• 진화 요인 30% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n연쇄 피해를 줄일 수 있도록 포탑 사이에 넓은 간격을 두는 것을 권장합니다. 동일한 양의 포탑이더라도 흐트려서 방어하는 것이 더 효과적입니다.
5dim-enemies-fire-spitter=[color=#FF6600]불을 뿜는 주황색 스피터[/color].\n\n[font=default-bold]특징:[/font]\n• 체력이 25% 적음\n• 명중 시 지속 화염 피해를 입힘\n• 지면에 불이 붙게 함\n• 진화 요인 20% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n이들의 발사체는 기지를 불태울 수 있습니다. 포탑 주변에 벽돌이나 콘크리트 등 바닥재를 설치하세요. 화염 내성 아머를 착용하면 방어력 증가에 더 도움이 됩니다.
5dim-enemies-full-battle=요새화된 방어선을 상대로 한, 모든 적 유형의 합동 공격을 지켜보세요!\n\n[font=default-bold]전투에 등장하는 적:[/font]\n• 일반, 레이저, 물리, 충격 바이터\n• 여왕 (새끼 생성)\n• 군집 바이터 (다수의 작고 빠른 적)\n• 재생, 광폭 바이터\n• 화염, 로켓, 독, 전기 스피터\n\n[font=default-bold]방어 구성:[/font]\n• 기관 포탑 포대 (전방)\n• 레이저 포탑 포대 (높은 피해)\n• 화염방사기 포탑 포대 (범위 피해)\n• 돌 벽 (방어 시설)
5dim-enemies-impact-biter=[color=#8B4513]충격 피해를 주는 짙은 갈색의 거대한 바이터[/color].\n\n[font=default-bold]특성:[/font]\n• 체력 30% 증가\n• 공격력 50% 증가\n• 이동 속도 15% 감소\n• 충격 피해에 내성이 있음\n• 진화 요인 10% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n이들은 이동 속도가 느리므로 카이팅(치고 빠지기) 전술이 효과적입니다. 적들이 벽에 도달하기 전에 원거리 무기를 이용해 수를 줄여보세요.
5dim-enemies-intro='5Dim's Enemies'는 특화된 적 유형, 10단계로 구성된 티어 시스템, 그리고 매우 강력한 보스 적을 추가하는 등, 적 시스템을 전면 개편했습니다.\n\n각 적 유형은 고유한 특성, 내성, 행동 양식을 가지고 있으며, 이를 물리치려면 다양한 전략이 필요할 것입니다. 각 유형에 대해 잘 파악하고 알맞은 방어 전략을 세우세요.
5dim-enemies-laser-biter=[color=#4444FF]레이저 저항력이 높은 파란색 바이터[/color].\n\n[font=default-bold]특징:[/font]\n• 85% 이상의 높은 레이저 피해 저항\n• 일반적인 물리 공격에 취약\n• 진화 요인 10% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n기관 포탑, 화염방사기, 대포를 활용해보세요. 레이저 포탑은 이 적에게 거의 효과가 없습니다.
5dim-enemies-normal-biter=기본 게임의 적들과 비슷한 평범한 바이터입니다.\n\n[font=default-bold]특징:[/font]\n• 특별한 내성 없음\n• 모든 티어에서 균형 잡힌 능력치\n• 진화 요인 0% ~ 80%에서 출현\n\n[font=default-bold]전략:[/font]\n어떤 무기 유형이든 효과적입니다. 방어 시설 테스트에 적합합니다.
5dim-enemies-physical-biter=[color=#AAAAAA]뛰어난 물리적 저항력을 지닌 은회색 장갑형 바이터[/color].\n\n[font=default-bold]특성:[/font]\n• 85% 이상의 높은 물리 피해 저항\n• 높은 고정 피해 감소\n• 진화 요인 10% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n레이저 포탑, 화염방사기, 폭발물을 사용하세요. 기관 포탑은 이 유형의 적에게 매우 적은 피해만 가할 수 있습니다.
5dim-enemies-poison-spitter=[color=#006600]독 피해를 주는 짙은 초록색 스피터[/color].\n\n[font=default-bold]특징:[/font]\n• 지속적인 독 피해를 가함\n• 독 효과는 중첩 가능\n• 진화 요인 20% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n독은 시간이 지남에 따라 구조물에 피해를 줄 수 있습니다. 복구 팩과 로봇은 필수적이며, 개인용 방어막은 독 피해에 대처하는 데 도움이 됩니다.
5dim-enemies-railgun=[color=#008080]'우주 시대'의 레일건 공격에 내성을 가진 청록색 적[/color].\n\n[font=default-bold]등장 유형:[/font]\n• 레일건 바이터\n• 레일건 스피터\n• 레일건 땅벌레\n\n[font=default-bold]특징:[/font]\n• 레일건/관통 피해에 대한 높은 저항력\n• 진화 요인 20% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n일반적인 무기로 공격하세요. 레일건과 관통 탄약은 적은 피해만 입힐 것입니다.
5dim-enemies-regenerator-biter=[color=#00FF00]매우 빠른 자연 체력 회복이 가능한 밝은 초록색 바이터[/color].\n\n[font=default-bold]특징:[/font]\n• 체력 25% 감소\n• [color=cyan]자연 회복 속도 5배[/color]\n• [color=red]불에 약함 (-25% 저항)[/color]\n• 진화 요인 20% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n집중 공격을 통해 빠르게 처치하거나, 화염 피해 약점을 공략하세요. 이들이 후퇴하게 내버려 두면, 거의 즉시 체력이 완전히 회복된 상태로 다시 돌아올 것입니다.
5dim-enemies-rocket-spitter=[color=#FFFF66]폭발형 로켓을 발사하는 연노란색 스피터[/color].\n\n[font=default-bold]특징:[/font]\n• 체력 25% 감소\n• 폭발 시 범위 피해\n• 충돌 시 범위 피해\n• 진화 요인 30% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n범위 피해를 최소화하려면 방어 시설을 흐트려 배치하세요. 벽은 로켓 피해를 흡수하는 데 도움이 됩니다. 최우선적으로 저격해 처리하는 것을 추천합니다.
5dim-enemies-suicide-spitter=[color=#9900CC]죽을 때 폭발하는 짙은 보라색 스피터[/color].\n\n[font=default-bold]특징:[/font]\n• 체력 50% 감소\n• 이동 속도 50% 증가\n• [color=red]폭발 시 5배의 피해를 입힘![/color]\n• 진화 요인 30% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n기지에 도달하기 전에 원거리에서 처치하세요. 폭발로 인해 포탑과 벽이 파괴될 수 있습니다. 절대 핵심 시설 근처까지 접근하게 둬서는 안됩니다.
5dim-enemies-swarm-biter=[color=#FFD700]떼거지로 몰려와 공격하는 황금색/황갈색 바이터 무리[/color].\n\n[font=default-bold]특징:[/font]\n• 체력 75% 감소 (매우 취약)\n• 공격력 50% 감소\n• 이동 속도 50% 증가\n• 70% 크기 (더 작음)\n• [color=cyan]산란장이 2배속으로 2배 더 많은 유닛을 생성[/color]\n• 진화 요인 10% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n범위 공격 무기가 효과적입니다. 화염방사기, 로켓, 수류탄을 이용해 무리를 통째로 쓸어버리세요. 단일 대상 무기는 압도당하고 말 것입니다.
5dim-enemies-tank=[color=#808000]모든 피해 유형에 대해 균등한 저항력을 가진 군용 초록색 적[/color].\n\n[font=default-bold]변종:[/font]\n• 탱커 바이터\n• 탱커 스피터\n• 탱커 땅벌레\n\n[font=default-bold]특성:[/font]\n• [color=cyan]모든 피해 유형[/color]에 50% 저항을 가짐 (물리, 레이저, 화염, 독, 전기, 폭발, 산, 충격)\n• [color=cyan]체력 2배[/color] (매우 튼튼함)\n• [color=red]받는 피해 65% 감소[/color]\n• 이동 속도 20% 감소\n• 고정 피해 감소 없음, (백분율 감소만 존재함)\n• 진화 요인 15% ~ 100%에서 출현\n\n[font=default-bold]전략:[/font]\n이 적에게 특히 효과적이거나 약한 특정 무기 유형은 존재하지 않습니다. DPS가 가장 높은 무기를 사용하세요. 이 적들의 피해량은 낮기 때문에 당장의 위협이 되지는 않지만, 더 위험한 적들이 접근하는 동안 어그로를 분산시킬 수 있습니다.
5dim-enemies-tiers=5Dim의 적들은 이제 10단계(MK1~MK10) 티어로 등장하며, 강력한 보스 변종들도 추가되었습니다.\n\n[font=default-bold]티어 진행:[/font]\n• 티어는 진화 계수에 따라 조정됩니다.\n• 티어가 높을수록 체력, 공격력, 저항력이 증가됩니다.\n• 모든 진화 수준에서 3개의 티어가 활성화됩니다..\n• 각 유형마다 소환되는 진화 범위가 다릅니다.\n\n[font=default-bold]보스 적:[/font]\n• 높은 진화 요인에서만(90% 이상) 등장합니다.\n• 체력과 공격력이 2배 증가합니다.\n• 크기가 2배로 커집니다 (거대함)\n• 이동 속도는 느리지만 훨씬 더 위험합니다.

