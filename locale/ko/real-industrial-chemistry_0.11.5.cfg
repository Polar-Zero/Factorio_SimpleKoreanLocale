ric-zinc-electrowinning=전기화학적 회수 방식을 이용해 용액 속의 금속을 고체 아이템으로 도금한다.
ric-zinc-sulfate-leach=침출 공정을 통해 분쇄되거나 농축된 아이템을 후반 정제 공정에 적합한 용액 형태로 전환합니다.
ric-zircaloy-cladding=지르콘 합금 단열재 제작과 관련된 Industrial Alchemy 공정 단계입니다.
ric-waste-treatment-plant=광미, 광재, 산성수, 산성 폐수, 중화된 폐수류를 처리하여 초기 산업 운영이 교착 상태에 빠지지 않도록 합니다.
ric-solid-fuel-from-fuel-gas=하급 연료 가스를 고체 연료로 압축하여, 초기 분해 루프가 배출 가스로 인해 막히는 것을 방지합니다.
ric-solid-fuel-from-petroleum-coke=연료, 환원제 또는 화학용 탄소로 사용하기 위해 고체 탄소 원료를 가공합니다.
ric-sort-copper-ore-to-chalcopyrite='광석 가공' 연구가 완료되면 광석을 황동석으로 분류합니다.
ric-sort-copper-ore-to-malachite=구리 광석을 말라카이트로 분리하는 Industrial Alchemy 공정 단계입니다.
ric-sulfur-dioxide-oxidation=이산화황을 산화시켜 삼산화황으로 만들고, 이를 이용해 황산을 생산합니다.
ric-sulfur-sorbent-cake-to-gypsum=유황 흡착제 케이크를 석고로 전환하는 Industrial Alchemy 공정 단계입니다.
ric-treat-wastewater=초기 세척 및 중화 공정용 기본 폐수 정화.

