[technology-description]
ric-advanced-battery-chemistry=배터리 단자, 리튬 이온 전지, 관련 아이템 제작이 가능합니다.
ric-advanced-board-materials=사전 함침된 에폭시 유리, 보강 구리 라미네이트, 솔더 마스크 잉크, 클린룸 용매제 카트리지, 부식액, 고밀도 회로 기판 제작이 가능합니다.
ric-advanced-ore-processing=기본적인 분쇄, 선별을 넘은, 고효율 광석 전처리 경로를 해금합니다.
ric-advanced-process-equipment=압력, 부식, 여과 등 연속적인 화학 공정에 사용되는 고급 공정 기계를 해금합니다.
ric-advanced-process-machinery=산업 공정 후반를 책임지는 고급 반응로, 증류탑, 전기화학 기계를 해금합니다.
ric-advanced-radiochemical-processing=원자력 산업을 발전시켜주는 고급 우라늄, 핵화학적 분리 단계를 해금합니다.
ric-advanced-refractories=고온의 열을 처리할 수 있는 개선된 전기 용광로 제작과 합금 생산에 사용할 수 있는 단열재를 해금합니다.
ric-alloy-steel-processing=크로마이트, 연망간석, 니켈, 강철을 철합금과 스테인리스강 형태로 변환합니다.
ric-aluminium-smelting=홀-에루 공정을 이용해, 알루미나를 알루미늄 주괴, 판, 전선 형태로 변환합니다.
ric-ammonia-processing=질소와 수소를 결합하여 암모니아를 생성한 후, 이를 산화시키면 질산을 만들 수 있습니다.
ric-basic-chemistry=안정화된 강철 생산 설비 구축 이후 사용할 수 있는, 기초적인 화학 기계와 공기 분리 공정을 추가합니다.
ric-basic-modules=기본적인 모듈은 이제 고급 회로 업그레이드 이후 단계에서 사용할 수 있게 되며, 제작 비용이 감소되었습니다.
ric-blast-furnace=제철 용광로와 소결, 주조, 선철, 구리 매트, 블리스터 구리, 초기 광재 정화 공정을 해금합니다.
ric-byproduct-utilisation=잔여물, 광물성 잔류물, 광재, 석고, 야금 분말을 유용한 건설용 골재, 판, 시멘트 첨가물, 하급 용광로 원료로 변환합니다.
ric-ceramics=화학적 제작이나, 전자공학적 목적으로 사용할 수 있는 세라믹 분말 분류, 절연체, 내열 소재를 해금합니다.
ric-chlor-alkali-processing=염수는 염소, 수산화나트륨, 염산으로 분리할 수 있습니다.
ric-chlorinated-polymers=에틸렌을 이용한 염소 화학 반응을 진행하면 염화비닐과 폴리염화 비닐을 생산할 수 있습니다.
ric-circuit-board-fabrication=구리, 수지, 유리 섬유, 화학 물질을 사용 가능한 회로 형태로 제작할 수 있는 경로를 해금합니다.
ric-coking=야금 공정이나 석유화학 공정 초반부에 사용할 수 있는 코크스로와 코크스, 석탄타르, 연료 가스, 산업용 탄소를 해금합니다.
ric-component-logistics=자동화 단계 직후 사용할 수 있도록 구성된 초기 물류 구성입니다.
ric-construction-materials=콘크리트, 유리, 석회 등의 산업용 건설 자재를 잠금 해제합니다.
ric-controlled-release-fertilizers=황산암모늄 회수, 석회로 안정화시킨 질산염 비료, 복합 NPK 혼합, 수지 코팅된 서방형 비료 생산을 추가합니다.
ric-copper-fire-refining=부유 제련, 블리스터 구리의 건식 정련, 양극 주조 공정, 구리 박판 코일을 사용할 수 있게 됩니다.
ric-corrosion-resistant-components=스테인리스강과 폴리염화 비닐을 이용한 스테인리스강 톱니바퀴와 내식성 파이프 제작이 가능합니다.
ric-electric-engines=윤활유와 기계 프레임을 생산할 수 있다면, 화학 과학 단계에서 전기 엔진을 사용할 수 있게 됩니다.
ric-electrolysis=전기 분해 공장과 수소, 산소 생산에 사용할 수 있는 물 전기분해 제작법을 해제합니다.
ric-fast-logistics=빠른 벨트는 산업용 강철 이후의 강철/부품 업그레이드로 조정되었습니다.
ric-fertilizer-chemistry=암모니아, 질산, 인산, 이산화탄소, 탄산칼륨을 이용하면 비료 중간 생산품이나 폭발물 원료로 사용할 수 있는 질산암모늄을 생산할 수 있습니다.
ric-fluorine-chemistry=형석을 이용해 불화 수소산, 불화 나트륨, 불화 알루미늄, 크라이오라이트 등을 생산해보세요.
ric-glass-chemistry=전자적 회로, 건설, 설비 제작에 사용되는 유리 아이템과 유리 섬유 화학 기술을 해금합니다.
ric-high-tech-electronics=공기 청정기, 고급 공정 제어에 사용할 수 있는 전자적 중간 생산품 사용이 가능합니다.
ric-hydrometallurgy=금속 회수 목적으로 사용할 수 있는 침출, 용액 정제, 침전, 전해 채취 공정을 해금합니다.
ric-industrial-catalysis=고효율 화학 반응을 위해 사용되는 촉매, 지지체, 귀금속 촉매 제조 기술을 해금합니다.
ric-industrial-fuels-and-emissions=석탄과 코크스를 명시적인 연료 아이템으로 가공한 뒤 이를 이용한 흡착제를 생산하면, 기본 게임의 공정처럼 배출물을 숨기지 않고, 오염된 배기 가스를 폐기물 처리 공정으로 넘길 수 있습니다.
ric-industrial-gas-utilities=고급 산업 설비에 필요한 압축 공기, 건조 계장 공기, 불활성 질소 블랭킷 가스 및 산소 농축 공정용 공기 계통을 추가합니다.
ric-industrial-oxidizers=폭발물 제작이나 화학 공정에 사용되는 질산, 과산화수소, 산화제 제작법을 해제합니다.
ric-integrated-steelmaking=산업적 야금 생산과 관련된 직접 환원철, 산소 기반 강철 제련, 강철 평판, 박판 코일, 성형된 강철 프레임을 추가합니다.
ric-lead-acid-storage=납 판과 황산을 이용해 납 축전지를 제작할 수 있게 됩니다.
ric-lead-tin-metallurgy=방연석과 석석을 가공해 납, 주석, 땜납을 생산할 수 있습니다.
ric-light-alloys=알루미늄, 니켈, 아연, 탄화 규소, 고무, 에폭시를 이용해 경량 구조, 저밀도 구조물을 제작해보세요.
ric-light-metal-forming=알루미늄 빌렛, 알루미늄 박판, 알루미늄 압출재, 경합금 구조물을 제작할 수 있게 됩니다.
ric-lime-and-soda-chemistry=폐수 처리, 산업 전반에 걸쳐 사용되는 생석회, 소석회, 소다회 제작법과 탄산염 화학 공정을 해금합니다.
ric-lithium-chemistry=스포듀민을 가공해 탄산 리튬, 수산화 리튬, 불화 리튬, 배터리 전해액으로 가공할 수 있게 됩니다.
ric-lubricant=중유 잔류물을 가공하여 첫 번째 중유 정아이템인 윤활유와 역청을 생산해보세요.
ric-magnesium-processing=염수에서 염화마그네슘을 회수하고, 이를 전기분해하면 티타늄 환원에 사용할 수 있는 마그네슘이 나옵니다.
ric-mechanical-engines=기계식 엔진은 이제 플레이어가 전문적인 화학 분야로 진입하지 않더라도, 산업용 강철이 등장한 시점부터 사용할 수 있도록 조정되었습니다.
ric-naphtha-cracking=나프타를 분해해 플라스틱 생산에 사용할 수 있는 중간 생산품과 연료 가스로 분해할 수 있게 됩니다.
ric-natural-gas-processing=천연가스를 메탄, 경알칸, 합성가스, 수소, 올레핀 원료로 가공할 수 있게 됩니다.
ric-nuclear-fuel-chemistry=RIC 핵화학 공정을 통해 우라늄 연료 펠릿, 단열재, 연료봉을 원자로에 사용할 수 있는 기본 게임의 우라늄 연료 전지 형태로 포장할 수 있습니다.
ric-oil-processing=화학 과학 팩 없이도 타르, 원유 정제를 시작할 수 있습니다.
ric-olefins-and-aromatics=나프타를 분해하여 올레핀을 생산하고, 페놀, 아세톤, 스티렌, 수지 화학 공정에 필요한 방향제 화합물을 추출해보세요.
ric-ore-processing=광석 선별기와 기본 원료 광석 선별, 등급별 선별 제작법, 건식 농축, 기계 프레임을 해금합니다.
ric-ore-processing-1=첫 번째 RIC 공정 이정표: 광석 선별기, 기계 프레임, 석회석 플럭스, 건식 농축, 초기 판 제작 경로, 잔여물 배출 등 공정 사용이 가능합니다.
ric-petrochemical-cracking-reforming=가스오일 수소화 처리와 증기 분해, 열분해 가솔린 정제, 개질유/방향제 추출, 알킬 연료 혼합을 해금하여 석유화학적 공정을 강화시킵니다.
ric-phosphate-chemistry=비료, 무기화학 분야에 사용되는 인산염 가공 기술을 해금합니다.
ric-plastics=석유화학적 원료를 회로나 화학 과학 팩 제작에 사용되는 표준 플라스틱 막대로 변환합니다.
ric-polymer-additives=후속 공정에 사용되는 고분자 첨가제, 가소제, 그리고 고무 배합, 강화된 고분자 박판 생산, 주조된 수지 화합물을 추가합니다.
ric-precious-metal-refining=은, 금 생산에 필요한 귀금속 침출, 침전, 정제 공정을 추가합니다.
ric-process-media-engineering=석유화학 정유 공정에 제올라이트 흡착, 활성 알루미나, 촉매층 매체, 촉매 충전재, 사용된 촉매 미세 입자 회수 등을 추가합니다.
ric-rare-earth-precipitation=여과, 추가 정제를 위해 용액에서 녹은 금속이나 소금을 침전시킵니다.
ric-rare-earth-processing=고급 소재 제작을 위해 희토류 침출, 분리 공정을 활용합니다.
ric-real-ore-processing=단축된 기본 광석 처리 경로를 넘어선 현실적인 광석 처리 경로 사용이 가능합니다.
ric-refined-concrete=Industrial Alchemy의 광물, 결합제 생산 공정을 이용한 고급 건축 자재를 생산할 수 있게 합니다.
ric-refinery-fractionation=진공 증류, 지연된 코크스화, 산성수 흡착, 배기가스 회수, 배기가스 회수 및 개질, 석유 코크스, 아스팔트 바인더, RIC 고체 연료 생산 공정을 추가합니다.
ric-rubber-and-resins=확장된 석유화학 공정을 통해 페놀 수지, 에폭시 수지, 합성 고무, 폴리프로필렌을 생산합니다.
ric-semiconductor-fabrication=클린룸 웨이퍼, 리소그래피, 포장을 비롯한 반도체 생산 단계를 해제합니다.
ric-sour-gas-processing=사워 가스를 정제하고, 황화수소 산화와 클라우스 황 회수 공정을 통해 황을 회수할 수 있습니다.
ric-stainless-forming=고급 공정 장비를 위한 철합금 원료와 스테인리스 빌렛, 스테인리스 박판 코일, 내화 구조물을 추가합니다.
ric-steel-processing=압연기, 빌렛 공정을 해금합니다. 곧 일반적인 강철 생산 공정은 강철 성형 공정으로 대체될 것입니다.
ric-sulfate-leaching=준비된 광석 원료에서 금속을 추출하기 위해 황산염을 활용할 수 있습니다.
ric-sulfide-flotation=기본 화학 공정이 구축된 후 사용할 수 있는 부양 정제 공정을 추가합니다.
ric-sulfur-processing=구리 배소, 황화수소 연소 공정을 이산화황 생산 공정과 연결합니다.
ric-sulfur-recovery=배터리, 고급 회로, 폭발물, 화학 연구에 사용할 수 있도록 이산화황으로부터 원소 황을 회수합니다.
ric-sulfuric-acid-production=이산화황을 산화시킨 뒤 삼산화황을 수화시키면 배터리 제작이나 화학적 목적으로 사용할 수 있는 황산이 나옵니다.
ric-syngas-chemistry=연료 가스를 합성가스, 메탄올, 포름알데히드, 수소, 메탄, 일산화탄소를 비롯한 초기 경용매 아이템으로 분해합니다.
ric-titanium-alloys=티타늄, 알루미늄, 몰리브덴, 니켈을 결합해 고급 티타늄 합금을 제작해보세요.
ric-titanium-forming=고급 설비 제작에 사용되는 티타늄 빌렛과 티타늄 박판 제작이 가능합니다.
ric-titanium-metallurgy=티탄철석와 금홍석을 원료로 사용해 이산화 티타늄, 사염화 티타늄, 티타늄 스펀지, 티타늄 판을 생산해보세요.
ric-tool-steel-and-high-temperature-alloys=공구강, 철합금, 내열 금속의 합금화 제작법을 개척합니다.
ric-tungsten-molybdenum-processing=텅스텐, 몰리브덴 광석을 가공, 침전해 금속을 생산할 수 있도록 합니다.
ric-uranium-chemistry=고급 동위원소 연구에 앞서 우라늄 침출, 화학 물질 취급 과정을 가능하게 합니다.
ric-uranium-fluoride-processing=고급 우라늄 가공에 필요한 불소 화학 처리와 관련된 가능성을 열어줍니다.
ric-utility-water-treatment=탈염수 정제, 부식 방지제 혼합, 보일러 급수, 냉각수 준비, 블로우다운 처리, 사용된 냉각수 정제 제작법을 추가합니다.
ric-waste-heat-recovery=연료 가스를 회수하고, 정유 공정을 통해 탈황 공정을 진행한 다음, 석유 코크스를 가스화하고, 고체 연료를 혼합한 다음, 뜨거운 배출 가스를 세척 공정이 완료되기 전 사용 가능한 증기 형태로 변환합니다.
ric-waste-stream-recycling=산성 유체 폐기물, 용매 폐기물, 식각액 폐기물, 광물 분진, 재, 흡착 잔류물, 여과 케이크, 침전물 등의 정화를 회수 가능한 환경 처리 공정으로 표준화합니다.
ric-waste-treatment=폐수 처리 시설과 초기 중화 공정을 추가해 세척수, 광재, 잔여물, 산성수에 대한 배출 경로를 확보합니다.
ric-wet-ore-processing=물류 과학 팩 단계에서의 대규모 처리 공정 운영을 가능하게 합니다. 광석 세척, 폐수 처리, 잔여물 처리 공정 사용이 추가됩니다.

[mod-setting-name]
ric-full-overhaul=기본 생산 시스템 전면 개편

[mod-setting-description]
ric-full-overhaul=활성화하면 Real Industrial Chemistry 모드에서 기본 철, 구리, 강철, 황, 황산 생산 공정을 대체합니다. 가급적 활성화로 진행하는 것을 권장하며, 추가 기능 테스트나 디버깅 시에만 비활성화하십시오.