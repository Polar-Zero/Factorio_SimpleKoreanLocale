[recipe-category-description]
ric-advanced-distillation=Advanced distillation and precision fractionation in late process equipment.
ric-advanced-electrochemistry=후반 공정 장비에서의 전문적인 전기화학적 처리와 관련된 제작법이 포함됩니다.
ric-air-separation=공기의 산소, 질소와 같은 기체로 분리하는 것과 관련된 제작법이 포함됩니다.
ric-blast-furnace=광석 아이템의 야금과 고온 환원과 관련된 제작법이 포함됩니다.
ric-casting=녹은 금속을 제련하고 주괴, 빌렛, 평판, 판과 같은 중간 아이템을 생산하는 데 관련된 제작법이 포함됩니다.
ric-catalysis=촉매 공정 설비에서의 촉매 화학 제작법이 포함됩니다.
ric-catalytic-reforming=촉매를 이용한 고급 정유소 제작법이나 개질유 생산과 같은 제작법이 포함됩니다.
ric-chemical-reactor=호환성이나 향후 개선 목적으로 남겨둔 화학 반응로 공정의 부가 제작법입니다.
ric-chemistry=화학 반응로 내에서 진행할 수 있는 일반적인 산업용 화학 공정 제작법이 포함됩니다.
ric-cleanroom-electronics=클린룸 설비가 필요한 무균 전자 반도체 생산과 관련된 제작법이 포함됩니다.
ric-coking=오븐이나 코크스로에서 석탄, 석유 코크스 등 탄소가 다량 함유된 아이템을 제작하는 것과 관련된 제작법이 포함됩니다.
ric-crushing=광석, 광물, 석탄, 공정 아이템의 기계적 분쇄와 관련된 제작법이 포함됩니다.
ric-delayed-coking=중유 잔류물의 코크스나 기타 정유 유체로의 열분해와 관련된 제작법이 포함됩니다.
ric-distillation=유체 또는 기체 형태의 원유 관련 객체의 분별, 증류와 관련된 제작법이 포함됩니다.
ric-electrolysis=전기분해 분해나 염소-알칼리 방식의 전기화학 생산과 관련된 제작법이 포함됩니다.
ric-electrowinning=전기분해를 진행한 금속의 전기화학적 회수, 정제와 관련된 제작법이 포함됩니다.
ric-extrusion=일부 금속 아이템 제작에 필요한 기계적 압출이나 압력 성형과 관련된 제작법이 포함됩니다.
ric-field-grading=기존 버전의 모드를 사용한 게임이나 일반적인 광석 채굴을 위한 비상용 제작이 포함됩니다. 공장 생산 공정에 적합하지 않습니다.
ric-flotation=물, 시약, 농축된 광석 처리를 포함한 황화물, 광물 부유 정제 관련된 제작법이 포함됩니다.
ric-high-pressure-chemistry=고급 합성이나 수소 처리 등 고압 화학과 관련된 제작법이 포함됩니다..
ric-hydrotreating=정유 관련 아이템이나 오염된 석유화학 유체의 수소 처리와 관련된 제작법이 포함됩니다.
ric-ore-sorting=채광한 광석이나 광물성 유체의 건식 제련 또는 부유선광, 분리 등과 관련된 제작법이 포함됩니다.
ric-oxygen-converting=대규모 강철, 금속 변환 공정에 사용되는 산소 사용 정제와 관련된 제작법이 포함됩니다.
