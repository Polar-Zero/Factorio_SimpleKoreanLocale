[entity-description]
ric-advanced-distillation-column=고급 화학, 정제 공정에 사용할 수 있는 대량 생산용 분류탑입니다.
ric-advanced-electrochemical-cell=고급 전기화학 장치 제작, 고급 전기분해, 전기적 정제 공정에 사용됩니다.
ric-air-separator=야금, 유황 처리, 고압 화학 공정에 사용할 수 있도록 공기를 산소와 질소로 분리합니다.
ric-apatite=인산염이나 비료 화학 공정에 사용되는 인회석 자원 매장지입니다.
ric-bauxite=알루미늄 가공에 사용되는 보크사이트 자원 매장지입니다.
ric-blast-furnace=선철, 미처리 구리 등의 광재, 제련을 진행할 수 있는, 야금 주조용 용광로입니다.
ric-borax=유리, 세라믹과 같은 화학 공정에 사용되는 붕사 자원 매장지입니다.
ric-casting-machine=선철과 블리스터 구리를 표준 판 형태로 주조할 수 있는 기계. 산업용 금속 제련 공정 초반부에 사용됩니다.
ric-catalytic-reactor=암모니아, 메탄올, 과산화물의 개질이나 관련 화학 물질 생산을 진행할 수 있는 촉매 구동식 처리기입니다.
ric-catalytic-reformer=개질유, 방향제 화학 물질 생산에 사용되는 고급 촉매 정제 설비입니다.
ric-chemical-reactor=초반 무기화학, 중화, 산 처리, 기타 연계 공정에 사용되는 범용 화학 공장입니다.
ric-cleanroom-assembler=통제된 환경에서 회로 기판, 반도체, 웨이퍼, 정밀 전자 기기 등의 제작을 진행합니다.
ric-coke-oven=석탄 또는 분쇄된 석탄을 코크스로 변환하고, 석탄타르, 연료 가스 등의 부산물을 생산하는 설비입니다.
ric-crusher=실제 광석, 석재, 석탄을 분쇄된 원료 아이템 형태로 변환하는 초기 가동용 화력 설비입니다. 이 기계를 제작해 초기 설비 구동을 개시해보세요.
ric-delayed-coker=진공 잔류물을 석유 코크스나 더 가벼운 정제된 유체으로 분해할 수 있는 고급 정제 설비입니다.
ric-distillation-column=원유, 석탄타르, 나프타, 연료 가스, 중유 잔류물 처리에 사용되는 한 초기 분류 설비입니다.
ric-electrolyzer=물, 염수, 염소-알칼리, 불소 등의 고급 전기분해 공정에 사용되는 전기화학적 기계입니다.
ric-electrowinning-cell=황산염/침출수 용액에서 금속 음극을 회수하기 위한 수력야금 장치.
ric-flotation-cell=후속 수력야금 공정 전에 구리 분말, 포말을 농축하기 위한 친환경 황화물 정제 공정.
ric-fluorite=용매제, 특수 산 화학 공정을 위한 채굴 가능한 형석 매장지.
ric-gas-resource=Industrial Alchemy 전용 천연가스 또는 사워가스 유체 자원.
ric-graphite=탄소, 단열재, 전자 소재 제작에 사용되는 흑연 자원 매장지입니다.
ric-gypsum=황산염, 건설이나 부산물 관련 제작에 사용되는 석고 자원 매장지입니다.
ric-high-pressure-reactor=고압 합성, 수소화 공정을 위한 내압 공정 장비.
ric-hydrotreater=탈황 작업이나 정제소 분류 정제에 사용되는 고급 압력로입니다.
ric-kaolin=세라믹, 절연 재료에 사용되는 카올린 매장지입니다.
ric-limestone=플럭스, 분쇄된 석회석  제작에채굴 가능한 석회석 광상.
ric-ore-sorter=일반 광석과 암석을 실제 광석, 광물, 초기 정제된 광석으로 분류하는 건식 광석 선별기.
ric-ore-washer=분쇄된 광석과 분말을 세척하여 더 깨끗한 정제된 광석과 잔여물, 폐수를 분리하는 습식 처리기.
ric-process-machine-placement-contract=감사된 설치 면적, 배관 배치 계약이 포함된 Industrial Alchemy 공정 설비입니다.
ric-quartz=실리카, 전자 재료 생산 공정에  위한 채굴 가능한 석영 매장지.
ric-real-resource=Industrial Alchemy 모드의 실제 광석/산업적 광물 매장지입니다.
ric-roaster=가스/산 부산물 처리가 필요한 정제된 황화물 광석, 광물 화학 반응을 위한 산화로. 처리가 필요한 황화물 농축물, 광물 화학 처리를 위한 산화 용광로.
ric-rock-salt=염소, 염수, 나트륨, 염기성 무기 화학 물질을 생산에 사용할 수 있는 암염 자원 매장지입니다.
ric-rolling-mill=강철 빌렛과 이후의 금속 평판/시트를 사용 가능한 판, 성형된 산업용 인벤토리로 가공합니다.
ric-sintering-plant=제철 용광로에 적합한 철 원료 공급을 위해 미세 정제된 철 광석을 소결체 형태로 가공합니다.
ric-steam-cracker=가스유와 경질 탄화수소를 중간 생산품 원료로 분해하는 고급 석유화학 설비.
ric-sylvite=칼륨, 비료 화학에 사용되는 채굴 가능한 실바이트 광상.
ric-vacuum-distillation-column=기본 증류가 완료된 후 중유 잔류물, 진공 분별을 위한 고급 정제탑.
ric-waste-treatment-plant=잔여물, 광재, 산성수, 산성 폐수, 중화된 폐수류를 처리하여 초기 산업 운영이 교착 상태에 빠지지 않도록 합니다.

