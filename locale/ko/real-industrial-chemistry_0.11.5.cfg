[item-description]
ric-advanced-distillation-column=고급 화학, 정제 공정에 사용할 수 있는 대량 생산용 분류탑입니다.
ric-advanced-electrochemical-cell=고급 전기화학 장치 제작, 고급 전기분해, 전기적 정제 공정에 사용됩니다.
ric-air-separator=야금, 유황 처리, 고압 화학 공정에 사용할 수 있도록 공기를 산소와 질소로 분리합니다.
ric-aluminium-extrusion=프레임이나 저밀도 구조물 제작에 사용되는 경량 알루미늄 구조물 주성입니다.
ric-asphalt-binder=정유 공정 말단에서 회수한 역청을 건설에 사용할 수 있는 형태로 결합합니다.
ric-basic-oxygen-steel=산소 전환 공정을 통해 생산한 제련 중인 강철, 압연 처리 전 평판 형태로 주조해야 합니다.
ric-beneficiation-sludge=폐수 처리 과정에서 침전시켜야 하는 습식 광석 부산물입니다.
ric-blast-furnace=선철, 미처리 구리 등의 광재, 제련을 진행할 수 있는, 야금 주조용 용광로입니다.
ric-blister-copper=산업용 구리 판 주조에 사용할 수 있는 구리 제련 중간 생산품입니다.
ric-bornite-fines=부유 선광법을 이용해 분류할 수 있는 미세한 형태의 반동석입니다.
ric-bornite-lump-ore=구리 성분이 풍부한 미제련 황화구리 광석입니다.
ric-carbon=질산염 화학, 폭발물, 환원 제작법 등 후속 탄소 가공 공정에 사용할 수 있는 정제된 산업용 아이템. 코크스를 가공해 제작할 수 있습니다.
ric-casting-machine=선철과 블리스터 구리를 표준 판 형태로 주조할 수 있는 기계. 산업용 금속 제련 공정 초반부에 사용됩니다.
ric-catalytic-reactor=암모니아, 메탄올, 과산화물의 개질이나 관련 화학 물질 생산을 진행할 수 있는 촉매 구동식 처리기입니다.
ric-catalytic-reformer=개질유, 방향제 화학 물질 생산에 사용되는 고급 촉매 정제 설비입니다.
ric-chalcopyrite-fines=부유 선광법을 진행하기에 적합한 미세한 형태의 황화구리입니다.
ric-chalcopyrite-lump-ore=건식 농축에 적합한 거친 체분리 황화구리 광석.
ric-chemical-reactor=초반 무기화학, 중화, 산 처리, 기타 연계 공정에 사용되는 범용 화학 공장입니다.
ric-cleanroom-assembler=통제된 환경에서 회로 기판, 반도체, 웨이퍼, 정밀 전자 기기 등의 제작을 진행합니다.
ric-coke-oven=석탄 또는 분쇄된 석탄을 코크스로 변환하고, 석탄타르, 연료 가스 등의 부산물을 생산하는 설비입니다.
ric-copper-anode-slime=전기분해 구리 정제 과정에서 발생하는 귀금속 함유 잔류물.
ric-copper-matte=녹은된 황화구리 중간 생산품로, 블리스터 구리로 전환되어야 합니다.
ric-copper-sheet=전자기기, 접점, 향후 성형 아이템에 사용되는 평판 구리 아이템.
ric-copper-sulfide-froth=회수된 구리 함유 부양 포말.
ric-crusher=실제 광석, 석재, 석탄을 분쇄된 원료 아이템 형태로 변환하는 초기 가동용 화력 설비입니다. 이 기계를 제작해 초기 설비 구동을 개시해보세요.
ric-delayed-coker=진공 잔류물을 석유 코크스나 더 가벼운 정제된 유체으로 분해할 수 있는 고급 정제 설비입니다.
ric-direct-reduced-iron=산소 제강 전에 수소와 일산화탄소로 환원된 정제된 철 광석.
ric-distillation-column=원유, 석탄타르, 나프타, 연료 가스, 중유 잔류물 처리에 사용되는 한 초기 분류 설비입니다.
ric-electrical-contact=초기 물류, 회로에서 사용된 스탬핑 가공 접점 부품.
ric-electrolyzer=물, 염수, 염소-알칼리, 불소 등의 고급 전기분해 공정에 사용되는 전기화학적 기계입니다.
ric-electrowinning-cell=황산염/침출액 용액에서 금속 음극을 회수하기 위한 습식 제련 장비.
ric-fire-refined-copper=주조 또는 압연 전에 산소 화염 정제 과정을 거쳐 정제된 블리스터 구리.
ric-flotation-cell=후속 수력야금 공정 전에 구리 분말, 포말을 농축하기 위한 친환경 황화물 선광 장치.
ric-formed-steel-frame=강철 판, 판, 기계식 체결재로 제작된 조립식 프레임.
ric-hematite-fines=습식 세척을 통해 이점을 얻는 미세 적철석 분획.
ric-hematite-lump-ore=건식 농축에 적합한 거친 체분 적철석.
ric-high-pressure-reactor=고압 합성, 수소화 공정을 위한 내압 공정 기계.
ric-hydrotreater=탈황 작업이나 정제소 분류 정제에 사용되는 고급 압력로입니다.
ric-industrial-components=RIC 기계에 공통으로 사용되는 초기 기계/전기 부품.
ric-insulating-board=정식 전자아이템 제조 이전에 사용되던 원시적인 절연판.
ric-iron-sinter=용광로 환원을 위한 응집된 철 원료.
ric-light-alloy-structural-panel=우주 시대, 고급 인프라 공정에 사용되는 성형 경합금 패널.
ric-machine-frame=수작업 기계에서 산업용 기계로의 전환을 상징하는 구조용 프레임.
ric-magnetite-fines=습식 세척을 통해 이점을 얻는 미세 자철석 분획.
ric-magnetite-lump-ore=건식 농축에 적합한 거친 선별 자철석.
ric-malachite-fines=부유 선별에 적합한 미세 공작석 분획.
ric-malachite-lump-ore=공작석가 풍부한 굵은 구리 광석.
ric-metallurgical-dust=주조, 고온 금속 취급 과정에서 발생하는 미세 분진.
ric-metallurgical-flux=강철, 구리, 합금 정제용 석회와 형석 혼합 플럭스.
ric-mill-scale=열간 압연 과정에서 생성되는 산화철 스케일; 산 처리, 폐기물 처리를 통해 회수 가능.
ric-mineral-residue=건조된 여과 케이크, 재, 침전물 처리 과정에서 발생하는 안정된 광물 잔류물.
ric-neutralised-sludge=산성 유체, 부식액 처리 과정에서 발생하는 중화 잔류물.
ric-ore-sorter=일반 광석과 암석을 실제 광석, 광물, 초기 정제된 광석으로 분류하는 건식 광석 선별기.
ric-ore-washer=분쇄된 광석과 분말을 세척하여 더 깨끗한 정제된 광석과 잔여물, 폐수를 분리하는 습식 처리 기계.
ric-petroleum-coke=지연 코크스화 과정에서 발생하는 탄소 함량이 높은 정유 부산물; 고밀도 연료 중간재로 유용함.
ric-pig-iron=주철판 주조 또는 강철 빌렛 제조에 사용되는 고로 철 중간재.
ric-primitive-circuit-board=화학, 전자 부품의 본격적인 제조 공정에 앞서 진행되는 초기 회로 기판 중간 단계.
ric-recovered-metal-concentrate=야금 분진, 혼합 폐기물 흐름에서 회수된 저품위 정제된 광석.
ric-refractory-lining=고온, 부식성 공정 장비용 교체 가능한 내화 라이닝.
ric-roaster=가스/산 부산물 처리가 필요한 일부 정제된 광석의 화학 공정을 진행하는 산화로.
ric-rolling-mill=강철 빌렛화, 이후 금속 평판/시트를 가공하여 사용 가능한 판, 성형된 산업용 재료를 생산하는 설비.
ric-sintering-plant=제철 용광로에 적합한 철 원료 공급을 위해 미세 정제된 철 광석을 소결체 형태로 가공합니다.
ric-spent-hydrotreater-catalyst=가스오일 정제 과정에서 발생한 오염된 촉매 잔류물; 후속 재활용 공정을 통해 여기서 금속을 회수할 수 있다.
ric-steam-cracker=가스오일, 경질 탄화수소를 폴리머 원료로 분해하는 고급 석유화학 설비로, 가스오일과 경질 탄화수소를 분해하여 폴리머 원료로 전환합니다.
ric-steel-billet=강철 판으로 압연하기 위한 반아이템 강철입니다.
ric-steel-sheet=성형 프레임, 후속 기계에 사용되는 평판 강철입니다.
ric-steel-slab=강철 판, 강철 판으로 압연하기 위한 연속 주조 강철 원료입니다.
ric-steelmaking-charge=선철, 직환철, 그리고 용매제 등을 혼합하여 미리 준비한 산소전로 충전물.
ric-sulfur-sorbent-cake=배기가스, 공해 정화 과정에서 발생하는 황 함량이 높은 흡착물 잔류물.
ric-titanium-sheet=고성능 장비, 고급 인프라에 사용되는 압연 티타늄 아이템.
ric-vacuum-distillation-column=기본 증류가 완료된 후 중유 잔류물, 진공 분별 정제를 위한 고급 정제탑.
ric-waste-filter-cake=1차 폐수 정화, 사용된 유체 정화 과정에서 침전된 고체.
ric-waste-treatment-plant=습식 광석 처리 루프용 소형 폐수, 잔여물 처리 장비.

