[mod-name]
BiggerStacksPlus=묶음 크기 증가++(Bigger Stack Plus++)

[mod-description]
BiggerStacksPlus=아이템 묶음 크기와 용광로 제작 결과품 수량을 늘릴 수 있습니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[mod-setting-name]
multiple_enabled=이미 2개 이상의 아이템을 제공하더라도 조정
oil_enabled=원유 제작법 결과물 조정 활성화
oil-result=원유 제작법 결과물 배율 (1 ~ 10)
result=용광로/조립 기계 결과물 배율 (1 ~ 1,000)
result_enabled=용광로/조립 기계 결과물 조정 활성화
stack_enabled=LuaInventory 기본 묶음 크기 조정 활성화
tack_size=아이템 기본 묶음 크기 (100 ~ 10000)

[mod-setting-description]
multiple_enabled=활성화하면, 기본 제작법 생산량이 설정값만큼 추가됩니다.\n비활성화하면 용광로/조립 기계 제작 당 지정한 수량씩만 얻을 수 있습니다.
oil_enabled=활성화하면, 아래 결과물 설정값만큼 원유 관련 제작법 생산량을 곱합니다.\n비활성화하면 추가 제작품 관련 조정사항을 이 모드에서 적용하지 않게 됩니다.
result_enabled=활성화하면, 아래 결과물 설정값만큼 용광로, 조립 기계의 제작법 생산량을 곱합니다.\n비활성화하면 추가 제작품 관련 조정사항을 이 모드에서 적용하지 않게 됩니다.
stack_enabled=활성화하면, 아래 결과물 설정값만큼 묶음 크기 값을 곱합니다.\n비활성화하면 추가 제작품 관련 조정사항을 이 모드에서 적용하지 않게 됩니다.