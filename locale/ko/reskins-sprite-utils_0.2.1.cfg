[mod-name]
reskins-sprite-utils=장인의 재도색 - 이미지 도구(Artisanal Reskins: Sprite Utils)

[mod-description]
reskins-sprite-utils=Factorio 모드 개발을 위한 포괄적인 아이콘 및 스프라이트 이미지 도구 모음입니다. 원래 Artisanal Reskins(장인의 재도색) 모드 지원을 위해 개발되었지만, 완벽한 객체 유형 안전성과 광범위한 유효성 검사를 거친, 아이콘, 스프라이트 및 프로토타입을 조작할 수 있는 강력한 함수 도구를 제공합니다.\n\n번역: SimpleKoreanLocale(PolarZero)
