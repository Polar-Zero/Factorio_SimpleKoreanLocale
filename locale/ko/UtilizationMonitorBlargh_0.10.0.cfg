[mod-name]
UtilizationMonitorBlargh=사용률 모니터(Utilization Monitor (Blargh))

[mod-description]
UtilizationMonitorBlargh=공장, 광산, 연구소 및 화로의 사용률을 표시합니다. AndrasSuller의 UtilizationMonitor를 기반으로 하며, 0.18.27 패치와 일부 업데이트가 적용되었습니다.\n\n번역: SimpleKoreanLocale(PolarZero)

[]
utilization-monitor-limit-exceeded=사용률 모니터: 틱당 모니터링되는 객체 수가 '틱마다 처리할 객체' 설정값(__1__)를 초과했습니다. 모든 객체는 이제 제 때 확인되지 않으며 정확도가 감소될 수 있습니다. 문제가 발생한다면 모드 설정에서 "틱마다 처리할 객체" 값을 높여보세요.
utilization-monitor-stats=사용률 모니터: 현재 __1__개의 객체를 추적하고 있습니다.
utilization-monitor-reset=사용률 모니터: 초기화 완료. 이제 __1__개의 객체를 추적합니다. 사용률을 다시 표시하려면 사용률 표시(__CONTROL__toggle-utilization-monitor-labels__)를 전환해야 할 수도 있습니다.
utilization-monitor-help-reset=사용률 모니터 모드를 초기화한 뒤, 모든 객체를 다시 확인한 뒤 통계 구축을 처음부터 진행합니다.
utilization-monitor-help-stats=사용률 모니터 모드에 대한 기본 통계를 표시합니다.
utilization-monitor-debuginfo=마우스 아래의 객체와 관련된 문제가 있는 상황에서 관련된 정보를 출력합니다.
utilization-monitor-debuginfo-noentity=이 명령어는 마우스로 객체를 선택한 상태에서 실행해야 합니다.
utilization-monitor-debuginfo-line1=UtilizaitonMonitorBlargh debug data for unit number __1__, type __2__, name __3__, status __4__:
utilization-monitor-debuginfo-nottracked=This entity is not being tracked.
utilization-monitor-debuginfo-return=__1__ returns __2__
utilization-monitor-debuginfo-ed=Entity data field __1__ is __2__
utilization-monitor-debuginfo-edsub=Entity data field __1__.__2__ is __3__

[controls]
toggle-utilization-monitor=모드 활성화/비활성화
toggle-utilization-monitor-labels=사용률 표시/숨기기

[mod-setting-name]
utilization-monitor-enabled=활성화
utilization-monitor-show-labels=사용률 표시
utilization-monitor-entities-per-tick=틱마다 처리할 객체
utilization-monitor-always-perf=에너지 효율을 항상 계산
utilization-monitor-secs-assembling-machine=조립 기계 평균 처리 시간(0=비활성화)
utilization-monitor-secs-furnace=용광로 평균 처리 시간(0=비활성화)
utilization-monitor-secs-mining-drill=채광 드릴 평균 처리 시간(0=비활성화)
utilization-monitor-secs-lab=연구소 평균 처리 시간(0=비활성화)
utilization-monitor-secs-boiler=보일러 평균 처리 시간(0=비활성화)
utilization-monitor-secs-generator=발전기 평균 처리 시간(0=비활성화)
utilization-monitor-secs-reactor=원자로 평균 처리 시간(0=비활성화)
utilization-monitor-secs-pump=펌프 평균 처리 시간(0=비활성화)
utilization-monitor-secs-offshore-pump=해안 펌프 평균 처리 시간(0=비활성화)
utilization-monitor-color-spoolup=통계 구축 중인 사용률 색상
utilization-monitor-color-steady=정확한 사용률 색상
utilization-monitor-label-pos=사용률 표시 위치
utilization-monitor-label-alt=Alt-모드에서만 표시
utilization-monitor-force-player='플레이어' 세력만 추적
utilization-monitor-label-size=사용률 표시 크기
utilization-monitor-show-spoolup=통계 구축 중인 사용률 표시

[mod-setting-description]
utilization-monitor-enabled=모드를 활성화할지 여부를 설정합니다. 이 설정은 공장의 새로운 부분을 측정하고 싶지만 일반적인 상황에서 UPS를 유지하고자 할 때 유용합니다.
utilization-monitor-show-labels=사용률을 표시할지 여부. 비활성화하더라도 효율은 계산됩니다.
utilization-monitor-entities-per-tick=각 틱마다 (1/60초) 업데이트할 최대 객체 갯수입니다. 필요한 모든 객체를 추적하기에 충분하지 않다면 채팅 메시지가 한 번 표시되며, 이후 제한으로 인해 통계가 평균화되는 시간이 60초보다 길어지게 됩니다.
utilization-monitor-always-perf=에너지 공급이 기계 성능에 미치는 영향을 항상 계산하도록 합니다. 비활성화된 경우에도 이 계산은 전력이 90.909%보다 부족한 상황에서 수행됩니다. 활성화하면 오버헤드가 틱마다 약간씩 증가하지만, 90.909% ~ 100% 전력 상황에서의 정확도가 약간 향상됩니다.
utilization-monitor-color-spoolup=이 색상은 아직 통계 구축이 완료되지 않은 상황에서, 평균값을 표시할 경우에 사용됩니다 (위 설정의 '숫자 평균화'에 따라 다름)\n이 색상의 사용률은 생산량이 정확하지 않음을 의미합니다. 통계 구축이 완료되면다시 일반적인 색상으로 변경됩니다.
utilization-monitor-force-player=기본 Factorio 게임과 대부분의 모드는 'player' 진영이 소유한 객체를 다룹니다. 하지만 진영을 추가하는 일부 모드에서 여 진영을 다룰 경우, 이 설정을 비활성화해야 정상적으로 합니다. 플레이어는 이 설정이 적용되더라도 자신의 진영 건물의 효율만 볼 수 있습니다.
utilization-monitor-label-pos=사용률을 배치할 경계 상자 모서리 부분을 변경할 수 있습니다. (마우스를 올렸을 때 건물을 둘러싼 괄호 표시)\n일부 건물은 경계 상자 밖에도 그래픽을 표시할 수 있으며, 이 경우 일부 설정이 제대로 동작하지 않을 수 있습니다.
utilization-monitor-show-spoolup=통계를 완전히 구축하기 전에 사용률을 표시해야 할지 여부를 정의합니다.