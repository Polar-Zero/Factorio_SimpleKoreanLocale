[technology-description]
jetpack=활성화하려면 __CONTROL__jetpack__ 키를 누르세요.\n활성화한다면 건물과 물 위를 날아다닐 수 있습니다. 제트팩을 여러 개 장착해 더 빠르게 비행하는 것도 가능합니다. 제트팩은 인벤토리 내 연료를 사용하며, AAI 산업모드의 로켓 연료, 핵 연료, 처리 연료 등을 사용할 수 있습니다.
