[mod-name]
jetpack=제트팩(Jetpack)

[mod-description]
jetpack=빠른 속도로 건물이나 물 위를 비행할 수 있는 로켓 제트팩을 제작해보세요.\n\n번역: SimpleKoreanLocale(PolarZero), x2605

[jetpack]
menu_jetpack=제트팩 [img=item/jetpack-1]
title_jetpack=제트팩
page_jetpack_text_1=제트팩은 아머 내부의 장비 그리드에 장착할 수 있는 장비로, 제트팩이 아머에 장착된 상태에서 __CONTROL__jetpack__ 키를 누르면 인벤토리 연료를 이용해 비행할 수 있게 됩니다. 사용 가능한 연료는 로켓 연료, 핵 연료입니다. [color=0.5,0.7,0.8](다른 모드의 연료 중 일부 또한 사용 가능하며, 이에는 AAI Industry 모드의 처리된 연료가 포함됩니다.)[/color]\n\n비행을 시작하면 물과 건물 위로 날아다닐 수 있게 됩니다. 비행하는 동안의 이동은 가속도를 가지게 되며, 이는 급작스러운 방향 전환은 어렵게 하지만 더 빠른 추진력을 낼 수 있도록 합니다.\n\n제트팩은 4개의 티어를 가지며, 티어가 올라갈수록 추진력이 더 강해집니다. 여러 개의 제트팩을 착용해 더 빠른 속도를 내는 것도 가능합니다. [color=0.5,0.7,0.8](추진력 추가 기능은 모드 설정에서 비활성화할 수 있습니다)[/color]\n\n최종적인 가속도는 무게에 의해 감소되며, 이는 주로 아머 장비 그리드 크기에 영향을 받습니다. 또한, 가속도는 이륙 시에 화면에 표시됩니다. [color=0.5,0.7,0.8](플레이어별 모드 설정에서 알림을 끌 수 있습니다)[/color]\n\n제트팩은 보호막 피해를 증폭시킵니다, 이 수치는 더 빠르게 비행할수록 더욱 증가됩니다. 이러한 피해 증폭은 % 기반이며 피해량처럼 정확히 특정 수치가 지정되지 않습니다. [color=0.5,0.7,0.8](보호막 비율은 모드 설정에서 조정할 수 있습니다.)[/color]\n\n전투 중 제트팩을 사용하는 것은 매우 강력하지만, 그만큼 조심해야 합니다. 비행 중에 피해를 받으면 바닥으로 떨어질 수 있습니다. [color=0.5,0.7,0.8](모드 설정에서 이 효과를 비활성화할 수 있습니다.)[/color]

[entity-name]
jetpack-character=__1__ (비행)

[equipment-name]
jetpack-1=제트팩 장비 MK1
jetpack-2=제트팩 장비 MK2
jetpack-3=제트팩 장비 MK3
jetpack-4=제트팩 장비 MK4

[equipment-description]
jetpack-1=[font=default-bold][color=#f5cb48]추진력: 1[/color][/font]\n활성화하려면 __CONTROL__jetpack__ 키를 누르세요.\n활성화하면건물과 물 위로 날 수 있게 됩니다여러 제트팩을 장착하면 더 빠르게 비행할 수 있습니다. 제트팩은 당신의 인벤토리 내 연료를 소비하며, AAI 산업모드의 로켓 연료, 핵 연료, 처리된 연료를 사용할 수 있습니다.
jetpack-2=[font=default-bold][color=#f5cb48]추진력: 2[/color][/font]\n활성화하려면 __CONTROL__jetpack__ 키를 누르세요.\n활성화하면건물과 물 위로 날 수 있게 됩니다여러 제트팩을 장착하면 더 빠르게 비행할 수 있습니다. 제트팩은 당신의 인벤토리 내 연료를 소비하며, AAI 산업모드의 로켓 연료, 핵 연료, 처리된 연료를 사용할 수 있습니다.
jetpack-3=[font=default-bold][color=#f5cb48]추진력: 3[/color][/font]\n활성화하려면 __CONTROL__jetpack__ 키를 누르세요.\n활성화하면건물과 물 위로 날 수 있게 됩니다여러 제트팩을 장착하면 더 빠르게 비행할 수 있습니다. 제트팩은 당신의 인벤토리 내 연료를 소비하며, AAI 산업모드의 로켓 연료, 핵 연료, 처리된 연료를 사용할 수 있습니다.
jetpack-4=[font=default-bold][color=#f5cb48]추진력: 4[/color][/font]\n활성화하려면 __CONTROL__jetpack__ 키를 누르세요.\n활성화하면건물과 물 위로 날 수 있게 됩니다여러 제트팩을 장착하면 더 빠르게 비행할 수 있습니다. 제트팩은 당신의 인벤토리 내 연료를 소비하며, AAI 산업모드의 로켓 연료, 핵 연료, 처리된 연료를 사용할 수 있습니다.

