[mod-setting-description]
jetpack-speed-reduces-shields=속도에 따라 증폭될 보호막 피해량을 조정할 수 있습니다.
jetpack-fall-on-damage=활성화하면, 피해를 입을 때 지상으로 낙하합니다.
jetpack-thrust-stacks=활성화하면, 제트팩을 여러 개 장착한 만큼 추진력이 합산됩집니다. 비활성화되면 제트팩을 여러 개 장착했더라도 추진력이 증가되지 않습니다.
jetpack-print-thrust=제트팩을 켰을 때 최종 제트팩 가속도를 채팅창에 출력합니다.
jetpack-volume=제트팩 효과음 음량을 조정할 수 있습니다.
jetpack-fuel-consumption=제트팩의 연료 소모를 조절할 수 있습니다.
