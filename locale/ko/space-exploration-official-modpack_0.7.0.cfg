space-exploration-official-modpack=우주 탐사 - 공식 모드팩(Space Exploration Official Modpack)

[mod-description]
space-exploration-official-modpack=필수 모드 및 권장 모드가 포함된 공식 'Space Exploration' 모드팩입니다. 권장 모드를 모두 설치하고 싶지 않다면 모드팩을 사용하지 않더라도, 'Space Exploration' 메인 모드만 설치해도 필요한 모든 전제 조건 모드가 자동으로 설치됩니다.\n\n번역: SimpleKoreanLocale(PolarZero)