[mod-name]
ltn-space-exploration=LTN - 우주 탐사 호환(LTN - Space Exploration Integration)

[mod-description]
ltn-space-exploration=LTN 물류 기차 네트워크 모드가 우주 탐사 모드의 우주 엘리베이터와 호환되도록 합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[hps__lse-locale]
connect=LTN에 연결
connect_tooltip=연결된 상태일 경우 LTN에서 우주 엘리베이터를 통과하는 행성과 궤도 사이 기차 운행 배송을 진행할 수 있습니다.
cross_surface_delivery=[LSE] __1__에 대한 표면 간 배송 진행, 일치하는 표면 연결: __2__.
elevator_connected=[LSE] 표면 간 배송을 위해 __1__ 우주 엘리베이터를 LTN 네트워크 __2__에 연결했습니다.
elevator_connected_all=[LSE] 표면 간 배송을 위해 __1__ 우주 엘리베이터를 모든 LTN 네트워크에 연결했습니다.
elevator_disconnected=[LSE] LTN에서 __1__ 우주 엘리베이터 연결을 해제했습니다.
logistic_train_network=LTN - 물류 기차 네트워크
network_id=네트워크 ID
network_id_tooltip=우주 엘리베이터를 사용할 수 있는 모든 네트워크에 대한 인코딩된 네트워크 ID입니다.
networks=연결된 네트워크:
train_arrival=[LSE] [train=__1__] (__2__) 기차가 우주 엘리베이터를 통해 도착했습니다.
train_stranded=[LSE] [color=red][train=__1__] 기차가 __2__에서 분리, 고립되었습니다![/color]

[string-mod-setting]
hps__lse-debug-mode-0=0: 중요 오류만 표시
hps__lse-debug-mode-1=1: 오류, 경고
hps__lse-debug-mode-2=2: 메시지
hps__lse-debug-mode-3=3: 전체 디버그 로그

[mod-setting-name]
hps__lse-debug-mode=디버그 모드
hps__lse-elevator_clearance_name=통과역 이름
hps__lse-use_elevator_clearance=통과역 사용

[mod-setting-description]
hps__lse-debug-mode=디버그 정보 출력을 활성화합니다.
hps__lse-use_elevator_clearance=엘리베이터를 떠나 남은 기차 제한이 1인 목적지로 직접 향하는 기차는 "[color=purple]목적지 가득 참[/color]" 메시지를 표시할 수 있습니다. 이를 방지하려면 기차에 대한 통과역을 지정한 뒤 이로 향하도록 해야 합니다.\n통과역에는 [color=cyan]기차 제한이 없어야 하며[/color], 엘리베이터 출구 지점에서 최소 [color=cyan]기차 한 대 길이만큼 떨어져 있어야 합니다[/color].\n\n이 설정을 활성화하면 엘리베이터를 통과하는 모든 LTN 배송에 통과역이 추가됩니다. 아래 설정을 통해 통과역으로 사용할 기차 정류장 이름을 지정하세요.\n\nLTN 요청역/공급역은 Factorio의 기차 제한을 거의 적용받지 않기 때문에, 이 기능은 보통 주로 기차 제한이 존재하는 대기역에서 유용합니다.