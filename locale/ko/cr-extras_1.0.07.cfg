[mod-setting-description]
cr-agricultural-tower-black=작동 속도와 재배 면적이 증가한 업그레이드된 농업용 탑을 추가합니다.
cr-agricultural-tower-blue=작동 속도와 재배 면적이 증가한 업그레이드된 농업용 탑을 추가합니다.
cr-arcane-ore=이 모드의 대부분의 판 제작법에 필요한 아케인 광석과 관련 촉매 제작법, 그리고 일부 제작 기계에 사용할 수 있는 연료/재료 등을 추가합니다.
cr-assembling-machine=전자기 제작법을 추가로 제작할 수 있는 업그레이드된 조립 기계를 추가합니다.
cr-biochamber=업그레이드된 바이오 챔버를 추가합니다.
cr-biolab=혼합 음료(활성화 시)를 사용하는, 내성 모듈(속도를 크게 증가시키는 바이오 연구소 전용 모듈) 적용이 가능한 업그레이드된 바이오 연구소를 추가합니다.
cr-bonus-armor=게임 시작 시 핵융합로, 로보포트, 로봇, 외골격이 추가된 메가 아머를 지급합니다.
cr-bonus-inserter=투입기의 최소 가동 속도를 0.025로 증가시킵니다. (참고: 기본 투입기 속도는 0.014, 고속 투입기 속도는 0.04)
cr-bonus-robot=로봇의 기본 이동 속도를 6배로 증가시킵니다.
cr-bonus-weapon=게임 시작 시 기관단총과 우라늄 탄창 200개를 제공합니다.
cr-fire-foundry=용광로 제작법을 진행할 수 있는 업그레이드된 주조소를 추가합니다.
cr-ice-foundry=화학, 극저온 제작법을 제작할 수 있는 고급 주조소를 추가합니다.
cr-logistic-chest=2x2 크기에 인벤토리 슬롯이 250칸인 로봇 상자를 추가합니다.
cr-mixing-station=칵테일 제조기를 추가합니다. 칵테일은 섭취하거나 바이오 챔버/바이오 연구소에 연료로 사용할 경우 보너스를 부여합니다.
cr-turret=마법 피해를 주며, 한 번에 10시간 동안 작동하는 레이저 포탑을 추가합니다.