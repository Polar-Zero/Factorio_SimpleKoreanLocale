[mod-name]
cr-extras=크레토르의 추가 콘텐츠(Crethor's Extras)

[mod-description]
cr-extras=빠른 시작 옵션을 게임에 추가합니다:\n-메카 아머, 로보포트, 외골격절.\n- 고급 기관단총, 우라늄 탄약.\n- 로봇 기본 속도 증가\n- 투입기 기본 속도 증가\n\n폴리악스에서 원래 해금되는 더 많은 기계 (폴리악스 행성이 활성화되지 않은 경우에도)\n- 마법 용광로 (보강된 판 제작법 포함)\n - 조립 기계 (조립, 전자기 제작법)\n- 바이오 챔버 (유기 물질, 화학 제작법)\n- 혼합기 (연료 생성)\n- 고급 바이오 연구소 (고품질 과학 팩 소모)\n- 물류 상자 (2x2, 250칸)\n- 마법 타워 (독특한 피해 유형을 가진 레이저 포탑)\n- 농업용 탑 (향상된 속도, 경작지 추가)\n\n옵시디악스 행성에서 원래 얻을 수 있는 고급 기계 (옵시디악스 행성이 활성화되지 않았을 경우에도)\n- 화염 제련소 (야금, 용광로 제작법)\n- 극저온 제련소 (극저온, 화학 제작법)\n- 농업용 탑 (향상된 속도, 추가 경작지)\n\n번역: SimpleKoreanLocale (PolarZero)

