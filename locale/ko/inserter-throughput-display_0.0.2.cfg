[mod-name]
inserter-throughput=투입기 처리량(Inserter Throughput)
inserter-throughput-display=투입기 처리량(Inserter Throughput)

[mod-description]
inserter-throughput=투입기 처리량과 관련된 정보를 게임에 표시합니다\n\n번역: SimpleKoreanLocale(PolarZero)
inserter-throughput-display=투입기 처리량과 관련된 정보를 게임에 표시합니다\n\n번역: SimpleKoreanLocale(PolarZero)


[custom-tooltip-fields]
throughput-name=기본 처리량
throughput-value=__1__ 아이템/초

[runtime-tooltip-fields]
throughput-name=처리량
throughput-value=__1__ 아이템/초

[mod-setting-name]
show-base-throughput=기본 처리량 표시

[mod-setting-description]
show-base-throughput=투입기 툴팁에 기본 처리량 관련 정보를 표시할지 결정합니다. 기본 처리량은 보너스나 페널티가 전혀 적용되지 않은 상태에서의 최대 처리량을 의미합니다. 플레이어의 인벤토리나 제작 메뉴에서 해당 값만 확인할 수 있는데, 이는 데이터 로딩 단계에서(startup 단계) 해당 값이 설정되기 때문입니다.