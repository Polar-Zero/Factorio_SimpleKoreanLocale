[tips-and-tricks-item-description]
wooden-platform=[item=wooden-platform]은 지정된 기계와 인프라 시설을 물 위에 배치할 수 있도록 하는 모듈형 바닥재입니다. 플랫폼을 이용하면 공장을 호수, 강 또는 바다로 확장할 수 있지만, 가볍고 안정적인 구조물만 배치할 수 있는 한계가 존재합니다.\n설치 가능한 객체는 다음으로 한정됩니다: \n- [entity=pipe] 파이프\n- 배럴링 기계\n- [entity=radar]\n- 투입기\n- 운송 벨트\n- 물류/보관 상자\n- 조합기, 조명 등과 같은 회로 설비\n- 기관 포탑\n- 중기관 포탑 (설치된 경우)\n- [entity=flamethrower-turret] 화염 방사 포탑\n- 로켓 포탑\n- [entity=pump] 펌프 (디젤 펌프 제외)