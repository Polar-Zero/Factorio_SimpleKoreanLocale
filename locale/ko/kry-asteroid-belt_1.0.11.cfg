[mod-name]
kry-asteroid-belt=소행성대 개선(Better Asteroid Belt)

[mod-description]
kry-asteroid-belt=소행성대를 처음부터 다시 구현하고, 더욱 역동적인 형태로 개선합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


