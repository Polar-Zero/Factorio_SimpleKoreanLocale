[kry-belt-technology-description]
dummy-locale-key=┣ ┗  기호는 설정 제작시 매우 유용하게 사용할 수 있습니다.
primary=내행성과 외행성 경계, __1__ 지역으로 이동할 수 있게 됩니다.
secondary=이곳은 외행성과 태양계 가장자리, 그 너머의 경계, __1__ 지역으로 이동할 수 있게 됩니다.

[string-mod-setting-description]
kry-asteroid-belt-name-Kepler=우리 태양계의 화성과 목성 사이의 소행성대와 관련된 이론화를 처음 진행한 과학자 케플러의 이름에서 유래했습니다.
kry-asteroid-belt-name-Klothon=그리스 신화의 세 운명의 여신 중 생명의 실을 잣는 자인 클로토에서 유래했습니다.
kry-asteroid-belt-name-Kovarex=Factorio 게임 프로젝트를 처음 시작한 개발자의 이름에서 유래했습니다. 어떤 원자력 관련 공정 이름도 여기서 유래했을지도 모릅니다.
kry-kuiper-belt-name-Atropon=그리스 신화의 세 운명의 여신 중 생명의 실을 끊어내는 자인 아트로포스에서 유래했습니다.
kry-kuiper-belt-name-Kryzeth=이 선택지를 고른 이유가 궁금합니다. 굳이 알고 싶으시다면, 이 기능을 직접 코딩한 사람의 이름에서 유래한 것입니다.
kry-kuiper-belt-name-Kuiper=해왕성 궤도 너머에 얼음 천체들이 모인 구역이 존재한다는 가설을 처음으로 제시한 과학자 중 한 명의 이름인 카이퍼에서 유래했습니다.

[mod-setting-name]
kry-asteroid-belt-density=소행성대 밀도 배율
kry-asteroid-belt-name=주 소행성대 이름
kry-cubium-outer-planet=큐비움 행성을 외행성대로 이동
kry-cubium-vesta-moon=┗ 큐비움 행성을 베스타의 위성으로 설정
kry-kuiper-belt=보조 소행성대 설정
kry-kuiper-belt-name=┣ 보조 소행성대 이름
kry-maraxsis-outer-planet=마락시스를 외행성대로 이동
kry-maraxsis-solar-nerf=┗ 마락시스 태양 전지판 효율 줄이기
kry-vesta-past-kuiper=┗ 베스타를 보조 소행성대 외부로 이동

[mod-setting-description]
kry-asteroid-belt-density=소행성대 내부의 소행성 생성 확률 배율값을 정의합니다. (사용 가능한 값: 0.0 (소행성 없음) ~ 100.0 (매우 많은 소행성))
kry-cubium-outer-planet=밸런스 개선을 위해 큐비움 행성 위치를 ​​내행성계에서 외행성계로 변경합니다.
kry-cubium-vesta-moon=큐비움 행성이 베스타의 위성이 되도록 이동시킵니다. Orbital Catapult 모드가 활성화된 경우, 직접적인 우주 경로 대신 궤도 연결이 대신 사용됩니다.
kry-kuiper-belt=아퀼로와 태양계 가장자리 사이에 새로운 보조 소행성대를 추가합합니다. 단순히 시각적인 요소만 추가할 수도 있지만, 새로운 장소가 포함된 플레이 가능한 지역으로 설정할 수도 있습니다. 선택지를 활성화하면 해당 구역에 있던 기존 우주 요소들이 다른 곳으로 이동합니다.
kry-maraxsis-outer-planet=마락시스 행성을 ​​내행성계에서 외행성계로 변경하고, 아퀼로와 비슷한 난이도 수준으로 조정합니다.
kry-maraxsis-solar-nerf=난이도나 현실성 등을 고려해, 마락시스에서의 태양광 발전 효율을 75%에서 50%로 하향 조정합니다 (참고: 아퀼로 태양 발전 효율은 1%입니다) '마락시스를 외행성대로 이동' 옵션이 활성화되어 있어야 적용됩니다.
kry-vesta-past-kuiper=베스타를 ​​외행성계에서 보조 소행성대 ~ 태양계 가장자리 위치로 이동시킵니다. 보조 소행성대가 'Disabled'가 아닌 경우에만 적용됩니다.