[mod-name]
0-things=고급 객체 관리(Things)
0-cooperative-blueprinting=협력 설계도면 호스트(Cooperative Blueprinting Host)

[mod-description]
0-cooperative-blueprinting=Cooperative Blueprinting 프로토콜을 위한 최소한의 호스트 기능을 제공합니다. (다른 모드에서 참조하는 라이브러리 함수 모드로, 게임플레이 요소를 변경/추가하지 않습니다)\n\n번역: SimpleKoreanLocale(PolarZero)
0-things=다른 Factorio 모드에 고급 객체 관리 기능을 제공합니다. (주의: 이 모드 자체는 게임플레이 요소를 변경하지 않지만, 다른 모드에서 Things를 참조하고 있는 상태에서 이 모드를 비활성화하면 저장 데이터가 손상될 수 있습니다!)\n\n번역: SimpleKoreanLocale(PolarZero)


[things-commands]
doctor-command-help=Things 모드의 다양한 검사를 실행하고 결과를 콘솔에 출력합니다.

[things-messages]
duplicate-ghost-warning=경고: 월드 키 '__1__'에서 중복된 고스트 객체가 감지되었습니다. 이 고스트는 이미 (__2__,__3__)에 연결되었지만, 무언가 이를 (__4__,__5__)로 재연결하고 있습니다. 이는 고스트 객체 유형을 추가한 두 모드 중 하나에 버그가 있거나, Things 자체에 버그가 있음을 나타냅니다. 이 문제를 모드 제작자에 알려주세요.

[mod-setting-name]
things-setting-debug=디버그 모드
things-setting-debug-always-splice=디버그: 추출하려는 설계도면을 항상 다시 작성
things-setting-debug-calc-unthing-blueprints=디버그: 'Things'가 포함되지 않은 설계도면 계산 허용
things-setting-debug-render-blueprint-bboxes=디버그: 설계도면 경계 상자 렌더링
things-setting-log-level=기록 수준

[mod-setting-description]
things-setting-debug=디버그 모드를 활성화합니다. Things의 작동 상태 정보를 지도에 표시하거나 다양한 내부 로그 기록, 추적 기능이 추가됩니다. 문제 진단에 도움이 될 수 있지만, 성능에 부정적인 영향을 미칩니다.
things-setting-debug-always-splice=활성화하면, 재작성이 필요한 변경 사항이 없더라도 설계도면이 항상 set_blueprint_entities 기능으로 재작성되도록 합니다. Things가 '협력 설계도면 호스트'로 설정된 경우에만 적용됩니다.
things-setting-debug-calc-unthing-blueprints=활성화하면, 설계도면에 '사물'이 포함되어 있지 않더라도 경계선을 항상 계산하도록 합니다. 설계도면 경계와 관련된 문제를 진단하는 데 도움이 될 수 있습니다.
things-setting-debug-render-blueprint-bboxes=활성화하면. 디버깅 목적으로 활용할 수 있도록 설계도면 경계 상자를 표합됩니다. 설계도면 경계와 관련된 문제를 진단하는 데 도움이 될 수 있습니다.
things-setting-log-level=Things에서 기록할 로그 수준을 정의합니다.\n\n[font=default-bold]NONE[/font] - 심각한 오류만 기록됩니다.\n[font=default-bold]WARN[/font] - 경고, 오류가 기록됩니다.\n[font=default-bold]INFO[/font] - 정보 메시지, 경고, 오류가 기록됩니다.\n[font=default-bold]DEBUG[/font] - 버그 진단에 유용한 매우 상세한 로깅입니다.\n[font=default-bold]TRACE[/font] - Things의 거의 모든 작업이 기록됩니다. [color=yellow]경고: TRACE로 설정하면 생성 이벤트와 관련된 수백 개+의 메시지가 기록될 수 있으며, 성능에 상당히 부정적 영향을 미칠 것입니다.[/color]