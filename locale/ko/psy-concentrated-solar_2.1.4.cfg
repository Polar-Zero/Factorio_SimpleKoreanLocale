[mod-name]
ch-concentrated-solar=Cheese의 집중된 태양광(Cheese's Concentrated Solar)
psy-concentrated-solar=집중된 태양광 [2.1 포크](Concentrated Solar (Fork) for 2.1)

[mod-description]
ch-concentrated-solar=태양 발전탑을 헬리오스태트 거울로 가열하는 것으로, 새로운 형태의 열 공급이 가능합니다.\n\n번역: SimpleKoreanLocale(PolarZero)
psy-concentrated-solar=헬리오스탯 거울로 가열되는 태양 발전탑를 새로운 형태의 열 생성 수단으로 추가합니다. Cheese의 Concentrated Solar 모드를 확장한 것으로, 주요 수치들에 대한 사용자 지정이 가능하록 수정했습니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[]
