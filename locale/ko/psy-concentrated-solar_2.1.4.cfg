[mod-setting-description]
ch-enable-beams=거울과 타워 사이에 시각적 광선을 표시합니다. 적용에 약간의 시간이 걸릴 수 있습니다 (최대 60초)
ch-fluid-temp-per-mirror=거울 하나가 기여할 수 있는 최대 태양광 수치를 조정합니다.\n(기본값: 4.26)
ch-glass-source=헬리오스텟 거울(5), 태양 레이저 탑(100)에 사용할 유리를 가져올 모드를 지정할 수 있습니다. 사용할 수 있는 모드에 대한 유리만 목록에 표시됩니다. '자동'으로 설정하면 Krastorio 유리, 일반 유리(Moshine 포함), 마락시스 유리판, 아리그 유리 판 순으로 우선순위가 적용됩니다. 유리가 게임상에 존재하지 않을 경우, 기존의 구리/강철 사용 제작법이 적용됩니다. Nullius 모드는 자체 재료를 사용합니다.
ch-k2-production-mult=Kastorio 2 모드가 설치되었을 때 적용할 발전량 배율을 조정합니다.
ch-laser-dmg-modifier=레이저 한 발당 피해량 배율. 값이 높을수록 치명도가 증가됩니다.\n(기본값: 5)
ch-laser-max-range=최대 교전 거리를 정의합니다. 값을 높이면 사거리가 증가되며, 낮을수록 좁아집니다.\n(기본값: 150)
ch-laser-min-range=최소 교전 거리를 정의해, 타워와 매우 인접한 지역을 공격할 수 없도록 합니다.\n(기본값: 6)
ch-solar-max-production-mw=타워 하나 당 최대 열에너지 출력량을 조정합니다. (완전 가동 시)\n(기본값: 600)
ch-solar-max-temp=탑 하나가 달성할 수 있는 최대 태양광 강도를 조정합니다.\n(기본값: 3,650)
ch-tower-capture-radius=탑이 헬리오스텟 거울 햇빛을 받아들일 수 있는 최대 범위. 홀수 값으로 설정하는 것을 권장합니다.