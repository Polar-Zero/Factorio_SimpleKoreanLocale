[entity-description]
chcs-heliostat-mirror=태양광을 광선 형태로 집중시켜 가장 가까운 탑에 1.1°C 태양 에너지로 전달합니다.
chcs-solar-laser-tower=태양광을 치명적인 레이저로 집중시킵니다. 데미지는 태양 에너지 온도에 따라 증가하며, 600°C에 최대치에 도달합니다.
chcs-solar-power-tower=태양광으로부터 열을 발생시킵니다. 태양광 에너지 600°C에 최대치에 도달합니다.

