[mod-name]
module-category-defaults=모듈 카테고리 기본값(Module category defaults)

[mod-description]
module-category-defaults=객체 프로토타입의 허용된 모듈 범주(allowed_module_categories) 속성 기본값에 기본 게임의 모듈 범주를 사용하도록 합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[mod-setting-name]
module-category-defaults-dynamic=기본 게임에 해당하는 카테고리를 자동으로 감지

[mod-setting-description]
module-category-defaults-dynamic=기본 게임 모듈 카테고리와 동일하게 취급해야 하는 모듈 카테고리를 자동으로 감지할지 여부 (기본값: 활성화)