[mod-name]
reskins-bobs=장인의 재도색 - Bob의 모드(Artisanal Reskins: Bob's Mods)
reskins-assets-bobs=장인의 재도색 - Bob의 모드 자산(Artisanal Reskins: Bob's Assets)

[mod-description]
reskins-bobs=밥스 모드 내의 항목, 객체, 기술 및 구조를 리스킨하고, 고품질의 아이콘 및 모델링, 광원, 이미지를 기본 팩토리오 게임과 비슷하게 제공합니다. 또한 사용자 지정 가능한 티어별 색상을 지원합니다. Artisanal Reskins 시리즈의 일부입니다.\n\n번역: SimpleKoreanLocale(PolarZero)
reskins-assets-bobs=Bob 모드의 아이템, 기술, 객체를 리스킨하는 데 필요한 아이콘과 이미지 자산을 제공합니다.

