[mod-name]
LithiumBattery=아퀼로 개편 - 리튬 전지(Aquilo Overhaul: Lithium Battery)

[mod-description]
LithiumBattery=다양한 사용자 지정 설정이 가능한 게임 개편요소를 추가합니다. 과학 팩에 리튬 배터리가 필요하도록 하는 등, 게임 후반에 새로운 생산 공정을 사용할 수 있도록 합니다. 강력한 아이템과 새로운 티어의 개인용 장비를 해금하세요.\n\n번역: SimpleKoreanLocale(PolarZero)


