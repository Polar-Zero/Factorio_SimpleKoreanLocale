[technology-description]
hea-engine=최첨단 기술이 적용된 고급 엔진 유닛입니다. 내열, 내압 성능도 우수하며 출력량 역시 뛰어납니다.
hea-processing=매우 강한 강도를 가진 첨단 소재, 고엔트로피 합금을 제작할 수 있게 됩니다.
lithium-accumulator=많은 전력을 수용할 수 있으며, 충전/방전 속도 역시 뛰어난 리튬 축전지입니다.
lithium-battery-mk4=리튬 전지의 성능을 활용하면, 매우 강력한 개인용 배터리 MK4를 제작할 수 있습니다.
lithium-roboport-mk3=한 번에 더 많은 로봇을 더 빠르게 충전할 수 있는 개선된 로보포트입니다. 건설 구역 역시 확장되었습니다.
lithium-shield-mk3=에너지 보호막 MK3은 더 많은 피해를 흡수할 수 있습니다.
hea-thruster=강력한 고엔트로피 합금 추진기. 이 괴물같은 추진기는 일반적인 추진기보다 4배 더 강한 추력을 발생시키지만, 연료 소비량도 10배나 많습니다.

