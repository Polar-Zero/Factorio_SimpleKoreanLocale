[mod-setting-description]
hea-assembling-machine-4='고엔트로피 합금 추가' 옵션이 활성화되어 있어야 적용됩니다.
hea-belt='고엔트로피 합금 추가' 옵션이 활성화되어 있어야 적용됩니다. 해당 옵션 사용을 원하지 않을 경우 PromethiumBeltRebalance 모드를 대신 사용하는 것을 권장합니다.
hea-belt-speed='고엔트로피 합금 추가' 옵션이 활성화되어 있어야 적용됩니다.
hea-belt-tech-cost='고엔트로피 합금 추가' 옵션이 활성화되어 있어야 적용됩니다. 옵션이 비활성화되어 있더라도 PromethiumBeltRebalance 모드가 활성화된 상태일 경우, 해당 모드의 설정이 사용됩니다.
hea-endgame=고엔트로피 함금과 새로운 처리 공정을 게임에 추가합니다. 제작법 변경과 기술 체계 변경점을 포함하며, 게임 난이도를 한층 더 높이게 됩니다.
hea-promethium=양자 처리 유닛 대신 고엔트로피 합금 엔진 유닛이 필요하도록 조정합니다.
lithium-accumulator-quality=일반 축전지와 리튬 축전지 모두에 적용됩니다. '리튬 축전지 활성화' 옵션이 활성화되어 있어야 작동합니다.
lithium-battery-fusion-generator='고엔트로피 합금 추가' 옵션 비활성화시, 제작법이 리튬 전지를 사용하도록 수정합니다.\n해당 옵션을 활성화하면 제작법이 이 설정과 무관하게 자동으로 조정됩니다.
lithium-battery-fusion-reactor-equipment='고엔트로피 합금 추가' 옵션 비활성화시, 제작법이 리튬 전지를 사용하도록 수정합니다.\n해당 옵션을 활성화하면 제작법이 이 설정과 무관하게 자동으로 조정됩니다.
lithium-battery-railgun='고엔트로피 합금 추가' 옵션 비활성화시, 제작법이 리튬 전지를 사용하도록 수정합니다.\n해당 옵션을 활성화하면 제작법이 이 설정과 무관하게 자동으로 조정됩니다.
lithium-battery-railgun-turret='고엔트로피 합금 추가' 옵션 비활성화시, 제작법이 리튬 전지를 사용하도록 수정합니다.\n해당 옵션을 활성화하면 제작법이 이 설정과 무관하게 자동으로 조정됩니다.
lithium-roboport-mk3-radius=반경 25는 50x50 범위와 동일합니다.
hea-thruster='고엔트로피 합금 추가' 옵션이 활성화되어 있어야 적용됩니다.