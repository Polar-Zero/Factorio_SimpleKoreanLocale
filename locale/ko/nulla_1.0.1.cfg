[space-location-description]
nulla=얼음 거성 아퀼로를 공전하는 작은 위성으로, 짙은 탄소 대기로 뒤덮여 있습니다, 표면에는 원자력 폭발로 발생한 크레이터와, 알 수 없는 이유로 사라진 문명 잔해만이 흉터처럼 남아있습니다. 전쟁은 플레이어가 도착하기 훨씬 전에 끝났지만, 그 유산은 아직 건재합니다. 남아있는 전투 드론들은 여전히 표면을 순찰하고 있으며, 낯선 무선 신호가 감지되면 즉각 대응할 것입니다. 멀리 떨어진 별에서 희미한 빛만이 도달함에도 불구하고, 이 위성은 얼지 않을 정도로 충분한 온도를 유지하고 있습니다. 하지만 부식성이 강한 대기로 인해 일반적인 투입기는 사용할 수 없습니다.

