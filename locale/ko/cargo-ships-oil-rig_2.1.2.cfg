[mod-name]
cargo-ships-oil-rig=화물선 - 해상 시추기(Cargo Ships: Oil Rig)

[mod-description]
cargo-ships-oil-rig=해상 시추기 및 심해 원유 시추기를 게임에 추가합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[cargo-ship-message]
error-canceled=오류: __1__ 객체를 이 곳에 배치할 수 없습니다, (아이템 파괴됨)
error-place-on-water=오류: __1__ 객체는 물 위에만 배치할 수 있습니다.

[entity-name]
offshore-oil=심해유
oil_rig=해상 시추기
or_pole=해상 시추기 전신주
or_power_electric=해상 시추기 내장 발전기
or_radar=해상 시추기 레이더
or_reactor=해상 시추기 펌프 가열기
or_tank=해상 시추기 저장 탱크

[entity-description]
offshore-oil=바다 깊숙한 곳에 매장된 다량의 원유. 해상 시추기를 이용해 채취하세요.
oil_rig=심해유 시추를 위해 건설할 수 있는 초대형 부유 플랫폼. 자체적인 발전 설비(비활성화되지 않은 경우) 및 전력망을 포함은 시설 자체는 물론 연결된 펌프에도 전력을 공급해줍니다.

[string-mod-setting]
oil_rigs_require_external_power-enabled=없음
oil_rigs_require_external_power-only-when-moduled=소량
oil_rigs_require_external_power-disabled=무제한

[technology-name]
deep_sea_oil_extraction=심해유 추출

[technology-description]
deep_sea_oil_extraction=__ENTITY__offshore-oil__ 추출

[mod-setting-name]
offshore_oil_enabled=__ENTITY__offshore-oil__, __ENTITY__oil_rig__ 활성화
no_oil_for_oil_rig=화학 과학 팩 이전 __ENTITY__oil_rig__ 허용
no_shallow_oil=깊은 물에만 심해유 배치
oil_rig_capacity=__ENTITY__oil_rig__ 용량 x1000
oil_rigs_require_external_power=해상 시추기 내장 발전기 활성화

[mod-setting-description]
no_oil_for_oil_rig=심해유 채굴 연구에 화학 과학 팩이 필요하지 않도록 전제조건을 제거합니다. 지상 원유 매장지 없이 플레이할 경우 활성화하세요.
no_shallow_oil=얕은 물에서 심해유 생성을 방지하는, 기존 동작을 다시 사용하도록 설정합니다.
oil_rig_capacity=해상 시추기의 내부 저장량을 증폭시킵니다.
oil_rigs_require_external_power=[font=default-bold]Small:[/font] 해상 시추기에는 모듈 사용시 외부 전력으로 보완할 수 있는 소형 발전기가 포함됩니다. (일반 모드)\n[font=default-bold]None:[/font] 해상 시추기가 작동하려면 외부 전력망에서 전기를 끌어와야 합니다.\n[font=default-bold]Infinite:[/font] 해상 시추기가 외부 전력망의 도움을 받지 않더라도 항상 최대 전력으로 작동합니다.