[mod-name]
Todo-List=할 일 목록(Todo List)

[mod-description]
Todo-List=싱글플레이어 및 멀티플레이어 게임에 할 일 목록 기능을 추가하여, 플레이어들이 서로의 진행 상황을 서로 확인하거나 동기화할 수 있도록 해줍니다.

