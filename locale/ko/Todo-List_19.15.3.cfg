todolist-translation-mode=텍스트 스타일
todolist-window-height=할 일 목록 창 세로 폭

[mod-setting-description-todo]
todolist-auto-assign=게임 세션에 한 명의 플레이어만 있을 경우, 해당 플레이어에게 작업을 자동으로 할당(진행)시킵니다.
todolist-click-edit-task=활성화하면, 마우스 가운데 클릭을 통해 작업 수정이 가능합니다. (기본값: 비활성화[오른쪽 클릭])
todolist-show-button=활성화하면, 게임 진행 중 좌측 상단에 "할 일 목록" 버튼을 띄워 빠르게 접근할 수 있도록 합니다.\n비활성화시 Shift+T 단축키로만 접근할 수 있게 됩니다.
todolist-show-log=활성화하면, 모드와 관련된 디버그 메세지를 채팅 메세지 형태로 출력합니다.\n참고: 매우 많은 메세지가 표시될 것입니다 :)
todolist-translation-mode=할 일 목록의 일부 문구 스타일을 조정할 수 있습니다. 퀘스트 형식으로 표시하도록 하는 것도 가능합니다!
todolist-window-height=할 일 목록 GUI 창의 높이를 조정할 수 있습니다. (기본값: 600)