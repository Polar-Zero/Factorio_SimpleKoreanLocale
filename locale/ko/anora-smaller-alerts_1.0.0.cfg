[mod-name]
anora-smaller-alerts=더 작은 경보 아이콘(Smaller Alert Icons)

[mod-description]
anora-smaller-alerts=경보 알림 아이콘의 크기를 조정하고 화면 왼쪽 하단으로 옮겨, 제작법이나 필터 아이콘 등을 가리지 않도록 합니다.\n\n모드 옵션에서 각 알림 아이콘에 대한 알림 조정 여부를 수정할 수 있습니다.\n\n기본적으로 비활성화하지 않음 (권장):\n- 전력 끊김 알림 (electricity_icon_unplugged)\n- 얼어붙음 알림 (frozen_icon)\n- 로보포트에서 너무 멂 (too_far_from_roboport_icon)\n\n번역: SimpleKoreanLocale(PolarZero)


