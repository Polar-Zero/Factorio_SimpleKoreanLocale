[mod-name]
some-luaconsole=누군가의 Lua 콘솔(Someone's LUA-Console)

[mod-description]
some-luaconsole=업적을 잃지 않고 Lua 명령을 실행해보세요. 이제 입력한 명령을 기억하고, 'game.player'가 작동합니다. 기본적으로 'Ctrl + ]'(오른쪽 대괄호)로 열 수 있으며, 마지막으로 입력 스크립트를 'Ctrl + Enter'로 실행할 수 있습니다. (단축키 사용자 지정 설정 가능)\n\n번역: SimpleKoreanLocale(PolarZero)


[controls]
some_luaconsole_exec=마지막 명령 실행
some_luaconsole_toggle=누군가의 Lua 콘솔 열기
some-luaconsole_exec=마지막 명령 실행
some-luaconsole_toggle=누군가의 Lua 콘솔 열기

[some-luaconsole]
close=저장하고 닫기
close_tooltip=입력을 저장한 뒤 실행은 하지 않고 창을 닫습니다. (__CONTROL__some-luaconsole-toggle__).
exec=명령 실행 (저장 + 창 유지)
exec_tooltip=입력을 저장한 뒤 실행한 다음, 창을 열린 상태로 둡니다. (__CONTROL__some-luaconsole-exec__)
inputlabel=실행할 입력 (__CONTROL__some-luaconsole-exec__: Lua 콘솔을 열지 않고 실행)
title=누군가의 Lua 콘솔