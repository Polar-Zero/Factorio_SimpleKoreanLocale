[mod-name]
ch-concentrated-solar=Cheese의 집중된 태양광(Cheese's Concentrated Solar)

[mod-description]
ch-concentrated-solar=태양 발전탑를 헬리오스태트 거울로 가열하는 것으로, 새로운 형태의 열 공급이 가능합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[achievement-name]
chcs-bird-murderer=새 살인자

[achievement-description]
chcs-bird-murderer=세계 최대의 태양광 발전소, Ivanpah Solar Power Facility 하나만큼의 태양 에너지를 하늘로 되돌려 보내세요.

[ch-gui]
average-power=평균 생산량: __1__ MW
current-power=현재 생산량: __1__ MW
mirrors=거울: __1__ (/ __2__ 최대)
tower-heat=태양광 에너지: __1__°C
tower-solar-energy=태양: __1__% (x __2__% 효율)

[entity-name]
chcs-heliostat-mirror=헬리오스텟 거울
chcs-solar-laser-tower=태양 레이저 탑
chcs-solar-power-tower=태양 에너지 탑

[entity-description]
chcs-heliostat-mirror=태양광을 광선 형태로 집중시켜 가장 가까운 탑에 1.1°C 태양 에너지로 전달합니다.
chcs-solar-laser-tower=태양광을 치명적인 레이저로 집중시킵니다. 데미지는 태양 에너지 온도에 따라 증가하며, 600°C에 최대치에 도달합니다.
chcs-solar-power-tower=태양광으로부터 열을 발생시킵니다. 태양광 에너지 600°C에 최대치에 도달합니다.

[fluid-name]
chcs-solar-fluid=태양 에너지

[technology-name]
chcs-concentrated-solar-energy=집중된 태양 에너지
chcs-weaponized-solar-energy=무기화된 태양 에너지

[technology-description]
chcs-concentrated-solar-energy=집중된 태양광을 활용해 전력을 생산합니다.
chcs-no-tower-in-range=범위 내에 태양 탑이 없습니다.
chcs-weaponized-solar-energy=집중된 태양광을 치명적인 광선 형태로 변환합니다.

[mod-setting-name]
ch-enable-beams=빔 그래픽 활성화
ch-k2-production-mult=태양 에너지 탑 Krastorio 2 생산 배율
ch-solar-max-production-mw=태양 에너지 탑 열 생산량 (MW)
ch-fluid-temp-per-mirror=헬리오스텟 거울 최대 강도 (°C)
ch-laser-dmg-modifier=태양 레이저 탑 피해량 배율
ch-laser-max-range=태양 레이저 탑 최대 공격 사거리
ch-laser-min-range=태양 레이저 탑 최소 공격 사거리
ch-solar-max-temp=태양 에너지 탑 최대 강도 (°C)

[mod-setting-description]
ch-enable-beams=거울과 타워 사이에 시각적 광선을 표시합니다. 적용에 약간의 시간이 걸릴 수 있습니다 (최대 60초)
ch-fluid-temp-per-mirror=거울 하나가 기여할 수 있는 최대 태양광 수치를 조정합니다.
ch-k2-production-mult=Kastorio 2 모드가 설치되었을 때 적용할 발전량 배율을 조정합니다.
ch-laser-dmg-modifier=레이저 한 발당 피해량 배율. 값이 높을수록 치명성이 증가됩니다.
ch-laser-max-range=최대 교전 거리를 정의합니다. 값을 높이면 사거리가 증가되며, 낮을수록 좁아집니다.
ch-laser-min-range=최소 교전 거리를 정의해, 타워와 매우 인접한 지역을 공격할 수 없도록 합니다.
ch-solar-max-production-mw=타워 하나 당 최대 열에너지 출력량을 조정합니다. (완전 가동 시)
ch-solar-max-temp=탑 하나가 달성할 수 있는 최대 태양광 강도를 조정합니다.
ch-tower-capture-radius=탑이 헬리오스텟 거울 햇빛을 받아들일 수 있는 최대 범위. 홀수 값으로 설정하는 것을 권장합니다.