bzchlorine-early-salt-mining=시작 구역의 자원 (채광 가능한 소금 자원 필요)
bzchlorine-more-intermediates-no=비활성화
bzchlorine-more-intermediates-yes=활성화: 염화 철, 염화 비닐

[technology-name]
chlorine-processing=염소 처리

[mod-setting-name]
bzchlorine-adjust-assemblers=저티어 조립 기계 수정
bzchlorine-early-salt=게임 초반 소금 획득법
bzchlorine-list=수정된 제작법 목록 생성
bzchlorine-more-intermediates=더 많은 염화물 중간 물질 활성화
bzchlorine-recipe-bypass=제작법 우회
bzchlorine-salt=채굴 가능한 소금 광맥 생성

[mod-setting-description]
bzchlorine-adjust-assemblers=저티어 조립 기계에 유체 입력을 추가하는 기능을 비활성화하여, 이를 조정하는 다른 모드와의 호환성을 개선할 수 있습니다. 반드시 필요한 경우가 아니라면 이 설정을 '둘 다 사용'으로 두는 것을 권장합니다. 일부 구성에서 이 값을 변경하면 게임 진행이 불가능한 소프트락 현상이 발생할 수 있기 때문입니다. '게임 초반 소금 획득법' 설정에서 '시작 지역의 자원'만 활성화된 경우 이 설정값은 효과가 없습니다.
bzchlorine-list=활성화한 상태에서 텍스트 명령어 [color=orange]/BZList[/color]를 실행하면, 조정된 제작법의 전체 목록을 script-output 폴더에 기록합니다.\n설정 구성을 마친 뒤 이 옵션을 비활성화하는 것을 추천합니다.
bzchlorine-recipe-bypass=다음 제작법의 수정을 건너뛰도록 합니다. (쉼표로 구분된 프로토타입 ID 목록)