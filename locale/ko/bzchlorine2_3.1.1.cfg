[recipe-name]
vtk-deepcore-mining-ore-chunk-refining-salt-focus=심층 광석 덩어리 정제 (소금 집중)
vtk-deepcore-mining-salt-chunk-refining=심층 소금 덩어리

[recipe-description]
vtk-deepcore-mining-salt-chunk-refining=화학 공장에서 심층 소금덩어리를 생산 공정에 사용할 수 있는 형태로 만들기 위해, 황산을 사용한 정제 공정을 진행합니다.

[string-mod-setting]
bzchlorine-adjust-assemblers-am1=조립 기계 1
bzchlorine-adjust-assemblers-both=둘 다
bzchlorine-adjust-assemblers-burner=화력 조립 기계
bzchlorine-adjust-assemblers-none=없음
bzchlorine-early-salt-assembler=저티어 조립 기계 ('저티어 조립 기계 수정' 필요)
