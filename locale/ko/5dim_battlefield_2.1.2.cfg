[mod-name]
5dim_battlefield=5Dim 모드 - 전장(5Dim's mod - Battlefield)

[mod-description]
5dim_battlefield=점점 더 위험해지는 세상에 맞춰 방어 체계를 개선하세요.\nMK2~MK10 포탑, 벽, 출입구, 레이더를 추가해 적에게 압도적인 군사력을 선사할 수 있도록 합니다.\n작동에 5dim_core 모드가 필요합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


