[mod-name]
lane-filtered-loaders=적재기 라인별 필터(Lane Filtered Loaders)

[mod-description]
lane-filtered-loaders=적재기의 각 줄에 필터를 적용할 수 있도록 합니다. 적재기를 추가하지는 않으며, 이는 다른 모드를 사용해야 합니다.\n\nDiscord의 Sunrosa가 요청한 모드입니다.


[lfl-window]
frame=필터 설정
radiobutton-lane=라인별 필터
radiobutton-loader=일반 필터
checkbox-lane=라인별 설정

[mod-setting-name]
loaders-lane-filtered-by-default=적재기 라인별 필터링 기본값