[recipe-description]
acidophile-lichen-cultivation=산성 이끼가 인위적으로 번식하도록 유도합니다.
chlorane-from-biter-egg=스피터의 산 배출 동작을 유도해 염화 수소를 얻습니다.
chlorane-from-spoilage=부패 물질을 걸러내 염화 수소를 얻습니다.
chlorane-oxidation=염화 수소를 산화시켜 염소와 물을 얻습니다.
crude-oil-from-eschatotaxite-paste=에스카토택사이트 페이스트를 염소 처리하여 원유를 얻습니다.
eschatotaxite-carbon-fiber=탄소 섬유의 대체 제작법입니다.
eschatotaxite-low-density-structure=저밀도 구조물의 대체 제작법입니다.
hydrogenated-oil-processing=더욱 진보된 원유 처리법. 수소 촉매를 사용하여 생산량을 극대화합니다.
hydronium-destruction=불안정한 하이드로늄 분자의 구성 요소를 분리합니다.
kerolox-rocket-fuel=산소의 고유한 산화 특성을 활용해 로켓 연료를 제작합니다.
oxyhydrogen-combustion=산소와 수소를 연소시켜 고온 증기를 생성합니다.
polyvinyl-chloride=플라스틱의 대체 제작법.
water-electrolysis=물을 전기 분해하여 수소와 산소를 얻습니다.
aquiloan-air-scrubbing=[item=spoilage] 촉매를 활용해 아퀼로 행성의 공기 중 입자를 포집합니다.
corroded-flask-recovery=[item=corroded-flask]에서 [fluid=chlorine]를 회수합니다.
muriatic-science-pack-activation=[fluid=chlorane]을 이용해 [item=muriatic-science-pack]의 화학 반응을 유도합니다.
fulgoran-air-scrubbing=[item=calcite] 촉매를 활용해 풀고라 행성의 공기 중 입자를 포집합니다.
gleban-air-scrubbing=[fluid=sulfuric-acid] 촉매를 활용해 글레바 행성의 공기 중 입자를 포집합니다.
murian-air-scrubbing=[item=eschatotaxite-sprout] 촉매를 활용해 무리아 행성의 공기 중 입자를 포집합니다.
nauvitian-air-scrubbing=[item=calcite] 촉매를 활용해 나우비스 행성의 공기 중 입자를 포집합니다.
paracelsian-air-scrubbing=[item=vaterite] 촉매를 활용해 파라켈신 행성의 공기 중 입자를 포집합니다.
vulcanusian-air-scrubbing=[item=stone] 촉매를 활용해 불카누스 행성의 공기 중 입자를 포집합니다.
acidworking-science-pack-activation=[fluid=hydrogen-chloride]를 이용해 [item=acidworking-science-pack]의 화학 반응을 유도합니다.
chlorine-from-acidophile-lichen=산성 이끼에서 염소를 분리하세요.
chlorine-traces-from-ice=우주에서 발견한 [item=ice]에 [item=carbon] 필터를 사용해 약간의 [fluid=chlorine]를 추출하세요.
hydrogen-chloride-from-biter-egg=바이터 알의 발달 중인 산 분비 기전을 활용해 염화 수소를 얻습니다.
hydrogen-chloride-from-spoilage=물 속의 부패 물질을 선별해 염화 수소를 얻습니다.
hydrogen-chloride-oxidation=구리 촉매를 사용해 염화수소를 산화시키면 염소와 물을 얻을 수 있습니다.
sulfur-chlorine-salt-redox=[fluid=hydrogen-chloride]와 [fluid=sulfuric-acid]을 동시에 생산하는 고급 공정입니다.
