[item-description]
acidophile-lichen=생존을 위해 염소 화합물을 소비하는 규소 기반 이끼 생명체.
acidthrower=유전자 변형 스피터가 들어있는 개조된 형태의 화염방사기.
artificial-lichen-colony=산성 이끼가 자랄 수 있는 토양입니다. [planet=muria]의 [tile=muriatic-solution]이나 [planet=fulgora]의 중유 바다에 배치할 수 있습니다.
chloric-fuel=산성 이끼 표본을 가둔 것. 이 생물의 독특한 에너지 합성 과정으로 방출된 에너지는 무리안 기계에 동력을 공급하는 데 사용할 수 있습니다.
chlorine-salts=철과 염화 구리의 혼합물. [tile=acidophile-lichen] 위에 배치할 수 있습니다.
cotunnite=염화 납 덩어리. [tile=acidophile-lichen] 위에 배치할 수 있습니다.
eschatotaxite-paste=탄소가 풍부한 천연 접착제. 숯 맛이 나지만 영양가가 높습니다.
eschatotaxite-sprout=갓 자란 에스카토택사이트 곰팡이. [planet=muria]의 모든 어두운 지형에 심을 수 있습니다.
holmium-chloride=인공적으로 생성된 염화 홀뮴 덩어리. [planet=fulgora]의 [tile=artificial-lichen-colony]에 배치할 수 있습니다.
leaded-fuel=많은 공해가 발생하지만, 그만큼 강력한 연료입니다.
anti-corrosion-cladding=이 부식 방지용 피복은, 부식성 환경이나 강산과 지속적으로 접촉해야 하는 기계에 매우 중요합니다.
corroded-flask=[item=acidworking-science-pack]이 부식된 형태입니다.
inert-muriatic-science-pack=연구소에서 사용하려면 먼저 [fluid=chlorane]를 이용해 활성화시켜야 합니다.
inert-acidworking-science-pack=연구소에서 사용하려면 먼저 [fluid=hydrogen-chloride]를 이용해 활성화시켜야 합니다.
 

