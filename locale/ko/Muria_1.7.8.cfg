[entity-description]
acidthrower-turret=화염 방사 포탑과 비슷하게 이 산성 전쟁 기계는 적을 녹여버릴 것입니다.
acidworking-plant=보다 발전된 형태의 산을 처리할 수 있습니다. 참고: 이 기계가 무리아에서 작동 중일 때 산성 물질이 발생하며, 이는 주변의 취약 개체를 부식시킬 수 있습니다.
big-chloric-rock=많은 염소 화합물과 돌을 포함합니다.
biovat=생물학적 제작을 비효율적으로 수행할 수 있는 기계. 하지만 작동 중 무리아 공기의 산성 물질을 약간 흡수합니다.
chlorine-salt-deposit=염소 화합물로 구성된 광맥입니다.
cotunnite-lichen-colony=커터나이트에서 자란 산성 이끼 군집.
eschatotaxite=공기 중의 부식성 산을 섭취하는 거대한 곰팡이 군집.
fungicultural-tower=균류와 이끼 재배를 위해 특별히 설계된 기계입니다.
holmium-lichen-colony=염화 홀뮴에서 자란 산성 이끼의 군집.
metallic-lichen-colony=염소 화합물에서 자란 산성 이끼의 군집.
smelting-plant=아이템을 제련하거나 야금 작업을 수행할 수 있는 시설. 납을 가공할 수 있습니다. 참고: 이 기계가 무리아에서 작동 중일 때 산성 물질이 발생하며, 이는 주변의 취약 개체를 부식시킬 수 있습니다.
scrubber=촉매를 이용해 대기 중의 공해 물질과 구성 요소를 포집할 수 있는 기계입니다.
lead-construction-robot=속도는 느리지만 더 높은 피해 저항력을 지닌 건설 로봇. 한 번에 더 많은 아이템을 운반할 수 있습니다.
lead-logistic-robot=속도는 느리지만 더 높은 피해 저항력을 지닌 물류 로봇. 한 번에 더 많은 아이템을 운반할 수 있습니다.

