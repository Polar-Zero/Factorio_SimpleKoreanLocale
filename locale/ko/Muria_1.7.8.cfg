[tile-description]
acidophile-lichen=생존을 위해 염소 화합물을 소비하는 규소 기반 이끼 생명체. [entity=fungicultural-tower]에 소금 아이템을 놓으면 이끼 군락을 자라나게 할 수 있습니다.
artificial-lichen-colony=인공적으로 설치한 산성 이끼 군집.
muriatic-folds=에스카토택사이트가 서식하는 토양.
muriatic-folds-flat=에스카토택사이트가 서식하는 토양.
muriatic-soil-dark=에스카토택사이트가 서식하는 토양.
muriatic-soil-light=에스카토택사이트가 서식하는 토양.
muriatic-solution=[fluid=chlorine]과 [fluid=hydronium]로 이루어진 바다로, 곳곳에 [item=cotunnite] 덩어리가 흩어져 있습니다. 이곳에 투입기로 아이템을 투입하면 파괴시킬 수 있습니다.

[tips-and-tricks-item-name]
acid-immunity-list=산 내성 목록
muria-briefing=무리아 개요

[tips-and-tricks-item-description]
acid-immunity-list=[entity=metallic-lichen-colony]나 [entity=cotunnite-lichen-colony]을 수확하면 부식성 가스가 방출됩니다. 이러한 가스는 대부분의 기계에 손상을 입힙니다. 지도의 공해 오버레이에서 기계 설치 위험성이 존재하는 지역을 확인할 수 있습니다. 부식성 대기는 [entity=eschatotaxite]를 심고 수확하는 것으로 줄일 수 있습니다.\n[planet=muria]의 오염된 타일에 있는 대부분의 플레이어 제작 기계는 다음 일부 예외를 제외하고 부식성 산에 지속적으로 피해를 받습니다.\n예외:\n- [entity=fungicultural-tower]: 산의 주요 생산처이자 흡수 역할을 하므로, 매우 강한 저항력을 가집니다.\n- [entity=acidworking-plant], [entity=smelting-plant] (이 두 설비는 작동 시 부식성 산이 발생하는 점 유의하세요)\n- [entity=biovat] (바이오 바트는 공기 중의 산을 일부 소비합니다)\n- [entity=scrubber] (이 기계는 산성 및 공해 물질을 처리하도록 설계되었습니다)\n- 모든 전력 객체(전신주, 발전기, 축전지)\n- 로봇을 제외한 모든 물류 객체는 면역입니다. (로보포트 포함). 로봇은 납 로봇으로 업그레이드해야 산의 영향을 받지 않게 됩니다.\n- 기차([entity=locomotive], [item=rail] 등)도 면역입니다.\n- [entity=rocket-silo], [entity=cargo-landing-pad], [entity=cargo-bay].\n- 모든 채광 드릴\n- [entity=beacon]\n- 모든 파이프\n- 모든 상자
muria-briefing=[planet=muria]은 풍부한 생명체가 서식하는 강산 세계입니다. [tile=acidophile-lichen]와 [entity=eschatotaxite] 곰팡이가 행성의 건조한 부분을 덮고 있으며, 나머지 표면은 [fluid=muriatic-solution]의 호수로 이루어져 있습니다. [entity=chlorine-salt-deposit]과 [item=cotunnite]는 [fluid=chlorine]을 포함하는 염소 화합물로, 행성 표면에서 다양한 방식으로 발견할 수 있습니다. 또한 두 객체 모두 [entity=fungicultural-tower]과 이끼를 이용해 광석 형태로 정제할 수 있습니다. 다만 이끼가 방출하는 부식성 공기에 주의하세요. 에스카토택사이트는 공장을 이러한 손상으로부터 보호할 수 있습니다.

