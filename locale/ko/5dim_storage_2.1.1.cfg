[mod-name]
5dim_storage=5Dim 모드 - 저장 탱크(5Dim's mod - Storage)

[mod-description]
5dim_storage=끊임없이 재건축할 필요 없이도 더 많은 아이템과 액체를 보관할 수 있는 다양한 객체를 게임에 추가합니다.\n대규모 공장이나 기차 정류장에 사용할 수 있는 더 큰 저장 탱크, 상자 등의 물류 보관 선택지를 추가합니다.\n작동에 5dim_core 모드가 필요합니다.\n\n번역: SimpleKoreanLocale(PolarZero)

