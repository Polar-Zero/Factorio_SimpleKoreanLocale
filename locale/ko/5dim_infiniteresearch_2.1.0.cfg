[mod-description]
5dim_infiniteresearch=게임 후반 과학 기술을 더 유용하게 활용해보세요.\n주요 기술 트리의 발전 속도가 느려질 때 연구할 수 있도록 하는 생산, 채광, 전투, 운송 등 분야에 대한 반복 가능한 연구를 게임에 추가합니다.\n작동에 5dim_core 모드가 필요합니다.\n\n번역: SimpleKoreanLocale(PolarZero)

