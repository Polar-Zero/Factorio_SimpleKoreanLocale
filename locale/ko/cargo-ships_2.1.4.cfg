[mod-name]
cargo-ships=화물선(Cargo Ships)
cargo-ships-graphics=화물선 - 그래픽(Cargo Ships Graphics)

[mod-description]
cargo-ships=수상 경로를 기반으로 움직이는 보트, 화물선, 유조선 등 콘텐츠를 추가합니다.\n\n번역: SimpleKoreanLocale(PolarZero)
cargo-ships-graphics=Cargo Ships 모드를 위한 그래픽 자산을 추가합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[cargo-ship-message]
migration-11-warning=[color=yellow] !!경고!! >>> Cargo Ships 마이그레이션 실패 <<< !!경고!![/color]\nFactorio 1.1 -> 2.1로 화물선 모드를 직접 마이그레이션할 수 없습니다. 2.0에서 한 번 불러와 저장한 뒤 2.1에서 불러와주세요.\nfactorio.com 공식 홈페이지에서  Steam 설치파일과 충돌하지 않는2.0.77 버전을 zip 파일 형태로 안전하게 다운로드받을 수 있습니다.
migration-21-warning=[color=yellow] !!경고!! >>> Cargo Ships 모드에서 해상 시추기, 해상 전신주 컨텐츠가 분리되었습니다. <<< !!경고!![/color]\n[color=red]해당 기능 유지를 원하신다면 게임을 저장하지 마시고,[/color]모드 포털에서 관련 모드를 설치하세요.\nCargo Ships: Oil Rig, Cargo Ships: Floating Electric Pole
error-connect-rails=오류: __1__, __2__ 객체는 서로 연결할 수 없습니다.
place-on-waterway=수로에 __1__을/를 배치합니다.
place-independent=자유 이동 모드로 __1__을/를 배치합니다.
error-place-on-waterway=오류: 수로에 __1__을 배치할 수 없습니다.
error-unlinked-engine=오류: 연결된 선박 없이 발견된 __1__을 삭제합니다.
error-train-on-waterway=오류: __1__ 객체는 수로에 놓을 수 없습니다!
error-ship-no-space=오류: __1__ 사방에 충분한 공간이 있는 직선 수로에 배치해야 합니다!
error-bridge-busy=오류: __ENTITY__bridge_base__를 삭제하기 전에 현재 횡단 중인 기차와 선박이 없는지 확인하세요.

