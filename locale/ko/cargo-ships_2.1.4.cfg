[entity-description]
boat=내부 공간이 작지만 빠르며, 수로 위에 설치하거나 독립된 차량 형태로 배치할 수 있는 작은 선박입니다.
bridge_base=아래로 배가 통과할 수 있도록 자동으로 열리는 기차 다리입니다. 설치되어있던 직선 수로 위에 설치하세요.
buoy=수로 시스템을 블록 단위로 나눠, 동일한 수로 네트워크에서 여러 선박이 운행할 수 있게 합니다.
cargo_ship=많은 자원을 운송할 수 있는 대형 선박입니다.
chain_buoy=경로상의 다음 신호를 읽어 개선된 선박 제어를 가능하게 합니다.
oil_tanker=많은 유체를 운송할 수 있는 대형 선박입니다.
port=자동화된 선박의 목적지입니다.
cs_pump=유조선의 적재 및 하역을 위해 물 위에 설치할 수도 있습니다.

[item-name]
waterway=수로

[item-description]
waterway=선박이 자동으로 항해할 수 있도록 물 위에 설치할 수 있는 경로입니다.


[technology-name]
automated_bridges=기차 도개교
automated_water_transport=자동화된 수상 운송
cargo_ships=__ENTITY__cargo_ship__
tank_ship=__ENTITY__oil_tanker__
water_transport=수상 운송

[technology-description]
cargo_ships=수상을 통한 대규모 운송이 가능합니다.
water_transport=바다를 횡단할 수 있는 수단을 제공합니다.
automated_water_transport=바로 가기 버튼을 사용하거나 __CONTROL__give-waterway__로 수로를 생성할 수 있게 됩니다. 수로에 항구를 배치하여 자동화된 선박 경로를 설정할 수 있습니다.
tank_ship=물 위로 유체를 운반할 수 있습니다. __ENTITY__oil_tanker__를 펌프로 채우거나 비울 수 있습니다.
automated_bridges=기차와 수로가 교차할 수 있는 도개교를 활성화합니다.

[tips-and-tricks-item-name]
cargo-ships=화물선

[tips-and-tricks-item-description]
cargo-ships=선박은 [entity=straight-waterway]에 배치할 수 있습니다. 수로는 단축바에서 수로 버튼을 클릭하거나 __CONTROL__give-waterway__를 눌러 얻을 수 있습니다.\n[item=boat]는 수로에 배치하는 것도 가능하지만 독립적으로 배치한 뒤 자동차처럼 운전하는 것도 가능합니다.\n\n각 유조선에는 최대 6개의 [entity=ship-loading-pump]/[entity=ship-unloading-pump]를 연결할 수 있습니다.

