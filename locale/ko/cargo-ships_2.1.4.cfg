floating_pole_enabled=__ENTITY__floating-electric-pole__ 활성화
floating_pole_fulgora=__TILE__oil-ocean-shallow__에 __ENTITY__floating-electric-pole__ 허용
floating_pole_aquilo=__TILE__ammoniacal-ocean__에 __ENTITY__floating-electric-pole__ 허용
fuel_modifier=선박 연료 용량
speed_modifier=선박 이동 속도
waterway_reach_increase=해상 아이템 도달 범위 증가
use_dark_blue_waterways=어두운 수로 사용
tanker_capacity=__ENTITY__oil_tanker__ 용량 x1000
no_catching_fish=투입기 낚시 비활성화
prevent_waterway_rail_connections=수로가 다른 철도 유형에 연결되지 않도록 방지
cargo_ship_capacity=__ENTITY__cargo_ship__ 인벤토리 크기

[mod-setting-description]
fuel_modifier=표준 선박 연료량에 이 값 배율을 곱합니다.
waterway_reach_increase=수로, 부표, 항구 등 해상 아이템에 한하여 플레이어 도달 범위가 증가합니다. 도달 범위 증가 옵션을 비활성화하려면 '0'으로 설정하세요.
use_dark_blue_waterways=수로를 더 어둡게 변경하여 더 잘 보이도록 변경합니다. (현재는 기존 수로에만 영향을 줍니다.)
speed_modifier=선박 및 보트 이동 속도에 이 배율 값을 적용할 수 있습니다. 경고: 빠른 배는 바보처럼 보일 것입니다.
tanker_capacity=유조선 선박의 저장 용량입니다.
no_catching_fish=물가에 배치한 투입기가 물고기를 잡지 못하도록 막습니다.
prevent_waterway_rail_connections=이 옵션을 선택하면 수로를 다른 유형의 철도과 연결할 수 없습니다.
cargo_ship_capacity=__ENTITY__cargo_ship__이 적재할 수 있는 화물량을 묶음 단위로 조정할 수 있습니다.