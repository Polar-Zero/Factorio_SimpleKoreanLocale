[mod-name]
5dim_nuclear=5Dim 모드 - 원자력(5Dim's mod - Nuclear)

[mod-description]
5dim_nuclear=원자력 발전 관련 요소를 기본 게임보다 훨씬 더 많이 추가합니다.\n훨씬 더 큰 발전량을 제공하는 강력한 원자로, 열 시스템, 터빈, 원심분리기를 추가합니다.\n작동에 5dim_core 모드가 필요합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


