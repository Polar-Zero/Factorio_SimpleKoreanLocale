[mod-name]
krastorio2-vanilla-plates=Krastorio 2 - 바닐라 아이콘(Krastorio 2 Vanilla-like icons)

[mod-description]
krastorio2-vanilla-plates=Restores vanilla plate and iron gear icons in Krastorio 2 and offers matching steel, beam and imersium artwork. Four independent settings let you choose each group, including optional vanilla circuits. Contains AI-generated images in the optional steel and imersium sets.\n\n번역: SimpleKoreanLocale(PolarZero)


[mod-setting-name]
k2vp-imersium-graphics=Use vanilla-like imersium icons
k2vp-new-graphics=Use vanilla-like steel and beam icons
k2vp-restore-vanilla=Restore vanilla plate and iron gear icons
k2vp-vanilla-circuits=Restore vanilla circuit icons

[mod-setting-description]
k2vp-imersium-graphics=Contains AI-generated images. Use matching purple imersium plate, gear and beam icons with pink accents, plus a refined imersite crystal. Also updates their recipe graphics and belt/ground glow. Independent of the steel and beam setting.
k2vp-new-graphics=Contains AI-generated images (steel plate and steel gear). Use a dark steel plate, steel gear and steel beam, plus a recolored vanilla-style iron beam. Also updates their recipe and belt/ground graphics. Overrides vanilla steel plate restoration.
k2vp-restore-vanilla=Use vanilla icons for iron, copper and steel plates and iron gears. Also updates their recipe and belt/ground graphics. If vanilla-like steel and beam icons are enabled, their new steel plate takes precedence.
k2vp-vanilla-circuits=Use vanilla icons for electronic circuits, advanced circuits and processing units, including their recipe and belt/ground graphics. Independent of the other settings.