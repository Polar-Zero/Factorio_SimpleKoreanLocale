[mod-name]
Research_Productivity=연구 생산성(Research Productivity)

[mod-description]
Research_Productivity=Rhaane의 "Laboratory Productivity" 모드에서 약간의 밸런스를 수정한 버전입니다. 모든 작업(그래픽 및 코드)은 원본 모드 작성자가 수행했으며, 일부 수치만 변경했습니다.\n더 자세한 내용은 모드 포털 또는 변경 사항의 설명을 참고하세요.\n\n번역: SimpleKoreanLocale(PolarZero)


[technology-name]
laboratory-productivity=연구 생산성

[technology-description]
laboratory-productivity=과학 팩 제작 비용이 너무 비쌌기에, 연구소에서 더 많은 연구 성과를 낼수 있도록 효율을 개선해야 합니다.


[modifier-description]
laboratory-productivity=연구 생산성: +__1__



[mod-setting-name]
researchproductivity-exponential=지수적 연구 비용
researchproductivity-optional-space-age-science=선택적인 우주 시대 과학 팩

[mod-setting-description]
researchproductivity-exponential=활성화하면, 기술 연구 비용이 4단계부터 레벨마다 2,500 대신 2배씩 지수적으로 증가하도록 수정합니다.
researchproductivity-optional-space-age-science=활성화하면, 4단계부터 금속공학, 전자기, 농업, 극저온 과학 팩이 필요하도록 조정합니다.