enemy-difficulty-term-dependency-stride=이동 속도 의존성 값 사용
enemy-difficulty-term-flesh=적 유닛 체력
enemy-difficulty-term-healing=회복 속도
enemy-difficulty-term-hive-shell=산란장 체력
enemy-difficulty-term-pack-law=근처 유닛 최대치
enemy-difficulty-term-reach=공격 범위
enemy-difficulty-term-spawner-healing=산란장 회복 속도
enemy-difficulty-term-stride=이동 속도
enemy-difficulty-text=이 페이지는 적 생태계에 마지막으로 적용되는 조정만 기록합니다. [font=default-bold]ei-default[/font]를 새로 만들지도 않으며 더 많은 생태계를 발명하지도 않습니다. 바이터, 스피터, 땅벌레, 산란장, 스내퍼 계열, 냉기/독성/폭발 변종, 보스, 거미, 전기, [entity=tb_infected_ship_boss] 등을 포함한 다양한 모드 이미 존재하는 개체의 수치 역시 조정됩니다.
enemy-difficulty-text-2=각 백분율 값은 [font=default-bold]4. 조정 없음[/font]을 기준으로 한 수치입니다. [font=default-bold]100%[/font]는 의존 모드의 값을 그대로 반영함을 의미하며, 더 높은 백분율 값은 해당 능력치가 증가됨을, 낮은 백분율 수치는 감소됨을 의미합니다. 다만 [font=default-bold]공격 간격[/font]과 [font=default-bold]생성 간격[/font]은 반대로 작동합니다. 낮은 값일수록 더 자주 공격/생성되며, 높은 값은 낮은 압박을 의미합니다. 이 페이지의 값은 읽기 쉽도록 반올림되어 있습니다.
enemy-difficulty-text-3=난이도 수준 설정은 능력치만 변경시킵니다. 적 유닛 체력, 체력 회복량, 스내퍼 적 체력, 스내퍼 방어력, 공격 피해, 사거리, 이동 속도, 공격 간격, 산란장 체력, 산란장 회복량, 생성 간격, 주변 유닛 상한이 조정됩니다. 진화 가중치, 공해 흡수량, 공격 합류 임계값, 생성되는 유닛, 적 무기에 공통으로 사용되는 발사체/광선/구름/스트림/탄약에 영향을 주지 않습니다. 펜타포드, 데몰리셔, 글레바 산란장, 플레이어 로봇과 로보포트는 이 의식 적용 대상에서 제외됩니다.
enemy-difficulty-text-4='1. 자비롭게'와 '7. 불가능' 난이도는 레비아탄, 마더, MAF 보스 계열, 보행 전기 보스, [entity=tb_infected_ship_boss] 등에 추가적인 최상급 보정을 적용합니다. 다만 예외로 [entity=arachnid-biter-royalwarrior-unit]의 체력 값은 유지되며, 피해량과 이동 속도만 별도로 조정됩니다. 또한 [font=default-bold]7. 불가능[/font] 난이도에서는 시작 시 설정과 무관하게 나우비스의 은총을 사용할 수 없습니다.
enemy-difficulty-text-5=[font=default-bold]7. 불가능[/font] 난이도에서는 적대 세력이 존재하는 표면에서 우주로 로켓을 발사할 경우 주변에 남은 적이 격납고 공격에 합류할 수 있습니다. 보복 부대는 보통 주변의 약 [font=default-bold]100~250칸[/font] 범위에서 [font=default-bold]8~30기의 유닛[/font]을 끌어모으며, 더 무거운 발사일수록 더 거센 대응을 불러오게 됩니다. 발사한 표면에 적 생태계가 없다면 당연히 보복 부대 역시 생성되지 않습니다.
enemy-difficulty-text-6=[font=default-bold]4. 조정 없음[/font]은 EI 모드에서 적 보정을 적용하지 않고, 의존 모드 값을 그대로 사용하도록 합니다. [font=default-bold]3. 보통[/font]이 기본 권장 설정입니다. 그보다 높은 값으로 설정하면 압박이 증가될 것이며, 낮은 값으로 설정하면 지도 프리셋을 변경하지 않으며 감소될 것입니다.
exotic-stabilizers=엑조틱 물질 안정기
exotic-stabilizers-text=엑조틱 물질은 자원이 아닙니다-그것은 유용하게 포장된 위협입니다. 이를 처리하려면 격리, 정밀성, 그리고 그 불안정성을 견딜 수 있도록 설계된 기계가 필요합니다.\n\n[color=orange]엑조틱 조립 기계[/color] [item=ei-exotic-assembler]은 그 에너지 신호를 처리할 수 있는 유일한 구조물입니다. 그럼에도 불구하고 불안정은 불가피하며, 조립기는 과부하되면 폭발할 수 있습니다. 격자 구조가 견고하게 버티고 있다면 기계에서 눈에 잘 띄는 곳에 있는 억제장이 아주 조용한 소리를 내지만, 이 구조가 무너지기 시작하는 순간 이는 딱딱거리는 소리와 아크 방전을 포함한, 온 몸으로 느껴질 만큼 강렬한 경고 신호로 변합니다.\n\n이 위험을 조금이라도 줄이려면 조립 기계 주변에 [color=orange]엑조틱 물질 안정화 장치[/color] [item=ei-matter-stabilizer]를 배치하세요. 이 장치는 치명적인 엔트로피 연쇄를 억제하고 주변 에너지망을 안정화합니다. 일부가 세계 곳곳에 흩어져 있을 수도 있습니다-이전 사이클의 잔재입니다.\n\n엑조틱 물질을 단순히 또 다른 재료로 취급하지 마세요.\n\n[color=gray]고품질의 물질 안정기는 3 x (품질Lv-1) 개의 안정기로 간주됩니다.\n고품질의 엑조틱 조립 기계는 초당 엔트로피 연쇄 발생 확률이 (품질Lv-1)% 감소합니다. 즉, 고급 품질의 엑조틱 조립 기계는 12-> 11%의 기본 연쇄 확률을 가짐을 의미합니다.[/color]\n그것은 [font=default-bold]살아 있으며, 변동성이 높고, 지켜보고 있습니다.[/font]
fission-reactors=핵분열 변경사항
fission-reactors-2=고온 핵분열
fission-reactors-2-text=[color=orange]고온 반응로[/color] [item=ei-high-temperature-reactor]는 최대 열 출력을 위해 설계된 고급 분열로입니다. 이 시스템은 효율성과 규모 측면에서 표준 원자력 인프라를 뛰어넘지만-[font=default-bold]적절한 유지보수가 이루어질 때에 한정됩니다.[/font]\n\n임계 온도에 도달하고 다음과 같은 조건이 충족되어야 합니다:\n\n[font=default-bold]납 냉각제[/font], 및\n\n최소 한 개의 사용 가능한 연료봉,\n\n… 이제 납 냉각제가 [font=default-bold]과열[/font]될 것입니다. 이는 기존 열교환기의 처리량으로 처리하기에는 부족하므로 맞춤형 시설이 필요합니다.\n\n전통적인 원자로와 달리, [color=brown]토륨[/color] [item=ei-thorium-232-fuel] 연료를 활용할 수 있습니다-설계의 극한 강도로 폐기물을 에너지원으로 변환합니다.\n\n이것은 초보자용 원자로가 아닙니다.\n\n공급 중단을 용납하지 않습니다.\n\n규모를 축소할 수 없습니다.\n\n이는 인류 멸망 이후 산업을 위한 압력 엔진입니다-[font=default-bold]잔인하고 효율적이며 용서하지 않습니다.[/font]
fission-reactors-text=엑조틱 산업에서는핵분열 시스템이 재조정되고 강화되었으며, 더 도전적이지만 보상이 더 큰 시스템으로 재설계되었습니다.\n\n기본 [color=orange]원자로[/color] [item=nuclear-reactor]는 이제 기본 인접 보너스를 더 이상 받지 않습니다.\n\n대신, 각 원자로당 [font=default-bold]전력 출력이 증가합니다[/font]-이제 밀도를 통해 전력을 생산하며, 인접성에는 의존하지 않습니다.\n\n[font=default-bold]우라늄이 더 희귀해졌습니다.[/font] 채굴 속도가 느려졌으며, 효율이 감소되었습니다. 효율적인 핵 인프라는 장기적인 연료량도 고려해야 합니다.\n\n소모된 연료 전지는 더 이상 폐기물이 아닙니다.\n\n폐쇄적인 재활용 시스템에서 열화된 부산물을 회수하고 효율이 향상된 2차 연료 전지로 정제할 수 있습니다.\n\n그러나 이 모든 과정은 [color=brown]핵 폐기물[/color] [item=ei-nuclear-waste]을 생성하며, 이는 안전하게 격리, 처리, 또는 격리되어야 하는 지속적인 부산물이 됩니다.\n\n이것은 무시하면 안됩니다.\n\n소홀함은 공해으로 이어집니다.\n\n핵 에너지는 더 이상 무한 에너지로의 빠른 길이 아닙니다.\n\n이는 [font=default-bold]열, 붕괴, 재활용[/font]을 수반하는 고위험 경제입니다.\n\n잘 활용하거나-[font=default-bold]비용에 잠기거나.[/font]
flammable-ruptures=가연성 유체 파열
flammable-ruptures-2=충실 모드
flammable-ruptures-3=전파와 위험
flammable-ruptures-4=플랫폼과 배관
flammable-ruptures-text=저장 탱크, 파이프, 지하 파이프, 화물차, 유체 포함한 기계 내부에 충분한 가연성 유체가 남은 채 파괴될 경우 파열(폭발)할 수 있습니다. runtime 단계에서 해당 객체에 남아있던 실제 유체 유형이 반영되며, 석유 제품, 가스 배관 및 특수 연료 혼합물 각각에 대해 다른 파열 후속 효과가 적용됩니다.\n\n발동 조건은 파괴 시 가해진 피해 유형에 따라 따릅니다. 화재, 충격, 폭발, 플라즈마와 같은 고에너지 형태의 파괴는 냉기나 독 등의 요인에 비해 파열을 유발할 가능성이 훨씬 더 높습니다.
flammable-ruptures-text-2=현재 설정된 모드: [font=default-bold]__1__[/font]\n\n[font=default-bold]1. 간결히[/font]은 연쇄 폭발을 짧게 유지하고 성능 예산을 엄격하게 제한합니다. [font=default-bold]2. 기본[/font]는 기본 권장 설정으로, 일반적인 플레이 진행에 맞춘 경로입니다. [font=default-bold]3. 과장[/font]은 더 많은 틱에 걸쳐 더 크고 단계적인 폭발 확산을 유도합니다. [font=default-bold]4. 무제한[/font]는 상한선을 완전히 제거하며, 준비된 효과를 같은 틱에 가능한 만큼 적극적으로 소모하도록 스케줄러에 지시합니다.
flammable-ruptures-text-3=파열로 인한 공해 효과는 파괴 즉시 추가되지만 기타 파열 효과는 중심부에서 바깥쪽으로 원처럼 퍼져나갑니다. 폭발, 연기, 화염, 그을음, 인근 대상 피해는 한 번에 계산된 뒤 서서히 적용되므로 큰 파열이더라도, 거대한 탱크가 한 틱만에 종말과 같은 상황을 구현하는 상황을 발생하지 않습니다\n지하 파이프 역시 동일한 제한을 사용합니다. '무제한' 모드는 의도적으로 성능에 위험을 초래할 수 있으며, 그 대가는 사용자가 감수해야 합니다.
flammable-ruptures-text-4=우주 플랫폼에서도 파열 피해와 연결 파이프 전파가 발생하지만 플랫폼 전체에 바닥 화염이 퍼지지는 않습니다. 배출 연기는 더 좁게 유지되고 그을음은 생략되며, 화염은 구조물 주변에만 훨씬더 제한적으로 생성됩니다. 플랫폼 파열은 위험성을 유지하지만 우주 갑판 전체를 화염으로 덮지 않을 것입니다.
fulgora-day-variation=풀고라 하루 길이 변화
fulgora-day-variation-2=재계산 시점
fulgora-day-variation-text=풀고라는 고정된 하루 길이를 유지하지 않습니다. 각 주기가 시작될 때마다 모드에서 시작 설정의 최소/최대 배율 범위를 사용해 [font=default-bold]하루 시간 길이[/font]를 무작위로 계산합니다. 이제 어떤 날은 빠르게 지나가지만 어떤 날은 오래 지속될 것입니다. 또한 같은 저장 파일이더라도 풀고라의 조명 리듬은 이제 일정하지 않습니다.
fulgora-day-variation-text-2=하루 길이 변경은 표면이 깊은 밤중에서 갑자기 낮으로 전환되는 등의 방식이 되지 않도록 밝고 안정적인 조명 구간에서 진행합니다. 풀고라가 오랫동안 안전한 구간을 제공하지 않더라도 대체 조건이 작동하므로, 변경이 무한히 미뤄지지는 않습니다.
fusion-neutron-collectors=수집기 원천 우선순위
fusion-neutron-collectors-2=배치 압박
fusion-neutron-collectors-text=중성자 수집기는 두 핵융합 계열을 모두 감지할 수 있지만 원천의 강도가 우선적으로 적용됩니다. 아퀼로 고밀도 플라즈마 원자로 [item=fusion-reactor]는 약한 2차 누출만 제공하지만, ESIR 열핵 원자로 [item=ei-fusion-reactor]는 활성, 조정된 상태에서 강력한 중성자 플럭스를 제공합니다. 열핵 반응기 제작법을 변경하면 범위 내의 수집기가 감지하는 중성자 배율이 변경되므로, 수집기 대기열에 영향을 줄 수 있습니다.
fusion-neutron-collectors-text-2=수집기는 기하학적 배치를 중요시합니다. 가까운 곳의 저온 원자로 [item=ei-fusion-reactor]는 강력한 플럭스로 연료 생산을 지원할 수 있지만, 고온 발전 시설은 더 많은 열을 발생하며 그만큼 엄청난 연료를 사용하기에, 추후 사용할 중성자가 부족해질 수 있습니다. 주변에 있는 원자로 [item=fusion-reactor]는 단지 배경 누출을 사용하는 것에 불과하므로, 공장에서 이 별을 발전 역할로만 사용할지, 증식로로 사용할지, 아니면 신중하게 용도를 나눠 사용할지 결정해야 합니다.
fusion-power=핵융합 전력 단계
fusion-power-2=중성자 획득
fusion-reactor-agents=에이전트 상태
fusion-reactor-agents-2=신호 값
fusion-reactor-circuit-interface=숨겨진 조합기 인터페이스
fusion-reactor-circuit-interface-2=읽기/쓰기 신호 규약
fusion-reactor-controls=수동 제어
fusion-reactor-controls-2=연료 조합과 잠긴 제작법
fusion-reactor-controls-3=온도와 주입
fusion-reactor-options=옵션과 대체값
fusion-reactor-options-2=프리셋과 덮어쓰기
gaian-saucer=슬립웨이크 비행접시
gaian-saucer-2=각성시 공명도
gaian-saucer-text=The [item=ei-gaian-saucer] 슬립웨이크 비행접시는 가이아 행성의 호버링 비행 차량입니다. 다리를 포함하지 않는 외부 구조에 스파이더트론 지휘 구조가 봉인된 형태입니다. 화물 인벤토리, 장비 격자 구조, 그리고 공허 에너지를 연료로 하는 추진 장치 덕에, 이 선박은 적대적인 경계를 넘어야 하는 순례자들에게 유용한 도구로 활용됩니다.
gaian-saucer-text-2=현재 각성시 공명도 설정값은 [font=default-bold]__1__[/font]입니다. 다만 해당 값은 선체를 따라오는 색채의 기억만을 변화시킬 뿐입니다. 즉, 이동의 여파가 얼마나 밝게 피어오르는지, 회전 흔적이 얼마나 오래 남는지, 그리고 세계가 그 흔적을 어느 정도로 기억해야 할지를 결정한다. 선박 자체의 성능은 변화하지 않습니다.
game-related=게임플레이 관련 정보
game-related-text=이 섹션에서는 모드의 핵심 시스템과 메커니즘을 정리합니다. 이 섹션은 미관적인 목적보다는 편리한 탐색을 위해 명확한 하위 카테고리로 구분되어 있습니다.\n\n왼쪽 메뉴를 사용하여 해당 섹션에 접근할 수 있습니다.\n각 아이템은 구조를 설명하기 위해 존재하며, 재미를 위한 것이 아닙니다.\n생존을 원하신다면 반드시 읽어보세요..
