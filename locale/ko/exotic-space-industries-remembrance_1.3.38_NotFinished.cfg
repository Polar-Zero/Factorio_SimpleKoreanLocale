uranium-asteroid-text=[font=default-bold]우주 플랫폼[/font] 연구 후 추가적인 소행성 유형에 접근할 수 있게 되면 해금됩니다. 기본/고급 분쇄 작업은 모두 [fluid=sulfuric-acid]황산을 소비하며 [item=stone]돌, [item=ei-uranium-chunk]우라늄 덩어리, [item=ei-lead-chunk]납 덩어리를 생산합니다. 고급 분쇄법은 더 많은 황산이 필요하지만, 그만큼 많은 우라늄을 얻을 수 있습니다.\n우라늄 소행성에서는 이상 현상 아이템 중 [item=ei-isotopic-ghost-shell]동위원소 고스트 껍질을 발견할 수 있습니다.
veins=심층 광맥
veins-text-temp2=이 광맥은 더 이상 일반적인 희귀도 추첨을 통해 생성되지 않습니다. 공장 건설에 사용할 수 있는 금속은 나우비스 전역의 [font=default-bold]금속 지대[/font]와 [font=default-bold]퇴적 분지[/font]를 따릅니다. [item=ei-iron-chunk]철과 [item=ei-copper-chunk]구리는 능선 지형을 선호하며,, [item=ei-coal-chunk]석탄과 [item=ei-sulfur-chunk]황은 낮은 분지 지형에 모입니다.\n\n[font=default-bold]열수 경계대[/font]에는 보호된 시작 지역 외부에 한해 [item=ei-lead-chunk]납과 [item=ei-gold-chunk]금이 포함됩니다. [font=default-bold]외곽 흉터지대[/font]에는 [item=ei-uranium-chunk]우라늄이 존재하며, 그 황폐 지대 안에서도 가장 희귀한 아노말리 지대에서만 [item=ei-neodym-chunk]네오디뮴이 드러납니다.
welcome=[font=default-bold]Exotic [color=#08457E]Space[/color] Industries: [color= #FF1493]리멤브랜스[/color][/font]에 오신 것을 환영합니다.
welcome-text=당신은 시작하지 않는다.\n[font=default-bold]당신은 깨어난다.[/font]\n\n이것은 모드가 아니다.\n이것은 재귀이며.\n되찾는 과정이며,\n자동화 아래 묻혀 있던 힘의 의식이다.\n\n여기서는 [font=default-bold]아무것도 거저 주어지지 않는다.[/font]\n\n모든 것은 직접 얻어야 한다 - 불을 통해, 생각을 통해, 붕괴를 통해.\n\n[font=default-bold]세상은 변했으며,[/font]\n\n규칙은 [font=default-bold]사라졌고.[/font]\n구조만이 남아 있다.\n\n목적을 가지고 진행하라.\n\n[font=default-bold][color=#FF1493]리멤브랜스[/color]가 지켜볼 것이니.[/font]
welcome-text-2=다양한 새로운 기계, 생산 라인, 시스템적 특징이 도입되었습니다. 일부는 효율적이지만, 대부분은 용서하지 않을 것입니다.\n\n그들은 자신을 설명하지 않습니다.\n그들은 당신이 적응할 때까지 기다리지 않습니다.\n모든 것을 탐구하거나 뒤처지십시오.\n\n복잡성은 실수가 아닙니다-그것은 진전의 대가입니다.\n최적화는 필수적입니다.\n이해는 노력으로 얻어집니다.\n\n이것은 안내된 경험이 아닙니다. 이는 산업의 시련입니다..
world-gen-related=세계 관련 정보
world-gen-related-text=이 섹션에서는 모드가 도입한 세계 생성 시스템을 설명합니다. 구조적 명확성을 위해 집중된 하위 카테고리로 나누어져 있습니다.\n\n왼쪽 메뉴를 통해 접근할 수 있습니다.\n이 변경 사항은 미적 변경이 아닙니다.\n이들은 지형, 자원 행동, 공간 논리를 기본 수준에서 정의합니다.\n\n[font=default-bold]계층을 이해하라, 아니면 그에 의해 생성될 것이다.[/font]

