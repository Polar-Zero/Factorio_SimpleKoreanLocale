train-progression-text=증기 시대부터 열차를 사용할 수 있습니다. 첫 번째 사용 가능한 선택지는 [color=orange]증기 기관차[/color] [item=ei-steam-basic-locomotive]로, 아이템을 운반할 수 있지만 유체를 운송할 수는 없습니다.\n\n기술이 발전하면 [color=orange]고급 증기 기관차[/color] [item=ei-steam-advanced-locomotive]가 해금되며, 이 모델을 사용하면 유체를 운송할 수 있게 됩니다. 두 모델 모두 석탄이나 고체 연료와 같은 연소 가능한 연료에 의존하지만, 로켓, 핵, 핵융합 연료를 사용하면 성능을 향상시킬 수 있습니다.\n\n하지만 결국 공해를 유발하는 순수한 무차별 연소는 단점이 될 수 있습니다.\n\n보다 우아하고 친환경적이며, 더 효율적인 철도 시스템을 운영하려면 [color=brown]디젤 연료[/color] [item=ei-diesel-fuel-unit] 기반으로 전환해야 하며, 이는 우수한 [color=orange]디젤 기관차[/color] [item=locomotive]를 사용한다는 것을 의미합니다.\n\n기술이 발전함에 따라 물류도 복잡해집니다.\n연료가 경계를 결정합니다.\n열차는 어디로 가는지 묻지 않습니다-그들은 무엇을 싣는지 요구합니다.\n\n가이아의 세계는 나우비스의 논리를 따르지 않습니다.\n\n그곳에서 철도는 단순히 산업용이 아닙니다-그들은 결정체 에너지로 맥동하는 전자기 통로입니다. 가이아의 심연에서, 당신은 수정 에너지로 구동되는 EM 열차[item=ei_em-locomotive][item=ei_em-cargo-wagon][item=ei_em-fluid-wagon]에 접근할 수 있게 됩니다. 이 열차는 전통적인 연료 없이도 무소음 가속과 지속 가능한 고속 운행을 가능하게 합니다.\n\n이 열차는 크리스탈 충전기[item=ei_charger]에서 직접 에너지를 끌어오며 석탄이나 디젤을 전혀 사용하지 않습니다. 그들은 연소되지 않습니다-공명합니다.\n\n가이아는 연소로 움직이지 않습니다.\n그녀는 기억, 신호, 그리고 빛으로 움직입니다.\n이후 가이아에 접근할 수 있다면 철도는 다시 'EM 물류'로 분기됩니다. 이 분기를 통해 철도가 내연기관 처럼 작동하는 것을 그만두고, 네트워크화된 전력 인프라처럼 작동하게 되므로, 이후 별도의 [font=default-bold]EM 기차[/font] 아이템으로 다루게 됩니다.
train-progression-text-2=증기 시대부터 열차를 사용할 수 있습니다. 첫 번째 사용 가능한 선택지는 [color=orange]증기 기관차[/color] [item=ei-steam-basic-locomotive]로, 아이템을 운반할 수 있지만 유체를 운송할 수는 없습니다.\n\n기술이 발전하면 [color=orange]고급 증기 기관차[/color] [item=ei-steam-advanced-locomotive]가 해금되며, 이 모델을 사용하면 유체를 운송할 수 있게 됩니다. 두 모델 모두 석탄이나 고체 연료와 같은 연소 가능한 연료에 의존하지만, 로켓, 핵, 핵융합 연료를 사용하면 성능을 향상시킬 수 있습니다.\n\n하지만 결국 공해를 유발하는 순수한 무차별 연소는 단점이 될 수 있습니다.\n\n보다 우아하고 친환경적이며, 더 효율적인 철도 시스템을 운영하려면 [color=brown]디젤 연료[/color] [item=ei-diesel-fuel-unit] 기반으로 전환해야 하며, 이는 우수한 [color=orange]디젤 기관차[/color] [item=locomotive]를 사용한다는 것을 의미합니다.\n\n기술이 발전함에 따라 물류도 복잡해집니다.\n연료가 경계를 결정합니다.\n열차는 어디로 가는지 묻지 않습니다-그들은 무엇을 싣는지 요구합니다.\n\n가이아의 세계는 나우비스의 논리를 따르지 않습니다.\n\n그곳에서 철도는 단순히 산업용이 아닙니다-그들은 결정체 에너지로 맥동하는 전자기 통로입니다. 가이아의 심연에서, 당신은 수정 에너지로 구동되는 EM 열차[item=ei_em-locomotive][item=ei_em-cargo-wagon][item=ei_em-fluid-wagon]에 접근할 수 있게 됩니다. 이 열차는 전통적인 연료 없이도 무소음 가속과 지속 가능한 고속 운행을 가능하게 합니다.\n\n이 열차는 크리스탈 충전기[item=ei_charger]에서 직접 에너지를 끌어오며 석탄이나 디젤을 전혀 사용하지 않습니다. 그들은 연소되지 않습니다-공명합니다.\n\n가이아는 연소로 움직이지 않습니다.\n그녀는 기억, 신호, 그리고 빛으로 움직입니다.\n이후 가이아에 접근할 수 있다면 철도는 다시 'EM 물류'로 분기됩니다. 이 분기를 통해 철도가 내연기관 처럼 작동하는 것을 그만두고, 네트워크화된 전력 인프라처럼 작동하게 되므로, 이후 별도의 [font=default-bold]EM 기차[/font] 아이템으로 다루게 됩니다.
