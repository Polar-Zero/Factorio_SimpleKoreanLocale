ei-fusion-circuit-agent=1: 회로 연결 없음, 2: 읽기 가능, 3: 제어 중 값을 출력합니다.
ei-fusion-control-agent=1 수동 모드, 2: 회로 모드 값을 출력합니다.
ei-fusion-coolant-agent=1: 유효한 냉각재 요구 또는 3 유효하지 않음을 출력합니다.

