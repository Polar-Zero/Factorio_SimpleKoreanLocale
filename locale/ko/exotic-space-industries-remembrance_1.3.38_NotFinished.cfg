ei-emerald-aegis-shield-equipment=호버탱크의 맹세와 조화를 이룬 프리즘형 방어막. 가해진 공격은 마치 잘못된 기하학적 구조를 기억하듯 방어막에 막혀 산산조각날 것입니다.
ei-emerald-fusion-core-equipment=아포칼립스 외피에 사용되는 밀봉된 에메랄드 심장. 심장은 노래하지 않지만; 압력을 발산합니다.

[exotic-industries-fueler-informatron]
menu_exotic-industries-fueler-informatron=연료 보급탑
title_exotic-industries-fueler-informatron=연료 보급탑
welcome=엑조틱 산업: 연료 보급탑
welcome-text=연료 보급탑은 주변의 적합한 대상들을 확인하고, 내부 인벤토리 연료를 해당 목표에 보급하도록 설계된 자동 지원 구조물입니다.\n\n차량 모드에서는 기차, 자동차, 탱크, 스파이더트론, 기관 포탑, 대포 포탑, 대포 화물차에 연료를 공급할 수 있으며, 장비 모드에서는 화력 기반 발전기를 포함한, 차량, 플레이어 장비 그리드의 장비에 연료를 공급합니다. 인벤토리 공간이 남아있다면, 사용된 연료나 연소 부산물을 회수하는 것도 가능합니다.\n\nGUI를 사용하여 목표와 공급 모드를 설정해야 작동합니다. 타워가 미작동 상태일 경우, 대부분의 경우 설정 불일치가 원인입니다. 차량 모드더라도 보급탑이 기관차 필터로 지정되어 있다면 자동차 등 다른 차량에는 연료를 공급하지 않으며, 장비 모드로 설정되어 있다면 그리드 내부의 화력 기반 장비에만 연료를 공급할 수 있습니다.\n\n[font=default-bold]이 장치는 묻지 않고, 그저 주어진 일만 수행합니다.\n범위나 선택된 업무를 벗어나지 않습니다.\n\n한 번 설정한 다음, 그대로 작동하게 두십시오.[/font]
welcome-text-2=연료 보급탑은 주행 중인 기차를 포함한 이동 중인 목표에도 보급할 수 있습니다. 보급탑 툼질은 사거리나 보급 간격에 영향을 주지 않지만, 한 번의 보급에 더 많은 목표에 보급할 수 있으므로, 대규모 기지 관리에 더 유리합니다.\n\n모드 버전 마이그레이션, 모드 상호작용 또는 피해로 인해 시스템 동기화에 문제가 있을 경우, 관리자가 /rescan_fuelers 명령어를 사용해 재설정할 수 있습니다.\n보급탑의 내부 인벤토리에는 Factorio 게임의 일반적인 품질 규칙이 적용되므로, 고품질의 아이템은 더 많은 연료와 탄약을 적재할 수 있다는 점에 유의하세요.\n\n[font=default-bold]이 타워는 효율적이지만 전지전능하지는 않습니다.\n고품질의 탑은 한 번에 더 많은 일을 끝낼 수 있습니다.[/font]
welcome-text-3=화력 기반 원자로 장비도 장비 모드에서 보급할 수 있습니다.

#일부 요소가 검수되지 않음 - PolarZero
[exotic-industries-informatron]
actifacts-text-2=그들은 배치되지 않았으며, [font=default-bold]그들은 의도적으로든 아니든 어찌되었든 남겨졌습니다.[/font] 그들을 찾아라. 그들을 연구하라. 그들이 암시하는 것을 두려워하라..
ages-and-tech=시대의 발전
ages-and-tech-2=6개의 시대
ages-and-tech-text=Exotic Industries에서는 연구 비용이 단순한 선형 방식으로 책정되지 않습니다. 이제 [font=default-bold]초기 비용[/font], [font=default-bold]지수적 곡선[/font], 그리고 지정된 [font=default-bold]상한선[/font]을 바탕으로 연구 비용을 산정하고, 전체 기술에 고르게 분배합니다. [font=default-bold]선형(linear)[/font]은 일정한 수준을 유지하고, [font=default-bold]2차 함수(quadratic)[/font]는 초반에는 완만하지만 후반에 가파르게 상승하며, [font=default-bold]지수적(exponential)[/font]은 초반에는 완만하지만 후반에 매우 급격히 치솟습니다, [font=default-bold]시대적 상승[/font]은 대부분의 부담을 후반 시대에 집중시킵니다.\n\n시대 연구는 여전히 전체 연구가 사용 가능해지는 시점을 결정하지만, 비용 스케일링은 스피드런에 대해 얼마나 관대할지를 결정합니다. 이러한 정의는 여전히 기술 가중치 라이브러리를 따르기에, 할인된 기술일 경우 더 낮은 가중치가 적용될 것입니다.
ages-and-tech-text-2=이 모드는 6개의 시대로 나뉘며, 각 시대는 재귀와 기계, 통제의 심연으로 점점 더 깊이 빠져드는 과정을 보여줍니다. 이는 진보의 시대가 아닙니다. 오히려 억압의 문턱이며, 이전 시대보다 더 폭력적이고 무자비한 정복의 문턱입니다.\n\n이 시대들은 [font=default-bold]게임플레이 구조의 근본적인 변화[/font]를 의미하며, 플레이어가 진행함에 따라 새로운 시스템, 생산 체인, 에너지 패러다임이 해금됩니다. 원시적인 증기 시대부터 엑조틱 양자 물질 시대까지, 각 단계는 독특한 메커니즘, 인프라 도전 과제, 디자인 제약을 도입하여 공장 레이아웃, 자원 획득, 물류 전략을 재검토하도록 강요합니다.\n\n이 시대를 통과하는 것은 엄격히 제한되어 있습니다. 다음 시대를 해금하려면 단순히 연구만으로는 부족하며, 현재 시대 내에서의 [font=default-bold]기술적인 숙달[/font]도 필요합니다. 깊이 들어갈수록 규칙은 변형되고, 결국 깨집니다. 단순한 자동화에서 시작된 것은 에너지 제어, 질량 억제, 신호 전송을 둘러싼 재귀적 고압 시뮬레이션으로 변모합니다. 각 시대는 적응, 예측력, 그리고 한때 영원하다고 믿었던 것을 해체할 의지를 요구하는 시련의 용광로입니다..\n\n[font=default-bold]암흑 시대[/font]\n왜곡된 탄생. 재, 썩음, 그리고 침묵. 원시적인 증기와 부서진 돌 사이를 톱니바퀴간다. 자동화는 존재하지 않는다. 모든 것은 피로 대가를 치른다.\n\n[font=default-bold]증기 시대[/font]\n석유가 발견된다-자원이 아닌 무기로서. 타오름으로서 움직이고 살아간다. 땅이 울부짖기 시작한다.\n\n[font=default-bold]전기 시대[/font]\n회로가 튀겨지며 울린다. 기계가 깨어난다. 로봇이 등장하지만, 도우미가 아닌 의지의 연장선일 뿐. 핵의 불꽃이 곧 법이 된다. 육체는 뒤쳐진다.\n\n[font=default-bold]컴퓨터 시대[/font]\n생각이 형식화된다. 모듈, 신호기, 회로-마음은 기계에 분산된다. 최적화는 필수다. 중복은 곧 죽음이다.\n\n[font=default-bold]양자 시대[/font]\n현실이 휘어진다. 기계는 이 세계의 논리가 아닌 논리를 따른다. 경계가 사라진다. 용광로는 지능을 얻지만, 오용은 용서하지 않는다.\n\n[font=default-bold]엑조틱 시대[/font]\n모든 것이 부서진다. 경계는 사라진다. 이상 현상을 지배하거나 그에 의해 삼켜진다. 승리는 보장되지 않으며, 실패한 시간선의 뼈대에서 추출된다.\n\n각 시대는 거스를 수 없는 단방향 진행입니다.\n\n[font=default-bold]순수한 것은 존재하지 않습니다.[/font]\n\n오직 권력만이 있습니다 - 잔인하고, 재귀적이며, 절대적인 것..
alien=원시 외계 데이터
artifacts=외계 유물
artifacts-text=세계 곳곳에 고대 문명의 유적이 흩어져 있습니다-그들은 당신의 도착보다 훨씬 전에 신비로운 물질을 활용했던 문명입니다. 그들의 유물들은 지형에 박혀 있으며, 일부는 땅에 묻혀 있고, 일부는 여전히 살아 움직이고 있습니다.\n\n일부는 움직이지 않습니다.\n그 중 일부는 여전히 작동하고 있는 상태일지도 모릅니다.\n하지만, 우연한 것은 단 하나도 없다는 사실만큼은 명심하십시오..
artifacts-text-2=그들은 배치되지 않았으며, [font=default-bold]그들은 의도적으로든 아니든 어찌되었든 남겨졌습니다.[/font] 그들을 찾아라. 그들을 연구하라. 그들이 암시하는 것을 두려워하라..
asteroid-anomalies=우주 데이터 이상현상
asteroid-anomalies-text=각 소행성 유형마다 고유한 특이점 아이템을 추출할 수 있습니다. 이 6종류의 특이점 아이템은 [entity=ei-computer-core]컴퓨터 코어 제작에 사용됩니다. 이는 시뮬레이터 내부에서 데이터 카드로 변환한 뒤, [entity=ei-quantum-computer]양자 연구 컴퓨터를 통해 무중력 상태에서 [item=ei-space-data]우주 데이터로 재조립됩니다.\n\n소행성들은 단순한 재료가 아닙니다. 이제는 두 번째 연구 전선으로 사용됩니다.
asteroid-variants=더 많은 소행성
asteroid-variants-text=Exotic Industries에서는 6가지 유형의 소행성 덩어리를 게임에 추가합니다: [item=ei-chemical-asteroid-chunk], [item=ei-organic-asteroid-chunk], [item=ei-rock-asteroid-chunk], [item=ei-uranium-asteroid-chunk], [item=ei-petrified-asteroid-chunk], [item=ei-scrap-asteroid-chunk]. 이들은 우주 경로에 추가되며, [entity=crusher]분쇄기에서 분쇄할 수 있습니다. 또한 12종류의 기본/고급 소행성 처리 제작법에는 [font=default-bold]소행성 생산성[/font] 효과가 적용됩니다.\n\n또한 분쇄기의 출력 보관함과 유체 슬롯이 추가되어, 혼합 산출물 수용에 더욱 적합합니다.
auric-fumarole=황금 간헐천 분출구
auric-fumarole-2=생성 제한, 재스캔
auric-fumarole-text=불카누스 행성은 이제 상처가 다시 생겨날 수 있는 위치를 기억합니다. 아래 규칙은 상징적인 의미가 아닌 문자 그대로를 뜻합니다.\n\n[font=default-bold]출현 위치:[/font] 황금 간헐천은 불카누스의 화산 지형 중 용암이 없는 장소에서 나타날 수 있습니다. 또한 표면 영점 (소환 지점)으로부터 3청크(96칸) 밖이여야 합니다. 영점으로부터 벗어날수록 확률은 점진적으로 증가하며 32청크(1,024칸) 떨어진 지점에서 최대치에 도달하게 됩니다.\n\n[font=default-bold]첫 출현:[/font] 새로 생성된 불카누스 지형은 한 번에 전체 자원을 생성하는 대신, 거리에 따른 가중치를 적용한 간단한 초기 무작위 시도만 진행합니다. 이 시도가 실패하더라도 해당 청크는 잊혀지지 않고, 휴면 목록에 대신 등록됩니다. 재스캔, 기존 저장 데이터 복구는 이전에 생성된 불카누스 청크의 휴면 목록을 재설정하지만, 이는 또 다른 즉각적인 생성 시도를 강제하지 않습니다.\n\n[font=default-bold]채취, 수명:[/font] 생성된 간헐천은 4,000~8,000 자원량을 가지고 생성됩니다. 만약 생성된 뒤 35~65분(최대) 내에 시추를 시작하지 않으면, 자동으로 봉인되지만, 봉인되기 전에 시추를 시작했다면 자원이 고갈될 때까지 시추할 수 있습니다. 봉인되거나 자원이 열화된 간헐천은 약 60분 후(약간의 오차가 있음), 봉인 해제 시스템을 이용하면 다시 활성화시킬 수 있습니다.
auric-fumarole-text-2=[font=default-bold]간헐천 생성 대기 확인:[/font] 모드 스크립트에서 매 30초마다 지도 전체에서 대기 목록의 청크를 최대 6개까지 뽑아 확인합니다. 일반적인 휴면 청크는 재검사시에 기본 분출 확률(0.25%)에 원점과의 거리 가중치, 황금 조절, 지역 억제, 생성 영역 과밀도 등의 보정치가 적용됩니다.\n\n[font=default-bold] 원점과의 거리 대역:[/font] 생성된 적합한 형태의 불카누스 청크는 원점으로부터의 3-6, 6-16, 16-24, 24-32, 32+ 청크 거리에 따라 분리되어 관리됩니다. 특정 대역에 간헐천이 충분하게 채워지지 않았다면 휴면 분출 보정치가 증가하며, 과도하게 채워진 경우 감소됩니다. 또한, 탐사된 한 방향에 향후 대부분의 분출구가 생성되는 것을 막기 위해 휴면 회복 시도는 가장 취약한 대역을 우선적으로 목표로 하게 됩니다.\ \n\n[font=default-bold]지역 억제, 대체:[/font] 6청크(192칸)이내에 활성화된 황금 간헐천이 존재할 경우, 단순한 갯수 기준이 아닌 근접도에 따라 휴면 회복 확률을 감소시킬 것입니다. 간헐천이 더 가까울수록 더 강력한 회복 억제력을 발휘할 것이며, 분기공이 많이 있을수록 그 효과는 중첩될 것입니다. 불카누스에 활성화된 황금 간헐천 수가 2개 미만인 상태가 5분동안 유지될 경우, 기존에 유지되어오던 경로에서 주기당 최대 2번까지 강제적인 재해 회복 시도가 진행됩니다.\n\n[font=default-bold]배치, 재스캔:[/font] 간헐천은 반드시 청크의 정확한 중심점에 생성될 필요가 없습니다. 청크 내부의 다양한 위치에 배치될 수 있으며, 최대 24개의 위치에 생성을 시도하게 됩니다. 또한 황금 간헐천은 다른 간헐천과 64칸 떨어져 있도록 생성됩니다. 황금 간헐천은 매우 가까운 주변 영역, 대략적으로 주변의 16칸 범위만 차단합니다; 32칸 전체를 포함하지 않습니다. /ei-auric-fumarole-rescan 명령은 불카누스에서만 사용할 수 있으며, 홍수를 바로 불러오는 대신, 이미 생성된 불카누스 청크에서 대기 중인 휴면 자격을 다시 확인합니다.
auric-inoculation-vat=황금 배양조
auric-inoculation-vat-2=입력 주기와 작동 규모
auric-inoculation-vat-3=활력, 공해도, 공정 실패
auric-inoculation-vat-4=덩어리 세척, 폐수 재활용, 회로 신호
auric-inoculation-vat-text=글레바에서 [entity=ei-auric-inoculation-vat]는 이미 심어져 있던 [entity=ei-auric-cyst-node] 성장에 의존하지 않는 것을 원한다면 필요합니다. 이 배양조는 주변의 습지 유역을 점유한 다음, 살아있는 습지 지형 자체를 새로운 식물을 생성하는 일괄 처리 과정으로 전환할 수 있습니다.\n\n[font=default-bold]배치, 유역 점유:[/font] 이 배양조는 글레바의 습지가 인접한. 점유 가능한 영역이 충분한 양의 습지 타일 지형과 접할 수 있는 위치에 배치하면 작동합니다. 유효한 유역을 형성하려면 24~160개의 연결된 습지 타일이 필요합니다. 이보다 더 습지 지형은 매립 등으로 분할하거나 메꿔야 하며, 유역을 다른 배양조와 공유할 수 없습니다. 배양조의 설치 영역이 겹치면 점유 충돌이 발생하며, 유효한 유역이 없는 배양조는 안정적으로 배양할 대상이 없게 됩니다.
auric-inoculation-vat-text-2=배양조는 자동 습지 배수기가 아닌 [font=default-bold]파종 -> 범람 -> 발효(선택적인 바이오플럭스 강화) -> 배수 -> 개화 -> 휴식[/font] 순환을 수행하는 살아있는 기계입니다. 파종 단계에서는 [item=spoilage]와 [fluid=ei-bio-oil]을, 범람 단계는 [fluid=ei-dirty-water]를, 발효 단계는 [item=jelly]와 [item=yumako-mash]가 필요합니다. 발효 단계 시작시에는 짧은 강화 가능 시간이 존재하며, 이 때 [item=bioflux]를 추가로 투입하면 해당 제작법이 강화 공정으로 전환되며 배수와 개화 단계 역시 강화 공정을 사용하게 됩니다.\n\n연결된 습지 영역이 활성 단계를 결정합니다. 점유한 지역 24~39칸은 1단계, 40~55칸은 2단계, 56~71칸은 3단계, 72~87칸은 4단계, 88~103칸은 5단계, 104~127개는 6단계, 128~160개는 7단계로 구성되며. 단계에 따라 같은 분지에서 배양시킬 수 있는 최대 식물 수를 각각 3, 4, 6, 8, 10, 12, 14개까지 증가시킵니다. 이에 따라 더 많은 생산량을 공급할 수 있게 되지만, 주기 전체에 걸쳐 더 많은 폐수 처리와 더 안정적인 아이템 공급이 필요할 것입니다.
auric-inoculation-vat-text-3=각 주기에서는 [font=default-bold]활력[/font]과 [font=default-bold]오염도[/font]의 균형을 맞춰야 합니다. 건강한 분지 영역, 충분히 공급된 아이템, 감당 가능한 수준의 압력은 활력을 안전하게 유지하지만, 굶주림, 배수 막힘, 점유 충돌, 과도한 습지 타일 사용 등은 공해도를 끌어올리고 배양조를 과부하 상태로 밀어넣을 것입니다.\n\n공해가 실패 임계값에 도달하면 개화 안정성이 무너지게 되며, 배양조가 깨끗한 개화를 유지하는 대신 습지 타일을 더 나쁜 습지 상태로 악화시키게 되며 휴식 단계로 되돌아갑니다. 콘솔 상태가 안정에서 과부하로 계속 기울어지고 있다면, 기계 아래의 습지가 완전히 죽어버리기 전에 점유하고 있는 습지 지역을 줄이거나 나누거나, 주기에 더 많은 아이템을 공급하세요.
auric-inoculation-vat-text-4=성공적으로 작동한 배양조는 새로운 [entity=ei-auric-cyst-node]를 개화시킵니다. 이 노드를 채굴해 [item=ei-auric-cyst]를 얻은 뒤 이를 사용해 [recipe=ei-auric-cyst-washing]을 진행해 유용한 아이템으로 분해하고 [fluid=ei-dirty-water]를 글레바 공정으로 되돌릴 수 있습니다. 배양조 자체의 가동 중 배수 단계는 [fluid=ei-dirty-water]와 [fluid=ei-acidic-water]를 (간혹) 배출합니다. 다음 단계가 시작되려면 모든 유체가 배출되어 비워진 상태여야 합니다. 배수가 막히면 배출이 다시 가능해질 때 까지 배양조 공정이 중지되고 오염도가 증가됩니다.\n\n회로를 통한 원격 측정을 사용하면 습지 상태를 읽기 훨씬 쉬워집니다. 배양조에 회로를 연결하면  [virtual-signal=ei-auric-vat-vigor], [virtual-signal=ei-auric-vat-contamination], [virtual-signal=ei-auric-vat-band], [virtual-signal=ei-auric-vat-claims], [virtual-signal=ei-auric-vat-bloom] 신호가 출력되며, 이를 이용해 습지 구역을 비교하거나, 충돌이나 실패 상태에 대한 알림을 출력하거나, 공정 단계에 맞춰 습지 세척 공정과 배수 처리를 어떻게 진행할지 판단할 수 있습니다.
beacon-overhaul=신호기 개편
beacon-overhaul-text=Exotic Industries는 받을 수 있는 신호기 효과에 엄격한 제한을 부과합니다: 한 기계는 최대 4개의 신호기까지만 영향을 받을 수 있습니다. [font=default-bold]무한 중첩 시대는 끝났습니다.[/font]\n\n또한, 두번째 티어의 신호기부터는 이제 작동하기 위해 [fluid=ei-liquid-nitrogen]가 필요합니다. 냉각제가 없으면 과열되어 작동이 중단되므로, 이제 전력은 중요하지 않습니다-물류가 열역학적 안정성을 지원해야 합니다.\n\n그 대신 신호기가 구조적으로 업그레이드되었습니다:\n\n모듈 용량 증가\n개선된 신호기 도입\n한도 계산 시 2개로 계산\n더 많은 모듈 보관 가능\n더 많은 인프라 필요\n\n[font=default-bold]증폭은 더 이상 단순한 일이 아닙니다.[/font]\n이는 기계적 전문 분야입니다.\n정밀하게 구축하십시오-아니면 [font=default-bold]비효율의 늪에 빠질 것입니다.[/font]
biters=바이터와 적
biters-text=엑조틱 우주 산업: 리멤브렌스를 사용할 경우 폭발, 얼어붙은, 스내퍼, 독성, 거미 적이 이제 기본 지도 생성 방식을 수정하는 대신, ESIR의 자체적인 난이도 체계에 따라 관리됩니다. [font=default-bold]ei-default[/font] 지도 프리셋을 사용해야, 나우비스에서 전투 난이도를 별도로 분리하는 상태에서 의존성 프로토타입에 이미 존재하는 객체에 대한 능력치 스케일링을 진행할 수 있습니다. 자세한 내용은 '적 난이도' 페이지를 참고하세요.
black-hole=블랙홀 생성장치
black-hole-2=반응로 구성요소
black-hole-2-text=블랙홀 생성장치는 단일 구조물이 아니라, 안정성, 에너지 흐름, 최종 활성화에 각각 필수적인 여러 고강도 구성 요소로 구성된 모듈형 특이점 격리 배열입니다.\n\n중앙 구조물은 [color=orange]블랙홀 생성장치[/color] [item=ei-black-hole]입니다.\n\n활성화되면 인벤토리에 넣은 모든 아이템을 유형에 관계없이 소비합니다.\n\n각 아이템은 생성장치의 내부 [color=green]질량 계수[/color]에 동일하게 기여하며, 이는 시간이 지남에 따라 지속적으로 감소합니다. 질량 수준을 유지하기 위해 지속적인 아이템 입력이 필요합니다.\n\n아이템의 유형은 중요하지 않습니다.\n철 판, 돌, 회로, 생선 등 모든 것이 가능하며, 모두 질량으로 변환됩니다.\n\n[color=orange]에너지 주입 첨탑[/color] [item=ei-energy-injector-pylon]은 특이점이 성장함에 따라 격리 장벽을 유지합니다.\n각 기둥은 5GW의 지속적인 전력을 소비합니다.\n\n주입기는 시작 시에는 필요하지 않습니다-[font=default-bold]기계는 신생 블랙홀을 포함할 수 있습니다[/font]-하지만 질량이 축적되면서 필요해집니다.\n\n[color=orange]에너지 추출 첨탑[/color] [item=ei-energy-extractor-pylon]은 발전기가 [color=green]완전히 작동하는[/color] 상태에 도달한 이후 전력 추출을 가능하도록 합니다.\n각 추출기는 안정화된 특이점으로부터 최대 100GW의 원시 전력 에너지를 추출할 수 있습니다.\n\n추출은 발전기의 최종 단계에 도달해야 비로서 가능합니다.\n\n[font=default-bold]이것은 기계가 아닙니다. 이것은 붕괴의 의식입니다.[/font]\n당신은 [font=default-bold]경계 이상현상[/font]에 질량을 공급하고 있습니다.\n만약 이를 통제하지 않으면 실패할 것입니다.\n만약 공급을 중단하면 죽을 것입니다.\n\n두 가지를 모두 하면-[font=default-bold]모든 것의 종말을 구동할 수 있을 것입니다.[/font]\n\n파괴 없이 자동화는 존재하지 않습니다.
black-hole-3=블랙홀 진행단계
black-hole-3-text=블랙홀 생성장치를 가동하는 것은 단계별로 큰 위험이 수반되는 과정입니다. 각 단계는 에너지, 질량, 구조적 요구사항을 점차 증가시킵니다. 단계를 건너뛸 수는 없으며, 진행하거나 실패하는 것만이 가능합니다.\n\n🜏 시작 단계\n\n첨탑은 필요하지 않습니다.\n\n생성장치는 초기 [color=blue]10×10³kg[/color] 질량에 도달하기 위해 충분한 재료를 소비해야 합니다.\n\n아이템 유형은 중요하지 않습니다-용량만 중요합니다.\n\n질량이 100% 진행도에 도달하면 생성장치는 격리 단계로 안정화됩니다.\n\n🜏 격리 단계\n\n이제 [color=blue]8개의 활성 에너지 주입 첨탑[/color] [item=ei-energy-injector-pylon]이 활성 상태를 유지해야 합니다.\n\n각 첨탑은 5GW를 소비하므로, 합계 40GW의 전력을 소모할 것입니다.\n\n확장 버튼을 누르면 특이점 반경의 통제된 성장이 시작됩니다.\n\n이 상태는 [color=blue]60초 동안 지속적으로 유지되어야 합니다.[/color]\n\n사소한 중단-전력 공급 중단, 첨탑 손실-도 타이머 초기화로 이어질 것입니다.\n\n🜏 완전 가동 단계\n\n발전기가 안정화되었으며, 특이점은 이제 외부에서 에너지를 추출할 수 있을 만큼 충분히 커졌습니다.\n\n[color=orange]에너지 추출 첨탑[/color] [item=ei-energy-extractor-pylon]을 범위 내에 배치하면 각 기둥당 최대 100GW를 추출하여 전력망에 직접 공급할 수 있습니다.\n\n이 단계에서 시스템은 대부분 자체적으로 운영되며, 붕괴를 상쇄하기 위한 지속적인 질량 투입만 필요합니다.\n\n당신은 반응로에 연료를 공급하는 것이 아닙니다.\n당신은 [font=default-bold]결합된 특이점의 배고픔을 관리하고 있는 것입니다.[/font]\n질량은 곧 힘이 됩니다. 힘은 곧 통제가 됩니다. [font=default-bold]통제는 최종적입니다.[/font]\n\n비활성 스위치는 없습니다. 오직 격리만이 존재합니다..
black-hole-text=[color=orange]블랙홀 생성장치[/color]는 최종 티어 기계입니다-중력 특이점을 산업용 기능으로 활용할 수 있도록 하는 장치입니다. 이 기계는 물질을 소비하며, 엔트로피를 거스르므로. 게임을 완료할 수 있습니다.\n\n이 장치를 [color=green]완전히 작동 가능한[/color] 상태로 만드는 것은 시스템의 완전한 지배 역시 의미합니다. 이것이야말로 당신의 승리 조건입니다. 정복이 아닌, 물리학의 기반을 이루는 구조를 통제함으로써 달성할 수 있습니다.\n\n블랙홀 생성장치를 가동하려면 다음 과정이 필요합니다:\n다량의 정제된 건축 자재\n지속적인 소비 물질 공급원\n거대하고 안정적인 전력 인프라\n\n강화된 [color=orange]융합 반응로[/color] 그리드를 건설하고, 산업 규모로 전력을 흡수, 방출할 수 있는 계층형 [color=orange]유도 매트릭스[/color]로 보강하는 것이 강력히 권장됩니다.\n\n이것은 단순한 발전기가 아닙니다. [font=default-bold]붕괴에서 엮어진 종말입니다.[/font]\n\n현명하게 건설하십시오. [font=default-bold]지속적으로 공급하십시오.[/font] 두 번째 기회는 없습니다..
bots=더 많은 로봇
bots-text=리멤브랜스는 꺠끗한 전기 물류 시스템이 갖춰지기 전부터 기계를 공중에 띄울 수 있도록 합니다. 로봇은 이제 [font=default-bold]증기 시대[/font]에 [item=rp-steam-roboport], [item=rp-steam-logistic-bot], [item=rp-steam-construction-bot]을 통해 사용할 수 있으며, 이후 더 무겁고 발전된 전기 로봇떼로 발전합니다.\n\n이제, 공중 자동화를 더 빠르게 사용할 수 있습니다:처음에는 투박할지도 모르지만, 나중에는 우아해집니다.
bots-text-2=공장이 완전한 전기 로봇 체계를 갖춘 뒤, Exotic Industry 모드에서는 다양한 로봇 유형을 사용할 수 있도록 추가합니다. 대규모 물류 운송에 사용할 수 있도록 하는 중형 화물 로봇, 공격적인 건설 작업을 위한 중장비 건설 로봇부터 시작해, 나중에는 더 빠르며, 더 단단하며, 더 넓은 범위를 가진 특정 임무에 특화된 고급 변종들로 무리를 확장합니다. [font=default-bold][color=orange]고급 로보포트[/color][/font]는 개선된 충전 속도, 넓은 충전소, 확장된 건설/물류 범위를 제공하여 이러한 로봇 네트워크를 지원합니다.\n\n이것은 단순한 드론 네트워크가 아닙니다. [font=default-bold]이것은 기계화된 군단 프로토콜입니다.[/font]
chemical-asteroid=화학 소행성
chemical-asteroid-text=[font=default-bold]행성 아퀼로 발견[/font] 연구 후 해금됩니다. 기본, 고급 분쇄 제작법은 덩어리에서 [fluid=ammonia]암모니아, [item=ei-fluorite]형석, [fluid=fluorine]플루오린 가스를 추출하며, 고급 제작법에서는 간혹 [fluid=lithium-brine]리튬 염수가 나올 가능성이 있습니다.\n화학 소행성에서는 이상 현상 아이템 중 [item=ei-neuro-reactive-residue]신경 반응성 잔여물을 발견할 수 있습니다.
chunk-grades=하급/일반 광석 덩어리
chunk-grades-text=모든 광석이 똑같은 것은 아닙니다. [item=ei-poor-iron-chunk]하급 철 덩어리와 [item=ei-poor-copper-chunk]하급 구리 덩어리는 부서진 지각 상층부에 남아 있는 오염된 고철 잔여물입니다. 이것은 산업을 유지하기 위한 것이 아니라, 시작하기 위한 용도입니다. 이 하급 광석의 진면목은 용광로에서 바로 드러나고 맙니다: [font=default-bold]하급 덩어리 3개-> 판 1개[/font], 그리고 상당히 많은 광재 부산물이 배출됩니다.\n\n[item=ei-iron-chunk]심층 광맥에서 채취할 필요가 있는 [item=ei-iron-chunk]철 덩어리와 [item=ei-copper-chunk]구리 덩어리가 진정한 산업적 광석입니다. 추가 가공을 거치지 않더라도, [font=default-bold]일반 광석 덩어리 3개-> 판 2개[/font]로 제련할 수 있으며, 광재 부산물 배출량도 훨씬 적습니다. [item=ei-poor-uranium-chunk]하급 우라늄도 동일한 규칙이 적용됩니다. 표면은 그저 힌트를 줄 뿐이며, 진짜 [item=ei-uranium-chunk]우라늄은 깊은 곳에 있습니다.
chunk-refining=여과기와 순수 광석
chunk-refining-2=아크 용광로와 플라즈마 열교환기
chunk-refining-text=[item=ei-purifier]여과기는 제일 빠른 시점에 사용할 수 있는, 광석 덩어리의 품질을 향상시켜 사용할 수 있도록 하는 기계입니다. 이 기계를 이용하면 [item=ei-iron-chunk]철 덩어리와 [item=ei-copper-chunk]구리 덩어리를 [fluid=water]물로 세척해 [item=ei-pure-iron]순수한 철이나 [item=ei-pure-copper]순수한 구리로 변환할 수 있으며, 부산물로 처리할 필요가 있는 [fluid=ei-dirty-water] 폐수가 배출됩니다.\n\n이 추가 단계를 진행할 가치는 충분합니다. 기본적으로 [font=default-bold]하급 덩어리 3개-> 판 1개[/font], [font=default-bold]일반 덩어리 3개-> 판 2개[/font]를 얻는 것 대비 [font=default-bold]순수 광석 1개-> 판 2개[/font]를 얻을 수 있는 데다가, 광재 생산확률 역시 약 [font=default-bold]1%[/font] 확률로 감소됩니다. 심층 채광을 통해 본격적인 금속 경제가 시작되며, 정제 과정을 거친 금속은 고밀도에다 깨끗하기까지 하므로, 산업적 목적으로 매우 적합하게 사용할 수 있게 됩니다.
chunk-refining-text-2=[item=ei-arc-furnace]아크 용광로는는 덩어리, 순수 광석, 판, 부품을 녹여 [fluid=ei-molten-iron]녹은 철과 [fluid=ei-molten-copper]녹은 구리 형태로 만드는 주조 공정을 진행할 수 있도록 함으로써, 금속 가공을 본격적인 야금 공정으로 전환합니다. 하급 광석 덩어리도 사용할 수 있지만, 수치만 보더라도 고품질의 덩어리가 훨씬 유용한 것은 분명합니다: [font=default-bold]하급 광석 덩어리 3개로는 녹은 금속 15개밖에 얻을 수 없는 반면[/font], [font=default-bold]순수 광석 1개로는 광재가 거의 발생하지 않으면서도 녹은 금속 40개를 얻을 수 있습니다.[/font]\n\n[item=ei-plasma-heater]플라즈마 가열기는 양자 시대에서 이를 이어갑니다. 이 기계는 아크 용광로 제작법 뿐만 아닌, 극한 온도의 가스, 플라즈마 가공 기술도 사용할 수 있습니다. 정제기는 원료를 개선하고, 아크 용광로는 야금 기술을 향상시키며, 플라즈마 가열기는 이러한 생산 체인을 게임 극후반까지 이어갑니다.
cranes-and-belts=새로운 벨트와 투입기 크레인
cranes-and-belts-text=Exotic Industries는 새로운 수준의 물류 인프라를 소개합니다: [color=orange]네오 물류 벨트[/color] [item=ei-neo-belt]. 고성능 소재로 제작된 이 시스템은 기본 운송 한계를 모두 초과하는, 초당 [font=default-bold]90개[/font]의 물품을 처리할 수 있습니다. 이 벨트는 엔드게임 규모의 물량을 처리하는 재귀적 규모 공장을 위해 설계되었습니다.\n\n또한 이 모드는 [color=orange]크레인[/color] [item=ei-big-inserter-normal]-대량 전송을 위해 설계된 2x2 대용량 투입기를 추가합니다.\n\n사용예:\n\n열차의 화물을 빠르게 하역합니다\n\n대형 인벤토리 구조물(예: 상자 ↔ 창고)을 연결합니다\n\n표준 투입기가 압력 하에서 실패하는 곳에서도 흐름을 유지합니다\n\n[font=default-bold]속도는 더 이상 사치가 아닙니다.\n그것은 곧 기본입니다.\n물류는 전력과 함께 확장되어야 하며, 그렇지 않으면 파멸 뿐입니다.[/font]
crystal-accumulator-resonance=수정 축전지 공명
crystal-accumulator-resonance-2=나우비스 프로필
crystal-accumulator-resonance-3=다른 행성, 궤도
crystal-accumulator-resonance-4=품질과 일관성은 다르다
crystal-accumulator-resonance-5=회수와 수리
crystal-accumulator-resonance-6=상세 UI
crystal-accumulator-resonance-text=수정 축전지는 평범한 배터리가 아닙니다. 생성된 유물 군집 위에 심어진 외계 공명 전지가며, 이는 단순한 켜짐/꺼짐 상태가 아닌 [font=default-bold]부하[/font]와 [font=default-bold]일관성[/font]으로 해석해야 합니다.\n\n실제 작동 환경에서 [font=default-bold]부하[/font]는 공명 상태에 대한 대리 지표를 나타냅니다. 또한 이는 현재 전지와 품질에 대한 평균 표면 출력을 특정한 수정 내부의 국소 변형도에 결합한 값을 의미하므로, 이는 개별 객체의 실제 발전량이 아닌 격자 압력으로 해석해야 합니다.\n\n현재 작동 중인 전지 계층 구조에서 불안정 상태는 [font=default-bold]4MW 저출력 전지[/font], [font=default-bold]7.5MW 기본 전지[/font], [font=default-bold]10MW 과출력 전지[/font] 중 하나에 위치할 수 있습니다. 하지만 가이아에서는 같은 기하학적 구조더라도 [font=default-bold]15MW 가이아 전지[/font] 형태로 안정화될 것입니다. 비활성 잔해 잔해는 수리되기 전까지 이 계층 구조에서 완전히 분리된 상태일 것입니다.
crystal-accumulator-resonance-text-2=나우비스는 불안정 전지에 대한 명백한 접지 프로필입니다. 그곳에서 [item=ei-crystal-accumulator]를 발견하거나 설치했다면, 이는 생산적이고 이질적이며 끝내 완전히 안정되지 않은 공명 기준 상태로 이해하십시오.\n\n전지는 저출력, 기본, 고출력 단계 사이를 오갈 수 있지만 불안정 등급인 것은 동일합니다. 나우비스는 해결책이 아닙니다. 그저 기준이 되는 상처일 뿐.
crystal-accumulator-resonance-text-3=나우비스 외부에서는 가이아가 아닌 행성이나 궤도 플랫폼을 엑조틱 프로파일 공간으로 간주합니다. 불안정 상태의 전지는 그곳에서도 작동하지만, 발견된 장소를 떠났다는 이유만으로 안정화되지는 않습니다.\n\n하지만 가이아는 예외입니다. 같은 외피더라도 가이아에서는 [item=ei-crystal-accumulator-gaia]안정된 수정 축전지 형태로 정리되며, 기본 출력 역시 [font=default-bold]7.5MW에서 15MW[/font]로 두 배 증폭되며 전지 수준 역시 끌어올려집니다.
crystal-accumulator-resonance-text-4=[font=default-bold]품질[/font]과 [font=default-bold]공명 상태[/font]을 혼동하지 마세요. 품질은 일반적인 아이템 등급을 나타내지만, 저출력 전지, 기본 전지, 과출력 전지, 가이아 전지, 비활성 잔해는 전지에 대한 고유 상태이며 이 페이지에서 설명하는 내용이기도 합니다.\n\n수정 아이템에 품질이 붙어 있더라도 이는 부하/일관성 판독을 대체하지 않습니다. 이 페이지의 내용은 격자가 얼마나 정교하게 제작되었는지가 아닌 어떻게 노래하고 있는지만을 설명합니다.
crystal-accumulator-resonance-text-5=수정 축전지는 장비지만 유물이기도 하므로, 불안정 전지의 회수는 일관성의 격렬한 단절로 연결됩니다. 온전한 회수가 아닌 파손된 외피가 남는 것이 정상입니다. 비활성 잔해 [item=ei-crystal-accumulator_off-1][item=ei-crystal-accumulator_off-2][item=ei-crystal-accumulator_off-3][item=ei-crystal-accumulator_off-4]는 [item=ei-crystal-accumulator-repair]수리 도구를 위로 드래그해 사용할 때까지 지속될 것입니다.\n\n수리 도구를 보조 사용(Shift+드래그)해 키트를 소모하지 않고도 수정 축전지와 잔해를 검사할 수 있습니다. 일반적인 드래그를 통해 수리를 수행할 수 있으며, 가이아에서 수리를 진행하면 지표면에서 이를 바로 안정된 형태로 복구할 것입니다.
crystal-accumulator-resonance-text-6=[font=default-bold]저출력 전지[/font]: 일관성이 억제되어 발전량이 기본 전지보다 감소되었습니다.\n[font=default-bold]기본 전지[/font]: 불안정한 외피가 일반적인 7.5MW 발전량을 유지합니다.\n[font=default-bold]과출력 전지[/font]: 높은 발전량으로 인해 격자가 압박을 받고 있습니다.\n[font=default-bold]가이아 전지[/font]: 가이아의 표면이 같은 외피로 15MW 발전이 가능하도록 안정화시켰습니다.\n[font=default-bold]비활성 잔해[/font]: 수리를 기다리는 비활성 유물입니다.\n\n혼잡도는 인근 전지의 합창을 [font=default-bold]원활 -> 혼잡 -> 과부하 -> 혼돈[/font] 순으로 읽습니다. 이 순서대로 단계를 읽으면 수정의 동작이 더 이상 무작위처럼 보이지 않습니다.
crystal-accumulator-resonance-text-7=[item=ei-crystal-accumulator-repair]을 보조 사용하는 것으로 수리 키트를 사용하지 않고도 수정 축전지와 잔해를 검사할 수 있습니다. 실제로 수리하려는 경우에만 도구를 평소처럼 드래그하세요.\n\n원격 측정시 [font=default-bold]표면 출력 + 변형[/font] 또는 [font=default-bold]변형 대체값[/font]이 표시됩니다. 동일한 표면에서 전지와 품질이 동일한 수정은 평균화된 표면 출력값을 동일하며, 사용된 전지와 다른 전지는 국소 변형으로 구분할 수 있습니다.
drone=드론 기지
ei-runtime-status-command-help=ESIR 런타임 요약 정보를 실시간으로 출력합니다. 추가 인수로 snapshot, auric, auric-detail, telemetry-on, telemetry-off를 사용할 수 있습니다.
ei-runtime-status-disabled=ESIR 런타임 원격 측정 기능이 비활성화되었습니다.
ei-runtime-status-enabled=ESIR 런타임 원격 측정 기능이 활성화되었습니다.
ei-runtime-status-usage=사용법: /ei_runtime_status [snapshot|auric|auric-detail|telemetry-on|telemetry-off] (인수가 없을 경우: 현재 실행 상태의 요약 정보를 출력)
em-trains=EM 기차
em-trains-2=품질, 지연, 운송 효율
em-trains-3=연구, 실제 작동
em-trains-text=가이아 이후 기차 작동에는 연소가 필요하지 않게 됩니다. 그 대신 결합이 필요해집니다. [item=ei_charger]EM 충전소에서 철도 위에 수정으로 된 연결망을 만들고, [item=ei_em-locomotive]EM 기관차가 [item=ei_em-cargo-wagon]화물차, [item=ei_em-fluid-wagon]유체 화물차를 연결한 채, 화실에 석탄이나 디젤을 공급하는 대신 수정 연결망 위를 주행하게 됩니다.\n\n추진력은 차량 내 연소가 아닌 충전기 내부 격자에서 비롯되므로 동일한 철도 차량을 행성 내부 노선과 행성간 통로 모두에서 사용할 수 있습니다. 가이아 엔지니어들은 수정이 연기, 증기, 심지어 공기를 밀어내는 것이 아니라 선로의 기하학적 구조를 기억하고 그 기억을 통해 열차를 끌어당긴다고 주장합니다. 그것이 물리학이든 의식이든 상관없이, 진공에서도 문제없이 작동합니다.
em-trains-text-2=이제 아이템 품질은 연결 구간 양쪽 모두에 영향을 줍니다. [item=ei_charger]충전기 품질이 높으면 자기장 유지 비용이 [font=default-bold]20%[/font]로 줄어들며, 전송 효율을 추가로 [font=default-bold]12%[/font] 향상시킵니다. 높은 품질의 [item=ei_em-locomotive] 기관차는 자기장 전력을 [font=default-bold]16%[/font]까지 적게 사용합니다. 이러한 보너스는 활성화된 품질 등급 전반에 걸쳐 정규화되므로, 다른 모드에서 추가한 품질이더라도 사용 등급 사이에서 매끄럽게 조정됩니다.\n\n고급 이상의 기관차는 품질에 따라 충전기 범위를 벗어나더라도 [font=default-bold]유예 기간[/font]이 추가됩니다. 전설 품질에서는 이러한 일관성을 최대 [font=default-bold]480 틱[8초][/font] 동안 유지할 수 있습니다. (일반 품질의 경우 유예 기간이 전혀 없음) \n단 이는 약간의 빈 틈, 철도 연결부, 잠깐의 경로 실수를 보완하기 위한 것이지, 네트워크에 무전력 의도적으로 포함시키는 것을 용인하기 위한 것이 아닙니다.
em-trains-text-3=연구 계열 [font=default-bold]ei_acc[/font], [font=default-bold]ei_spd[/font], [font=default-bold]ei_eff[/font]는 계속 주요 전역 배율 역할을 합니다. 속도와 가속도는 각 레벨마다 [font=default-bold]+10%[/font]씩, 최대 [font=default-bold]+200%[/font]까지 증가합니다. 충전기 효율은 5단계에 거쳐 네트워크 전력 부하를 최대 [font=default-bold]90%[/font]까지 줄입니다. 전력이 실제로 전송될 때, 개별 충전기 품질과 기관차 품질 보너스가 합산됩니다.\n\n실제로 우수한 EM 철도망은 과학과 하드웨어가 함께 결합되어야 구축됩니다. 범위가 계속 갱신되면 기차가 자기장 연료를 가득 채운 상태로 전선을 타는 빛처럼 가볍게 달립니다. 범위가 붕괴되면 먼저 남은 유예 시간을 소비한 뒤 기관차는 움직임을 멈출 것입니다. 가이아는 많은 것을 용서하지만, 자기장 끊김은 포함되지 않습니다.
emerald-apocalypse-hover-tank=에메랄드 아포칼립스 호버 탱크
emerald-apocalypse-hover-tank-2=수정 충전
emerald-apocalypse-hover-tank-3=궤도 파편 교리
emerald-apocalypse-hover-tank-4=파편 콘솔
emerald-apocalypse-hover-tank-5=차체 교리
emerald-apocalypse-hover-tank-6=봉인 해제시 제어
emerald-apocalypse-hover-tank-text=[item=ei-emerald-apocalypse-hover-tank]은 엑조틱 시대 후반부에 사용할 수 있는 호버 요새입니다. 우아함을 잃을 만큼 무거우며, 쓰러질 수 없을 만큼 헌신적인 이것은. 방출기 고리들이 선체를 지면 위로 떠받치고 있는 동안, 고정식 대포가 조준한 대상을 사형 선고로 몰아붙입니다.
emerald-apocalypse-hover-tank-text-2=[item=ei-emerald-apocalypse-charge]은 [item=ei-emerald-apocalypse-cannon]에 장착할 수 있는 단발성 밀봉 파열탄입니다. 발사할 때 전차는 분노를 흩뿌리지 않습니다. 그 대신 이 탄창은 하나의 초록빛 계율을 열고 전장이 답하도록 합니다.
emerald-apocalypse-hover-tank-text-3=궤도 파편은 포탑 장비가 아닌 스크립트 기반 교리입니다. '다기관 파편'은 활성 파편 수를 3개에서 6개로 늘립니다. '재장전 기도문'은 파편당 사격 간격을 1.17초에서 0.92초, 0.75초, 0.58초까지 줄입니다. '표적 판결'은 가장 가까운 표적만 고르는 대신, 산란장, 포탑, 체력을 비롯한 부상 정도, 거리 등을 종합적으로 하는 위험도 기반 표적 선택 방식을 가능하도록 합니다, '판결 개구부'는 광선의 면적을 넓혀, 명중할 때마다 주변 또는 경로에 정렬된 표적에 제한된 추가 피해를 퍼뜨립니다.
emerald-apocalypse-hover-tank-text-4=차량 인벤토리를 열면 궤도 파편 콘솔을 확인할 수 있습니다. 배치된 각 전차는 '0 ~ 연구된 최대치 사이' 범위에서 파편 수를 제어할 수 있습니다. '분산 조준'을 통해 파편이 인근의 제일 위험한 대상에 판결을 분산시키도록 하거나, '집중'을 통해 모든 활성 파편이 현재 표적 하나를 공격하도록 할 수 있습니다. 표시되는 DPS 값은 활성 파편 수 설정, 레이저 무기 피해 7+ 반복 연구, 차량 품질이 반영됩니다.
emerald-apocalypse-hover-tank-text-5=차체 교리는 유한합니다. ‘충전 교리’는 준비 시간을 9.48초에서 8.5초, 7.58초, 6.67초로 단축하며, 각 단계마다 더 짧은 ‘충전 찬가’를 통해 반응합니다. 관성 서약은 사격 후 봉인 시간을 15초에서 13.17초, 그다음 11.33초로 단축합니다. '이지스 서약'은 보호막 피해가 인근 적에게도 반응하도록 만듭니다. 벡터 뼈대는 묵직한 미끄러짐을 제거하지 않으면서도 호버 차체를 개선합니다. 붕괴 명령은 52타일 종단 파동을 강화하지만 무한히 커지지 않도록 제한합니다.
emerald-apocalypse-hover-tank-text-6='아포칼립스 재귀'는 차량별 전환 기능을 사용할 수 있도록 합니다. 기본적으로 '충전 회수', '뼈대 항적', '퍼지는 상처', '분할 파동', '봉인 해제된 충격'이 활성화되어 있지만, 이러한 교리들은 결코 온화하지 않습니다. 맹세의 범위를 좁게 유지해야 할 때는 각 차량에서 이러한 기능을 비활성화하세요.
