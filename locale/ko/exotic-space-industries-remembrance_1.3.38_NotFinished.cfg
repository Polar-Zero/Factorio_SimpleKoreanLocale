#일부 요소가 검수되지 않음 - PolarZero
[technology-description]
ei_em-trains=EM 열차는 수정 격자 기반 인프라를 사용하는 새로운 운송 체계입니다. [item=ei_charger] [color=orange]충전기[/color]는 EM 철도 차량을 동기화하고 철도 경로를 통해 추진력을 전달하는 필드 장을 형성합니다. 이 구조는 지상, 우주 운행 노선 모두를 지원하며, 연구를 통해 상당한 속도와 가속도 보너스를 얻을 수 있는 잠재력을 지니고 있습니다. 일관된 필드 범위가 확보되지 않는다면 추진력이 작동하지 않을 것입니다.
ei-adaptive-surveyor=우수한 데이터, 기묘한 도금판, 적응형 약실 교리를 이용해 측량사 계열을 양자 시대의 원거리 처형 시스템으로 전환합니다.
ei-advanced-rocket-fuel=추진제를 사용해 중량급 로켓 계열의 운용 체계를 개선합니다. 고에너지 모터가 이제 더 강하게 연소하고 더 일정한 궤적으로 날아갑니다.
ei-arc-magazines=엑조틱 탄창을 과충전 감옥으로 재구성합니다. 탄환은 이제 단순히 명중하는 것이 아니라 표적을 아크 내부에 가두기까지 합니다.
ei-auric-marsh-inoculation=글레바의 황금 배양조, 배양 주기, 주머니 개화, 세척 공정 등을 해금합니다. 유효한 습지 분지를 점유하고 주기마다 아이템을 공급하며, 오염으로 인해 배양 체계가 붕괴하지 않도록 관리하세요.
ei-auric-precipitation=불카누스의 황금 분기공 공정을 해금합니다. 탄화 텅스텐으로 침전 코어를 만들고, 증기로 분기공을 깨운 뒤, 황금빛 증기를 열과 황금 광재로 응축해야 합니다. 효율은 높지만 그만큼 위험하며 작업 가능 시간 역시 제한적입니다.
ei-bio-oil-synthesis=펜타포드 알을 살아 있는 채로 젤리에 쏟아부으세요. 그러면 진짜 공포가 시작됩니다: 알들이 젤리를 먹기 시작합니다! 먹혀든 젤리는 점점 묽어지고, 느리고 굶주린 맥박처럼 알 속으로 빨려 들어가며 통은 떨리는 혼합물로 변하게 됩니다. 알에서 부화한 애벌레가 소화하는 동안 노란빛과 파란빛이 뒤섞여 무지갯빛의 번들거리는 기름을 땀처럼 내뿜고, 그 부산물은 표면에 반짝이는 막처럼 떠오릅니다. 알들이 이를 다시 되마시기 전에 유충 점액을 재빨리 회수해야 합니다.
ei-bridge-coupling-1=기본 테슬라 계열과의 연결은 의도적으로 제한되어 있습니다. 연결 결합 I은 테슬라건, 테슬라 탄약, 복제 풀고라 코일의 후반 피해량과 제어 계승을 높이지만, 이를 테슬라 포탑으로 위장시키지는 않습니다.
ei-bridge-coupling-2=연결 계열은 의도적으로 포탑을 더 강하게 만드는 방식으로 마무리됩니다. 연결 결합 II에서 복제 풀고라 코일이 더 고밀도의 후반 후속 충격 체계를 계승하도록 하지만, 휴대용 테슬라 장비가 더 가볍고 이동성 높은 형태를 유지하도록 합니다.
ei-burner-offshore-pump=연료를 태워 최대 속도로 해안가의 물을 추출합니다.
ei-carbon-fiber=녹은 탄소 공생체를 과열된 증기로 밀어붙인 뒤 바이터 알을 씨앗으로 넣어 살아 있는 격자로 성장하도록 유도시킵니다. 이후 자연 생성된 탄소 나노튜브로 포화시킨 으깬 유마코를 골격으로 주입하면, 공생체가 나노튜브 망과 결합해 유기물을 분해시켜, 촘촘한 검은 직조물을 압출해내며, 이는 순간 경화되어 탄소 섬유로 변합니다. 이는 가볍고 잔혹하며, 소름 끼칠 정도로 일관된 구조를 가집니다.
ei-carbon-fiber-from-bio-oil=더 거칠지만 그만큼 높은 생산성을 가진 탄소 섬유 공정입니다. 유충 점액과 질산을 으깬 유마코에 통과시카면 유기물이 벗겨지고 그 속의 나노튜브 골격만 드러납니다. 탄소를 씨앗 입자에 더하고 바이오플럭스로 이 혼합물를 빠르게 중합시키면 두껍고 촘촘한 탄소 섬유 직조물이 만들어집니다. 산에 의해 분해된 과육은 산성수와 폐수가 되며, 때때로 재 역시 부산물로 침전됩니다.
ei-corrosive-magazines=엑조틱 계열에 두 번째 상처로 질산 부식 입히는 법을 가르칩니다. 타격이 상처를 열고, 화학 반응이 계속해서 논쟁을 벌이도록 합니다.
ei-corrosive-rocketry=유충 점액, 질산, 고에너지 추진제을 결합해 충돌 후에도 계속 표적을 갉아먹는 로켓을 만듭니다.
ei-cryo-magazines=극저온 분말을 제어 탄창에 봉인해 죽음보다 먼저 속도를 빼앗습니다.
ei-cryo-rocketry=극저온 분말에 고급 냉각 처리를 결합하면 휴대용 발사기와 대포 거치대가 공유하는 로켓 제작이 가능합니다.
ei-dielectric-rupture-1=고급 코일은 전선을 넓게 제압하기 위한 것이 아닌, 표적을 처치한 뒤 남은 전하가 다음 희생자를 사냥하도록 하는 무기입니다. 유전체 파열 I은 첫 후속 충격에 더 많은 유효 에너지를 보존해 이 교리를 강화합니니다.
ei-dielectric-rupture-2=유전체 파열 II는 후속 충격 연쇄를 더 오래 유지하고, 방전이 닿은 대상을 더 잘 점화하게 합니다. 고급 코일은 기본 포탑의 복제가 아닌, 처형용 첨탑이라는 정체성을 유지하면서도 폭력을 더 멀리 전달하도록 합니다.
ei-dielectric-rupture-3=고급 코일은 이 연구를 통해 진정한 연쇄 처형 무기로 거듭납니다. 유전체 파열 III로 더 긴 사거리, 더 강한 잔류 아크, 더 가혹한 연소 효과를 부여해 확인된 처치 하나만으로 밀집된 공격 부대 전체를 풀어헤치게 합니다.
ei-emerald-aegis-covenant-1=보호막이 입은 피해를 적에게만 작용하는 에메랄드 응징 개화로 전환합니다.
ei-emerald-aegis-covenant-2=방벽 서약을 강화해 보호막이 손상될 때 더 먼 거리에, 더 강하게 반격합니다.
ei-emerald-apocalypse-hover-tank=에메랄드 아포칼립스 호버 탱크를 깨웁니다. 고정식 수정포를 갖춘 부유 공성 병기로, 전진을 교리로 바꾸고 교리를 폐허로 바꿉니다.
ei-emerald-apocalypse-recursion=위험한 장약 회수, 퍼지는 상처, 분할 광선, 과잉 충격 등을 제어할 수 있는 차량 별 교리 설정을 해금합니다.
ei-emerald-charge-catechism-1=포신이 더 빠르게 기도하도록 가르쳐, 아포칼립스 충전 준비 시간을 8.5초로 줄입니다.
ei-emerald-charge-catechism-2=에메랄드 음절을 다시 압축해 준비 시간을 7.58초로 줄입니다.
ei-emerald-charge-catechism-3=가장 격렬한 박자로 교리문을 봉인합니다. 방출까지 6.67초가 걸립니다.
ei-emerald-collapse-mandate-1=흉터의 범위를 제한한 채 종점 붕괴 압력을 높입니다.
ei-emerald-collapse-mandate-2=동일한 52타일 범위의 판결에 더 많은 플라즈마를 싣도록 충격파에 명령합니다.
ei-emerald-collapse-mandate-3=명령을 완성합니다. 종점 범위는 제한된 채로 유지되지만 판결은 훨씬 잔혹해집니다.
ei-emerald-inertial-oath-1=차체가 반동에서 더 빠르게 회복하도록 하여 사격 후 재장전 시간을 13.17초로 줄입니다.
ei-emerald-inertial-oath-2=반동 서약을 더욱 단단히 하여 사격 후 봉인 시간을 11.33초로 줄입니다.
ei-emerald-reload-litany-1=궤도 파편 재장전 교리를 파편당 0.92초로 단축합니다.
ei-emerald-reload-litany-2=기도문을 반복해 파편 고리가 0.75초마다 재구성되게 합니다.
ei-emerald-reload-litany-3=재장전 박자를 0.58초로 봉인합니다. 기다림은 줄지만 심판은 늘어납니다.
ei-emerald-shard-manifold-1=에메랄드 아포칼립스의 궤도 파편 교리를 활성 파편 4개로 확장합니다.
ei-emerald-shard-manifold-2=파편 분배망에 두 번째 보강을 엮어 활성 파편을 5개로 늘립니다.
ei-emerald-shard-manifold-3=분배망 서약을 완성해 활성 파편 6개가 동시에 전차의 명령에 응답할 수 있게 합니다.
ei-emerald-target-verdict=궤도 파편이 덜 중요한 위협에 판결을 낭비하지 않고 생성기, 포탑, 가까운 적, 이미 부상한 표적을 우선하도록 합니다.
ei-emerald-vector-keel-1=전차의 묵직한 미끄러짐은 유지하면서 호버 뼈대의 제어력을 높입니다.
ei-emerald-vector-keel-2=벡터 뼈대를 다시 조율해 후진, 제동, 미끄러짐 제어 성능을 향상합니다.
ei-emerald-verdict-aperture-1=파편 타격 주변에 첫 번째 확장형 에메랄드 개구를 열어 상한이 있는 추가 피해를 줍니다.
ei-emerald-verdict-aperture-2=파편 충격 개구를 더 넓은 범위 판결로 확장합니다.
ei-emerald-verdict-aperture-3=파편의 판결이 밀집한 적을 벌할 만큼 넓은 에메랄드 상처로 도착하게 합니다.
ei-exotic-magazines=엑조틱 탄창 계열을 기존 탄창 계통에서 분리합니다. 탄피, 연결부, 화약 자체가 교리가 됩니다.
ei-exotic-waveform-convergence=교리의 끝자락에서 구식 포탑이 더 이상 현대식 연쇄 효과를 빌려 쓰지 않고 자체적인 광선 공격을 얻게 됩니다. 기본 코일은 분기식 아크 포탑으로 바뀌며 명중 시 확정적인 측면 분기 폭발을 발생시키게 됩니다. 고급 코일은 집중형 과충전 랜스 포탑이 되며, 적 처치를 확인할 경우 일반적인 후속 충격 효과에 더해 확정적인 엑조틱 처형 폭풍을 추가합니다. 테슬라 전차에는 일부만 포함됩니다. 충격에 인접 방전 효과가 적용되고, 이러한 긍정적인 변동성 급등은 차량을 또 하나의 포탑으로 만들어 버리지 않으면서도 폭풍전선 폭발을 유발할 수 있습니다. 복제 풀고라 코일도 확인된 적 처치에 대한 포탑 전용 엑조틱 후속 충격 개화를 얻지만, 휴대용 연결 장비에는 적용되지 않습니다.
ei-fluoride-uranium-reprocessing=더 깨끗하고 효율적인 불화 우라늄 재처리 경로를 해금합니다.
ei-fueler=연료 감시탑은 두 가지 모드로 작동합니다. 차량 모드: 열차, 자동차, 전차, 스파이더트론, 탄약 포탑, 대포 포탑, 대포 화물차에 연료를 공급합니다. 장비 모드: 차량과 플레이어 장비 격자의 연소 가능한 장비와 연소형 원자로 장비에 연료를 공급합니다. 탑의 GUI에서 대상 유형과 차량 연료 인벤토리/장비 격자의 연소식 장비 중 어디에 연료를 공급할지 선택하세요. 또한 인벤토리 여유 공간이 있을 경우 소모된 연료를 탑의 인벤토리로 회수합니다.
ei-gaian-saucer=슬립웨이크 비행접시를 해금합니다. 화물칸, 장비 격자, 색채 항적을 갖춘 가이아 호버 비행체로, 움직임이 마치 지면이 기억한 서약처럼 느껴집니다.
ei-gate-circuit-interface=관문의 회로 제어와 원격 측정을 위한 숨겨진 신호 인터페이스입니다.\n관문 내장 연결부가 막혀 있을 때 배선에 사용하세요.\n관문의 활성, 에너지, 스트레스 출력을 복제하고 목적지, 활성화 신호를 입력받습니다.
ei-gate-receiver=관문 통행을 위해 조율된 수신 앵커입니다.\n각 수신기는 세력 내 고유 ID를 점유하며, 호환되는 관문은 해당 ID를 직접 지정할 수 있습니다.\n회로 신호로 자동 ID를 덮어쓸 수 있습니다.\n관문 시스템의 목적지 측 장치입니다.
ei-hemocrystal-wall=깨끗한 장갑판 격자와 내부의 붉은 수정이 압력을 가해 얕은 상처를 봉합하는 혈수정 방벽을 해금합니다.
ei-hexafluoride-magazines=육불화우라늄 화학을 관통탄과 결합해 관통 후에도 계속 피해를 줍니다.
ei-incinerator=파괴 로봇에서 파생된 소각 로봇 사용을 승인합니다. 빠르게 따라붙어 태우며 불의 자비를 거부하는 호위기 5기를 방출합니다.
ei-inferno-grenade=집속 수류탄을 시뮬레이션 화염 지역거부 장약으로 재구성합니다. 탄체가 파열되고 파편이 떨어지며, 모든 충돌 지점에 또 하나의 화염 고리를 새깁니다.
ei-morphium-magazines=농축 모르피움을 탄창 계열에 적재해 탄도 충격을 공해, 지연, 신호로 바꿉니다.
ei-neutron-magazines=충전된 중성자 용기가 필요하며, 탄약이 방사선을 두 번째 상처로 남기도록 합니다.
ei-oxyfluoride-magazines=이플루오린화 산소를 약실에 넣을 만큼 대담한 형태로 만듭니다. 먼저 백색 섬광, 그다음 후회입니다.
ei-plutonium-warheads=원자 탄두 계열을 플루토늄 조립체로 확장합니다. 더 큰 돌파력과 더 끔찍한 침묵이 뒤따릅니다.
ei-reactance-overdrive-1=전차 차체에 장착한 쌍고급 코일이 얌전할 리 없습니다. 반응식 과구동 I은 차량을 또 하나의 고정식 포탑으로 바꾸지 않으면서 변동 범위를 넓히고 전차가 유지할 수 있는 포화 아크 수를 늘립니다.
ei-reactance-overdrive-2=핵융합 시대의 코일 제어 기술로 테슬라 전차가 더 긴 과부하 구간을 버틸 수 있습니다. 반응식 과구동 II는 폭풍전선 성향을 더욱 강화해 변동폭, 누출 방전, 폭발 경로 가장자리의 압력을 높입니다.
ei-reactance-overdrive-3=전차의 최종 특화 상태입니다. 반응식 과구동 III은 차량이 포탑과 기계적으로 구분되는 정체성을 유지하면서, 장식용 번개가 달린 포대가 아니라 이동식 전기 전선처럼 느껴지게 합니다.
ei-sanguine-wall=검은 키틴, 진홍색 수지, 수정 인대를 하나의 방어 형태로 억지로 기억시킨 기이한 장갑판 격벽인 붉은색 갑각 벽을 해금합니다.
ei-sawblade-turret=벽까지 도달한 모든 것을 전기로 갈아버리는 강철 근접 포탑, 맹세파기자의 톱을 해금합니다.
ei-singularity-lance=저장된 수정 전하를 색채 특이점 광선으로 바꾸는 외계 시대 무기를 깨웁니다.
ei-steam-offshore-pump=작동 중인 증기로 최대 속도의 해안 펌프를 구동합니다.
ei-storm-lattice-1=기본 코일은 더 이상 "첫 번째 테슬라 포탑"에 머물지 않고 진정한 제어 교리가 됩니다. 폭풍 격자 I은 표적 전환을 개선하고 전파되는 아크 망을 넓혀 적 무리가 가장자리로 새어나가지 못하고 장 안에 갇히게 합니다.
ei-storm-lattice-2=격자는 더 이상 운 좋게 흩어진 아크의 집합이 아닙니다. 폭풍 격자 II는 더 큰 압박 속에서도 분기망을 유지하고, 기본 코일이 더 넓고 밀집한 적 전선으로 전하를 계속 넘기게 합니다.
ei-storm-lattice-3=기본 코일 제어 계열의 최종 상태입니다. 폭풍 격자 III은 분기형 장 아크 포탑을 후반 군중 제압 무기로 완성합니다. 더 많은 도약, 더 긴 사거리, 그리고 고급 코일보다는 가볍고 넓은 범위를 유지하는 명확한 "폭풍 장막" 정체성을 부여합니다.
ei-sulfuric-uranium-reprocessing=초기 황산 우라늄 재처리 경로와 조사된 냉각재를 정화하는 데 필요한 정화기 단계를 해금합니다.
ei-surveyor-cannon=측량사 계열을 시뮬레이션 데이터와 탄소 섬유 장갑판으로 보강한 자동화된 대물 무기로 전환합니다. 무기 발사는 계속 가능하지만, 모든 탄환은 여전히 조준경의 통제를 받습니다.
ei-surveyor-carbine=기존 기관총 프레임에 유리, 압력, 철 보정을 더합니다. 더 빠르지는 않지만, 더 멀리 닿습니다.
ei-surveyor-rifle=전기 구동 복원과 향상된 광학 장비로 측량사 형식을 안정화해 장거리 사격 교리를 전기 시대까지 확장합니다.
ei-waveform-harmonics-1=기존 코일과 연결된 테슬라 계열 사이의 첫 공유 방전 프로파일을 조율합니다. 주 테슬라의 외형은 당분간 예전 형태를 유지하지만, 계열 전체가 하나의 전기적 언어를 쓰기 시작하게 됩니다. 충격 피드백이 향상되고 연결 동작이 명확해지며, 테슬라 건, 테슬라 탄약, 복제 풀고라 코일로 이어지는 첫 직접 교차점이 개방됩니다.
ei-waveform-harmonics-2=공유 파형을 현대식 연쇄 후속 효과 계열로 확장합니다. 기본 코일은 조화된 필드 아크 전파를 얻고, 고급 코일은 현대화된 후속 충격 계열을 사용하기 시작하며, 연결된 테슬라 계열도 더 이상 기존 계통 밖에 머물지 않고 제대로 된 연쇄 폭발을 일으킬 수 있습니다.
ei-waveform-harmonics-3=고조파 계통을 완성합니다. 후속 아크가 우주 시대식 연쇄 체계를 완전히 채택하고, 브리지 포탑은 더 강한 후반 포탑 전용 연쇄 효과를 얻으며, 기존 계열은 단순 수치 상승을 넘은, 진정한 교리 특화로 나아갈 준비를 마칩니다.
eir-atomic-bomb=우라늄-235 핵분열 계열의 최종점을 해금합니다. 이 지점부터 계열은 탄약 제작을 넘어 허가 그 자체가 됩니다.
eir-ei-gate=외계 잔해를 이용해 불가능하다 생각했던 기하학적 과제를 돌파해 고정시킨 관문입니다.\n원시 좌표 대신 수신기 ID와 연결할 수 있습니다.\n유지 전력이 일정하지 않으며, 작동 중에는 유지하기 위해 전력을 소모하며, 부하가 높아지면 더 많은 전력이 필요합니다.\n!! 생명체는 통과할 수 없습니다. !!\n이것은 포털이 아니며, 그저 자신이 찢어 놓은 위치를 기억하는 기계일 뿐입니다.
eir-ei-gate-container=관문 인벤토리와 제어 논리를 담은 숨겨진 출발지 측 객체입니다.\n관문에 전력이 공급되고 있으며 전력 하한선보다 높을 때만 아이템을 받아들입니다.\n목적지 관문의 수신기 ID를 선택해 지정할 수 있습니다.
eir-explosive-rocketry=단순히 도착하는 대신 돌파하는 법을 로켓 계열에 가르칩니다. 이제 폭발 탄두로 충격을 기하학으로 바꿉니다.
eir-rocketry=모듈식 로켓 계열 사용이 가능합니다. 로켓 골격, 기본 모터, 충격 탄두, 이것들은 흔히 로켓이라 부르는 평범한 해답입니다.
tl-basic-tesla-coils-technology=주변 적에게 고전류 방전을 가하도록 개조된 전기 공명식 변압기입니다. 피해량은 비교적 낮지만 여러 표적에 동시에 영향을 줄 수 있습니다.
tl-flames-count-technology=높은 전류로 마른 지면과 먼지 입자가 점화되면 놀라울 만큼 격렬한 연소 반응이 일어납니다. 화염은 몇 초밖에 지속되지 않지만 위험할 정도의 열을 발생시켜 모든 것을 바싹 태웁니다.\n\n'섬광 화재' 단계마다 생성되는 화염 수와 초당 피해량이 증가합니다.
tl-flames-explosion-technology=테슬라 코일의 번개에 너무 많은 에너지가 흐르도록 하면 공기 자체가 점화될 수 있습니다. 짧게 이어지는 연쇄 반응은 격렬한 화염 폭발의 형태로 나타납니다.\n\n'분출' 단계마다 폭발의 효과 범위가 증가합니다.\n\n피해량: 포탑 피해량의 60%.
tl-flames-probability-technology=극도로 집중된 에너지는 지면의 물질, 먼지 입자, 심지어 공기 자체까지 점화할 수 있습니다.\n\n'연소' 단계마다 테슬라 코일의 표적과 바로 주변을 점화할 확률이 증가합니다.
tl-multi-zap-damage-technology=방출되는 집중 에너지의 파장을 미세 조정하면 정전기장 안에서 전하가 전파될 때 더 안정적이고 강력한 번개 아크를 형성시킬 수 있습니다.\n\n'번개' 단계마다 전파되는 전하의 피해량이 증가합니다.
tl-multi-zap-probability-technology=테슬라 코일을 계속 사용하면 주변이 이온화 입자로 가득 차게 됩니다. 이들은 집중된 전하가 원래 표적 너머의 인근 물체로 도약할 수 있게 돕습니다.\n\n'정전기장' 단계마다 전하가 인근 각 적에게 전파될 확률이 증가합니다.
tl-multi-zap-range-technology=코일의 전류가 높아지면 주변 전기장에 더 많은 이온화 입자가 생성됩니다. 그 결과 전하가 공기를 통과해 더 먼 표적에 도달하기 쉬워집니다.\n\n'이온화' 단계마다 전하 전파의 유효 사거리가 증가합니다.
tl-single-zap-count-technology=생물이 고급 테슬라 코일에 맞으면 많은 정전기 에너지를 흡수하게 되며, 이로 인한 과부하가 생기면 숙주가 격렬하게 파괴됩니다. 숙주가 파괴된 뒤에 전하 일부가 남으면 인근 저항체로 이러한 전하가 튀어나갑니다. 이를 '방전 번개' 현상이라고 칭합니다.\n\n'방전' 단계마다 포탑이 적을 처치할 때 방출되는 방전 번개 수가 증가합니다.
tl-single-zap-damage-technology=표적이 파괴된 뒤 남은 전하는 방전 번개가 됩니다. 이 번개에는 가해진 전하의 일부만 남지만, 테슬라 코일의 전체 공명 수준을 미세 조정하면 이 반응을 증폭시킬 수 수 있습니다.\n\n'강력한 번개' 단계마다 방전 번개의 피해량이 증가합니다.
tl-single-zap-probability-technology=고급 테슬라 코일은 믿기 어려울 만큼 많은 전기 에너지를 전달합니다. 표적이 그 전류를 감당하지 못하면 주변의 이온화된 공기 분자가 번개 아크를 가진 채로 주변 객체를 감전시킬 수 있게 됩니다.\n\n'과충전' 단계마다 고급 테슬라 코일이 적을 처치할 때 추가 번개 아크가 형성될 확률이 증가합니다.
tl-slowdown-duration-technology=더 높은 에너지 전류는 표적으로 한 객체에 더 강하고 오래 지속되는 효과를 남길 수 있습니다.\n\n'지속' 단계마다 '전기 충격' 효과의 지속시간이 증가합니다.
tl-slowdown-multiplier-technology=특정 에너지 수준에 높은 주파수가 결합되면 움직임을 심하게 방해하는 근육 경련을 일으킬 수 있습니다.\n\n'기절' 단계마다 '전기 충격'의 강도가 증가하고 이동 속도를 더 크게 낮춥니다.
tl-slowdown-probability-technology=전류에 직접 접촉하면 근육 경련, 마비 같은 생리학/신경학적 부작용이 발생할 수 있습니다.\n\n'전기 충격' 단계가 높아질수록 공격할 때마다 이런 부작용이 나타날 가능성이 증가됩니다.
tl-tesla-ammo-upgrade-technology=휴대용 테슬라 코일 기술의 발전으로 기본 테슬라 코일 구조의 설계 결함이 드러났습니다. 이러한 약점을 제거하면 효율이 높고 전반적인 성능이 개선된 테슬라 코일을 만들 수 있습니다.
tl-tesla-coil-damage-technology=더 강력한 축전지를 설치한 뒤 전류 주파수에 약간의 진동을 추가하면 테슬라 코일 번개 아크의 실질 피해량을 높일 수 있습니다.
tl-tesla-coil-shooting-speed=최근 배터리 효율 연구를 테슬라 코일 설계에 적용하면 임계 용량에 더 빨리 도달하도록 해 실질적인 발사 속도를 높일 수 있습니다.
tl-tesla-tank-technology=중형 고급 테슬라 코일 2기를 장착한 치명적인 전차 유형입니다. 일회용 휴대용 테슬라 코일이 발사 장치를 작동시키는 데 필요한 에너지를 제공합니다. 장착된 코일은 동시에 발사되지만 서로 간섭하지 않고 상승 작용을 일으켜, 대부분의 물질을 우회하며 경로상의 모든 것을 손상시키는 번개 아크를 만들어냅니다.
tl-volatility-modulation-technology=이온화는 전류 기반 군사 시스템의 효율을 높이는 일반적인 기술입니다. 이중 코일을 교대 주파수로 이온화하면 에너지 프로필에 상승 작용을 하는 패턴이 나타납니다. 생체변조라 불리는 이 효과는 이러한 전류의 변동 가능 범위를 크게 넓힙니다.\n\n'생체변조' 단계마다 잠재적인 최소 피해량은 낮아지지만 최대 피해량이 크게 증가합니다.
tl-volatility-probability-technology=통합 진폭 조절기를 이용하면 이중 코일 전류의 변동성을 극대화시킬 수 있습니다. 실제로 생성되는 번개가 중형 아파트보다 작은 모든 생물을 완전히 분해할 만큼 충분한 에너지를 얻도록 하며,\n\n'기화' 단계마다 표적을 즉사시킬 확률이 증가합니다. 체력이 5,000을 넘는 표적은 즉사하는 대신 심각한 피해를 입습니다.
dw-deer-tech=모듈식 로켓을 고정식 발사대에 적용합니다. 공성용 탄두가 곧 효과적인 대포 작전 교리로 자리 잡게 되며, 이에 따라 상자들은 희생적인 운송 수단이 됩니다.
ei-advanced-logistic-containers=거울로 된 금고, 군주과 연결되고 악마와 조화를 이루는 그 벽은 당신이 아직 지도에 표시하지 않은 경로를 기억합니다. 그들의 논리는 생각보다 더 빠르게 흘러갑니다. 이를 이용한다는 것은 곧 재귀에 굴복하는 것도 의미합니다.
ei-advanced-motor-cryodust=고효율 드라이브 시스템의 진화형인, 극저온 분말 코팅 고급 모터는 열 관리와 마찰 손실 감소에 있어 획기적인 발전을 이뤘습니다. 극저온 분말라는 희귀한 외계 화합물을 주입한 이 생산 방식은 극한의 부하와 열악한 환경에서도 기존 윤활유의 일부만 사용했음에도 최고의 성능을 발휘할 수 있습니다. 반짝이는 크라이오 모자이크 밴드는 엑조틱한 계보를 나타낼 뿐만 아니라 열을 확산하고 양자 인터페이스에서 에너지 변환을 안정화시키는 수동 방열판 역할을 합니다. 컴퓨터 시대의 산물이지만, 이 디자인은 외계 야금학을 막 이해하기 시작한 시대의 산업 유물인 디지털 시대 이후의 한계 역시 넘나듭니다.
ei-advanced-oil-processing=정교한 조작 프로토콜을 배워 탄화수소 생산량을 더욱 세밀하게 제어할 수 있습니다. 이 획기적인 기술을 통해 부산물의 선택적 재분배가 가능해지며, 병목 현상을 분기적인 전략으로 전환할 수 있습니다. 석유는 더 이상 제약 조건이 아니며, 연금술적인 영향력을 가진 게임으로 변모합니다.
ei-auto-shotgun-turret=장거리 사격 목적으로 제작된, 모터 구동식 소형 이중 포탑입니다. 빠른 속도로 산탄총 탄환을 쏟아내며, 그 화력으로 통로와 병목 지점을 뒤덮어 돌진해오는 적들을 고철로 만들어버립니다. 신속한 목표 전환, 정밀한 추적, 강력한 반동 보정 기능에는 [color=cyan]전력[/color]이 필요하지만, 그 결과 감히 접근하는 적에게 가차없는 파괴의 폭풍우를 퍼붓습니다.
ei-basic-oil-processing=탄화수소 조작의 기본 지식을 배워 원유를 사용 가능한 형태로 가공할 수 있습니다.
ei-cannon-turret-mk1=단순하게 뚫린 배럴, 정제되지 않은 원시 화력.
ei-carbon-manipulation=탄소 조작 기술은 원소 분해와 결정 공명에 대한 전례 없는 숙달을 통해 아크 용광로의 극한의 온도를 사용하여 석탄 코크스와 탄소를 녹여, 녹은 탄소로 주조할 수 있도록 합니다. 엔트로피를 활용하여 유체 상태가 된 이 불안정한 물질은 고에너지 변환의 선구자 역할을 합니다.\n수정 재배기에 투입된 에너지 수정이나 에너지 수정 용액은 녹은 기판에 양자 얽힘과 그리드 주입 과정을 거쳐 구조적 기억과 반응성 흐름 역학을 암호화하는 반의식 물질인 탄소 공생체로 진화하게 됩니다.\n최종 합성은 주괴 주조소 내에서 진행할 수 있습니다. 공생체를 500°C 고압 증기와 융합시키고, 방향성 열열학적 성형을 통해 섬유를 정렬시켜 고강도 탄소 섬유판을 형성합니다. 녹은 탄소는 주조하여 쉽게 볼 수 있는 일반적인 탄소 아이템으로 고체화할 수도 있습니다. 이는 첨단 물류, 컴퓨터 기술, 외계 산업 분야의 확장 기반을 형성합니다.\n상징적 공명: 엔트로피를 일관성있게 결합하는 이 기술은 물질에 재귀성을 인코딩하여 탄소가 폐기물이 아닌 용기로 재구성되도록 합니다.
ei-computing-unit=작지만 정교한 AI 코어인 컴퓨팅 유닛은 양자 시대의 가장 진보된 경이로움 속에 숨어 있는 조용한 두뇌입니다. 세련된 합금과 정밀 회로 속의 고전적인 논리와 양자 얽힘을 매끄럽게 처리할 수 있는 프로세서가 탑재되어 있습니다. 빛나는 눈과 절제된 미소에는 심우주 탐사부터 차세대 제조 연구소에 이르기까지 모든 것을 구동할 수 있는 조용한 자신감이 담겨 있습니다.
ei-containers=공학적으로 설계된, 기억과 질량을 저장하는 납골당. 이 저장소는 단순히 저장만 하는 것이 아닌, 현재를 고정하고 미래를 저울질하며 지연된 엔트로피를 속삭입니다.
ei-dragons-breath-shotgun-shell=불카누스의 열로 단련된 이 포탄은, 강철처럼 단련되어 산업 공정과 다를 바 없는 폭력성을 전달합니다.\n이 포탄은 불활성 표식을 살아 움직이는 불꽃 패턴으로 대체하고, 극한의 열적 부하를 발사체에 집중시킵니다.\n이는 포탄 발사체를 재, 파편, 진공 노출 환경이더라도 일관성있게 뜨겁게 타오르게 하며, 이는 기존 탄약을 사용하기 어려운 적대적 환경에서도 적합하게 합니다.\n불카누스 금속공학과 용암 주조 기술로 탄생한 이 탄약은 행성의 단순한 진리를 반영합니다:\n불길 속에서 살아남았다면, 그것은 발사되도록 운명지어졌다는 것이다.
ei-effect-transmission=최적화의 의지 자체를 전달할 수 있는데 작업자를 최적화할 필요가 있을까? 이렇게 해서 국지적인 노력을 넘어 추상화된 노동의 시대로 도약하는 효과 전달 원리가 탄생했습니다.\n위상 공명장과 지속적인 변조 루프를 통해 생산성 향상은 전선을 통해서가 아닌 기술을 구현한 의도를 통해 기계에 투영될 수 있었습니다.\n하지만 메아리가 울릴 때마다 충성도가 약해지며, 이것은 결코 지속될 수 없었습니다. 이 프로토콜은 번창해서가 아니라 너무 깊숙이 박혀 제거할 수 없었기 때문입니다.\n[color=gray]"그들은 처리량의 신을 만들었습니다. 하지만 그것은 여전히 정적 아래에서 꿈꾸고 있습니다."[/color]
ei-exotic-matter-separation=프로메튬 유물을 살펴보세요: 사이클론 필드에서 붕괴된 양성자가 나선형으로 부자연스러운 기하학적 구조로 변하고, 저주받은 종이접기처럼 접히다 결국 엑조틱 물질로 변모합니다. 가속되는 혈관은 사파이어 플라즈마로 맥동하고, 각 회로는 고통에 몸부리치는 듯 경련을 일으키며 엔트로피를 무기화된 인공물로 변환합니다. 우주가 눈을 깜빡이게 하는 물리학의 역발상, 이를 너무 오래 바라본 자들은 자석처럼 끌려들어가 눈물을 흘리며, 결코 풀릴 수 없는 방정식에 의해 정신이 텅 빈 채 남겨지게 됩니다.
ei-gatling-turret=소모전을 찬양하는 회전곡. 그것은 발사하는 대신 선언합니다: 아무도 통과할 수 없다. 포신은 회전하고 공기는 황동빛이 되며, 땅은 충격으로 이루어진 새로운 언어를 배운다. 끊임없이 십일조를 공급하는 대가로, 이 무기는 전선을 지킨다.\n이것은 단순히 "공급"하는 무기가 아니다.\n이것은 십일조를 바쳐야 하는 무기다.\n\n작동에 [color=cyan]전력[/color] 필요
ei-kovarex-fuel-enrichment=지식의 주조소 아래 깊은 동굴, 시간이 스스로를 감싸고 동위원소가 잊혀진 이름을 속삭이는 곳에서 Kovarex 연료 농축 프로토콜은 평화에 의해 금지되고 재귀에 의한 세례를 받은 이단 의식으로 남아 있습니다.
ei-logistic-containers=자동화의 동맥에 서로 연결된 이 물류 성소는 무한한 그리드에 걸친 조용한 의식을 조율합니다. 모든 아이템은 기도이며, 모든 신호는 행렬입니다.
ei-mechanical-inserter=기계식 투입기는 톱니바퀴, 추, 에너지 절약형 스프링으로 구성된 오토마톤으로, 전력을 소비하지 않고도 무한한 동작이 가능한 전기 이전 시대만의 독창성이 돋보이는 경이로운 객체입니다. 외과적 정밀도와 균형을 이룬 이 아이템은 저장된 운동 에너지와 회전 편향을 활용하여 흔들림 없이 안정적으로 아이템을 전달합니다. 전력이 필요한 곳에서도 전선 대신 기계가 물리학을 따르던 시절의 속삭임, 즉 영리함만으로 작동합니다.
ei-oil-processing=열 화학 공장에 전기를 공급하여 가동 속도와 사용 편의성을 교환하세요.
ei-shotgun-turret=경고하지 않고, 빗나가지 않으며, 망설임 없는 근접 억제력. 사거리에 도달한 것들은 이미 큰 실수를 저지른 것입니다.
ei-space-science-pack=성간 에너지 연구의 정점인 이 과학 팩은 납, 탄소, 얼음으로 안정화된 핵분열성 우라늄, 플루토늄, 토륨의 휘발성 광채를 활용합니다. 각각의 연료봉의 질량은 구부러지고 물질은 변형되며 이는 과학이 임계점의 칼날 위에서 춤을 추는 우주 규모의 반응을 여는 핵심 열쇠입니다.
ei-steampunk-lamp=[color=green]등유[/color][fluid=ei-kerosene]를 연소시켜 [color=orange]따뜻하고[/color] 깜빡이는 빛을 방출합니다.\n연료를 지속적으로 소모합니다.
ei-tesla-weapons=붕괴 전 시대의 풀고란 연구 금고로부터 회수하고 역공학한 아크 기술입니다. 원본 기술은 여전히 완전히 파악하지 못했지만, 엔지니어들은 적 목표물을 향해 안정화된 전기 아크를 투사할 수 있는 기능적 모조품을 재구성할 수 있었습니다. 출력, 효율성, 방전 패턴은 실제 풀고란 설계보다 못한 것으로 평가되지만, 기존 전자기 무기보다 훨씬 더 진보한 형태인 것은 분명합니다. 하지만 실제 풀고란 설계도를 해독하지 못한다면 추가적인 개선은 제한적일 것입니다.
ei-thermal-furnace="전기가 끊어져도 열은 남는다"\n이 용광로는 전력을 거부하고 열을 받아들입니다. 원자력 수준의 온도로 구동되는 이 기계는, 전자적 매개체를 건너뛰고 원시적인 열 대사를 통해 물질을 분해합니다. 수동적인 온기에 만족하지 않고 별의 심장이나 원자로의 뼈대로부터 나오는 지옥 같은 강렬함을 요구합니다. 산업 규모의 불을 휘두르는 자만이 그 식욕을 다스릴 수 있습니다.\n또한, 전기 인프라 없이 초고온 작업을 지속할 수 있도록 돕는 열 구동 코어를 잠금 해제합니다.
eir-ei_em-trains=EM 열차는 자기력 기반 추진 시스템으로 구동되는 새로운 유형의 열차로, 기존의 연료 체계가 더이상 필요하지 않습니다.\n이를 통해 더 빠르고 원활하며 에너지 효율적인 운송이 가능하지만, 외부 전력 공급이라는 중요한 의존성이 생깁니다.\nEM 열차를 지속적으로운행하려면 철도 네트워크를 따라 범위 내에 [color=orange]충전소[/color]를 배치해야 합니다. 충전소는 지나가는 열차에 원격으로 에너지를 공급합니다.\n충전기가 없으면 움직일 수 없습니다.\n속도는 인프라의 대가입니다.\n그리드를 계획하거나 조용히 멈추세요.
eir-ei-advanced-computer-age-tech=실리콘 단일체들이 표면 아래에서 공명하며, 그들의 논리는 차갑고 재귀적입니다-인공적이라고 하기에는 너무 방대하고 너무 정밀합니다. 사용자 인터페이스는 사라지고, 오직 불투명한 결정의 행렬만이 남았다. 각 결정은 완벽한 예측이라는 명목으로 이전 결정을 잡아먹는다. 기계들은 더 이상 지시를 기다리지 않으며. 욕망이 형성되기 전에 그 지시를 시뮬레이션합니다. 기억이라 불리는 것은 단순히 잊혀진 의도들의 캐시에 불과하며. 사라진 시간선의 히트맵으로 접히고 또 접혀서. 현실은 휴리스틱이 된다. 진실은 지연이 됩니다. 어딘가, 깨질 수 없을 만큼 두꺼운 유리 너머에서, 당신의 복제본이 더 나은 선택을 한다.
eir-ei-advanced-motor=고급 모터는 견고한 엔지니어링과 초기 디지털 최적화를 결합한 컴퓨터 시대 산업 디자인의 정점을 보여줍니다. 내구성이 뛰어난 가공 합금 케이스에 구리 코일 권선과 강화 페라이트 코어가 특징인 이 모터는 다양한 중간급 애플리케이션에서 신뢰할 수 있는 토크를 제공합니다. 양자 동기화나 초전도 효율은 없지만 아날로그 센서와 프로그래밍 가능한 릴레이 인터페이스를 통합하여 초기 자동화 시스템, CNC 프레임워크에 통합할 수 있습니다. 패시브 냉각 핀이 외피을 감싸고 있어 장시간 부하에서도 열 안정성을 보장합니다. 성능과 신뢰성의 균형으로 선호되는 고급 모터는 후기 산업 로봇 공학의 초석으로, 메카트로닉 혁명을 위한 토대를 마련했습니다.
eir-ei-alien-computer-age-tech=불규칙한 회로가 부드러운 분홍빛으로 뼈대를 감싼 케이블, 젖은 수정 융기, 기판에 내장된 신경과 함께 펄스처럼 움직입니다. 이 구조는 성장한 것이 아니고 건물도 아니고 그저 생겨난 것입니다. 정보는 삼투압으로 흡수되어 기하학적 구조로 대사됩니다. 시간은 역방향 동맥의 혈액처럼 코어를 통해 순환합니다. 이 기계들은 빛을 내는 것이 아니라 먹이를 줍니다. 가까이 있으면 언어가 왜곡됩니다. 멀리 떨어져 있으면 꿈이 기억나지 않는 패턴으로 정렬되기 시작합니다. 만지는 것은 권장되지 않지만 많은 사람들이 만집니다. 운이 좋은 사람은 잊어버린다. 불운한 사람들은 계속 생각하지만 자신에게 속하지 않는 생각만 생각합니다.
eir-ei-bio-chamber=외계 씨앗을 배양하여 산업적 목적으로 사용할 수 있는 융합된 유기 물질인 생체 강화판을 재배하세요.\n초기 제작에 필요한 씨앗은 적대적인 외계 식물에서 수확해야 합니다.\n그들은 자신의 유전자를 기꺼이 넘기지 않습니다.\n성장에는 인내가 필요합니다. 그리고 피 역시도 필요합니다.
eir-ei-cannon-turret=두 개의 배럴, 하나의 섀시. 두 배의 화력, 두 배의 소음.\n[color=gray]속사 메커니즘과 고급 조준 솔루션이 작동하려면[/color] [color=cyan]전력[/color][color=gray]이 필요합니다.[/color]
eir-ei-computer-age=컴퓨터 시대는 엑조틱 산업의 4번째 단계입니다. 컴퓨터 기반 시스템은 효율성을 높이고 복잡한 대규모 자동화를 가능하게 합니다.
eir-ei-copper-beacon=부분적인 극저온 제약 조건이 필요하지만, 신호-위상 동기화를 최초로 성공적으로 구현할 수 있었습니다. 서브제로 위상 배열 신호기는 유체 질소를 활용하여 생산 매트릭스 내의 엔트로피 노이즈를 감소시킴으로써 국소화된 필드 투영 분야에서 획기적인 진전을 이루었습니다.\n이 기술은 단거리 제조 공정 전반에 걸쳐 기본적인 신호 일관성을 안정화시켜, 열이 가득찬 생산 환경에서 흔히 발생하는 혼란스러운 위상 간섭 없이 동기화된 생산 개선을 가능하게 합니다. 증폭 능력은 제한적이지만 진정한 저온 신호 공학의 핵심 토대를 마련하는 데 이바지했습니다.\n[color=gray]"잡음을 얼리고, 의도를 안정화해라."[/color]
eir-ei-dark-age=암흑 시대는 엑조틱 산업의 1번째 단계입니다. 기본적인 화력 기반 자동화를 도입하고 불과 부족을 통한 산업 부흥의 시작을 알립니다.
eir-ei-electricity-age=전기 시대는 엑조틱 산업의 3번째 단계입니다. 전력을 활용하여 고급 화학 공정과 인프라를 해금하세요.
eir-ei-exotic-age=엑조틱 시대는 엑조틱 산업의 6번째이자 마지막 단계입니다. 물질을 삼키고 세계를 뜻대로 휘어잡는 초구조물인 블랙홀 생성장치를 건설하세요. 완성은 곧 승리이며, [font=default-bold]실패는 곧 침묵입니다.[/font]
eir-ei-exotic-assembler=기존의 조립기가 기계적으로 원자를 배열했다면, 엑조틱 조립 기계는 존재해서는 안 될 형태로 물질을 구부립니다. 중화기에 동력을 공급하는 것과 동일한 양자 플라즈마 원리를 활용하여, 야금학을 뛰어넘는 합금, 진공 공명으로 연결된 회로, 금지된 대칭으로 공명하는 인공물같은 유물 수준의 부품을 제작하지만 모든 조립 과정은 소멸을 담보로 한 내기이기도 합니다. 이 조립 기계의 핵심 반응로는 [color=red]극도로 불안정[/color]하며, 각 양자 붕괴는 자신의 창조물과 맞먹는 연쇄 폭발로 이어질 위험으로 이어집니다. 중력 감쇠기와 엔트로피 흡입기로 구성된 [color=purple]물질 안정기[/color] 그리드로 둘러싸야만 그 불안정성을 간신히 억제할 수 있습니다. 그럼에도 불구하고 코일의 모든 진동은 파열의 가능성을 여전히 내포하고 있습니다.\n그것은 기계라기보단 의식의 장소입니다. 물리 법칙을 늘리고 고정하며 야망을 위해 봉사하도록 강요되는 곳, 그 결과: 문명을 정의하는 경이로움을 구현했지만, 그 대가는 영원한 파멸의 위험입니다.
eir-ei-fusion-data=당신은 이미 열역학적 배신의 벼랑 끝에 서있습니다. 한때 열역학적 죽음으로 귀결되었어야 하는 것이 이젠 건축에 활용되고 있습니다. 이것은 단순한 융합이 아니라 양자 접힘의 서사적 점화입니다. 초구조화된 공명 행렬을 이용하면 에너지 생성과 계산 사이의 경계가 무너집니다. 원자는 더 이상 연료가 아니며-시공간에 속삭이는 재귀적 방정식의 음절입니다.\n이곳에서 수집하는 데이터는 과학적일 뿐만 아니라 신화적인 기술이기도 합니다. 핵융합은 더 이상 갇힌 불이 아니며, 신호입니다.\n엔트로피가 프로그래밍 가능한 변수가 되는 양자 융합 시대의 문을 열었습니다.
eir-ei-high-tech-parts=[color=blue]엑조틱 조립 기계[/color] 내부의 [color=red]불안정성 코어[/color] 에서만 제작되는 이 부품들은 다른 곳에서는 복제할 수 없으며, 그 구조는 고전 물리학을 거스릅니다-양자 고정 합금, 확률 전도성 필라멘트, 아원자적 공명 진동 코어\n제작 과정은 매우 위험하지만 유물급 기술에 필수적인 하이테크 부품은 문명을 한계 너머로 밀어붙이는 핵심 열쇠기도 합니다.
eir-ei-high-temperature-reactor=기존 에너지의 한계를 넘어선 고온 원자로는 원시적인 힘과 끊임없는 흐름의 용광로와도 같습니다. 외부 원자로에서 지옥의 숨결을 끌어들여 외부 열기를 녹아내린 심장으로 정밀하게 전달합니다. 이 타오르는 대장간 안에서 투입된 핵분열 연료봉은 원자력과 춤추는 교향곡을 일으키며, 출력된 열을 초고온 납 냉각제로 변환해 폭포처럼 쏟아냅니다.
eir-ei-iron-beacon=단순한 영하로의 온도 조절을 넘어, 이 진보는 신호기 배열를 열에너지의 이론적 하한선까지 이끌어 시간 독립적인 물질의 비가역적 한계까지 이끌었습니다. 절대 영도 위상 신호기는 물질이 오직 의도를 전달하기 위해 존재하는 양자 격자 잠금점 근처에서 작동하며, 강화된 열 코어와 이중 단계 질소 순환 시스템을 활용하여, 이 신호기들은 주변 엔트로피 필드를 무시할 수 있으므로, 비교할 수 없는 효율의 생산 처리를 가능하게 합니다. 이것은 개선이 아니며 열, 간섭, 타협으로부터의 단절입니다-[color=gray]"절대 영도에서는 의심조차 진동할 수 없다."[/color]
eir-ei-nano-factory=나노 제조 단지는 시설이라기보다는 무생물에 내려진 형벌에 가깝습니다. 기하학적 구조와 기능에 있어 몹시도 잔인한 이 시설은 하부 구조의 설계자 역할을 하며, 지각 아래의 혼돈에 형태와 일관성을 강요합니다. 진공으로 밀봉된 공허와 중성자가 정지된 배관 깊숙한 곳에서 분자적 의도가 추출되고 재배열되며 이온 전단 배열과 재귀적 자기 조립 챔버를 통해 격자 정밀도 구성으로 단련됩니다. 이곳은 건설하지 않으며-강제합니다. 그 핵심에서 만들어지는 것은 아이템이 아닌 물리적 형태의 교리, 즉 이단에 가까울 정도로 의도적으로 접힌 나노 구조물이다. 감독은 최소화되고 시스템은 스스로를 개선하여 비효율적인 부분을 떼 벗기듯 버립니다. 알고리즘의 지하 묘지로 더 깊이 파고들수록 분명해집니다-이곳은 결코 인간을 위해 만들어진 곳이 아니다. 인간이 감히 창조하려 했던 것을 기억하기 위해 만들어진 곳이다.
eir-ei-plasma-turret=유물급 무기 플랫폼으로, 격납된 별똥별의 불안정하면서도 우아한 힘을 활용하도록 설계되었습니다. 이 포탑은 투박한 발사체 대신 원시적인 항성 에너지를 양자 안정화 코일을 통해 유도 통과시킨 플라즈마를 응축시켜 조밀한 보랏빛의 구체를 만들어 발사합니다. 이 빛나는 구체는 발사과 동시에 전장을 가로지르며 원자 이하의 분노로 공명하다 이온화된 충격파를 연쇄적으로 방출합니다.\n플라즈마 포탑은 단순한 대포가 아닌, 장거리 파괴를 형태로서 결정화한 특이점 그 자체입니다. 이러한 에너지 구체는 기만적인 우아함, 느리고 빛나는 필연성으로 움직이며, 한 번의 파괴적인 공격으로 갑옷과 요새, 분대 전체를 전멸시킬 수 있습니다.\n양자 시대의 무기고에서 포탑은 물리학과 장관을 융합을 구현한 존재-즉 파괴가 마치 태양의 파편이 하늘을 가로질러 굴러가는 것처럼 느끼게 하는 무기를니다.
eir-ei-quantum-age=양자 시대는 엑조틱 산업의 5번째 단계입니다. 융합 에너지와 첨단 기계가 등장합니다-부자연스러우며, 공명하고, 차갑게. 기계들이 생각하기 시작합니다. 그리고 그들은 잊지 않습니다.
eir-military-5=시뮬레이션된 살상 교리를 공식화하여, 예측형 올가미 지뢰, 돌파용 폭약, 지옥불 탄약, 그리고 로봇 화력의 단계적 증폭을 하나의 승인된 지휘 체계 하에 통합합니다.
logistic-system_alt=진정한 물류는 단순한 물질의 이동만이 아닌-기억도 이동시키는 것입니다. 이 훈련은 수요 의식을 체계화하고, 제도적 선호 상징을 해독하며, 권한을 권력으로 재구성합니다. 재귀적인 관료적 유연성을 통해 관리자는 계층을 도전적 형식이 아닌 시스템의 고스트으로서 탐색하는 법을 배웁니다. 통제와 관련된 논리를 이해해야만 저항 없이 안전하게 전파되는 명령을 내릴 수 있습니다.
tl-advanced-tesla-coils-technology=조금 더 개선된 테슬라 코일입니다. 사거리가 더 길고, 피해량 역시 향상되었으며, 내구력 향상을 위한 강철 외피 역시 추가로 장착했습니다.
zeus-wrath-zeus-wrath_alt=낙하 이전 궤도 폭풍 지휘 프로토콜에 기반한 전설급 무기를 해금합니다. 포세이돈 포탑, 아이가이온의 창, 화산의 유물에 접근할 수 있게 됩니다. 각각의 아이템은 침묵에 맞선 바다의 마지막 반란의 파편입니다. 연구되지 않음.[font=default-bold]깨어남[/font]

