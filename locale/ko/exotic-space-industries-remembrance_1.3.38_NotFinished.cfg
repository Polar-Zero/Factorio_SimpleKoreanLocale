[entity-description]
ei-burner-offshore-pump=연소 가능한 연료로 구동되는 해안 펌프. 최대 압력으로 물을 끌어올리지만, 해안가는 그 연기를 기억할 것입니다.
ei-express-loader=최대 2층까지 잔적할 수 있습니다.
ei-fast-loader=잔적 기능을 지원하지 않습니다.
ei-loader=잔적 기능을 지원하지 않습니다.
ei-neo-loader=최대 잔적 한도까지 잔적할 수 있습니다.
ei-steam-loader=작동에 증기가 필요하며, 잔적과 필터 기능을 지원하지 않습니다.
ei-steam-offshore-pump=증기 구동식 해안 펌프. 측면으로 증기를 공급하면 최대 압력으로 물을 끌어올립니다.
ei-turbo-loader=최대 2층까지 잔적할 수 있습니다.
eir-beacon=신호기 과부하에 [color=orange]1개[/color]의 신호기로 계산됩니다.
eir-ei-advanced-deep-drill=광석 광맥에 접근할 수 있는 드릴입니다.\n[color=gray]작동하려면 초당 [/color][color=orange]7 드릴 유체[/color][fluid=ei-drill-fluid][color=gray]가 필요합니다.[/color]
eir-ei-alien-beacon=[color=purple]신호기 과부하에 계산되지 않습니다.[/color]\n[color=gray]작동하려면 초당[/color][color=purple] 30 생체 물질[/color][item=ei-bio-matter][color=gray]이 필요합니다.[/color]
eir-ei-bio-reactor=[color=gray]작동하려면 초당[/color][color=purple] 0.1 생체 물질[/color][item=ei-bio-matter][color=gray]이 필요합니다.[/color]
eir-ei-cannon-turret=[color=gray]속사 메커니즘과 고급 조준 솔루션이 작동하려면[/color] [color=cyan]전력[/color] [color=gray]이 필요합니다.[/color]
eir-ei-cargo-bot=산업의 열기 속에서 단련된 단단한 운반차.\n엔진이 화물을 단단히 움켜쥐고 있으며, 냉혹한 기계적 정확성을 갖추고 전진합니다.\n우아함을 위해 만들어지지 않았습니다-오직 끝없는 배송의 고난을 위해서만 존재합니다.
eir-ei-construction-bot=정확하고. 신속하게. 신호가 사라지기 전에 현장에 도착한다.\n하지만 건설하지는 않는다 - 그 대신 건물로서 현실을 관통할 뿐.
eir-ei-copper-beacon=[color=gray]작동하려면 초당 [/color][color=blue]1 유체 질소[/color][fluid=ei-liquid-nitrogen][color=gray]가 필요합니다.[/color]\n신호기 과부하에 [color=orange]1개[/color]의 신호기로 계산됩니다.
eir-ei-deep-drill=광석 광맥에 접근할 수 있는 드릴입니다.\n[color=gray]작동하려면 초당 [/color][color=orange]4.2 드릴 유체[/color][fluid=ei-drill-fluid][color=gray]가 필요합니다.[/color]
eir-ei-exotic-assembler=이 조립 기계는 [color=orange]엑조틱 아이템[/color]을 제작하는 데 사용할 수 있습니다. 하지만 엑조틱 물질은 매우 불안정하기 때문에 폭발을 방지하려면 [color=blue]물질 안정기[/color] 근처에 두어야 합니다.
eir-ei-iron-beacon=[color=gray]작동하려면 초당 [/color][color=blue]2 유체 질소[/color][fluid=ei-liquid-nitrogen][color=gray]가 필요합니다.[/color]\n신호기 과부하에 [color=orange]2개[/color]의 신호기로 계산됩니다.
eir-ei-warp-beacon=[color=purple]신호기 과부하에 계산되지 않습니다.[/color]\n[color=gray]작동하려면 초당[/color][color=purple] 60 생체 물질[/color][item=ei-bio-matter][color=gray]이 필요합니다.[/color]
eir-offshore-pump=전기 구동식 해안 펌프. 이전의 자동적인 방식은 이제 없으며, 이제 물은 전력망을 이용해 끌어올려야 합니다.
tl-advanced-tesla-coil=조금 더 개선된 테슬라 코일입니다.
tl-basic-tesla-coil=주변 적에게 고전류 방전을 가하도록 개조된 전기 공명식 변압기입니다.
tl-tesla-tank=고급 테슬라 코일 2개를 장착한 탱크입니다.

