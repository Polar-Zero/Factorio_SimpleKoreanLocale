[mod-name]
5dim_module=5Dim 모드 - 모듈(5Dim's mod - Module)

[mod-description]
5dim_module=더 강력한 모듈과 강화된 신호기 시스템을 통해 기계의 성능을 한 단계 더 끌어올리세요.\n더 많은 단계의 모듈과 신호기를 게임에 추가해, 더 빠르고 깔끔하며, 훨씬 효율적인 공장 구축이 가능해집니다.\n작동에 5dim_core 모드가 필요합니다.\n\n번역: SimpleKoreanLocale(PolarZero)

