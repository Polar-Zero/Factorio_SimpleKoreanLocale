[mod-setting-description]
better-aquilo-cryo-plant=제작법 비용 증가
better-aquilo-fluoroketone=제작법에 경유가 추가됩니다.
better-aquilo-fluoroketone-cooling=제작법에 얼음이 추가됩니다.
better-aquilo-fusion-cell=제작법에 양자 프로세서가 추가되며, 출력량이 두 배가 되지만, 홀뮴이 촉매로 필요하도록 합니다.
better-aquilo-ice-plateform-in-pack=얼음 대신 얼음 플랫폼이 필요하도록 수정합니다. (4개 제작마다 1개 필요) 얼음과 암모니아는 무한히 존재하므로, 이 설정은 주로 대량 생산의 복잡성을 추가하기 위해 사용됩니다.
better-aquilo-lithium-accumulator=제작시 뜨거운 플루오로케톤이 출력되도록 조정합니다.
better-aquilo-quantum-processor=비용과 제작 결과물 모두 증가되지만, 초전도체 대신 고품질 모듈이 필요하게 됩니다.
better-aquilo-quantum-processor-speed=양자 프로세서 제작에 훨씬 정밀한 공정이 필요하게 해, 모듈을 통해 속도를 높일 수 없도록 합니다.
better-aquilo-rail-support=현실적인 요소를 적용해보세요 :)
better-aquilo-roboport-heat-multiplier=기본 열 소비량에(300kW) 설정값 배수를 곱합니다. (기본값: 5)
better-aquilo-tech=일부 아퀼로 기술 연구에 필요한 비용을 증가시킵니다.