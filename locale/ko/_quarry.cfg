[mod-setting-description]
quarry-stone-waste-percentage=선택한 자원이 아닌 돌을 채석장에서 얼마나 파내게 될지 설정합니다.\n0%로 설정하면 돌 부산물이 비활성화됩니다.\n__ITEM__skl-txtra0__0%__ITEM__skl-txtre__
quarry-recipe-speed=값이 낮을수록 채석장 제작법의 제작 속도가 빨라지며, 그 반대도 마찬가지입니다.\n채석장 제작 속도 배율과는 무관하며, 채석장에 영향을 미칩니다.
quarry-crafting-speed=값이 높을수록 채석장 추출 속도가 빨라집니다.\n제작법 속도 배율과는 무관하게 적용됩니다.
quarry-power-usage=값이 클수록 채석장이 더 많은 전력을 사용함을 의미합니다.
quarry-complex-mode=활성화하면, 채석장은 광석이 아닌, "미네랄 스톤"을 대신 채광하며, 채석장 공정에 추가 처리가 필요하도록 합니다.
quarry-pollution-mult=채석장 및 채석장 추출기에 대한 공해 배출을 설정합니다.\n0으로 설정하면 채석장 공해를 비활성화합니다.\n__ITEM__skl-txtra0__1__ITEM__skl-txtre__
quarry-enable-ammoniacal-solution=채석장을 이용해 암모니아 용액을 지면에서 추출할 수 있도록 합니다.
quarry-enable-calcite=채석장을 이용해 방해석을 지면에서 추출할 수 있도록 합니다.
quarry-enable-coal=채석장을 이용해 석탄을 지면에서 추출할 수 있도록 합니다.
quarry-enable-copper-ore=채석장을 이용해 구리 광석을 지면에서 추출할 수 있도록 합니다.
quarry-enable-crude-oil=채석장을 이용해 원유를 지면에서 추출할 수 있도록 합니다.
quarry-enable-fluorine-vent=채석장을 이용해 플루오린 배출구로부터 자원을 추출할 수 있도록 합니다.
quarry-enable-holmium-ore=채석장을 이용해 홀뮴 광석을 지면에서 추출할 수 있도록 합니다.
quarry-enable-iron-ore=채석장을 이용해 철 광석을 지면에서 추출할 수 있도록 합니다.
quarry-enable-lava=채석장을 이용해 용암을 추출할 수 있도록 합니다.
quarry-enable-lithium-brine=채석장을 이용해 리튬 염수를 추출할 수 있도록 합니다.
