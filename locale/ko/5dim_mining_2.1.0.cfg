[mod-name]
5dim_mining=5Dim 모드 - 채광(5Dim's mod - Mining)

[mod-description]
5dim_mining=더 강력한 채광용 도구를 사용하여 지도에서 더 많은 자원을 채광하세요.\n드릴, 시추기, 펌프에 더 많은 티어를 추가해 광석, 석유, 물 생산량이 더 거대한 공장 수요를 따라잡을 수 있도록 합니다.\n작동에 5dim_core 모드가 필요합니다.\n\n번역: SimpleKoreanLocale(PolarZero)

