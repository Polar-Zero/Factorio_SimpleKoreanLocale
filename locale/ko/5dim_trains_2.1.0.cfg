[mod-name]
5dim_trains=5Dim 모드 - 기차(5Dim's mod - New Trains)

[mod-description]
5dim_trains=더 강력한 철도 물류 시스템을 활용해 더 많은 화물을 더 빠르게 운송해보세요.\nMK2~MK10 기관차와 화물차를 추가하여 철도 네트워크에서 더 많은 화물과 유체를 수송할 수 있도록 합니다.작동에 5dim_core 모드가 필요합니다.\n\n번역: SimpleKoreanLocale(PolarZero)

