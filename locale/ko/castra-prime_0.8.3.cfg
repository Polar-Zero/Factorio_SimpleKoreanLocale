[tips-and-tricks-item-description]
castra-briefing=주변의 [entity=data-collector] 기지가 데이터를 수집하면 연구 트리가 더 발전하고 기지가 업그레이드됩니다. 그들보다 앞서 나가려면 군사 연구를 진행하여 따라잡아야 합니다. [item=castra-data] 는 [entity=data-collector]가 충분한 데이터를 수집하면 생성되는 아이템을 수집하여 획득할 수 있습니다. 데이터를 방출하는 객체는 설명에 관련된 부분을 언급합니다.
castra-lithium-supply=[planet=castra]에는 자연적인 리튬 지원이 없습니다. [item=lithium-battery]를 제작하려면, 다른 행성에서 [item=lithium]을 수입해오고나, 캐스트라의 [item=nickel-plate]을 다른 행성에 수입할  to produce batteries elsewhere.

