[mod-setting-description]
castra-prime-buff-equipment=이 모드에서 에너지 보호막 MK3(450 HP, 보호막 재생 18/초, 300kW 사용), 배터리 MK3(300MJ 용량)에 버프를 적용합니다. 비활성화하면 포크 이전 모드에서 사용했던 값이 대신 사용됩니다.
castra-prime-buffed-forge=대장간 제작 속도를 3.0으로, 기본 생산성을 50%로 증가시키고, 에너지 소비량을 2.5MW로 감소시킵니다.
castra-prime-disable-artillery=적 산란장이 대포 포탑을 건설하지 못하게 합니다. 장기간 플레이 시 권장합니다.
castra-prime-disable-enemy-nukes=적 포탑이 원자 폭탄을 장전하지 못하도록 합니다: 원자 로켓 포탄, 원자 대포용 포탄 (세리스/마락시스) 등 포함. 이미 장착된 원자 탄약은 발사될 때까지 유지되며, 제거되지 않습니다.
castra-prime-disable-land-mines=이미 설치된 지뢰에 영향을 주지 않습니다. (제거되지 않음)
castra-prime-extend-data-spoilage=전장 데이터 패킷의 소멸(부패) 시간을 1분에서 5분으로 늘립니다.
castra-prime-forge-glow=대장간의 조명 레이어를 활성화하여 작동 중에 빛나도록 합니다.
castra-prime-gates-progression=활성화하면 (기본값), 게임 후반 연구 진행에 캐스트라 자원이 필요하게 됩니다. 레일건과 프로메튬 과학 팩 제작에 리튬 건전지가, 프로메튬 과학 연구 및 연구 생산성 기술에 수행하려면 전장 과학 팩이 필요하게 됩니다. 이 옵션을 비활성화하면 캐스트라를 선택적인 보조 행성으로 둘 수 있게 됩니다.
castra-prime-nauvis-nukes=활성화하면 원자 폭탄 기술 연구에 전장 과학 팩이 필요하지 않도록 조정하여, 캐스트라를 방문하지 않고도 해당 기술을 연구할 수 있게 됩니다.
castra-prime-nerf-enemy-bases=모든 적 데이터 수집기의 체력, 방어력 및 체력 재생을 50% 감소시킵니다.
castra-prime-research-rate-multiplier=적 진영의 연구 속도를 해당 설정값 배율만큼 조정합니다. 기본값 1.0은 원본 모드와 동일하지만, 1.0보다 작은 값은 적의 연구를 늦추며, 큰 값으로 설정할수록 적 연구 속도가 빨라집니다. 참고: 적 진영의 연구 속도는 게임 엔진에 의해 제한되므로, 값을 높이더라도 의도한 대로 작동하지 않을 수 있습니다. (사용 가능한 값: 0.01 ~ 100.0)
castra-prime-suppress-research-msg=적의 연구 진행 상황에 대한 메시지를 채팅에 표시하지 않도록 합니다. 알림 없이 더욱 몰입감 있는 경험을 선호하는 플레이어에게 유용합니다.