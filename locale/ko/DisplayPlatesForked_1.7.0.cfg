DisplayPlatesForked=아이템과 유체 아이콘을 보여 주는 대형, 중형, 소형 표지판을 추가합니다. 표지판 위치에 같은 모양의 지도 표시를 만들도록 설정할 수 있습니다. 설계도면에서도 쓸 수 있습니다 (설계도면 갱신은 제외)\n번역: alstnrrj12


