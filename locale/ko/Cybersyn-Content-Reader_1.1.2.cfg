[mod-name]
Cybersyn-Content-Reader=Cybersyn 네트워크 컨텐츠 리더(Cybersyn Network Content Reader)

[mod-description]
Cybersyn-Content-Reader=특정 네트워크 ID에 대해 Cybersyn에서 공급/요청할 컨텐츠를 내보내는 조합기를 게임에 추가합니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[entity-name]
cybersyn-delivery-reader=Cybersyn 배송 컨텐츠 리더
cybersyn-provider-reader=Cybersyn 공급역 컨텐츠 리더
cybersyn-requester-reader=Cybersyn 요청역 컨텐츠 리더

[mod-setting-name]
cybersyn_content_reader_same_surface=동일한 표면으로 제한
cybersyn_content_reader_update_interval=업데이트 간격 (틱)

[mod-setting-description]
cybersyn_content_reader_same_surface=활성화하면, 조합기는 현재 위치한 표면의 컨텐츠만 출력할 수 있습니다.
cybersyn_content_reader_update_interval=조합기 출력을 업데이트할 틱 빈도입니다.\n(기본값: 120[2초])