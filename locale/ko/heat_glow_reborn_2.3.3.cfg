[mod-name]
heat_glow_reborn=빛나는 열 파이프 [Reborn](Heat Glow (Reborn))

[mod-description]
heat_glow_reborn=열에너지로 인한 객체 효과를 더 보기 좋게 개선합니다. 용암이나 녹은 금속이 흐르는 파이프도 붉게 달아올라 빛나도록 수정합니다. OwnlyMe의 'Heat Glow' 모드 후속 버전으로, Factorio 2.1에 맞춰 업데이트되었습니다.\n\n번역: alstnrrj12, SimpleKoreanLocale(PolarZero)


[command-help]
heat-glow-rescan=Heat Glow (Reborn): 모든 표면의 파이프를 다시 탐색한 뒤, 관련 열 관련 효과를 갱신합니다.

[heat-glow-reborn]
rescanned=Heat Glow (Reborn): 이제 파이프 __1__개를 감시합니다.

[mod-setting-name]
heat-glow-reborn-brightness=파이프 발광 효과 강도
heat-glow-reborn-hot-fluids=뜨거운 유체 목록
heat-glow-reborn-pipe-glow=뜨거운 유체 파이프에 발광 적용
heat-glow-reborn-update-seconds=파이프 확인 간격 (초)
heat-glow-reborn-wood-burns=나무 파이프 연소 활성화

[mod-setting-description]
heat-glow-reborn-brightness=파이프 발광 효과의 강도를 조정할 수 있습니다 (낮, 밤 모두에 적용)
heat-glow-reborn-hot-fluids=파이프 발광 효과를 적용할 내부 유체의 쉼표로 구분된 프로토타입 ID 목록을 입력해주세요. "lava"가 포함된 유체 ID일 경우 짙은 붉은색 용암빛이, 다른 유체의 경우 더 밝은 녹은 금속 빛으로 표현됩니다.
heat-glow-reborn-pipe-glow=파이프, 지하 파이프, 밸브, Flow Control 모드의 파이프가 아래 발광 효과를 적용받는 뜨거운 유체를 운반하고 있는 경우 빛나도록 합니다. Color Coded Pipes 모드와 호환됩니다.
heat-glow-reborn-update-seconds=모든 파이프를 한 번씩 확인할 주기를 조정할 수 있습니다 (초 단위). 낮은 값일수록 발광 효과 적용이 빨라지지만 대규모 기지에서의 성능 부담이 증가합니다.
heat-glow-reborn-wood-burns=Bio Industries 모드의 나무 파이프에 뜨거운 유체를 흘려보냈을 경우, 몇 초 안에 붙이 붙고 타버리도록 합니다.