[mod-setting-name]
PlanetsLib-disable-all-entity-replacements=모든 객체 대체를 강제로 비활성화
PlanetsLib-enable-detailed-logs=자세한 로그 기록 활성화
PlanetsLib-enable-entity-replacements=다른 객체 대체 기능 활성화
PlanetsLib-enable-runtime-rocket-silo-replacements=runtime 단계에서 로켓 격납고 대체 활성화
PlanetsLib-enhanced-tooltips=추가 툴팁 활성화
PlanetsLib-unlink-hidden-prerequisites=숨겨진 전제조건 연결 해제
PlanetsLib-update-vanilla-recipe-productivity-techs=기본 게임 아이템 생산성 연구에 모드 제작법을 추가
PlanetsLib-warn-on-hidden-prerequisites=숨겨진 전제조건이 있을 경우 경고

[mod-setting-description]
PlanetsLib-disable-all-entity-replacements=모든 모드에서의 객체 대체 기능을 강제로 비활성화합니다. 모드가 심각하게 잘못 구성된 경우가 아니면 이 설정은 사용할 필요가 없습니다.
PlanetsLib-enable-entity-replacements=다른 시작 설정에 바인딩되지 않은 경우, 객체 대체 기능을 활성화합니다. 모드 개발자가 객체 대체 기능을 설정에 등록하지 못한 상황에서, 모드 제거를 위한 대체 수단으로 사용할 수 있습니다.
PlanetsLib-enable-runtime-rocket-silo-replacements=행성에 로켓 운반력 배율이나 로켓 부품 배율이 설정된 경우, runtime 단계에서 로켓 격납고 대체 기능을 적용합니다. 모드에서 이 기능을 안전하지 않은 방식으로 사용했을 경우, 이 설정을 비활성화하여 해당 동작을 안전하게 중지한 뒤, 저장된 데이터에서 진행된 대체 내용을 원상 복구할 수 있습니다.
PlanetsLib-enhanced-tooltips=이전에 숨겨져 있던 정보를 사용자가 알 수 있도록, 프로토타입에 새로운 툴팁을 추가합니다.
PlanetsLib-unlink-hidden-prerequisites=숨겨진 기술이 전제조건으로 지정된 경우 이를 제거하여 후속 기술 연구가 불가능하지 않도록 수정합니다.
PlanetsLib-update-vanilla-recipe-productivity-techs=기본 게임의 아이템 생산성 기술 연구에 아직 등록되지 않은 아이템을 추가합니다. 일반적인 플레이에서는 활성화된 상태로 유지하는 것을 추천하지만, 오래된 모드와 호환성 문제가 발생할 수 있습니다.
PlanetsLib-warn-on-hidden-prerequisites=게임에 숨겨진 필수 기술 전제조건이 로드된 경우 플레이어에게 경고합니다.