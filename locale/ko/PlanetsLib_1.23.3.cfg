notify-unlinked-prerequisites='숨겨진 전제조건 연결 해제' 설정에 따라 다음 기술이 후속 기술 전제조건에서 제거되었습니다: __1__
planetslib-entity-migration=[PlanetsLib]: __1__ -> __2__ 마이그레이션 진행 중
