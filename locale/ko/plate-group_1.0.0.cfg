[mod-name]
plate-group=아이템 그룹 - 문자판, 표지판(Plate Group)

[mod-description]
plate-group=표지판류(텍스트 표지판, 디스플레이 표지판 등)를 '물류(Logistics)' 탭 하단이 아닌, 별도의 전용 제작 탭으로 모아줍니다. 어떤 하위 그룹과 아이템이 이 탭에 포함될지는 시작 설정(startup settings)에 따라 결정되므로, Lua 코드를 직접 수정할 필요 없이 모드 설정 메뉴를 통해 다른 모드의 표지판류 아이템도 추가할 수 있습니다. 아이템 그룹은 게임을 불러올 때 생성되므로, 이 변경 사항은 세이브 도중이 아니라 다음번 프로토타입 재로딩 시점에 적용됩니다.\n\n번역: SimpleKoreanLocale(PolarZero)


[item-group-name]
plate-group=문자판, 표지판

[mod-setting-name]
plate-group-items=별도로 이동할 아이템 목록
plate-group-order=아이템 그룹 정렬 기준 문자열
plate-group-subgroups=별도로 이동할 하위 아이템 그룹

[mod-setting-description]
plate-group-items=새 아이템 그룹으로 이동시킬 아이템 프로토타입 ID를 쉼표로 구분된 목록 형태로 입력하세요. 하위 그룹을 별도로 지정하지 않은 모드의 아이템을 이동시킬 때 유용합니다.
plate-group-order=그룹 위치를 ​​결정하는 정렬 기준 문자열을 정의합니다. "d-b"로 설정하면 '전투'와 '유체' 탭 사이에 배치됩니다.
plate-group-subgroups=문자판, 표지판 그룹으로 이동할 아이템 하위 그룹을 정의합니다. 기본적으로 Text Plates, Display Plates 모드가 포함됩니다. 쉼표로 구분된 프로토타입 ID 목록을 사용해주세요.