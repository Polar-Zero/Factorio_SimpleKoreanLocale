[technology-description]
circular-collider-lab=이 강력한 연구소는 연구 성과를 더욱 가속화하고 새로운 경지를 열어줍니다. 하지만 가동에 상당한 전력이 필요합니다.
solar-system-edge=이제 우주에 대한 지식을 활용해 이 태양계를 벗어나 게임에서 승리할 수 있습니다.
solar-system-edge-bis=연구의 획기적인 성과는 우주의 신비에 대한 이해를 넓히고 있습니다. 첨단 소재를 해금하고, 태양계 가장자리로 우주 여정을 이어가세요.

